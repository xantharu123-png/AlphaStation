<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const API = window.location.protocol + '//' + window.location.hostname + ':8000';

// Toast Notification System
let toastId = 0;
const [toasts, setToasts] = useState([]);

function useToast() {
    const addToast = (message, type = 'info', duration = 3000) => {
        const id = toastId++;
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), duration);
    };
    return addToast;
}

// Toast Component
function ToastContainer() {
    const [toasts, setToasts] = useState([]);
    useEffect(() => {
        window.addToast = (msg, type) => {
            const id = Math.random();
            setToasts(prev => [...prev, { id, message: msg, type }]);
            setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
        };
    }, []);

    return (
        <div>
            {toasts.map(t => (
                <div key={t.id} className={`toast ${t.type}`}>
                    {t.message}
                </div>
            ))}
        </div>
    );
}

// Custom Hooks
function useAutoRefresh(url, interval = 30000, dependency = []) {
    const [data, setData] = useState(null);
    const [loading, setLoading] = useState(true);
    const [error, setError] = useState(null);

    useEffect(() => {
        const fetchData = async () => {
            try {
                setLoading(true);
                const response = await fetch(API + url);
                if (!response.ok) throw new Error('API Error');
                const result = await response.json();
                setData(result);
                setError(null);
            } catch (err) {
                setError(err.message);
                if (window.addToast) window.addToast('Fehler beim Abrufen der Daten', 'error');
            } finally {
                setLoading(false);
            }
        };

        fetchData();
        const timer = setInterval(fetchData, interval);
        return () => clearInterval(timer);
    }, dependency);

    return { data, loading, error };
}

function useSortable(data, defaultKey = null) {
    const [sortKey, setSortKey] = useState(defaultKey);
    const [sortDesc, setSortDesc] = useState(false);

    const sorted = useMemo(() => {
        if (!data || !sortKey) return data;
        return [...data].sort((a, b) => {
            const aVal = a[sortKey];
            const bVal = b[sortKey];
            if (typeof aVal === 'number' && typeof bVal === 'number') {
                return sortDesc ? bVal - aVal : aVal - bVal;
            }
            return sortDesc ? String(bVal).localeCompare(String(aVal)) : String(aVal).localeCompare(String(bVal));
        });
    }, [data, sortKey, sortDesc]);

    const toggleSort = (key) => {
        if (sortKey === key) {
            setSortDesc(!sortDesc);
        } else {
            setSortKey(key);
            setSortDesc(false);
        }
    };

    return { sorted, toggleSort, sortKey, sortDesc };
}

// ScanControl Component
function ScanControl({ onScan, isScanning = false, lastScan = null, nextScan = null }) {
    return (
        <div className="card border border-gray-200 p-4 rounded-lg flex items-center justify-between">
            <div className="flex items-center gap-4">
                <button onClick={onScan} disabled={isScanning} className="button">
                    {isScanning ? (
                        <>
                            <span className="loading-spinner"></span>
                            <span className="ml-2">Scannt...</span>
                        </>
                    ) : (
                        'Scan starten'
                    )}
                </button>
                {lastScan && <div className="text-sm text-gray-600">Letzter Scan: {lastScan}</div>}
                {nextScan && <div className="text-sm text-gray-600">Nächster Scan: {nextScan}</div>}
            </div>
        </div>
    );
}

// DetailSidebar Component
function DetailSidebar({ ticker, onClose }) {
    const [tickerData, setTickerData] = useState(null);
    const [aiData, setAiData] = useState(null);
    const [loading, setLoading] = useState(true);
    const chartContainer = useRef(null);
    const chart = useRef(null);

    useEffect(() => {
        const fetchData = async () => {
            try {
                setLoading(true);
                const [tickerRes, aiRes] = await Promise.all([
                    fetch(`${API}/api/ticker-detail?ticker=${ticker}`),
                    fetch(`${API}/api/ai-analysis?ticker=${ticker}`)
                ]);
                if (tickerRes.ok) setTickerData(await tickerRes.json());
                if (aiRes.ok) setAiData(await aiRes.json());
            } catch (err) {
                console.error('Error fetching detail:', err);
            } finally {
                setLoading(false);
            }
        };

        fetchData();
    }, [ticker]);

    useEffect(() => {
        if (!tickerData || !chartContainer.current) return;

        try {
            if (chart.current) {
                chart.current.remove();
            }

            const { createChart } = window.LightweightCharts;
            chart.current = createChart(chartContainer.current, {
                layout: { textColor: '#666', background: { color: '#fafafa' } },
                width: 380,
                height: 250,
                timeScale: { timeVisible: true, secondsVisible: false }
            });

            const candlestickSeries = chart.current.addCandlestickSeries();
            const chartData = tickerData.chart_data || [
                { time: Date.now() / 1000, open: tickerData.price || 100, high: (tickerData.price || 100) * 1.02, low: (tickerData.price || 100) * 0.98, close: tickerData.price || 100 }
            ];
            candlestickSeries.setData(chartData);
            chart.current.timeScale().fitContent();
        } catch (err) {
            console.error('Chart error:', err);
        }

        return () => {
            if (chart.current) {
                chart.current.remove();
                chart.current = null;
            }
        };
    }, [tickerData]);

    if (loading) {
        return (
            <div className="detail-sidebar">
                <div className="detail-sidebar-content flex items-center justify-center h-full">
                    <div className="loading-spinner"></div>
                </div>
            </div>
        );
    }

    const price = tickerData?.price || 0;
    const change = tickerData?.change_pct || 0;
    const changeClass = change >= 0 ? 'color-positive' : 'color-negative';

    return (
        <div className="detail-sidebar">
            <div className="detail-sidebar-content">
                {/* Header */}
                <div className="flex justify-between items-start mb-6">
                    <div>
                        <h2 className="text-2xl font-bold">{ticker}</h2>
                        <p className="text-2xl font-bold mt-2">
                            €{price.toFixed(2)} <span className={`text-lg font-semibold ${changeClass}`}>({change.toFixed(2)}%)</span>
                        </p>
                    </div>
                    <button onClick={onClose} className="text-2xl">×</button>
                </div>

                {/* Chart */}
                <div ref={chartContainer} className="chart-container"></div>

                {/* Grade */}
                {tickerData?.grade && (
                    <div className="mb-4">
                        <span className={`grade-badge grade-${tickerData.grade.toLowerCase()}`}>
                            Grade {tickerData.grade}
                        </span>
                    </div>
                )}

                {/* Key Metrics */}
                <div className="bg-gray-50 p-4 rounded-lg mb-4 text-sm">
                    <div className="grid grid-cols-2 gap-4">
                        <div>
                            <div className="text-gray-600">RSI</div>
                            <div className="font-semibold">{(tickerData?.rsi || 0).toFixed(1)}</div>
                        </div>
                        <div>
                            <div className="text-gray-600">RVOL</div>
                            <div className="font-semibold">{(tickerData?.rvol || 0).toFixed(2)}</div>
                        </div>
                        <div>
                            <div className="text-gray-600">MA20</div>
                            <div className="font-semibold">€{(tickerData?.ma20 || 0).toFixed(2)}</div>
                        </div>
                        <div>
                            <div className="text-gray-600">MA50</div>
                            <div className="font-semibold">€{(tickerData?.ma50 || 0).toFixed(2)}</div>
                        </div>
                    </div>
                </div>

                {/* AI Analysis */}
                {aiData && (
                    <div className="bg-blue-50 p-4 rounded-lg mb-4 text-sm">
                        <h3 className="font-semibold mb-2">KI Analyse</h3>
                        <p className="text-gray-700">{aiData.analysis || 'Keine Analyse verfügbar'}</p>
                    </div>
                )}
            </div>
        </div>
    );
}

// Main App
function App() {

    // Check server status
    useEffect(() => {
        const checkServer = async () => {
            try {
                const response = await fetch(`${API}/api/health`);
                setServerStatus(response.ok);
            } catch {
                setServerStatus(false);
            }
        };
        checkServer();
        const interval = setInterval(checkServer, 30000);
        return () => clearInterval(interval);
    }, []);

    // Apply dark mode
    useEffect(() => {
        if (darkMode) {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.removeAttribute('data-theme');
        }

    const tabs = [
        { id: 'scanner', label: 'Scanner' },

        { id: 'money-flow', label: 'Money Flow' },
        { id: 'kalender', label: 'Kalender' },
        { id: 'crash-monitor', label: 'Crash Monitor' },
        { id: 'watchlist', label: 'Watchlist' },
        { id: 'backtest', label: 'Backtest' },

// Scanner Tab
function ScannerTab({ onSelectTicker }) {
    const [strategy, setStrategy] = useState('');
    const [marketType, setMarketType] = useState('stocks');
    const [isScanning, setIsScanning] = useState(false);
    const [results, setResults] = useState([]);
    const { sorted, toggleSort, sortKey } = useSortable(results, 'score');
    const { data: strategies } = useAutoRefresh(`/api/strategies?market_type=${marketType}`);

    const handleScan = async () => {
        setIsScanning(true);
        try {
            const response = await fetch(`${API}/api/scan`, { method: 'POST', body: JSON.stringify({ strategy, market_type: marketType }), headers: { 'Content-Type': 'application/json' } });
            if (response.ok) {
                const data = await response.json();
                setResults(data.results || []);
                if (window.addToast) window.addToast('Scan abgeschlossen', 'success');
            }
        } catch (err) {
            if (window.addToast) window.addToast('Scan-Fehler', 'error');
        } finally {
            setIsScanning(false);
        }
    };

    return (
        <div className="space-y-6">
            <div className="card border border-gray-200 p-6 rounded-lg">
                <div className="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label className="block text-sm font-semibold mb-2">Strategie</label>
                        <select value={strategy} onChange={(e) => setStrategy(e.target.value)} className="w-full">
                            <option value="">Wählen Sie eine Strategie...</option>
                            {strategies?.strategies?.map(s => (
                                <option key={s} value={s}>{s}</option>
                            ))}
                        </select>
                    </div>
                    <div>
                        <label className="block text-sm font-semibold mb-2">Markttyp</label>
                        <select value={marketType} onChange={(e) => setMarketType(e.target.value)} className="w-full">
                            <option value="stocks">Aktien</option>
                            <option value="crypto">Crypto</option>
                            <option value="futures">Futures</option>
                            <option value="forex">Forex</option>
                        </select>
                    </div>
                </div>
            </div>

            <ScanControl onScan={handleScan} isScanning={isScanning} />

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">

    const [results, setResults] = useState([]);
    const [isScanning, setIsScanning] = useState(false);
    const { sorted, toggleSort, sortKey } = useSortable(results, 'sector');

    useEffect(() => {
        const fetchResults = async () => {
            try {
                const response = await fetch(`${API}/api/money-flow-results`);
                if (response.ok) {
                    const data = await response.json();
                    setResults(data.results || []);
                }
            } catch (err) {
                console.error('Error:', err);
            }
        };
        fetchResults();
    }, []);

    const handleScan = async () => {
        setIsScanning(true);
        try {
            const response = await fetch(`${API}/api/money-flow-scan`, { method: 'POST' });
            if (response.ok) {
                if (window.addToast) window.addToast('Money Flow Scan abgeschlossen', 'success');
            }
        } catch (err) {
            if (window.addToast) window.addToast('Scan-Fehler', 'error');
        } finally {
            setIsScanning(false);
        }
    };

    const getFlowSignalClass = (signal) => {
        if (signal.includes('ZUFLUSS')) return 'signal-bullish';
        if (signal.includes('ABFLUSS')) return 'signal-bearish';
        return 'signal-neutral';
    };

    return (
        <div className="space-y-6">
            <ScanControl onScan={handleScan} isScanning={isScanning} />

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('sector')}>Sektor</th>
                            <th className="text-left py-2 px-2">ETF</th>
                            <th className="text-right py-2 px-2">Preis</th>
                            <th className="text-right py-2 px-2">1D%</th>
                            <th className="text-right py-2 px-2">5D%</th>
                            <th className="text-right py-2 px-2">20D%</th>
                            <th className="text-right py-2 px-2">RVOL</th>
                            <th className="text-left py-2 px-2">Flow Signal</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.map((item, idx) => (
                            <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker(item.etf)}>
                                <td className="py-3 px-2 font-semibold">{item.sector}</td>
                                <td className="py-3 px-2">{item.etf}</td>
                                <td className="py-3 px-2 text-right">€{item.price?.toFixed(2)}</td>
                                <td className={`py-3 px-2 text-right ${item.change_1d >= 0 ? 'color-positive' : 'color-negative'}`}>{item.change_1d?.toFixed(2)}%</td>
                                <td className={`py-3 px-2 text-right ${item.change_5d >= 0 ? 'color-positive' : 'color-negative'}`}>{item.change_5d?.toFixed(2)}%</td>
                                <td className={`py-3 px-2 text-right ${item.change_20d >= 0 ? 'color-positive' : 'color-negative'}`}>{item.change_20d?.toFixed(2)}%</td>
                                <td className="py-3 px-2 text-right">{item.rvol?.toFixed(2)}</td>
                                <td className="py-3 px-2"><span className={`signal-badge ${getFlowSignalClass(item.flow_signal)}`}>{item.flow_signal}</span></td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

// Kalender Tab
function KalenderTab() {
    const [events, setEvents] = useState([]);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
        const fetchCalendar = async () => {
            try {
                const response = await fetch(`${API}/api/kalender`);
                if (response.ok) {
                    const data = await response.json();
                    setEvents(data.events || []);
                }
            } catch (err) {
                console.error('Error:', err);
            } finally {
                setLoading(false);

        };
        fetchCalendar();
    }, []);

    const getImportanceClass = (importance) => {
        if (importance.includes('HOCH')) return 'importance-high';

        return 'importance-low';

    return (
        <div className="space-y-6">

                    <div className="flex justify-center py-8"><div className="loading-spinner"></div></div>

                                <th className="text-left py-2 px-2">Event</th>
                                <th className="text-center py-2 px-2">Wichtigkeit</th>
                                <th className="text-left py-2 px-2">Beschreibung</th>
                            </tr>
                        </thead>

                                    <td className="py-3 px-2">{event.event}</td>

                                    <td className="py-3 px-2">{event.description}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                )}
            </div>
        </div>
    );
}

// Watchlist Tab
function WatchlistTab({ onSelectTicker }) {
    const [watchlist, setWatchlist] = useState([]);
    const [newTicker, setNewTicker] = useState('');
    const [tickerPrices, setTickerPrices] = useState({});
    const { sorted, toggleSort, sortKey } = useSortable(watchlist, 'ticker');

    useEffect(() => {
        const saved = localStorage.getItem('watchlist');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                setWatchlist(parsed);
            } catch (e) {
                setWatchlist([]);
            }
        }
    }, []);

    useEffect(() => {
        watchlist.forEach(ticker => {
            fetch(`${API}/api/ticker-detail?ticker=${ticker}`)
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (data) {
                        setTickerPrices(prev => ({
                            ...prev,
                            [ticker]: data
                        }));
                    }
                })
                .catch(err => console.error('Error:', err));
        });
    }, [watchlist]);

    const addTicker = () => {
        if (newTicker.trim() && !watchlist.includes(newTicker.toUpperCase())) {
            const updated = [...watchlist, newTicker.toUpperCase()];
            setWatchlist(updated);
            localStorage.setItem('watchlist', JSON.stringify(updated));
            setNewTicker('');
            if (window.addToast) window.addToast(`${newTicker.toUpperCase()} zur Watchlist hinzugefügt`, 'success');
        }
    };

    const removeTicker = (ticker) => {
        const updated = watchlist.filter(t => t !== ticker);
        setWatchlist(updated);
        localStorage.setItem('watchlist', JSON.stringify(updated));
        if (window.addToast) window.addToast(`${ticker} aus Watchlist entfernt`, 'success');
    };

    const exportCSV = () => {
        let csv = 'Ticker,Preis,1D%,5D%,RSI,Grade\n';
        sorted.forEach(ticker => {
            const price = tickerPrices[ticker];
            if (price) {
                csv += `${ticker},${price.price},${price.change_pct},${price.change_5d || 0},${price.rsi || 0},${price.grade || 'N/A'}\n`;
            }
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'watchlist.csv';
        a.click();
    };

    return (
        <div className="space-y-6">
            <div className="card border border-gray-200 p-6 rounded-lg">
                <label className="block text-sm font-semibold mb-3">Ticker hinzufügen</label>
                <div className="flex gap-2">
                    <input
                        type="text"
                        value={newTicker}
                        onChange={(e) => setNewTicker(e.target.value)}
                        onKeyPress={(e) => e.key === 'Enter' && addTicker()}
                        placeholder="z.B. AAPL"
                        className="flex-1"
                    />
                    <button onClick={addTicker} className="button">Hinzufügen</button>
                    <button onClick={exportCSV} className="button button-secondary">CSV</button>
                </div>
            </div>

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('ticker')}>Ticker</th>
                            <th className="text-right py-2 px-2">Preis</th>
                            <th className="text-right py-2 px-2">1D%</th>
                            <th className="text-right py-2 px-2">5D%</th>
                            <th className="text-right py-2 px-2">RSI</th>
                            <th className="text-center py-2 px-2">Grade</th>
                            <th className="text-center py-2 px-2">Aktion</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.map((ticker, idx) => {
                            const price = tickerPrices[ticker];
                            return (
                                <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker(ticker)}>
                                    <td className="py-3 px-2 font-semibold">{ticker}</td>
                                    <td className="py-3 px-2 text-right">€{price?.price?.toFixed(2) || '-'}</td>
                                    <td className={`py-3 px-2 text-right ${(price?.change_pct || 0) >= 0 ? 'color-positive' : 'color-negative'}`}>{price?.change_pct?.toFixed(2) || '-'}%</td>
                                    <td className={`py-3 px-2 text-right ${(price?.change_5d || 0) >= 0 ? 'color-positive' : 'color-negative'}`}>{price?.change_5d?.toFixed(2) || '-'}%</td>
                                    <td className="py-3 px-2 text-right">{price?.rsi?.toFixed(1) || '-'}</td>
                                    <td className="py-3 px-2 text-center"><span className={`grade-badge grade-${(price?.grade || 'D').toLowerCase()}`}>{price?.grade || 'D'}</span></td>
                                    <td className="py-3 px-2 text-center"><button onClick={(e) => { e.stopPropagation(); removeTicker(ticker); }} className="button button-danger" style={{ padding: '4px 8px', fontSize: '12px' }}>×</button></td>
                                </tr>
                            );
                        })}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

// Backtest Tab
function BacktestTab() {
    const [ticker, setTicker] = useState('');
    const [strategy, setStrategy] = useState('sma-crossover');
    const [months, setMonths] = useState('6');
    const [isRunning, setIsRunning] = useState(false);
    const [results, setResults] = useState(null);
    const [trades, setTrades] = useState([]);
    const [strategies] = useState(['SMA Crossover', 'RSI Mean Reversion']);

    const runBacktest = async () => {
        if (!ticker.trim()) {
            if (window.addToast) window.addToast('Bitte Ticker eingeben', 'error');
            return;
        }

        setIsRunning(true);
        try {
            const response = await fetch(`${API}/api/backtest`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticker: ticker.toUpperCase(), strategy, months: parseInt(months) })
            });

            if (response.ok) {
                const data = await response.json();
                setResults(data.results);
                setTrades(data.trades || []);
                if (window.addToast) window.addToast('Backtest abgeschlossen', 'success');
            } else {
                if (window.addToast) window.addToast('Backtest fehlgeschlagen', 'error');
            }
        } catch (err) {
            if (window.addToast) window.addToast('Fehler beim Backtest', 'error');
        } finally {
            setIsRunning(false);
        }
    };

    return (
        <div className="space-y-6">
            <div className="card border border-gray-200 p-6 rounded-lg">
                <div className="grid grid-cols-4 gap-4 mb-4">
                    <div>
                        <label className="block text-sm font-semibold mb-2">Ticker</label>
                        <input
                            type="text"
                            value={ticker}
                            onChange={(e) => setTicker(e.target.value)}
                            placeholder="z.B. AAPL"
                        />
                    </div>
                    <div>
                        <label className="block text-sm font-semibold mb-2">Strategie</label>
                        <select value={strategy} onChange={(e) => setStrategy(e.target.value)}>
                            {strategies.map((s, i) => (
                                <option key={i} value={s.toLowerCase().replace(' ', '-')}>{s}</option>
                            ))}
                        </select>
                    </div>
                    <div>
                        <label className="block text-sm font-semibold mb-2">Zeitraum (Monate)</label>
                        <select value={months} onChange={(e) => setMonths(e.target.value)}>
                            <option value="3">3 Monate</option>
                            <option value="6">6 Monate</option>
                            <option value="12">12 Monate</option>
                        </select>
                    </div>
                    <div className="flex items-end">
                        <button onClick={runBacktest} disabled={isRunning} className="button w-full">
                            {isRunning ? 'Läuft...' : 'Ausführen'}
                        </button>
                    </div>
                </div>
            </div>

            {results && (
                <>
                    <div className="grid grid-cols-4 gap-4">
                        <div className="metric-card green">
                            <div className="text-sm font-semibold text-gray-600">Gesamte Trades</div>
                            <div className="text-2xl font-bold mt-2">{results.total_trades}</div>
                        </div>
                        <div className="metric-card blue">
                            <div className="text-sm font-semibold text-gray-600">Gewinnquote</div>
                            <div className="text-2xl font-bold mt-2">{(results.win_rate * 100).toFixed(1)}%</div>
                        </div>
                        <div className="metric-card orange">
                            <div className="text-sm font-semibold text-gray-600">Ø PnL</div>
                            <div className={`text-2xl font-bold mt-2 ${results.avg_pnl >= 0 ? 'color-positive' : 'color-negative'}`}>
                                €{results.avg_pnl?.toFixed(2)}
                            </div>
                        </div>
                        <div className="metric-card purple">
                            <div className="text-sm font-semibold text-gray-600">Max Drawdown</div>
                            <div className="text-2xl font-bold mt-2 color-negative">{(results.max_drawdown * 100).toFixed(2)}%</div>
                        </div>
                    </div>

                    <div className="metric-card" style={{ borderColor: '#10b981' }}>
                        <div className="text-sm font-semibold text-gray-600">Gesamtrendite</div>
                        <div className={`text-3xl font-bold mt-2 ${results.total_return >= 0 ? 'color-positive' : 'color-negative'}`}>
                            {(results.total_return * 100).toFixed(2)}%
                        </div>
                    </div>

                    {trades.length > 0 && (
                        <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                            <h3 className="font-semibold mb-4">Trade Historie</h3>
                            <table className="w-full text-sm">
                                <thead className="border-b border-gray-200">
                                    <tr>
                                        <th className="text-left py-2 px-2">Entry Datum</th>
                                        <th className="text-right py-2 px-2">Entry Preis</th>
                                        <th className="text-left py-2 px-2">Exit Datum</th>
                                        <th className="text-right py-2 px-2">Exit Preis</th>
                                        <th className="text-right py-2 px-2">PnL%</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {trades.map((trade, idx) => (
                                        <tr key={idx} className="table-row border-b border-gray-200">
                                            <td className="py-3 px-2">{trade.entry_date}</td>
                                            <td className="py-3 px-2 text-right">€{trade.entry_price?.toFixed(2)}</td>
                                            <td className="py-3 px-2">{trade.exit_date}</td>
                                            <td className="py-3 px-2 text-right">€{trade.exit_price?.toFixed(2)}</td>
                                            <td className={`py-3 px-2 text-right ${trade.pnl_pct >= 0 ? 'color-positive' : 'color-negative'}`}>{trade.pnl_pct?.toFixed(2)}%</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </>
            )}
        </div>
    );
}

            </div>

            <div className="flex gap-2 border-b border-gray-200">
                {marketTypes.map(market => (
                    <button
                        key={market.id}
                        onClick={() => setActiveMarket(market.id)}
                        className={`secondary-tab ${activeMarket === market.id ? 'active' : 'inactive'}`}
                    >
                        {market.label}
                    </button>
                ))}
            </div>

            <div className="space-y-3">
                {loading ? (
                    <div className="flex justify-center py-8"><div className="loading-spinner"></div></div>
                ) : (
                    filtered.map((strategy, idx) => (
                        <div key={idx} className="card border border-gray-200 p-4 rounded-lg cursor-pointer" onClick={() => setExpandedStrategy(expandedStrategy === idx ? null : idx)}>
                            <div className="flex justify-between items-center">
                                <h3 className="font-semibold">{strategy}</h3>
                                <span className="text-xl">{expandedStrategy === idx ? '−' : '+'}</span>
                            </div>
                            {expandedStrategy === idx && (
                                <div className="mt-4 pt-4 border-t border-gray-200 text-sm text-gray-700">
                                    <p>Detaillierte Beschreibung der Strategie {strategy}...</p>
                                </div>
                            )}
                        </div>
                    ))
                )}
            </div>
        </div>
    );
}

// New Listing Scanner Tab
function NewListingTab({ onSelectTicker }) {
    const [results, setResults] = useState([]);
    const [stats, setStats] = useState(null);
    const [isScanning, setIsScanning] = useState(false);
    const { sorted, toggleSort, sortKey } = useSortable(results, 'pump_pct');

    useEffect(() => {
        const fetchResults = async () => {
            try {
                const response = await fetch(`${API}/api/new-listing-results`);
                if (response.ok) {
                    const data = await response.json();
                    setResults(data.listings || []);
                    setStats(data.stats);
                }
            } catch (err) {
                console.error('Error:', err);
            }
        };
        fetchResults();
    }, []);

    const handleScan = async () => {
        setIsScanning(true);
        try {
            const response = await fetch(`${API}/api/new-listing-scan`, { method: 'POST' });
            if (response.ok) {
                if (window.addToast) window.addToast('New Listing Scan abgeschlossen', 'success');
            }
        } catch (err) {
            if (window.addToast) window.addToast('Scan-Fehler', 'error');
        } finally {
            setIsScanning(false);
        }
    };

    const getExhaustionColor = (exhaustion) => {
        if (exhaustion >= 70) return 'signal-bearish';
        if (exhaustion >= 40) return 'signal-lightdiv';
        return 'signal-bullish';
    };

    return (
        <div className="space-y-6">
            {stats && (
                <div className="grid grid-cols-3 gap-4">
                    <div className="metric-card blue">
                        <div className="text-sm font-semibold text-gray-600">Neue Listings</div>
                        <div className="text-2xl font-bold mt-2">{stats.new_listings}</div>
                    </div>
                    <div className="metric-card green">
                        <div className="text-sm font-semibold text-gray-600">Exchanges Überwacht</div>
                        <div className="text-2xl font-bold mt-2">{stats.exchanges_monitored}</div>
                    </div>
                    <div className="metric-card orange">
                        <div className="text-sm font-semibold text-gray-600">Aktive Signale</div>
                        <div className="text-2xl font-bold mt-2">{stats.active_signals}</div>
                    </div>
                </div>
            )}

            <ScanControl onScan={handleScan} isScanning={isScanning} />

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2">Symbol</th>
                            <th className="text-left py-2 px-2">Exchange</th>
                            <th className="text-right py-2 px-2">Preis</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('pump_pct')}>Pump%</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('exhaustion_score')}>Exhaustion</th>
                            <th className="text-center py-2 px-2">Signal</th>
                            <th className="text-right py-2 px-2">Funding Rate</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.map((item, idx) => (
                            <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker(item.symbol)}>
                                <td className="py-3 px-2 font-semibold">{item.symbol}</td>
                                <td className="py-3 px-2">{item.exchange}</td>
                                <td className="py-3 px-2 text-right">€{item.price?.toFixed(2)}</td>
                                <td className={`py-3 px-2 text-right ${item.pump_pct >= 0 ? 'color-positive' : 'color-negative'}`}>{item.pump_pct?.toFixed(2)}%</td>
                                <td className="py-3 px-2 text-right"><span className={`signal-badge ${getExhaustionColor(item.exhaustion_score)}`}>{item.exhaustion_score?.toFixed(0)}</span></td>
                                <td className="py-3 px-2 text-center"><span className="signal-badge signal-bullish">{item.signal}</span></td>
                                <td className={`py-3 px-2 text-right ${item.funding_rate >= 0 ? 'color-positive' : 'color-negative'}`}>{item.funding_rate?.toFixed(3)}%</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

// Suche (Search) Tab
function SucheTab({ onSelectTicker }) {
    const [searchTicker, setSearchTicker] = useState('');
    const [searchResults, setSearchResults] = useState(null);
    const [loading, setLoading] = useState(false);

    const performSearch = async () => {
        if (!searchTicker.trim()) return;

        setLoading(true);
        try {
            const response = await fetch(`${API}/api/ticker-detail?ticker=${searchTicker.toUpperCase()}`);
            if (response.ok) {
                const data = await response.json();
                setSearchResults(data);
            } else {
                setSearchResults(null);
                if (window.addToast) window.addToast('Ticker nicht gefunden', 'error');
            }
        } catch (err) {
            setSearchResults(null);
            if (window.addToast) window.addToast('Suchfehler', 'error');
        } finally {
            setLoading(false);
        }
    };

    return (
        <div className="space-y-6">
            <div className="card border border-gray-200 p-6 rounded-lg">
                <label className="block text-sm font-semibold mb-3">Ticker suchen</label>
                <div className="flex gap-2">
                    <input
                        type="text"
                        value={searchTicker}
                        onChange={(e) => setSearchTicker(e.target.value)}
                        onKeyPress={(e) => e.key === 'Enter' && performSearch()}
                        placeholder="z.B. AAPL"
                        className="flex-1"
                    />
                    <button onClick={performSearch} disabled={loading} className="button">
                        {loading ? 'Sucht...' : 'Suchen'}
                    </button>
                </div>
            </div>

            {searchResults && (
                <div className="space-y-6">
                    <div className="metric-card" style={{ borderColor: '#2563eb' }}>
                        <div className="flex justify-between items-start mb-4">
                            <div>
                                <h2 className="text-2xl font-bold">{searchResults.ticker}</h2>
                                <p className="text-2xl font-bold mt-2">€{searchResults.price?.toFixed(2)}</p>
                                <p className={`text-lg font-semibold mt-1 ${searchResults.change_pct >= 0 ? 'color-positive' : 'color-negative'}`}>
                                    ({searchResults.change_pct?.toFixed(2)}%)
                                </p>
                            </div>
                            <span className={`grade-badge grade-${(searchResults.grade || 'D').toLowerCase()}`}>
                                Grade {searchResults.grade || 'D'}
                            </span>
                        </div>
                    </div>

                    <div className="grid grid-cols-4 gap-4">
                        <div className="card border border-gray-200 p-4 rounded-lg">
                            <div className="text-sm font-semibold text-gray-600">RSI</div>
                            <div className="text-2xl font-bold mt-2">{searchResults.rsi?.toFixed(1)}</div>
                        </div>
                        <div className="card border border-gray-200 p-4 rounded-lg">
                            <div className="text-sm font-semibold text-gray-600">RVOL</div>
                            <div className="text-2xl font-bold mt-2">{searchResults.rvol?.toFixed(2)}</div>
                        </div>
                        <div className="card border border-gray-200 p-4 rounded-lg">
                            <div className="text-sm font-semibold text-gray-600">MA20</div>
                            <div className="text-2xl font-bold mt-2">€{searchResults.ma20?.toFixed(2)}</div>
                        </div>
                        <div className="card border border-gray-200 p-4 rounded-lg">
                            <div className="text-sm font-semibold text-gray-600">MA50</div>
                            <div className="text-2xl font-bold mt-2">€{searchResults.ma50?.toFixed(2)}</div>
                        </div>
                    </div>

                    <button onClick={() => onSelectTicker(searchResults.ticker)} className="button" style={{ width: '100%' }}>
                        Details anzeigen
                    </button>
                </div>
            )}
        </div>
    );
}

// Render App
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
