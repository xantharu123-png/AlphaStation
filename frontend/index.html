                const vp = chartData.vrvp;
                const addVPLine = (price, title, color, style, width) => {
                    if (price && price > 0) {
                        candleSeriesRef.current.createPriceLine({ price, color, lineWidth: width || 1, lineStyle: style || LineStyle.Dashed, axisLabelVisible: true, title });
                    }
                };
                addVPLine(vp.poc, 'POC', '#06b6d4', LineStyle.Solid, 2);
                addVPLine(vp.vah, 'VAH', '#0891b2', LineStyle.Dashed, 1);
                addVPLine(vp.val, 'VAL', '#0891b2', LineStyle.Dashed, 1);

                if (vp.bins && vp.bins.length > 0 && chartRef.current) {
                    const maxVol = Math.max(...vp.bins.map(b => b.volume));
                    const maxBarWidth = chartContainer.current ? chartContainer.current.clientWidth * 0.15 : 80;
                    const existingCanvas = chartContainer.current.querySelector('.vrvp-canvas');
                    if (existingCanvas) existingCanvas.remove();
                    const canvas = document.createElement('canvas');
                    canvas.className = 'vrvp-canvas';
                    canvas.style.position = 'absolute';
                    canvas.style.top = '0';
                    canvas.style.right = '48px';
                    canvas.style.pointerEvents = 'none';
                    canvas.style.zIndex = '5';
                    canvas.width = Math.ceil(maxBarWidth + 10);
                    canvas.height = chartContainer.current.clientHeight;
                    chartContainer.current.style.position = 'relative';
                    chartContainer.current.appendChild(canvas);

                    const drawVRVP = () => {
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        const series = candleSeriesRef.current;
                        if (!series) return;
                        vp.bins.forEach(bin => {
                            const yMid = series.priceToCoordinate(bin.mid);
                            const yHigh = series.priceToCoordinate(bin.high);
                            const yLow = series.priceToCoordinate(bin.low);
                            if (yMid === null || yHigh === null || yLow === null) return;
                            const barH = Math.max(2, Math.abs(yLow - yHigh));
                            const barW = Math.max(2, (bin.volume / maxVol) * maxBarWidth);
                            const y = Math.min(yHigh, yLow);
                            const isPOC = Math.abs(bin.mid - vp.poc) < (bin.high - bin.low);
                            const isVA = bin.mid >= vp.val && bin.mid <= vp.vah;
                            ctx.fillStyle = isPOC ? 'rgba(6, 182, 212, 0.45)' : isVA ? 'rgba(34, 211, 238, 0.25)' : 'rgba(100, 116, 139, 0.18)';
                            ctx.fillRect(canvas.width - barW, y, barW, barH);
                            ctx.strokeStyle = isPOC ? 'rgba(6, 182, 212, 0.7)' : isVA ? 'rgba(34, 211, 238, 0.4)' : 'rgba(100, 116, 139, 0.3)';
                            ctx.lineWidth = 0.5;
                            ctx.strokeRect(canvas.width - barW, y, barW, barH);
                        });
                    };
                    drawVRVP();
                    // Store refs for cleanup
                    chartRef.current.timeScale().subscribeVisibleTimeRangeChange(drawVRVP);
                    chartRef.current.subscribeCrosshairMove(drawVRVP);
                    vrvpSubsRef.current = [drawVRVP];
                }
            }

            // Fibonacci — V3.0: Richtungsabhängig
            if (overlays.fib && chartData.fib) {
                const isShort = chartData.fib_direction === 'short';
                const fibColors = {
                    '0%': '#ef4444', '23%': '#f97316', '38%': '#eab308', '50%': '#22c55e',
                    '61%': '#3b82f6', '78%': '#8b5cf6', '100%': '#a855f7',
                    '127%': isShort ? '#f43f5e' : '#06b6d4',
                    '161%': isShort ? '#e11d48' : '#14b8a6',
                    '200%': isShort ? '#be123c' : '#10b981',
                };
                const extendedKeys = ['127%', '161%', '200%'];
                Object.entries(chartData.fib).forEach(([level, price]) => {
                    const isExtended = extendedKeys.includes(level);
                    candleSeriesRef.current.createPriceLine({
                        price, color: fibColors[level] || '#6b7280',
                        lineWidth: 1, lineStyle: isExtended ? LineStyle.Dashed : LineStyle.Dotted,
                        axisLabelVisible: true, title: `Fib ${level}`,
                    });
                });
            }

            // Patterns
            if (overlays.patterns && chartData.patterns) {
                const markers = [];
                const _viewDir = (tickerData?.confluence?.direction || '').toUpperCase();

                // V4.0: Pivot-Marker entfernt (nur Noise)

                if (chartData.patterns.chart_patterns) {
                    // V4: Marker-Dedup — nur 1 Marker pro Kerze (höchste Priorität gewinnt)
                    const _usedTimes2 = new Set();
                    const _sevOrder2 = {'high': 0, 'medium': 1, 'low': 2};
                    const _sorted2 = [...chartData.patterns.chart_patterns]
                        .filter(p => !_viewDir || _viewDir === 'NEUTRAL' || (_viewDir === 'SHORT' ? p.type !== 'bullish' : p.type !== 'bearish'))
                        .sort((a, b) => (_sevOrder2[a.severity] || 2) - (_sevOrder2[b.severity] || 2));
                    _sorted2.forEach(p => {
                        const markerTime = p.time || (candles.length > 0 ? candles[candles.length - 1].time : null);
                        if (markerTime && !_usedTimes2.has(markerTime)) {
                            _usedTimes2.add(markerTime);
                            markers.push({
                                time: markerTime,
                                position: p.type === 'bullish' ? 'belowBar' : 'aboveBar',
                                color: p.type === 'bullish' ? '#10b981' : '#ef4444',
                                shape: 'circle',
                                text: (p.pattern || '').substring(0, 12),
                            });
                        }
                        // draw_points: Pattern-Linien einzeichnen
                        if (p.draw_points && p.draw_points.length >= 2) {
                            const validPts = p.draw_points.filter(dp => dp.time && dp.price);
                            if (validPts.length >= 2) {
                                const patColor = p.type === 'bullish' ? 'rgba(16,185,129,0.7)' : 'rgba(239,68,68,0.7)';
                                const patLine = chartRef.current.addLineSeries({
                                    color: patColor, lineWidth: 2, lineStyle: LineStyle.Dashed,
                                    lastValueVisible: false, priceLineVisible: false,
                                    crosshairMarkerVisible: false,
                                });
                                const sorted = [...validPts].sort((a, b) => a.time - b.time);
                                patLine.setData(sorted.map(dp => ({ time: dp.time, value: dp.price })));
                                overlaySeriesRef.current.push(patLine);
                                if (p.neckline) {
                                    candleSeriesRef.current.createPriceLine({
                                        price: p.neckline, color: '#f59e0b', lineWidth: 1,
                                        lineStyle: LineStyle.Dashed, axisLabelVisible: true,
                                        title: 'Neckline',
                                    });
                                }
                                if (p.target) {
                                    candleSeriesRef.current.createPriceLine({
                                        price: p.target, color: patColor, lineWidth: 1,
                                        lineStyle: LineStyle.Dotted, axisLabelVisible: true,
                                        title: 'Target',
                                    });
                                }
                            }
                        }
                    });
                }

                if (chartData.patterns.harmonic) {
                    chartData.patterns.harmonic
                        .filter(h => !_viewDir || _viewDir === 'NEUTRAL' || h.direction === _viewDir)
                        .forEach(h => {
                        if (h.points && h.points.length >= 5) {
                            const hLine = chartRef.current.addLineSeries({
                                color: h.direction === 'LONG' ? '#10b981' : '#ef4444',
                                lineWidth: 2, lastValueVisible: false, priceLineVisible: false,
                                title: h.pattern || 'Harmonic',
                            });
                            const points = h.points.map(pt => ({ time: pt.time || pt.t, value: pt.price || pt.p })).filter(pt => pt.time && pt.value).sort((a, b) => a.time - b.time);
                            if (points.length > 0) hLine.setData(points);
                            overlaySeriesRef.current.push(hLine);
                        }
                    });
                }

                if (markers.length > 0) {
                    markers.sort((a, b) => a.time - b.time);
                    candleSeriesRef.current.setMarkers(markers);
                }
            }

            // Restore zoom
            if (isOverlayChange && savedVisibleRange.current) {
                try {
                    if (savedVisibleRange.current.logical) {
                        chartRef.current.timeScale().setVisibleLogicalRange(savedVisibleRange.current.logical);
                    }
                } catch(e) {
                    chartRef.current.timeScale().fitContent();
                }
            } else {
                const totalBars = candles.length;
                const barsToShow = Math.min(totalBars, 120);
                chartRef.current.timeScale().setVisibleLogicalRange({ from: totalBars - barsToShow, to: totalBars - 1 });
                savedVisibleRange.current = null;
            }
        } catch (err) { console.error('Chart error:', err); }
        return () => {
            // VRVP event listener cleanup
            if (vrvpSubsRef.current.length > 0 && chartRef.current) {
                try {
                    vrvpSubsRef.current.forEach(fn => {
                        chartRef.current.timeScale().unsubscribeVisibleTimeRangeChange(fn);
                        chartRef.current.unsubscribeCrosshairMove(fn);
                    });
                } catch(e) {}
                vrvpSubsRef.current = [];
            }
            if (chartRef.current) {
                try {
                    savedVisibleRange.current = {
                        logical: chartRef.current.timeScale().getVisibleLogicalRange(),
                        scrollPos: chartRef.current.timeScale().scrollPosition(),
                    };
                } catch(e) {}
                chartRef.current.remove();
                chartRef.current = null;
            }
            // VRVP Canvas aufräumen
            if (chartContainer.current) {
                const oldCanvas = chartContainer.current.querySelector('.vrvp-canvas');
                if (oldCanvas) oldCanvas.remove();
            }
        };
    }, [chartData, overlays, tickerData]);

    // Resize chart on window resize
    useEffect(() => {
        const handleResize = () => {
            if (chartRef.current && chartContainer.current) {
                chartRef.current.applyOptions({ width: chartContainer.current.clientWidth });
            }
        };
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
    }, []);

    const loadAiAnalysis = async () => {
        if (!activeTicker) return;
        setAiLoading(true);
        try {
            const token = localStorage.getItem('as_token');
            const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
            const res = await fetch(`${API}/api/ai-analysis?ticker=${activeTicker}`, { headers });
            const data = await res.json();
            if (data.error === 'ai_not_available' || data.error === 'ai_limit_reached') {
                setAiData({ analysis: data.message, upgrade_required: true });
            } else if (res.ok) {
                setAiData(data);
            } else {
                setAiData({ analysis: 'API Fehler: ' + res.status });
            }
        } catch (err) { setAiData({ analysis: 'Verbindungsfehler' }); }
        finally { setAiLoading(false); }
    };

    const renderMarkdown = (text) => {
        if (!text) return '';
        let safe = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        return safe.replace(/\*\*(\d+)\.\s*(.*?)\*\*/g, '<br/><strong>$1. $2</strong>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br/>');
    };

    const d = tickerData || {};
    const price = Number(d.price) || 0;
    const change = Number(d.change_1d) || 0;
    const signalColor = s => s === 'bullish' ? '#059669' : s === 'bearish' ? '#dc2626' : '#6b7280';

    return (
        <div className="space-y-4">
            {/* Search Bar */}
            <div className="card border border-gray-200 p-4 rounded-lg">
                <div className="flex gap-2 items-center">
                    <div style={{ position: 'relative', flex: 1, zIndex: 100 }}>
                        <svg style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', width: 18, height: 18, color: '#6b7280', zIndex: 2 }} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                        <input
                            type="text"
                            value={searchTicker}
                            onChange={(e) => handleSearchInput(e.target.value)}
                            onKeyPress={(e) => e.key === 'Enter' && performSearch()}
                            onFocus={() => searchResults.length > 0 && setShowDropdown(true)}
                            onBlur={() => setTimeout(() => setShowDropdown(false), 200)}
                            placeholder="Ticker oder Firmenname — z.B. AAPL, Tesla, Microsoft..."
                            style={{ paddingLeft: 40, width: '100%', fontSize: 15 }}
                        />
                        {showDropdown && searchResults.length > 0 && (
                            <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, zIndex: 999, marginTop: 4, background: 'var(--card-bg)', border: '1px solid var(--border-color)', borderRadius: 10, boxShadow: '0 8px 30px rgba(0,0,0,0.4)', maxHeight: 320, overflowY: 'auto' }}>
                                {searchResults.map((r, i) => (
                                    <div key={i} onClick={() => { setSearchTicker(r.ticker); setShowDropdown(false); performSearch(r.ticker); }}
                                        style={{ padding: '10px 16px', cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid rgba(255,255,255,0.05)', transition: 'background 0.15s' }}
                                        onMouseEnter={e => e.currentTarget.style.background = 'rgba(59,130,246,0.1)'}
                                        onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                                        <div>
                                            <span style={{ fontWeight: 700, fontSize: 14, color: '#3b82f6' }}>{r.ticker}</span>
                                            <span style={{ fontSize: 13, color: 'var(--text-muted)', marginLeft: 10 }}>{r.name}</span>
                                        </div>
                                        <span style={{ fontSize: 11, color: 'var(--text-muted)', textTransform: 'uppercase' }}>{r.type || r.market}</span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                    <button onClick={() => performSearch()} disabled={loading} className="button" style={{ padding: '10px 24px', fontWeight: 700 }}>
                        {loading ? 'Laden...' : 'Analysieren'}
                    </button>
                </div>
            </div>

            {/* Welcome state */}
            {!activeTicker && !loading && (
                <div style={{ textAlign: 'center', padding: '80px 20px' }}>
                    <div style={{ width: 64, height: 64, borderRadius: 16, background: 'linear-gradient(135deg, #3b82f6, #8b5cf6)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', marginBottom: 20 }}>
                        <svg width="32" height="32" fill="none" stroke="white" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                    </div>
                    <h3 style={{ fontSize: 22, fontWeight: 700, marginBottom: 8 }}>Chart & Analyse</h3>
                    <p style={{ color: 'var(--text-muted)', maxWidth: 500, margin: '0 auto', lineHeight: 1.6 }}>
                        Gib oben einen Ticker ein und erhalte sofort den vollständigen Chart mit allen Indikatoren, Pattern-Erkennung, Harmonic Patterns, Support/Resistance, Trade Setups und mehr.
                    </p>
                    <div style={{ display: 'flex', gap: 8, justifyContent: 'center', marginTop: 24, flexWrap: 'wrap' }}>
                        {['AAPL', 'TSLA', 'NVDA', 'META', 'MSFT', 'AMZN'].map(t => (
                            <button key={t} onClick={() => { setSearchTicker(t); performSearch(t); }}
                                style={{ padding: '8px 16px', borderRadius: 8, border: '1px solid var(--border-color)', background: 'var(--card-bg)', cursor: 'pointer', fontSize: 13, fontWeight: 600, color: 'var(--text-color)', transition: 'all 0.2s' }}
                                onMouseEnter={(e) => { e.currentTarget.style.borderColor = '#3b82f6'; e.currentTarget.style.color = '#3b82f6'; }}
                                onMouseLeave={(e) => { e.currentTarget.style.borderColor = 'var(--border-color)'; e.currentTarget.style.color = 'var(--text-color)'; }}>
                                {t}
                            </button>
                        ))}
                    </div>
                </div>
            )}

            {/* Loading state */}
            {loading && (
                <div style={{ textAlign: 'center', padding: '60px 20px' }}>
                    <div className="loading-spinner" style={{ margin: '0 auto 16px' }}></div>
                    <p style={{ color: 'var(--text-muted)' }}>Analyse wird geladen...</p>
                </div>
            )}

            {/* Results */}
            {activeTicker && tickerData && !loading && (
                <div>
                    {/* Header bar */}
                    <div className="card border border-gray-200 p-4 rounded-lg" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                            <div>
                                <h2 style={{ fontSize: 24, fontWeight: 800, margin: 0 }}>{activeTicker}</h2>
                                <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginTop: 2 }}>
                                    <span style={{ fontSize: 22, fontWeight: 700 }}>${price < 0.01 ? price.toPrecision(4) : price.toFixed(2)}</span>
                                    <span style={{ fontSize: 16, fontWeight: 600, color: change >= 0 ? '#10b981' : '#ef4444' }}>({change >= 0 ? '+' : ''}{change.toFixed(2)}%)</span>
                                </div>
                            </div>
                            {d.signal_grade && (
                                <span className={`grade-badge grade-${d.signal_grade.toLowerCase()}`} style={{ fontSize: 14 }}>
                                    Grade {d.signal_grade} ({d.signal_score != null ? Math.round(d.signal_score) : 0}P)
                                </span>
                            )}
                            {d.confluence && (
                                <span className={`signal-badge signal-${d.confluence.direction === 'LONG' ? 'bullish' : d.confluence.direction === 'SHORT' ? 'bearish' : 'neutral'}`} style={{ fontSize: 13 }}>
                                    {d.confluence.direction}
                                </span>
                            )}
                        </div>
                        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                            <button onClick={() => setShowInfoPanel(!showInfoPanel)} className="button" style={{ padding: '6px 14px', fontSize: 12 }}>
                                {showInfoPanel ? 'Info ausblenden' : 'Info einblenden'}
                            </button>
                            <button onClick={() => onSelectTicker(activeTicker)} className="button" style={{ padding: '6px 14px', fontSize: 12, background: '#374151' }}>
                                In Sidebar öffnen
                            </button>
                        </div>
                    </div>

                    {/* Timeframe + Overlay controls */}
                    <div style={{ display: 'flex', gap: 8, marginTop: 12, flexWrap: 'wrap', alignItems: 'center' }}>
                        <div style={{ display: 'flex', gap: 4, background: 'var(--card-bg)', border: '1px solid var(--border-color)', borderRadius: 8, padding: 3 }}>
                            {TIMEFRAMES.map(tf => (
                                <button key={tf} onClick={() => setTimeframe(tf)}
                                    style={{ padding: '5px 12px', borderRadius: 6, border: 'none', fontSize: 12, fontWeight: 600, cursor: 'pointer',
                                        background: timeframe === tf ? '#3b82f6' : 'transparent',
                                        color: timeframe === tf ? '#fff' : 'var(--text-muted)',
                                    }}>
                                    {tf}
                                </button>
                            ))}
                        </div>
                        <div style={{ width: 1, height: 24, background: 'var(--border-color)' }}></div>
                        <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
                            {[
                                { key: 'ema', label: 'EMA', color: '#3b82f6' },
                                { key: 'vwap', label: 'VWAP', color: '#f97316' },
                                { key: 'sr', label: 'S/R', color: '#fbbf24' },
                                { key: 'fib', label: 'Fib', color: '#8b5cf6' },
                                { key: 'bb', label: 'BB', color: '#9333ea' },
                                { key: 'vrvp', label: 'VRVP', color: '#06b6d4' },
                                { key: 'patterns', label: 'Patterns', color: '#10b981' },
                                { key: 'vol', label: 'Vol', color: '#6b7280' },
                            ].map(({ key, label, color }) => (
                                <button key={key}
                                    onClick={() => setOverlays(prev => ({...prev, [key]: !prev[key]}))}
                                    style={{
                                        padding: '5px 10px', borderRadius: 6, fontSize: 11, fontWeight: 700, cursor: 'pointer',
                                        background: overlays[key] ? color : `${color}15`,
                                        color: overlays[key] ? '#fff' : color,
                                        border: `1.5px solid ${overlays[key] ? color : `${color}44`}`,
                                        transition: 'all 0.15s',
                                    }}>
                                    {label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Chart */}
                    <div style={{ marginTop: 12, borderRadius: 12, overflow: 'hidden', border: '1px solid var(--border-color)' }}>
                        {chartData && chartData.candles && chartData.candles.length === 0 ? (
                            <div style={{ textAlign: 'center', padding: '60px 20px', background: '#1a1a2e', color: '#64748b' }}>
                                {chartData.error || 'Keine Chart-Daten verfügbar'}
                            </div>
                        ) : !chartData ? (
                            <div style={{ display: 'flex', justifyContent: 'center', padding: '60px 20px', background: '#1a1a2e' }}><div className="loading-spinner"></div></div>
                        ) : null}
                        <div ref={chartContainer} style={{ position: 'relative', display: chartData && chartData.candles && chartData.candles.length > 0 ? 'block' : 'none' }}></div>
                    </div>

                    {/* Pattern badges */}
                    {chartData?.patterns?.chart_patterns && chartData.patterns.chart_patterns.length > 0 && (() => {
                        const _vd = (d.confluence?.direction || '').toUpperCase();
                        const filtered = chartData.patterns.chart_patterns.filter(p => !_vd || _vd === 'NEUTRAL' || (_vd === 'SHORT' ? p.type !== 'bullish' : p.type !== 'bearish'));
                        return filtered.length > 0 ? (
                        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 10 }}>
                            {filtered.map((p, i) => (
                                <span key={i} style={{ display: 'inline-block', padding: '4px 10px', borderRadius: 6, fontSize: 12, fontWeight: 600,
                                    background: p.type === 'bullish' ? 'rgba(16,185,129,0.15)' : 'rgba(239,68,68,0.15)',
                                    color: p.type === 'bullish' ? '#10b981' : '#ef4444',
                                    border: `1px solid ${p.type === 'bullish' ? 'rgba(16,185,129,0.3)' : 'rgba(239,68,68,0.3)'}`,
                                }}>
                                    {p.pattern} ({p.confidence || ''})
                                </span>
                            ))}
                        </div>
                        ) : null;
                    })()}

                    {/* Harmonic badges */}
                    {chartData?.patterns?.harmonic && chartData.patterns.harmonic.length > 0 && (() => {
                        const _vd = (d.confluence?.direction || '').toUpperCase();
                        const filtered = chartData.patterns.harmonic.filter(h => (!_vd || _vd === 'NEUTRAL' || h.direction === _vd) && (h.score || 0) >= 30);
                        return filtered.length > 0 ? (
                        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 6 }}>
                            {filtered.map((h, i) => (
                                <span key={i} style={{ display: 'inline-block', padding: '4px 10px', borderRadius: 6, fontSize: 12, fontWeight: 600,
                                    background: h.direction === 'LONG' ? 'rgba(16,185,129,0.15)' : 'rgba(239,68,68,0.15)',
                                    color: h.direction === 'LONG' ? '#10b981' : '#ef4444',
                                    border: `1px solid ${h.direction === 'LONG' ? 'rgba(16,185,129,0.3)' : 'rgba(239,68,68,0.3)'}`,
                                }}>
                                    {h.pattern} {h.direction} (Score: {h.score || ''})
                                </span>
                            ))}
                        </div>
                        ) : null;
                    })()}

                    {/* Info panels */}
                    {showInfoPanel && (
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 12, marginTop: 16 }}>
                            {/* Trade Setup */}
                            {d.trade_setup && (
                                <div className="card" style={{ padding: 16, borderRadius: 12, border: '1px solid rgba(16,185,129,0.3)', background: 'rgba(16,185,129,0.05)' }}>
                                    <h4 style={{ fontSize: 14, fontWeight: 700, marginBottom: 12, color: '#10b981', display: 'flex', alignItems: 'center', gap: 6 }}>
                                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>
                                        Trade Setup ({d.trade_setup.direction})
                                    </h4>
                                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, fontSize: 13 }}>
                                        <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>Entry</span><div style={{ fontWeight: 700 }}>${d.trade_setup.entry}</div></div>
                                        <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>Stop Loss</span><div style={{ fontWeight: 700, color: '#ef4444' }}>${d.trade_setup.stop}</div></div>
                                        <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>Take Profit 1</span><div style={{ fontWeight: 700, color: '#10b981' }}>${d.trade_setup.tp1}</div></div>
                                        <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>Take Profit 2</span><div style={{ fontWeight: 700, color: '#10b981' }}>${d.trade_setup.tp2}</div></div>
                                        <div style={{ gridColumn: 'span 2', textAlign: 'center', marginTop: 4 }}>
                                            <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>Risk/Reward</span>
                                            <div style={{ fontSize: 20, fontWeight: 800, color: '#10b981' }}>{d.trade_setup.rr}x</div>
                                        </div>
                                    </div>
                                    <div style={{ fontSize: 10, color: 'var(--text-muted)', marginTop: 8, textAlign: 'center', fontStyle: 'italic' }}>
                                        Empfohlen — du entscheidest selbst.
                                    </div>
                                </div>
                            )}

                            {/* Technische Indikatoren */}
                            <div className="card" style={{ padding: 16, borderRadius: 12, border: '1px solid var(--border-color)' }}>
                                <h4 style={{ fontSize: 14, fontWeight: 700, marginBottom: 12 }}>Technische Indikatoren</h4>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, fontSize: 13 }}>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>RSI (14)</span><div style={{ fontWeight: 700 }}>{d.rsi?.toFixed(1) || '-'}</div></div>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>RVOL</span><div style={{ fontWeight: 700 }}>{d.rvol?.toFixed(2) || '-'}x</div></div>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>ATR</span><div style={{ fontWeight: 700 }}>{d.atr?.toFixed(2) || '-'}</div></div>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>VWAP</span><div style={{ fontWeight: 700 }}>${d.vwap || '-'}</div></div>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>MACD</span><div style={{ fontWeight: 700 }}>{d.macd || '-'}</div></div>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>MACD Signal</span><div style={{ fontWeight: 700 }}>{d.macd_signal || '-'}</div></div>
                                </div>
                            </div>

                            {/* Moving Averages */}
                            <div className="card" style={{ padding: 16, borderRadius: 12, border: '1px solid var(--border-color)' }}>
                                <h4 style={{ fontSize: 14, fontWeight: 700, marginBottom: 12 }}>Moving Averages</h4>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, fontSize: 13 }}>
                                    {[
                                        { label: 'EMA 9', val: d.ema9, color: '#f59e0b' },
                                        { label: 'EMA 20', val: d.ema20, color: '#3b82f6' },
                                        { label: 'MA 20', val: d.ma20 },
                                        { label: 'MA 50', val: d.ma50 },
                                        { label: 'EMA 100', val: d.ema100, color: '#8b5cf6' },
                                        { label: 'EMA 200', val: d.ema200, color: '#14b8a6' },
                                    ].map(({ label, val, color }) => (
                                        <div key={label}>
                                            <span style={{ color: 'var(--text-muted)', fontSize: 11 }}>{label}</span>
                                            <div style={{ fontWeight: 700, color: val && price > val ? '#10b981' : val ? '#ef4444' : 'inherit' }}>
                                                {val ? `$${val}` : '-'}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Support / Resistance */}
                            <div className="card" style={{ padding: 16, borderRadius: 12, border: '1px solid var(--border-color)' }}>
                                <h4 style={{ fontSize: 14, fontWeight: 700, marginBottom: 12 }}>Support / Resistance</h4>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, fontSize: 13 }}>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>Support</span><div style={{ fontWeight: 700, color: '#10b981' }}>${d.support_1 || '-'}</div></div>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>Resistance</span><div style={{ fontWeight: 700, color: '#ef4444' }}>${d.resistance_1 || '-'}</div></div>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>Pivot</span><div style={{ fontWeight: 700 }}>${d.pivot || '-'}</div></div>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>Range Position</span><div style={{ fontWeight: 700 }}>{d.range_position?.toFixed(0) || '-'}%</div></div>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>20D High</span><div style={{ fontWeight: 700 }}>${d.high_20d || '-'}</div></div>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>20D Low</span><div style={{ fontWeight: 700 }}>${d.low_20d || '-'}</div></div>
                                </div>
                                {d.fib_levels && (
                                    <div style={{ marginTop: 10, paddingTop: 10, borderTop: '1px solid var(--border-color)' }}>
                                        <div style={{ fontSize: 11, color: 'var(--text-muted)', marginBottom: 6 }}>Fibonacci Levels</div>
                                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 4, fontSize: 11 }}>
                                            {Object.entries(d.fib_levels).map(([k, v]) => (
                                                <div key={k}><span style={{ color: 'var(--text-muted)' }}>{k}</span> ${v}</div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Preis */}
                            <div className="card" style={{ padding: 16, borderRadius: 12, border: '1px solid var(--border-color)' }}>
                                <h4 style={{ fontSize: 14, fontWeight: 700, marginBottom: 12 }}>Preis & Volumen</h4>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8, fontSize: 13 }}>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>1D</span><div style={{ fontWeight: 700, color: change >= 0 ? '#10b981' : '#ef4444' }}>{change}%</div></div>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>5D</span><div style={{ fontWeight: 700, color: (d.change_5d ?? 0) >= 0 ? '#10b981' : '#ef4444' }}>{d.change_5d || '-'}%</div></div>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>20D</span><div style={{ fontWeight: 700, color: (d.change_20d ?? 0) >= 0 ? '#10b981' : '#ef4444' }}>{d.change_20d || '-'}%</div></div>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>Open</span><div style={{ fontWeight: 700 }}>${d.open || '-'}</div></div>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>High</span><div style={{ fontWeight: 700 }}>${d.high || '-'}</div></div>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>Low</span><div style={{ fontWeight: 700 }}>${d.low || '-'}</div></div>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>Volumen</span><div style={{ fontWeight: 700 }}>{(d.volume || 0).toLocaleString()}</div></div>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>Avg Vol</span><div style={{ fontWeight: 700 }}>{(d.avg_volume || 0).toLocaleString()}</div></div>
                                    <div><span style={{ color: 'var(--text-muted)', fontSize: 11 }}>BB Band</span><div style={{ fontWeight: 700 }}>${d.bb_upper || '-'} / ${d.bb_lower || '-'}</div></div>
                                </div>
                            </div>

                            {/* Signale */}
                            {d.signals && d.signals.length > 0 && (
                                <div className="card" style={{ padding: 16, borderRadius: 12, border: '1px solid var(--border-color)' }}>
                                    <h4 style={{ fontSize: 14, fontWeight: 700, marginBottom: 12 }}>Signale ({d.confluence?.bullish || 0} Bull / {d.confluence?.bearish || 0} Bear)</h4>
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                                        {d.signals.map((s, i) => (
                                            <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 12 }}>
                                                <span style={{ color: 'var(--text-muted)' }}>{s.name}</span>
                                                <span style={{ color: signalColor(s.status), fontWeight: 600 }}>{s.detail}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Extension Warning */}
                            {d.ext_warning && (
                                <div className="card" style={{ padding: 16, borderRadius: 12,
                                    border: `1px solid ${d.ext_level === 'extreme' ? '#ef4444' : d.ext_level === 'high' ? '#f97316' : '#eab308'}`,
                                    background: d.ext_level === 'extreme' ? 'rgba(239,68,68,0.05)' : d.ext_level === 'high' ? 'rgba(249,115,22,0.05)' : 'rgba(234,179,8,0.05)',
                                }}>
                                    <h4 style={{ fontSize: 14, fontWeight: 700, marginBottom: 8, color: d.ext_level === 'extreme' ? '#ef4444' : d.ext_level === 'high' ? '#f97316' : '#eab308' }}>
                                        Extension Warning
                                    </h4>
                                    <div style={{ fontSize: 13, fontWeight: 600, color: d.ext_level === 'extreme' ? '#ef4444' : d.ext_level === 'high' ? '#f97316' : '#eab308' }}>
                                        {d.ext_warning}
                                    </div>
                                    <div style={{ marginTop: 6, fontSize: 12, color: 'var(--text-muted)', display: 'flex', gap: 12 }}>
                                        {d.ext_ma20 != null && <span>MA20: {d.ext_ma20 > 0 ? '+' : ''}{d.ext_ma20}%</span>}
                                        {d.ext_vwap != null && <span>VWAP: {d.ext_vwap > 0 ? '+' : ''}{d.ext_vwap}%</span>}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* AI Analysis */}
                    <div style={{ marginTop: 16 }}>
                        {!aiData && (
                            <button onClick={loadAiAnalysis} disabled={aiLoading} className="button" style={{ width: '100%', padding: '12px 0' }}>
                                {aiLoading ? 'KI analysiert...' : 'KI Analyse starten'}
                            </button>
                        )}
                        {aiData && (
                            <div className="card" style={{ padding: 16, borderRadius: 12, border: '1px solid rgba(59,130,246,0.3)', background: 'rgba(59,130,246,0.05)' }}>
                                <h4 style={{ fontSize: 14, fontWeight: 700, marginBottom: 10, color: '#3b82f6' }}>KI Analyse</h4>
                                <div style={{ fontSize: 13, lineHeight: 1.7 }} dangerouslySetInnerHTML={{ __html: renderMarkdown(aiData.analysis || 'Keine Analyse') }}></div>
                            </div>
                        )}
                    </div>
                </div>
            )}
        </div>
    );
}

// ── Admin Tab ──
function AdminTab() {
    const [activePanel, setActivePanel] = useState('users');
    const [users, setUsers] = useState([]);
    const [stats, setStats] = useState(null);
    const [logs, setLogs] = useState([]);
    const [coupons, setCoupons] = useState([]);
    const [tickets, setTickets] = useState([]);
    const [loading, setLoading] = useState(false);
    const [editingUser, setEditingUser] = useState(null);
    const [newCoupon, setNewCoupon] = useState({ code: '', plan: 'pro', duration_days: 30, max_uses: 10, description: '' });
    const [showNewCoupon, setShowNewCoupon] = useState(false);
    const [replyText, setReplyText] = useState({});
    const [searchTerm, setSearchTerm] = useState('');
    const [toast, setToast] = useState(null);
    const toastTimerRef = useRef(null);

    const token = localStorage.getItem('as_token');
    const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

    const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        toastTimerRef.current = setTimeout(() => setToast(null), 3000);
    };

    useEffect(() => { return () => { if (toastTimerRef.current) clearTimeout(toastTimerRef.current); }; }, []);

    // Fetch data based on active panel
    useEffect(() => {
        if (activePanel === 'users') fetchUsers();
        if (activePanel === 'stats') fetchStats();
        if (activePanel === 'logs') fetchLogs();
        if (activePanel === 'coupons') fetchCoupons();
        if (activePanel === 'tickets') fetchTickets();
    }, [activePanel]);

    const fetchUsers = async () => {
        setLoading(true);
        try {
            const res = await fetch(`${API}/api/admin/users`, { headers });
            if (res.ok) setUsers(await res.json().then(d => d.users || d));
        } catch(e) { console.error(e); }
        setLoading(false);
    };

    const fetchStats = async () => {
        setLoading(true);
        try {
            const res = await fetch(`${API}/api/admin/stats`, { headers });
            if (res.ok) setStats(await res.json());
        } catch(e) { console.error(e); }
        setLoading(false);
    };

    const fetchLogs = async () => {
        setLoading(true);
        try {
            const res = await fetch(`${API}/api/admin/logs`, { headers });
            if (res.ok) { const d = await res.json(); setLogs(d.logs || []); }
        } catch(e) { console.error(e); }
        setLoading(false);
    };

    const fetchCoupons = async () => {
        setLoading(true);
        try {
            const res = await fetch(`${API}/api/admin/coupons`, { headers });
            if (res.ok) { const d = await res.json(); setCoupons(d.coupons || []); }
        } catch(e) { console.error(e); }
        setLoading(false);
    };

    const fetchTickets = async () => {
        setLoading(true);
        try {
            const res = await fetch(`${API}/api/admin/tickets`, { headers });
            if (res.ok) { const d = await res.json(); setTickets(d.tickets || []); }
        } catch(e) { console.error(e); }
        setLoading(false);
    };

    const changePlan = async (email, plan) => {
        try {
            const res = await fetch(`${API}/api/admin/users/${encodeURIComponent(email)}/plan`, {
                method: 'PUT', headers, body: JSON.stringify({ plan })
            });
            if (res.ok) { showToast(`Plan für ${email} → ${plan}`); fetchUsers(); fetchStats(); setEditingUser(null); }
            else showToast('Fehler beim Ändern', 'error');
        } catch(e) { showToast('Fehler', 'error'); }
    };

    const deleteUser = async (email) => {
        if (!confirm(`User ${email} wirklich löschen?`)) return;
        try {
            const res = await fetch(`${API}/api/admin/users/${encodeURIComponent(email)}`, { method: 'DELETE', headers });
            if (res.ok) { showToast(`${email} gelöscht`); fetchUsers(); fetchStats(); }
        } catch(e) { showToast('Fehler', 'error'); }
    };

    const createCoupon = async () => {
        if (!newCoupon.code) return showToast('Code erforderlich', 'error');
        try {
            const res = await fetch(`${API}/api/admin/coupons`, {
                method: 'POST', headers, body: JSON.stringify(newCoupon)
            });
            if (res.ok) { showToast(`Gutschein ${newCoupon.code} erstellt`); fetchCoupons(); setShowNewCoupon(false); setNewCoupon({ code: '', plan: 'pro', duration_days: 30, max_uses: 10, description: '' }); }
            else { const d = await res.json(); showToast(d.detail || 'Fehler', 'error'); }
        } catch(e) { showToast('Fehler', 'error'); }
    };

    const toggleCoupon = async (code) => {
        try {
            const res = await fetch(`${API}/api/admin/coupons/${encodeURIComponent(code)}/toggle`, { method: 'PUT', headers });
            if (res.ok) fetchCoupons();
        } catch(e) {}
    };

    const deleteCoupon = async (code) => {
        if (!confirm(`Gutschein ${code} löschen?`)) return;
        try {
            const res = await fetch(`${API}/api/admin/coupons/${encodeURIComponent(code)}`, { method: 'DELETE', headers });
            if (res.ok) { showToast('Gelöscht'); fetchCoupons(); }
        } catch(e) {}
    };

    const replyTicket = async (id) => {
        const msg = replyText[id];
        if (!msg) return;
        try {
            const res = await fetch(`${API}/api/admin/tickets/${id}/reply`, {
                method: 'PUT', headers, body: JSON.stringify({ message: msg })
            });
            if (res.ok) { showToast('Antwort gesendet'); setReplyText(p => ({...p, [id]: ''})); fetchTickets(); }
        } catch(e) { showToast('Fehler', 'error'); }
    };

    const changeTicketStatus = async (id, status) => {
        try {
            const res = await fetch(`${API}/api/admin/tickets/${id}/status`, {
                method: 'PUT', headers, body: JSON.stringify({ status })
            });
            if (res.ok) fetchTickets();
        } catch(e) {}
    };

    const panels = [
        { id: 'users', label: 'User', icon: '👥' },
        { id: 'stats', label: 'Statistiken', icon: '📊' },
        { id: 'coupons', label: 'Gutscheine', icon: '🎟️' },
        { id: 'tickets', label: 'Tickets', icon: '🎫' },
        { id: 'logs', label: 'System Logs', icon: '📋' },
    ];

    const planColors = { trial: '#f59e0b', expired: '#6b7280', basic: '#3b82f6', pro: '#8b5cf6', elite: '#f59e0b' };
    const planLabels = { trial: 'Trial', expired: 'Expired', basic: 'Basic', pro: 'Pro', elite: 'Elite' };

    const filteredUsers = users.filter(u =>
        u.email?.toLowerCase().includes(searchTerm.toLowerCase()) ||
        u.name?.toLowerCase().includes(searchTerm.toLowerCase()) ||
        u.plan?.toLowerCase().includes(searchTerm.toLowerCase())
    );

    const cardStyle = { background: 'var(--card-bg)', border: '1px solid var(--border-color)', borderRadius: 12, padding: 20 };
    const badgeStyle = (color) => ({ display: 'inline-block', padding: '3px 10px', borderRadius: 20, fontSize: 11, fontWeight: 700, background: `${color}22`, color, border: `1px solid ${color}44` });

    return (
        <div style={{ maxWidth: 1200, margin: '0 auto' }}>
            {/* Toast */}
            {toast && (
                <div style={{ position: 'fixed', top: 20, right: 20, zIndex: 9999, padding: '12px 24px', borderRadius: 10,
                    background: toast.type === 'error' ? '#ef4444' : '#10b981', color: '#fff', fontSize: 14, fontWeight: 600,
                    boxShadow: '0 4px 20px rgba(0,0,0,0.3)', animation: 'fadeIn 0.3s' }}>
                    {toast.msg}
                </div>
            )}

            {/* Header */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
                <div style={{ width: 40, height: 40, borderRadius: 10, background: 'linear-gradient(135deg, #ef4444, #f59e0b)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20 }}>⚡</div>
                <div>
                    <h2 style={{ fontSize: 22, fontWeight: 800, margin: 0 }}>Admin Panel</h2>
                    <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>Alpha Station Verwaltung</div>
                </div>
            </div>

            {/* Panel Navigation */}
            <div style={{ display: 'flex', gap: 6, marginBottom: 24, background: 'var(--card-bg)', border: '1px solid var(--border-color)', borderRadius: 10, padding: 4, flexWrap: 'wrap' }}>
                {panels.map(p => (
                    <button key={p.id} onClick={() => setActivePanel(p.id)}
                        style={{ padding: '8px 16px', borderRadius: 8, border: 'none', fontSize: 13, fontWeight: 600, cursor: 'pointer',
                            background: activePanel === p.id ? '#3b82f6' : 'transparent',
                            color: activePanel === p.id ? '#fff' : 'var(--text-muted)',
                            transition: 'all 0.2s' }}>
                        {p.icon} {p.label}
                    </button>
                ))}
            </div>

            {/* ═══ USERS PANEL ═══ */}
            {activePanel === 'users' && (
                <div>
                    <div style={{ display: 'flex', gap: 12, marginBottom: 16, alignItems: 'center', flexWrap: 'wrap' }}>
                        <input value={searchTerm} onChange={e => setSearchTerm(e.target.value)}
                            placeholder="Suche nach Email, Name oder Plan..."
                            style={{ flex: 1, minWidth: 200, padding: '10px 16px', borderRadius: 10, border: '1px solid var(--border-color)', background: 'var(--card-bg)', color: 'var(--text-primary)', fontSize: 13 }} />
                        <button onClick={fetchUsers} className="button" style={{ padding: '10px 20px', fontSize: 13 }}>
                            🔄 Aktualisieren
                        </button>
                        <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>{filteredUsers.length} User</span>
                    </div>

                    {loading ? (
                        <div style={{ textAlign: 'center', padding: 40, color: 'var(--text-muted)' }}>Laden...</div>
                    ) : (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                            {filteredUsers.map(u => (
                                <div key={u.email} style={{ ...cardStyle, padding: 16, display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
                                    <div style={{ width: 38, height: 38, borderRadius: '50%', background: u.is_admin ? 'linear-gradient(135deg, #ef4444, #f59e0b)' : 'linear-gradient(135deg, #3b82f6, #8b5cf6)',
                                        display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 15, fontWeight: 700, color: '#fff', flexShrink: 0 }}>
                                        {(u.name || u.email || '?')[0].toUpperCase()}
                                    </div>
                                    <div style={{ flex: 1, minWidth: 180 }}>
                                        <div style={{ fontWeight: 700, fontSize: 14 }}>{u.name || 'Kein Name'} {u.is_admin && <span style={{ fontSize: 10, color: '#ef4444', fontWeight: 800 }}>ADMIN</span>}</div>
                                        <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{u.email}</div>
                                    </div>
                                    <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                                        <span style={badgeStyle(planColors[u.plan] || '#6b7280')}>{planLabels[u.plan] || u.plan}</span>
                                        {u.stripe_customer_id && <span style={{ fontSize: 10, color: '#10b981' }}>💳 Stripe</span>}
                                    </div>
                                    <div style={{ fontSize: 11, color: 'var(--text-muted)', textAlign: 'right', minWidth: 120 }}>
                                        <div>Registriert: {u.created_at ? new Date(u.created_at).toLocaleDateString('de-DE') : '—'}</div>
                                        <div>Letzter Login: {u.last_login ? new Date(u.last_login).toLocaleDateString('de-DE') : '—'}</div>
                                    </div>
                                    <div style={{ display: 'flex', gap: 6 }}>
                                        {editingUser === u.email ? (
                                            <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
                                                {['trial', 'basic', 'pro', 'elite', 'expired'].map(p => (
                                                    <button key={p} onClick={() => changePlan(u.email, p)}
                                                        style={{ padding: '4px 10px', borderRadius: 6, border: `1px solid ${planColors[p]}44`, background: u.plan === p ? `${planColors[p]}22` : 'transparent',
                                                            color: planColors[p], fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>
                                                        {planLabels[p]}
                                                    </button>
                                                ))}
                                                <button onClick={() => setEditingUser(null)} style={{ padding: '4px 8px', borderRadius: 6, border: '1px solid var(--border-color)', background: 'transparent', color: 'var(--text-muted)', fontSize: 11, cursor: 'pointer' }}>✕</button>
                                            </div>
                                        ) : (
                                            <>
                                                <button onClick={() => setEditingUser(u.email)}
                                                    style={{ padding: '4px 12px', borderRadius: 6, border: '1px solid var(--border-color)', background: 'transparent', color: 'var(--text-primary)', fontSize: 11, cursor: 'pointer' }}>
                                                    ✏️ Plan
                                                </button>
                                                {!u.is_admin && (
                                                    <button onClick={() => deleteUser(u.email)}
                                                        style={{ padding: '4px 12px', borderRadius: 6, border: '1px solid #ef444444', background: 'transparent', color: '#ef4444', fontSize: 11, cursor: 'pointer' }}>
                                                        🗑️
                                                    </button>
                                                )}
                                            </>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            )}

            {/* ═══ STATS PANEL ═══ */}
            {activePanel === 'stats' && (
                <div>
                    {loading || !stats ? (
                        <div style={{ textAlign: 'center', padding: 40, color: 'var(--text-muted)' }}>Laden...</div>
                    ) : (
                        <>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 12, marginBottom: 24 }}>
                                {[
                                    { label: 'Gesamt User', value: stats.total_users, color: '#3b82f6', icon: '👥' },
                                    { label: 'Neue heute', value: stats.new_today, color: '#10b981', icon: '🆕' },
                                    { label: 'Neue diese Woche', value: stats.new_this_week, color: '#8b5cf6', icon: '📈' },
                                    { label: 'Aktiv heute', value: stats.active_today, color: '#f59e0b', icon: '🔥' },
                                    { label: 'Est. MRR', value: `$${stats.estimated_mrr || 0}`, color: '#10b981', icon: '💰' },
                                ].map((s, i) => (
                                    <div key={i} style={{ ...cardStyle, textAlign: 'center' }}>
                                        <div style={{ fontSize: 24, marginBottom: 4 }}>{s.icon}</div>
                                        <div style={{ fontSize: 28, fontWeight: 800, color: s.color }}>{s.value}</div>
                                        <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 4 }}>{s.label}</div>
                                    </div>
                                ))}
                            </div>
                            {/* Users by Plan */}
                            <div style={cardStyle}>
                                <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 16 }}>User nach Plan</h3>
                                <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap' }}>
                                    {Object.entries(stats.users_by_plan || {}).map(([plan, count]) => (
                                        <div key={plan} style={{ flex: 1, minWidth: 120, textAlign: 'center', padding: 16, borderRadius: 10, background: `${planColors[plan] || '#6b7280'}11`, border: `1px solid ${planColors[plan] || '#6b7280'}33` }}>
                                            <div style={{ fontSize: 24, fontWeight: 800, color: planColors[plan] || '#6b7280' }}>{count}</div>
                                            <div style={{ fontSize: 12, fontWeight: 600, color: planColors[plan] || '#6b7280', marginTop: 4 }}>{planLabels[plan] || plan}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <button onClick={fetchStats} className="button" style={{ marginTop: 16, padding: '10px 20px', fontSize: 13 }}>🔄 Aktualisieren</button>
                        </>
                    )}
                </div>
            )}

            {/* ═══ COUPONS PANEL ═══ */}
            {activePanel === 'coupons' && (
                <div>
                    <div style={{ display: 'flex', gap: 12, marginBottom: 16, alignItems: 'center' }}>
                        <button onClick={() => setShowNewCoupon(!showNewCoupon)} className="button" style={{ padding: '10px 20px', fontSize: 13, background: showNewCoupon ? '#ef4444' : '#3b82f6' }}>
                            {showNewCoupon ? '✕ Abbrechen' : '+ Neuer Gutschein'}
                        </button>
                        <button onClick={fetchCoupons} className="button" style={{ padding: '10px 20px', fontSize: 13, background: '#374151' }}>🔄</button>
                    </div>

                    {showNewCoupon && (
                        <div style={{ ...cardStyle, marginBottom: 16, border: '1px solid #3b82f644' }}>
                            <h4 style={{ fontSize: 14, fontWeight: 700, marginBottom: 12 }}>Neuer Gutschein</h4>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 12 }}>
                                <div>
                                    <label style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-muted)', display: 'block', marginBottom: 4 }}>Code</label>
                                    <input value={newCoupon.code} onChange={e => setNewCoupon(p => ({...p, code: e.target.value.toUpperCase()}))}
                                        placeholder="z.B. FRIEND50" style={{ width: '100%', padding: '8px 12px', borderRadius: 8, border: '1px solid var(--border-color)', background: 'var(--bg-primary)', color: 'var(--text-primary)', fontSize: 13 }} />
                                </div>
                                <div>
                                    <label style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-muted)', display: 'block', marginBottom: 4 }}>Plan</label>
                                    <select value={newCoupon.plan} onChange={e => setNewCoupon(p => ({...p, plan: e.target.value}))}
                                        style={{ width: '100%', padding: '8px 12px', borderRadius: 8, border: '1px solid var(--border-color)', background: 'var(--bg-primary)', color: 'var(--text-primary)', fontSize: 13 }}>
                                        <option value="basic">Basic ($29)</option>
                                        <option value="pro">Pro ($79)</option>
                                        <option value="elite">Elite ($149)</option>
                                    </select>
                                </div>
                                <div>
                                    <label style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-muted)', display: 'block', marginBottom: 4 }}>Laufzeit (Tage)</label>
                                    <input type="number" value={newCoupon.duration_days} onChange={e => setNewCoupon(p => ({...p, duration_days: parseInt(e.target.value) || 30}))}
                                        style={{ width: '100%', padding: '8px 12px', borderRadius: 8, border: '1px solid var(--border-color)', background: 'var(--bg-primary)', color: 'var(--text-primary)', fontSize: 13 }} />
                                </div>
                                <div>
                                    <label style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-muted)', display: 'block', marginBottom: 4 }}>Max. Einlösungen</label>
                                    <input type="number" value={newCoupon.max_uses} onChange={e => setNewCoupon(p => ({...p, max_uses: parseInt(e.target.value) || 1}))}
                                        style={{ width: '100%', padding: '8px 12px', borderRadius: 8, border: '1px solid var(--border-color)', background: 'var(--bg-primary)', color: 'var(--text-primary)', fontSize: 13 }} />
                                </div>
                            </div>
                            <div style={{ marginTop: 12 }}>
                                <label style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-muted)', display: 'block', marginBottom: 4 }}>Beschreibung</label>
                                <input value={newCoupon.description} onChange={e => setNewCoupon(p => ({...p, description: e.target.value}))}
                                    placeholder="z.B. Freunde-Rabatt 30 Tage Pro"
                                    style={{ width: '100%', padding: '8px 12px', borderRadius: 8, border: '1px solid var(--border-color)', background: 'var(--bg-primary)', color: 'var(--text-primary)', fontSize: 13 }} />
                            </div>
                            <button onClick={createCoupon} className="button" style={{ marginTop: 12, padding: '10px 24px', fontSize: 13 }}>
                                ✅ Gutschein erstellen
                            </button>
                        </div>
                    )}

                    {loading ? (
                        <div style={{ textAlign: 'center', padding: 40, color: 'var(--text-muted)' }}>Laden...</div>
                    ) : coupons.length === 0 ? (
                        <div style={{ ...cardStyle, textAlign: 'center', padding: 40, color: 'var(--text-muted)' }}>Keine Gutscheine vorhanden</div>
                    ) : (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                            {coupons.map(c => (
                                <div key={c.code} style={{ ...cardStyle, padding: 16, display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap', opacity: c.active ? 1 : 0.5 }}>
                                    <div style={{ minWidth: 100 }}>
                                        <div style={{ fontSize: 16, fontWeight: 800, fontFamily: 'monospace', color: '#3b82f6' }}>{c.code}</div>
                                        <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>{c.description || '—'}</div>
                                    </div>
                                    <span style={badgeStyle(planColors[c.plan] || '#6b7280')}>{planLabels[c.plan] || c.plan}</span>
                                    <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>
                                        <div>{c.duration_days} Tage</div>
                                        <div>{c.uses || 0} / {c.max_uses} eingelöst</div>
                                    </div>
                                    <div style={{ marginLeft: 'auto', display: 'flex', gap: 6 }}>
                                        <button onClick={() => toggleCoupon(c.code)}
                                            style={{ padding: '4px 12px', borderRadius: 6, border: `1px solid ${c.active ? '#ef444444' : '#10b98144'}`, background: 'transparent',
                                                color: c.active ? '#ef4444' : '#10b981', fontSize: 11, cursor: 'pointer', fontWeight: 600 }}>
                                            {c.active ? 'Deaktivieren' : 'Aktivieren'}
                                        </button>
                                        <button onClick={() => deleteCoupon(c.code)}
                                            style={{ padding: '4px 12px', borderRadius: 6, border: '1px solid #ef444444', background: 'transparent', color: '#ef4444', fontSize: 11, cursor: 'pointer' }}>
                                            🗑️
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            )}

            {/* ═══ TICKETS PANEL ═══ */}
            {activePanel === 'tickets' && (
                <div>
                    <div style={{ display: 'flex', gap: 12, marginBottom: 16, alignItems: 'center' }}>
                        <button onClick={fetchTickets} className="button" style={{ padding: '10px 20px', fontSize: 13 }}>🔄 Aktualisieren</button>
                        <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>
                            {tickets.filter(t => t.status === 'open').length} offen / {tickets.length} gesamt
                        </span>
                    </div>

                    {loading ? (
                        <div style={{ textAlign: 'center', padding: 40, color: 'var(--text-muted)' }}>Laden...</div>
                    ) : tickets.length === 0 ? (
                        <div style={{ ...cardStyle, textAlign: 'center', padding: 40, color: 'var(--text-muted)' }}>Keine Tickets vorhanden</div>
                    ) : (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                            {tickets.sort((a, b) => (a.status === 'open' ? -1 : 1)).map(t => (
                                <div key={t.id} style={{ ...cardStyle, opacity: t.status === 'closed' ? 0.6 : 1 }}>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 12, flexWrap: 'wrap' }}>
                                        <span style={badgeStyle(t.status === 'open' ? '#f59e0b' : t.status === 'in_progress' ? '#3b82f6' : '#10b981')}>
                                            {t.status === 'open' ? 'Offen' : t.status === 'in_progress' ? 'In Bearbeitung' : 'Geschlossen'}
                                        </span>
                                        <span style={{ fontSize: 10, color: 'var(--text-muted)' }}>#{t.id}</span>
                                        <span style={{ fontWeight: 700, fontSize: 14, flex: 1 }}>{t.subject}</span>
                                        <span style={{ fontSize: 11, color: 'var(--text-muted)' }}>{t.email}</span>
                                        <span style={{ fontSize: 11, color: 'var(--text-muted)' }}>{t.created_at ? new Date(t.created_at).toLocaleString('de-DE') : ''}</span>
                                    </div>
                                    <div style={{ fontSize: 13, lineHeight: 1.6, padding: 12, background: 'rgba(255,255,255,0.03)', borderRadius: 8, marginBottom: 12, whiteSpace: 'pre-wrap' }}>
                                        {t.message}
                                    </div>

                                    {/* Replies */}
                                    {(t.replies || []).length > 0 && (
                                        <div style={{ marginBottom: 12, paddingLeft: 16, borderLeft: '2px solid var(--border-color)' }}>
                                            {t.replies.map((r, i) => (
                                                <div key={i} style={{ marginBottom: 8 }}>
                                                    <div style={{ fontSize: 11, color: r.from === 'admin' ? '#3b82f6' : 'var(--text-muted)', fontWeight: 600 }}>
                                                        {r.from === 'admin' ? '👑 Admin' : r.from} — {r.created_at ? new Date(r.created_at).toLocaleString('de-DE') : ''}
                                                    </div>
                                                    <div style={{ fontSize: 13, marginTop: 2 }}>{r.message}</div>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {/* Reply + Status Controls */}
                                    <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                                        <input value={replyText[t.id] || ''} onChange={e => setReplyText(p => ({...p, [t.id]: e.target.value}))}
                                            placeholder="Antwort schreiben..."
                                            style={{ flex: 1, minWidth: 200, padding: '8px 12px', borderRadius: 8, border: '1px solid var(--border-color)', background: 'var(--bg-primary)', color: 'var(--text-primary)', fontSize: 12 }}
                                            onKeyDown={e => e.key === 'Enter' && replyTicket(t.id)} />
                                        <button onClick={() => replyTicket(t.id)} className="button" style={{ padding: '8px 16px', fontSize: 12 }}>Antworten</button>
                                        <select value={t.status} onChange={e => changeTicketStatus(t.id, e.target.value)}
                                            style={{ padding: '8px 12px', borderRadius: 8, border: '1px solid var(--border-color)', background: 'var(--bg-primary)', color: 'var(--text-primary)', fontSize: 12 }}>
                                            <option value="open">Offen</option>
                                            <option value="in_progress">In Bearbeitung</option>
                                            <option value="closed">Geschlossen</option>
                                        </select>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            )}

            {/* ═══ LOGS PANEL ═══ */}
            {activePanel === 'logs' && (
                <div>
                    <div style={{ display: 'flex', gap: 12, marginBottom: 16, alignItems: 'center' }}>
                        <button onClick={fetchLogs} className="button" style={{ padding: '10px 20px', fontSize: 13 }}>🔄 Aktualisieren</button>
                        <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>{logs.length} Zeilen</span>
                    </div>
                    <div style={{ ...cardStyle, maxHeight: 600, overflowY: 'auto', fontFamily: 'monospace', fontSize: 11, lineHeight: 1.8, whiteSpace: 'pre-wrap', wordBreak: 'break-all' }}>
                        {loading ? 'Laden...' : logs.length === 0 ? 'Keine Logs vorhanden' : logs.map((line, i) => (
                            <div key={i} style={{
                                color: line.includes('ERROR') ? '#ef4444' : line.includes('WARNING') ? '#f59e0b' : line.includes('INFO') ? '#3b82f6' : 'var(--text-muted)',
                                borderBottom: '1px solid rgba(255,255,255,0.03)', padding: '2px 0'
                            }}>
                                {line}
                            </div>
                        ))}
                    </div>
                </div>
            )}
        </div>
    );
}

// Render App
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
<script>
(function() {
    function loadRuntimeScript(src) {
        return new Promise(function(resolve, reject) {
            const script = document.createElement('script');
            script.src = src;
            script.async = false;
            script.crossOrigin = 'anonymous';
            script.onload = resolve;
            script.onerror = function() { reject(new Error('Script konnte nicht geladen werden: ' + src)); };
            document.head.appendChild(script);
        });
    }

    async function ensureRuntime() {
        const fallbacks = [
            { check: function() { return window.React; }, src: 'https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js', name: 'React' },
            { check: function() { return window.ReactDOM; }, src: 'https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js', name: 'ReactDOM' },
            { check: function() { return window.Babel; }, src: 'https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js', name: 'Babel' },
        ];

        for (const runtime of fallbacks) {
            if (runtime.check()) continue;
            try {
                await loadRuntimeScript(runtime.src);
            } catch (err) {
                // The final check below reports anything still unavailable.
            }
        }

        return fallbacks
            .filter(function(runtime) { return !runtime.check(); })
            .map(function(runtime) { return runtime.name; })
            .filter(function(name, index, arr) { return arr.indexOf(name) === index; });
    }

    const sourceEl = document.getElementById('app-source');
    if (!sourceEl) {
        if (window.showBootError) window.showBootError('App-Quellcode (#app-source) wurde nicht gefunden.');
        return;
    }

    ensureRuntime().then(function(missing) {
        if (missing.length > 0) {
            if (window.showBootError) window.showBootError('Runtime konnte nicht geladen werden: ' + missing.join(', '));
            return;
        }

        try {
            const compiled = Babel.transform(sourceEl.textContent, {
                presets: ['react'],
                sourceType: 'script',
            }).code;
            (0, eval)(compiled);
        } catch (err) {
            const details = [
                err && err.message ? err.message : String(err),
                err && err.codeFrame ? err.codeFrame : '',
                err && err.stack ? err.stack : '',
            ].filter(Boolean).join('\n\n');
            if (window.showBootError) window.showBootError(details);
        }
    }).catch(function(err) {
        if (window.showBootError) window.showBootError(err && (err.stack || err.message) || err || 'Runtime konnte nicht geladen werden.');
    });
})();
</script>

</body>
</html>
