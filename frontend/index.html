// Strategie Guide Tab
function StrategieGuideTab() {
    const [activeMarket, setActiveMarket] = useState('stocks');
    const [strategies, setStrategies] = useState([]);
    const [expandedStrategy, setExpandedStrategy] = useState(null);
    const [loading, setLoading] = useState(true);
    const [searchTerm, setSearchTerm] = useState('');

    useEffect(() => {
        const fetchStrategies = async () => {
            try {
                setLoading(true);
                const response = await fetch(`${API}/api/strategies?market_type=${activeMarket}`);
                if (response.ok) {
                    const data = await response.json();
                    setStrategies(data.strategies || []);
                }
            } catch (err) {
                console.error('Error:', err);
            } finally {
                setLoading(false);
            }
        };
        fetchStrategies();
    }, [activeMarket]);

    const marketTypes = [
        { id: 'stocks', label: 'Aktien' },
        { id: 'crypto', label: 'Crypto' },
        { id: 'futures', label: 'Futures' },
        { id: 'forex', label: 'Forex' }
    ];

    const filtered = strategies.filter(s =>
        s.toLowerCase().includes(searchTerm.toLowerCase())
    );

    return (
        <div className="space-y-6">
            <div className="card border border-gray-200 p-6 rounded-lg">
                <label className="block text-sm font-semibold mb-3">Suchfilter</label>
                <input
                    type="text"
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    placeholder="Strategie suchen..."
                    className="w-full"
                />
            </div>

            <div className="flex gap-2 border-b border-gray-200">
                {marketTypes.map(market => (
                    <button
                        key={market.id}
                        onClick={() => setActiveMarket(market.id)}
                        className={`secondary-tab ${activeMarket === market.id ? 'active' : 'inactive'}`}
                    >
                        {market.label}
                    </button>
                ))}
            </div>

            <div className="space-y-3">
                {loading ? (
                    <div className="flex justify-center py-8"><div className="loading-spinner"></div></div>
                ) : (
                    filtered.map((strategy, idx) => (
                        <div key={idx} className="card border border-gray-200 p-4 rounded-lg cursor-pointer" onClick={() => setExpandedStrategy(expandedStrategy === idx ? null : idx)}>
                            <div className="flex justify-between items-center">
                                <h3 className="font-semibold">{strategy}</h3>
                                <span className="text-xl">{expandedStrategy === idx ? '−' : '+'}</span>
                            </div>
                            {expandedStrategy === idx && (
                                <div className="mt-4 pt-4 border-t border-gray-200 text-sm text-gray-700">
                                    <p>Detaillierte Beschreibung der Strategie {strategy}...</p>
                                </div>
                            )}
                        </div>
                    ))
                )}
            </div>
        </div>
    );
}

// New Listing Scanner Tab
function NewListingTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {} }) {
    const [results, setResults] = useState(scanCache.newlisting_results || []);
    const [stats, setStats] = useState(scanCache.newlisting_stats || null);
    const [isScanning, setIsScanning] = useState(scanCache.nl_scanning || false);
    const { sorted, toggleSort, sortKey } = useSortable(results, 'pump_pct');

    useEffect(() => {
        if (scanCache.newlisting_results && scanCache.newlisting_results.length > 0) {
            setResults(scanCache.newlisting_results);
            setStats(scanCache.newlisting_stats || null);
        } else {
            const fetchResults = async () => {
                try {
                    const response = await fetch(`${API}/api/new-listing-results`);
                    if (response.ok) {
                        const data = await response.json();
                        setResults(data.listings || []);
                        setStats(data.stats);
                        updateScanCache('newlisting_results', data.listings || []);
                        updateScanCache('newlisting_stats', data.stats);
                    }
                } catch (err) {
                    console.error('Error:', err);
                }
            };
            fetchResults();
        }
    }, [scanCache.newlisting_results]);

    const handleScan = async () => {
        setIsScanning(true);
        updateScanCache('newlisting_scanning', true);
        // Save current cached_at BEFORE scan starts
        let prevCachedAt = null;
        try {
            const preCheck = await fetch(`${API}/api/new-listing-results`);
            if (preCheck.ok) {
                const preData = await preCheck.json();
                prevCachedAt = preData.cached_at || null;
            }
        } catch(e) {}
        try {
            const response = await fetch(`${API}/api/new-listing-scan`, { method: 'POST' });
            if (response.ok) {
                if (window.addToast) window.addToast('Scan gestartet...', 'info');
                // Poll for results with increasing intervals
                const pollResults = async (attempts = 0) => {
                    if (attempts > 12) { // Max 2 minutes (12 * 10s)
                        setIsScanning(false);
                        updateScanCache('newlisting_scanning', false);
                        if (window.addToast) window.addToast('Scan dauert länger...', 'info');
                        return;
                    }
                    try {
                        const res = await fetch(`${API}/api/new-listing-results`);
                        if (res.ok) {
                            const data = await res.json();
                            const items = data.listings || [];
                            const isNewData = data.cached_at && data.cached_at !== prevCachedAt;
                            if (isNewData) {
                                setResults(items);
                                setStats(data.stats);
                                updateScanCache('newlisting_results', items);
                                updateScanCache('newlisting_stats', data.stats);
                                setIsScanning(false);
                                updateScanCache('newlisting_scanning', false);
                                if (window.addToast) window.addToast(`Scan fertig: ${items.length} Ergebnisse`, 'success');
                                return;
                            }
                        }
                    } catch (e) { console.error(e); }
                    setTimeout(() => pollResults(attempts + 1), 10000); // Retry in 10s
                };
                setTimeout(() => pollResults(0), 5000); // First poll after 5s
            } else {
                setIsScanning(false);
                updateScanCache('newlisting_scanning', false);
            }
        } catch (err) {
            if (window.addToast) window.addToast('Scan-Fehler', 'error');
            setIsScanning(false);
            updateScanCache('newlisting_scanning', false);
        }
    };

    const getExhaustionColor = (exhaustion) => {
        if (exhaustion >= 70) return 'signal-bearish';
        if (exhaustion >= 40) return 'signal-lightdiv';
        return 'signal-bullish';
    };

    return (
        <div className="space-y-6">
            {stats && (
                <div className="grid grid-cols-3 gap-4">
                    <div className="metric-card blue">
                        <div className="text-sm font-semibold text-gray-600">Neue Listings</div>
                        <div className="text-2xl font-bold mt-2">{stats.new_listings}</div>
                    </div>
                    <div className="metric-card green">
                        <div className="text-sm font-semibold text-gray-600">Exchanges Überwacht</div>
                        <div className="text-2xl font-bold mt-2">{stats.exchanges_monitored}</div>
                    </div>
                    <div className="metric-card orange">
                        <div className="text-sm font-semibold text-gray-600">Aktive Signale</div>
                        <div className="text-2xl font-bold mt-2">{stats.active_signals}</div>
                    </div>
                </div>
            )}

            <ScanControl onScan={handleScan} isScanning={isScanning} />

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2">Symbol</th>
                            <th className="text-left py-2 px-2">Exchange</th>
                            <th className="text-right py-2 px-2">Preis</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('pump_pct')}>Pump%</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('exhaustion_score')}>Exhaustion</th>
                            <th className="text-center py-2 px-2">Signal</th>
                            <th className="text-right py-2 px-2">Funding Rate</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.map((item, idx) => (
                            <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker(item.symbol)}>
                                <td className="py-3 px-2 font-semibold">{item.symbol}</td>
                                <td className="py-3 px-2">{item.exchange}</td>
                                <td className="py-3 px-2 text-right">€{item.price?.toFixed(2)}</td>
                                <td className={`py-3 px-2 text-right ${item.pump_pct >= 0 ? 'color-positive' : 'color-negative'}`}>{item.pump_pct?.toFixed(2)}%</td>
                                <td className="py-3 px-2 text-right"><span className={`signal-badge ${getExhaustionColor(item.exhaustion_score)}`}>{item.exhaustion_score?.toFixed(0)}</span></td>
                                <td className="py-3 px-2 text-center"><span className="signal-badge signal-bullish">{item.signal}</span></td>
                                <td className={`py-3 px-2 text-right ${item.funding_rate >= 0 ? 'color-positive' : 'color-negative'}`}>{item.funding_rate?.toFixed(3)}%</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

// Suche (Search) Tab
function SucheTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {} }) {
    const [searchTicker, setSearchTicker] = useState('');
    const [searchResults, setSearchResults] = useState(null);
    const [loading, setLoading] = useState(false);

    const performSearch = async () => {
        if (!searchTicker.trim()) return;

        setLoading(true);
        try {
            const response = await fetch(`${API}/api/ticker-detail?ticker=${searchTicker.toUpperCase()}`);
            if (response.ok) {
                const data = await response.json();
                setSearchResults(data);
            } else {
                setSearchResults(null);
                if (window.addToast) window.addToast('Ticker nicht gefunden', 'error');
            }
        } catch (err) {
            setSearchResults(null);
            if (window.addToast) window.addToast('Suchfehler', 'error');
        } finally {
            setLoading(false);
        }
    };

    return (
        <div className="space-y-6">
            <div className="card border border-gray-200 p-6 rounded-lg">
                <label className="block text-sm font-semibold mb-3">Ticker suchen</label>
                <div className="flex gap-2">
                    <input
                        type="text"
                        value={searchTicker}
                        onChange={(e) => setSearchTicker(e.target.value)}
                        onKeyPress={(e) => e.key === 'Enter' && performSearch()}
                        placeholder="z.B. AAPL"
                        className="flex-1"
                    />
                    <button onClick={performSearch} disabled={loading} className="button">
                        {loading ? 'Sucht...' : 'Suchen'}
                    </button>
                </div>
            </div>

            {searchResults && (
                <div className="space-y-6">
                    <div className="metric-card" style={{ borderColor: '#2563eb' }}>
                        <div className="flex justify-between items-start mb-4">
                            <div>
                                <h2 className="text-2xl font-bold">{searchResults.ticker}</h2>
                                <p className="text-2xl font-bold mt-2">€{searchResults.price?.toFixed(2)}</p>
                                <p className={`text-lg font-semibold mt-1 ${searchResults.change_pct >= 0 ? 'color-positive' : 'color-negative'}`}>
                                    ({searchResults.change_pct?.toFixed(2)}%)
                                </p>
                            </div>
                            <span className={`grade-badge grade-${(searchResults.grade || 'D').toLowerCase()}`}>
                                Grade {searchResults.grade || 'D'}
                            </span>
                        </div>
                    </div>

                    <div className="grid grid-cols-4 gap-4">
                        <div className="card border border-gray-200 p-4 rounded-lg">
                            <div className="text-sm font-semibold text-gray-600">RSI</div>
                            <div className="text-2xl font-bold mt-2">{searchResults.rsi?.toFixed(1)}</div>
                        </div>
                        <div className="card border border-gray-200 p-4 rounded-lg">
                            <div className="text-sm font-semibold text-gray-600">RVOL</div>
                            <div className="text-2xl font-bold mt-2">{searchResults.rvol?.toFixed(2)}</div>
                        </div>
                        <div className="card border border-gray-200 p-4 rounded-lg">
                            <div className="text-sm font-semibold text-gray-600">MA20</div>
                            <div className="text-2xl font-bold mt-2">€{searchResults.ma20?.toFixed(2)}</div>
                        </div>
                        <div className="card border border-gray-200 p-4 rounded-lg">
                            <div className="text-sm font-semibold text-gray-600">MA50</div>
                            <div className="text-2xl font-bold mt-2">€{searchResults.ma50?.toFixed(2)}</div>
                        </div>
                    </div>

                    <button onClick={() => onSelectTicker(searchResults.ticker)} className="button" style={{ width: '100%' }}>
                        Details anzeigen
                    </button>
                </div>
            )}
        </div>
    );
}
