<script type="text/plain" id="app-source">
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const API_PARAMS = new URLSearchParams(window.location.search);
const EXPLICIT_API_PORT = API_PARAMS.get('api_port');
const EXPLICIT_API_BASE = String(window.ALPHA_API_BASE || '').trim().replace(/\/+$/, '');
const DEV_FRONTEND_PORTS = new Set(['3000', '5173']);
const API = EXPLICIT_API_BASE || (
    EXPLICIT_API_PORT
        ? `${window.location.protocol}//${window.location.hostname}:${EXPLICIT_API_PORT}`
        : DEV_FRONTEND_PORTS.has(window.location.port)
            ? `${window.location.protocol}//${window.location.hostname}:8000`
            : window.location.origin
);

const DEFAULT_PUBLIC_PLANS = [
    { id: 'basic', name: 'Basic', price: 29, interval: 'month', features: ['5 Scanner-Bereiche', 'Scan alle 30 Minuten', '30 Ticker-Details pro Stunde', 'Aktien-Long/Short, BI und Crash Monitor'], cta: 'Basic starten' },
    { id: 'pro', name: 'Pro', price: 79, interval: 'month', popular: true, features: ['Alle Pro-Scanner inkl. Biotech und Krypto', 'Scanintervall ab 5 Minuten', 'Volle Sidebar-Chartanalyse', 'E-Mail-Alerts bei qualifizierten Signalen', 'Trade-Setups mit Entry, Stop und Zielen', 'Unbegrenzte Ticker-Details', 'KI-Analyse bis 20 Aufrufe pro Tag'], cta: 'Pro starten' },
    { id: 'elite', name: 'Elite', price: 149, interval: 'month', features: ['Alles aus Pro', 'ORB Scanner', 'Backtesting', 'API-Zugang', 'KI-Analyse mit hohem Nutzungslimit', 'Priority Support'], cta: 'Elite starten' },
];

const DEFAULT_PUBLIC_LEGAL_INFO = {
    entity_name: 'Alpha Station',
    operator_name: '',
    postal_address: '',
    contact_email: '',
    terms_version: '',
    privacy_version: '',
    configured: false,
};

const rawFetch = window.fetch.bind(window);
window.fetch = (input, init = {}) => {
    try {
        const url = typeof input === 'string' ? input : (input && input.url) || '';
        const isAlphaApi = String(url).startsWith(`${API}/api/`);
        if (isAlphaApi) {
            const nextInit = { ...init, credentials: 'include' };
            const headers = new Headers(nextInit.headers || {});
            // Browser sessions use an HttpOnly cookie. Never retain or expose
            // the JWT to JavaScript; explicit Bearer auth remains for API clients.
            headers.delete('Authorization');
            nextInit.headers = headers;
            return rawFetch(input, nextInit);
        }
    } catch (e) {}
    return rawFetch(input, init);
};

function usePublicPlans() {
    const [plans, setPlans] = useState(DEFAULT_PUBLIC_PLANS);

    useEffect(() => {

function useAuth() {
    const [user, setUser] = useState(null);
    const [limits, setLimits] = useState(null);
    const [loading, setLoading] = useState(true);

    const checkAuth = useCallback(async () => {
        try {
            const res = await fetch(`${API}/api/auth/me`);
            if (res.ok) {
                const data = await res.json();
                setUser(data.user);
                setLimits(data.limits);
            } else {
                setUser(null); setLimits(null);
            }
        } catch {
            setUser(null); setLimits(null);
        }
        setLoading(false);
    }, []);

    useEffect(() => { checkAuth(); }, [checkAuth]);

    const login = async (email, password) => {
        try {
            const res = await fetch(`${API}/api/auth/login`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                const me = await fetch(`${API}/api/auth/me`);
                if (me.ok) {
                    const profile = await me.json();
                    if (!profile?.user || !profile?.limits) {
                        setUser(null);
                        setLimits(null);
                        return { success: false, message: 'Login erfolgreich, Profilantwort aber unvollstaendig. Bitte erneut anmelden.' };
                    }
                    setUser(profile.user);
                    setLimits(profile.limits);
                } else {
                    setUser(null);
                    setLimits(null);
                    return { success: false, message: 'Login erfolgreich, Profil konnte aber nicht sicher geladen werden. Bitte erneut anmelden.' };
                }
                return { success: true };
            }
            return { success: false, message: data.detail || data.message || 'Login fehlgeschlagen' };
        } catch (err) {
            return { success: false, message: 'Server nicht erreichbar' };
        }
    };

    const register = async (email, password, name, legalConsent = {}) => {
        try {
            const res = await fetch(`${API}/api/auth/register`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, name, ...legalConsent })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                const me = await fetch(`${API}/api/auth/me`);
                if (me.ok) {
                    const profile = await me.json();
                    if (!profile?.user || !profile?.limits) {
                        setUser(null);
                        setLimits(null);
                        return { success: false, message: 'Registrierung erfolgreich, Profilantwort aber unvollstaendig. Bitte erneut anmelden.' };
                    }
                    setUser(profile.user);
                    setLimits(profile.limits);
                } else {
                    setUser(null);
                    setLimits(null);
                    return { success: false, message: 'Registrierung erfolgreich, Profil konnte aber nicht sicher geladen werden. Bitte erneut anmelden.' };
                }
                return { success: true };
            }
            return { success: false, message: data.detail || data.message || 'Registrierung fehlgeschlagen' };
        } catch (err) {
            return { success: false, message: 'Server nicht erreichbar' };
        }
    };

    const logout = () => {
        rawFetch(`${API}/api/auth/logout`, {
            method: 'POST',
            credentials: 'include'
        }).catch(() => {});
        setUser(null); setLimits(null);
    };

    // Kept as a compatibility prop for existing components. Browser auth is
    // cookie-based, so no JavaScript-readable token exists anymore.
    const getToken = () => null;

    return { user, limits, loading, login, register, logout, getToken, checkAuth };
}

            try {

        setLoading(planId);

                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ plan: planId })
            });

                const err = await res.json();
                if (window.addToast) window.addToast(err.detail || 'Fehler beim Checkout', 'error');

// Toast Component
function ToastContainer() {
    const [toasts, setToasts] = useState([]);
    useEffect(() => {
        window.addToast = (msg, type) => {
            const id = Math.random();
            setToasts(prev => [...prev, { id, message: msg, type }]);
            setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
        };
    }, []);

    return (
        <div>
            {toasts.map(t => (
                <div key={t.id} className={`toast ${t.type}`}>
                    {t.message}
                </div>
            ))}
        </div>
    );
}

function TradeReminderPoller() {
    const seenRef = useRef(new Set((() => {
        try { return JSON.parse(localStorage.getItem('tradeReminderSeen') || '[]'); }
        catch(e) { return []; }
    })()));

    useEffect(() => {
        const saveSeen = () => {
            localStorage.setItem('tradeReminderSeen', JSON.stringify(Array.from(seenRef.current).slice(-100)));
        };
        const notify = (reminder) => {
            const title = `Trigger bereit: ${reminder.ticker}`;
            const reason = (reminder.trigger_result?.reason || reminder.last_check?.reason || 'Trigger bereit').replaceAll('_', ' ');
            if (window.addToast) window.addToast(`${title} - ${reason}`, 'success');
            if ('Notification' in window && Notification.permission === 'granted') {
                try { new Notification(title, { body: reason }); } catch(e) {}
            }
        };
        const poll = async () => {
            try {
                const res = await fetch(`${API}/api/trade-reminders?status=triggered`);
                if (!res.ok) return;
                const data = await res.json();
                (data.reminders || []).forEach(reminder => {
                    if (!reminder.id || seenRef.current.has(reminder.id)) return;
                    seenRef.current.add(reminder.id);
                    notify(reminder);
                });
                saveSeen();
            } catch(e) {}
        };
        poll();
        const timer = setInterval(poll, 60000);
        return () => clearInterval(timer);
    }, []);
    return null;
}

// Custom Hooks
function useAutoRefresh(url, interval = 30000, dependency = []) {
    const [data, setData] = useState(null);
    const [loading, setLoading] = useState(true);
    const [error, setError] = useState(null);

    useEffect(() => {
        const fetchData = async () => {
            try {
                setLoading(true);
                const response = await fetch(API + url);
                if (!response.ok) throw new Error('API Error');
                const result = await response.json();
                setData(result);
                setError(null);
            } catch (err) {
                setError(err.message);
                if (window.addToast) window.addToast('Fehler beim Abrufen der Daten', 'error');
            } finally {
                setLoading(false);
            }
        };

        fetchData();
        const timer = setInterval(fetchData, interval);
        return () => clearInterval(timer);
    }, dependency);

    return { data, loading, error };
}

function useSortable(data, defaultKey = null, defaultDesc = true) {
    const [sortKey, setSortKey] = useState(defaultKey);
    const [sortDesc, setSortDesc] = useState(defaultDesc);  // V2.7: Default absteigend (beste zuerst)

    const sorted = useMemo(() => {
        if (!data || !sortKey) return data;
        return [...data].sort((a, b) => {
            const aVal = a[sortKey];
            const bVal = b[sortKey];
            if (typeof aVal === 'number' && typeof bVal === 'number') {
                return sortDesc ? bVal - aVal : aVal - bVal;
            }
            return sortDesc ? String(bVal).localeCompare(String(aVal)) : String(aVal).localeCompare(String(bVal));
        });
    }, [data, sortKey, sortDesc]);

    const toggleSort = (key) => {
        if (sortKey === key) {
            setSortDesc(!sortDesc);
        } else {
            setSortKey(key);
            // V2.7: Numerische Spalten starten absteigend (beste zuerst), Text aufsteigend
            const numericKeys = ['score','price','change_pct','rvol','volume','change_1d','chg_5d','pump_pct','phase','Price','Change24h','Change7d','VolMCapRatio','EarlyScore','DegenScore','WhaleScore','risk_level','grade'];
            setSortDesc(numericKeys.includes(key));
        }
    };

    return { sorted, toggleSort, sortKey, sortDesc };
}

// Global helper: relative time display (German)
function getRelativeTime(timestamp, isFuture = false) {
        if (!timestamp) return 'nie';
        // Server sends UTC timestamps without 'Z' suffix — force UTC interpretation
        const raw = String(timestamp);
        const date = new Date(raw.endsWith('Z') ? raw : raw + 'Z');
        const now = new Date();
        const diffMs = isFuture ? (date - now) : (now - date);
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);

        if (isFuture) {
            if (diffMs < 0) return 'überfällig';
            if (diffMins < 1) return 'gleich';
            if (diffMins < 60) return `in ${diffMins} min`;
            if (diffHours < 24) return `in ${diffHours}h`;
            return date.toLocaleDateString('de-DE');
        }
        if (diffMins < 1) return 'gerade eben';
        if (diffMins < 60) return `vor ${diffMins} min`;
        if (diffHours < 24) return `vor ${diffHours}h`;
        return date.toLocaleDateString('de-DE');
}

// Helper: extract scan timing info for ScanControl from schedulerStatus
function getScanTiming(schedulerStatus, scanKey) {
    if (!schedulerStatus?.scans?.[scanKey]) return { lastScan: null, nextScan: null };
    const scan = schedulerStatus.scans[scanKey];
    return {
        lastScan: scan.last_run ? getRelativeTime(scan.last_run) : null,
        nextScan: scan.next_run ? getRelativeTime(scan.next_run, true) : null,
    };
}

function formatCacheAge(seconds) {
    if (seconds === null || seconds === undefined) return 'kein Cache';
    if (seconds < 60) return `${seconds}s alt`;
    const mins = Math.floor(seconds / 60);
    if (mins < 60) return `${mins} min alt`;
    const hours = Math.floor(mins / 60);
    if (hours < 48) return `${hours}h alt`;
    return `${Math.floor(hours / 24)} Tage alt`;
}

// ScanControl Component
function ScanControl({ onScan, isScanning = false, lastScan = null, nextScan = null, schedulerStatus = null, scanKey = null }) {

    const timing = scanKey ? getScanTiming(schedulerStatus, scanKey) : { lastScan, nextScan };
    const displayLast = timing.lastScan || lastScan;
    const displayNext = timing.nextScan || nextScan;

    // Check if scheduler is currently running this scan in the background
    const schedulerRunning = scanKey && schedulerStatus?.scans?.[scanKey]?.running;
    const runningSinceSec = schedulerRunning ? (schedulerStatus.scans[scanKey].running_since_sec || 0) : 0;
    const scanHealth = scanKey ? schedulerStatus?.scans?.[scanKey] : null;
    const anyScanning = isScanning || schedulerRunning;

    return (
        <div className="card border border-gray-200 p-4 rounded-lg scan-control-card">
            <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:gap-4">
                    <button onClick={onScan} disabled={anyScanning} className="button w-full sm:w-auto" style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: '8px' }}>
                        {anyScanning ? (
                            <>
                                <span className="loading-spinner"></span>
                                {schedulerRunning && !isScanning ? 'Auto-Scan läuft...' : 'Scannt...'}
                            </>
                        ) : (
                            'Scan starten'
                        )}
                    </button>
                    <div className="flex flex-col gap-1 text-sm text-gray-500 sm:flex-row sm:items-center sm:gap-4">
                        {displayLast && <div>Letzter: {displayLast}</div>}
                        {displayNext && <div className="text-sm text-gray-500">Nächster: {displayNext}</div>}
                    </div>
                </div>
            </div>
            {anyScanning && (() => {
                const prog = scanKey && schedulerStatus?.scans?.[scanKey]?.progress;
                const hasProgress = prog && prog.total > 0;
                const pct = hasProgress ? Math.round((prog.checked / prog.total) * 100) : 0;
                return (
                <div className="mt-3">
                    <div style={{ width: '100%', height: hasProgress ? '6px' : '4px', backgroundColor: '#e5e7eb', borderRadius: '3px', overflow: 'hidden' }}>
                        {hasProgress ? (
                            <div style={{ width: `${pct}%`, height: '100%', backgroundColor: '#3b82f6', borderRadius: '3px', transition: 'width 0.5s ease' }}></div>
                        ) : (
                            <div style={{ width: '100%', height: '100%', background: 'linear-gradient(90deg, #3b82f6, #60a5fa, #3b82f6)', backgroundSize: '200% 100%', animation: 'shimmer 1.5s infinite', borderRadius: '2px' }}></div>
                        )}
                    </div>
                    <div className="text-xs text-blue-600 mt-1 font-semibold">
                        {hasProgress
                            ? `${prog.checked} / ${prog.total} analysiert — ${prog.hits} Treffer (${pct}%)`
                            : schedulerRunning && !isScanning
                                ? `Auto-Scan läuft seit ${runningSinceSec > 60 ? Math.floor(runningSinceSec / 60) + ' min' : runningSinceSec + 's'}...`
                                : 'Scanner läuft — Bitte warten...'}
                    </div>
                    {hasProgress && prog.detail && (
                        <div className="text-xs text-gray-400 mt-0.5">{prog.detail}</div>
                    )}
                </div>
                );
            })()}
            {scanHealth && ['stale', 'missing', 'error'].includes(scanHealth.cache_health) && !anyScanning && (
                <div className="mt-2 text-right text-[11px] text-gray-400">
                    {scanHealth.cache_health === 'missing' ? 'Datenstand: noch nicht vorhanden' : `Datenstand: ${formatCacheAge(scanHealth.cache_age_seconds)}`}
                </div>
            )}
        </div>
    );
}

    const isDragging = useRef(false);

    // Drag-Resize Handler
    const startResize = (e) => {
        e.preventDefault();
        isDragging.current = true;
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        const handleMouseMove = (e) => {
            if (!isDragging.current) return;
            const newWidth = window.innerWidth - e.clientX;
            const clamped = Math.max(380, Math.min(newWidth, window.innerWidth - 40));
            setCustomWidth(clamped);
            setSidebarMode('custom');
        };
        const handleMouseUp = () => {
            isDragging.current = false;
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            document.removeEventListener('mousemove', handleMouseMove);
            document.removeEventListener('mouseup', handleMouseUp);
        };
        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
    };

    // V2.4: Vertikaler Drag-Resize für Chart-Höhe
    const startHeightResize = (e) => {
        e.preventDefault();
        e.stopPropagation();
        const startY = e.clientY;
        const startHeight = getChartHeight();
        document.body.style.cursor = 'row-resize';
        document.body.style.userSelect = 'none';
        const handleMouseMove = (e) => {
            const delta = e.clientY - startY;
            const newHeight = Math.max(180, Math.min(startHeight + delta, window.innerHeight - 100));
            setCustomHeight(newHeight);
        };
        const handleMouseUp = () => {
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            document.removeEventListener('mousemove', handleMouseMove);
            document.removeEventListener('mouseup', handleMouseUp);
        };
        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
    };

    const cycleMode = () => {
        setCustomWidth(null);
        setSidebarMode(prev => prev === 'normal' ? 'wide' : prev === 'wide' ? 'full' : 'normal');
    };

    const isCrypto = scannerData?.isCrypto || false;
    const isExchangeCrypto = scannerData?.isExchangeCrypto || false;
    const cryptoPerpExchangeRaw = scannerData?.PerpChartExchange || scannerData?.perp_chart_exchange || scannerData?.BestExchange || '';
    const cryptoPerpExchange = String(cryptoPerpExchangeRaw || '').toLowerCase();
    const cryptoPerpSymbol = scannerData?.PerpChartSymbol || scannerData?.perp_chart_symbol || null;
    const hasCryptoIntradayChart = Boolean(
        isExchangeCrypto ||
        (isCrypto && scannerData?.HasPerp && cryptoPerpSymbol && cryptoPerpExchange)
    );
    const availableTimeframes = isCrypto && !hasCryptoIntradayChart ? ['1D'] : TIMEFRAMES;

    useEffect(() => {
        if (isCrypto && !hasCryptoIntradayChart && timeframe !== '1D') {
            setTimeframe('1D');
        }
    }, [isCrypto, hasCryptoIntradayChart, timeframe]);

    // Fetch ticker detail data (metrics) — skip for crypto
    useEffect(() => {
        if (isCrypto) { setLoading(false); return; }
        const fetchData = async () => {
            try {
                setLoading(true);
                setAiData(null);
                const res = await fetch(`${API}/api/ticker-detail?ticker=${ticker}`);
                if (res.ok) setTickerData(await res.json());
            } catch (err) {
                console.error('Error fetching detail:', err);
            } finally {
                setLoading(false);
            }
        };
        fetchData();
    }, [ticker, isCrypto]);

    // Fetch chart data — Exchange-Crypto nutzt exchange-chart, fallback nutzt Daily-Krypto-Kontext, Stocks nutzen Chart-API
    // V2.8: AbortController verhindert Race Conditions bei schnellem Timeframe-Wechsel
    useEffect(() => {
        // Sofort alten Chart löschen → zeigt Loading-State
        setChartData(null);
        const controller = new AbortController();
        const signal = controller.signal;
        const fetchChart = async () => {
            const fetchWithTimeout = (url, options = {}, timeoutMs = 8000) => Promise.race([
                fetch(url, options),
                new Promise((_, reject) => setTimeout(() => reject(new Error('chart_fetch_timeout')), timeoutMs)),
            ]);
            try {
                if (isExchangeCrypto && scannerData?.contract && scannerData?.exchange) {
                    // Pump & Dump Coins: direkt von der Exchange holen
                    const contract = scannerData.contract;
                    const exchange = scannerData.exchange;
                    const res = await fetchWithTimeout(`${API}/api/exchange-chart?symbol=${encodeURIComponent(contract)}&exchange=${encodeURIComponent(exchange)}&timeframe=${timeframe}&count=100`, { signal }, 7000);
                    if (signal.aborted) return;
                    if (res.ok) {
                        setChartData(await res.json());
                    } else {
                        setChartData({ ticker, timeframe, candles: [], error: 'Exchange-Chart nicht verfügbar' });
                    }
                } else if (isCrypto) {
                    const coinId = scannerData?.ID || scannerData?.id || ticker.toLowerCase();
                    let cryptoSuccess = false;

                    // Early Movers brauchen echte Intraday-Trigger. Wenn ein Perp-Match existiert,
                    // nutzen wir zuerst Exchange-Candles statt Daily-Kontext.
                    if (scannerData?.HasPerp && cryptoPerpSymbol && cryptoPerpExchange) {
                        try {
                            const res = await fetchWithTimeout(`${API}/api/exchange-chart?symbol=${encodeURIComponent(cryptoPerpSymbol)}&exchange=${encodeURIComponent(cryptoPerpExchange)}&timeframe=${timeframe}&count=160`, { signal }, 5000);
                            if (signal.aborted) return;
                            if (res.ok) {
                                const chartJson = await res.json();
                                if (chartJson.candles && chartJson.candles.length > 0) {
                                    setChartData({
                                        ...chartJson,
                                        source: `Exchange Perp (${cryptoPerpExchangeRaw || cryptoPerpExchange})`,
                                        chart_note: 'Echter Perp-Chart fuer Entry/Retest-Trigger',
                                    });
                                    cryptoSuccess = true;
                                }
                            }
                        } catch (exErr) {
                            if (exErr.name === 'AbortError') return;
                        }
                    }

                    // Auto-Retry bei Rate Limiting (max 2 Versuche, schneller)
                    // Abort-aware sleep: bricht sofort ab wenn Ticker wechselt
                    const abortableSleep = (ms) => new Promise((resolve) => {
                        const timer = setTimeout(resolve, ms);
                        signal.addEventListener('abort', () => { clearTimeout(timer); resolve(); }, { once: true });
                    });
                    for (let attempt = 0; !cryptoSuccess && attempt < 2; attempt++) {
                        if (signal.aborted) return;
                        if (attempt > 0) {
                            setChartData({ ticker, timeframe: '1D', candles: [], error: `Lade Chart... (Versuch ${attempt + 1}/2)` });
                            await abortableSleep(2000);
                            if (signal.aborted) return;
                        }
                        try {
                            const res = await fetch(`${API}/api/crypto-chart?coin_id=${coinId}&days=30`, { signal });
                            if (signal.aborted) return;
                            if (res.ok) {
                                const chartJson = await res.json();
                                if (chartJson.candles && chartJson.candles.length > 0) {
                                    setChartData({
                                        ...chartJson,
                                        source: 'Daily Crypto Context',
                                        chart_note: 'Nur Tages-Kontext - Entry-Trigger separat pruefen',
                                    });
                                    cryptoSuccess = true;
                                    break;
                                }
                                // Backend returned empty candles (rate_limited) - retry
                                continue;
                            }
                        } catch (retryErr) {
                            if (retryErr.name === 'AbortError') return;
                            continue;
                        }
                    }
                    if (!cryptoSuccess && !signal.aborted) {
                        setChartData({ ticker, timeframe: '1D', candles: [], error: 'Crypto-Chart voruebergehend nicht verfuegbar - Datenquelle rate-limited' });
                    }
                } else {
                    const allOverlays = 'ema,vwap,sr,fib,patterns,vrvp';
                    const chartDirection = [
                        scannerData?.trade_setup?.direction,
                        scannerData?.direction,
                        scannerData?.Signal_Direction,
                        scannerData?.confluence?.direction,
                        scannerData?.signal,
                        scannerData?.Signal,
                    ].filter(Boolean).join(' ');
                    const res = await fetch(`${API}/api/chart-data?ticker=${ticker}&timeframe=${timeframe}&overlays=${allOverlays}&direction=${encodeURIComponent(chartDirection)}`, { signal });
                    if (signal.aborted) return;
                    if (res.ok) {
                        setChartData(await res.json());
                    } else {
                        setChartData({ ticker, timeframe, candles: [], error: 'Keine Chart-Daten verfügbar' });
                    }
                }
            } catch (err) {
                if (err.name === 'AbortError') return;  // Abgebrochen — ignorieren
                console.error('Chart data error:', err);
                setChartData({ ticker, timeframe, candles: [], error: 'Chart-Daten konnten nicht geladen werden' });
            }
        };
        fetchChart();
        return () => controller.abort();  // Vorherigen Request abbrechen
    }, [
        ticker,
        timeframe,
        isCrypto,
        isExchangeCrypto,
        scannerData?.contract,
        scannerData?.exchange,
        scannerData?.ID,
        scannerData?.id,
        scannerData?.HasPerp,
        scannerData?.PerpChartSymbol,
        scannerData?.perp_chart_symbol,
        scannerData?.PerpChartExchange,
        scannerData?.perp_chart_exchange,
        scannerData?.BestExchange,
        cryptoPerpSymbol,
        cryptoPerpExchange,
        cryptoPerpExchangeRaw,
    ]);

    const loadAiAnalysis = async () => {
        setAiLoading(true);
        try {
            const res = await fetch(`${API}/api/ai-analysis?ticker=${ticker}`);
            const data = await res.json();
            if (data.error === 'ai_not_available' || data.error === 'ai_limit_reached') {
                setAiData({ analysis: data.message, upgrade_required: true });
            } else if (res.ok) {
                setAiData(data);
            } else {
                setAiData({ analysis: 'API Fehler: ' + res.status });
            }
        } catch (err) {
            setAiData({ analysis: 'Verbindungsfehler' });
        } finally {
            setAiLoading(false);
        }
    };

    const getChartWidth = () => {
        if (customWidth) return customWidth - 60;
        if (sidebarMode === 'full') return window.innerWidth - 60;
        if (sidebarMode === 'wide') return 720 - 60;
        return 480 - 60;
    };

    const getChartHeight = () => {
        if (customHeight) return customHeight;
        return sidebarMode === 'full' ? Math.max(500, window.innerHeight * 0.55) : sidebarMode === 'wide' ? 380 : 250;
    };

    // Render chart with all overlays
    useEffect(() => {
        if (!chartData || !chartContainer.current) return;
        if (!chartData.candles || chartData.candles.length === 0) return; // No data to render
        try {
            // V2.4: Zoom+Scroll exakt speichern vor Rebuild
            // Erkennung: ist es nur ein Overlay/Resize-Wechsel (gleiche Daten)?
            const isOverlayChange = prevOverlaysRef.current && chartData === prevOverlaysRef.current._chartData;
            if (chart.current) {
                try {
                    savedVisibleRange.current = {
                        logical: chart.current.timeScale().getVisibleLogicalRange(),
                        scrollPos: chart.current.timeScale().scrollPosition(),
                    };
                } catch(e) {}
                chart.current.remove();
            }
            prevOverlaysRef.current = { ...overlays, _chartData: chartData };
            overlaySeriesRef.current = [];

            const { createChart, LineStyle, CrosshairMode } = window.LightweightCharts;
            const chartWidth = getChartWidth();
            const chartHeight = getChartHeight();

            chart.current = createChart(chartContainer.current, {
                layout: { textColor: '#999', background: { color: '#1a1a2e' }, fontSize: 11 },
                grid: { vertLines: { color: 'rgba(255,255,255,0.04)' }, horzLines: { color: 'rgba(255,255,255,0.04)' } },
                width: chartWidth, height: chartHeight,
                crosshair: { mode: CrosshairMode.Normal },
                rightPriceScale: { borderColor: 'rgba(255,255,255,0.1)' },
                timeScale: { timeVisible: timeframe.includes('m') || timeframe.includes('H'), secondsVisible: false, borderColor: 'rgba(255,255,255,0.1)', rightOffset: 12, barSpacing: 8, minBarSpacing: 4 },
            });

            // Candlestick series
            candleSeries.current = chart.current.addCandlestickSeries({
                upColor: '#10b981', downColor: '#ef4444',
                borderUpColor: '#10b981', borderDownColor: '#ef4444',
                wickUpColor: '#10b981', wickDownColor: '#ef4444',
            });
            const candles = (chartData.candles || []).map(c => ({
                time: c.time, open: c.open, high: c.high, low: c.low, close: c.close
            }));
            if (candles.length > 0) candleSeries.current.setData(candles);

            const setupForChart = (() => {
                const scannerSetup = scannerData?.trade_setup || null;
                const detailSetup = tickerData?.trade_setup || null;
                if (detailSetup?.starter_plan) return detailSetup;
                return scannerSetup || detailSetup;
            })();
            if (setupForChart && candleSeries.current && typeof candleSeries.current.createPriceLine === 'function') {
                const tradeLines = [
                    ...(setupForChart.starter_plan ? [
                        { key: 'starter_entry', alt: 'early_entry', label: 'STARTER', color: '#f59e0b', width: 2, style: LineStyle.Dotted },
                    ] : []),
                    { key: 'entry', alt: 'main_entry', label: setupForChart.starter_plan ? 'MAIN' : 'ENTRY', color: '#2563eb', width: 2, style: LineStyle.Solid },
                    { key: 'stop_loss', alt: 'stop', label: 'STOP', color: '#dc2626' },
                    { key: 'tp1', label: 'TP1', color: '#059669' },
                    { key: 'tp2', label: 'TP2', color: '#10b981' },
                ];
                tradeLines.forEach(line => {
                    const rawPrice = setupForChart[line.key] ?? setupForChart[line.alt];
                    const linePrice = Number(rawPrice);
                    if (Number.isFinite(linePrice) && linePrice > 0) {
                        try {
                            candleSeries.current.createPriceLine({
                                price: linePrice,
                                color: line.color,
                                lineWidth: line.width || (line.key === 'entry' ? 2 : 1),
                                lineStyle: line.style ?? (line.key === 'entry' ? (LineStyle.Solid || 0) : LineStyle.Dashed),
                                axisLabelVisible: true,
                                title: line.label,
                            });
                        } catch(e) {}
                    }
                });
            }

            // Volume overlay
            if (overlays.vol && chartData.volume) {
                const volSeries = chart.current.addHistogramSeries({
                    priceFormat: { type: 'volume' },
                    priceScaleId: 'vol',
                });
                chart.current.priceScale('vol').applyOptions({ scaleMargins: { top: 0.85, bottom: 0 } });
                volSeries.setData(chartData.volume);
                overlaySeriesRef.current.push(volSeries);
            }

            // EMA lines
            if (overlays.ema && chartData.ema) {
                Object.entries(chartData.ema).forEach(([key, data]) => {
                    if (data && data.length > 0) {
                        const emaMeta = chartData.ema_meta?.[key] || {};
                        const emaTitle = `${key.toUpperCase()} ${emaMeta.timeframe || timeframe}${emaMeta.warmup_ok === false ? ' warmup' : ''}`;
                        const line = chart.current.addLineSeries({
                            color: EMA_COLORS[key] || '#888',
                            lineWidth: key === 'ema200' ? 2 : 1,
                            lineStyle: emaMeta.warmup_ok === false ? LineStyle.Dotted : LineStyle.Solid,
                            priceLineVisible: false,
                            lastValueVisible: false,
                            title: emaTitle,
                        });
                        line.setData(data);
                        overlaySeriesRef.current.push(line);
                    }
                });
            }

            // VWAP line
            if (overlays.vwap && chartData.vwap && chartData.vwap.length > 0) {
                const vwapLine = chart.current.addLineSeries({
                    color: '#f97316', lineWidth: 2,
                    lineStyle: LineStyle.Dotted,
                    priceLineVisible: false, lastValueVisible: false,
                    title: 'VWAP',
                });
                vwapLine.setData(chartData.vwap);
                overlaySeriesRef.current.push(vwapLine);
            }

            // Bollinger Bands
            if (overlays.bb && chartData.bollinger && chartData.bollinger.length > 0) {
                const bbUpper = chart.current.addLineSeries({
                    color: 'rgba(147,51,234,0.5)', lineWidth: 1,
                    priceLineVisible: false, lastValueVisible: false, title: 'BB+',
                });
                const bbLower = chart.current.addLineSeries({
                    color: 'rgba(147,51,234,0.5)', lineWidth: 1,
                    priceLineVisible: false, lastValueVisible: false, title: 'BB-',
                });
                bbUpper.setData(chartData.bollinger.map(b => ({ time: b.time, value: b.upper })));
                bbLower.setData(chartData.bollinger.map(b => ({ time: b.time, value: b.lower })));
                overlaySeriesRef.current.push(bbUpper, bbLower);
            }

            // Support/Resistance — REAL swing-based levels from backend
            if (overlays.sr && chartData.sr) {
                const sr = chartData.sr;
                const addPriceLine = (price, title, color, style, width) => {
                    if (price && price > 0) {
                        candleSeries.current.createPriceLine({
                            price, color, lineWidth: width || 1,
                            lineStyle: style || LineStyle.Dashed,
                            axisLabelVisible: true, title,
                        });
                    }
                };
                // Real support levels (from swing analysis)
                if (sr.support_levels) {
                    sr.support_levels.slice(0, 4).forEach((lvl, i) => {
                        const strength = lvl.strength || 1;
                        const lw = Math.min(3, Math.max(1, Math.ceil(strength / 2)));
                        addPriceLine(lvl.price, `S${i+1} ${lvl.type || ''}`, '#10b981', strength >= 4 ? LineStyle.Solid : LineStyle.Dashed, lw);
                    });
                }
                // Real resistance levels
                if (sr.resistance_levels) {
                    sr.resistance_levels.slice(0, 4).forEach((lvl, i) => {
                        const strength = lvl.strength || 1;
                        const lw = Math.min(3, Math.max(1, Math.ceil(strength / 2)));
                        addPriceLine(lvl.price, `R${i+1} ${lvl.type || ''}`, '#ef4444', strength >= 4 ? LineStyle.Solid : LineStyle.Dashed, lw);
                    });
                }
                // Pivot if available
                if (sr.pivot) addPriceLine(sr.pivot, 'Pivot', '#fbbf24', LineStyle.Solid, 1);
                // PDH/PDL (Previous Day High/Low)
                if (sr.pdh) addPriceLine(sr.pdh, 'PDH', '#94a3b8', LineStyle.Dotted, 1);
                if (sr.pdl) addPriceLine(sr.pdl, 'PDL', '#94a3b8', LineStyle.Dotted, 1);
                // Period High/Low
                if (sr.period_high) addPriceLine(sr.period_high, 'Period High', '#64748b', LineStyle.Dotted, 1);
                if (sr.period_low) addPriceLine(sr.period_low, 'Period Low', '#64748b', LineStyle.Dotted, 1);
            }

            // Diagonal Trendlines
            if (overlays.sr && chartData.trendlines) {
                chartData.trendlines.forEach(tl => {
                    if (tl.points && tl.points.length >= 2) {
                        const color = tl.type === 'support' ? '#10b981' : '#ef4444';
                        const tlLine = chart.current.addLineSeries({
                            color, lineWidth: 2, lineStyle: LineStyle.Solid,
                            lastValueVisible: false, priceLineVisible: false,
                            crosshairMarkerVisible: false,
                        });
                        tlLine.setData(tl.points.map(p => ({ time: p.time, value: p.price })));
                        overlaySeriesRef.current.push(tlLine);
                    }
                });
            }

            // VRVP — V2.3: Volume Profile als Balken (horizontales Histogramm)
            if (overlays.vrvp && chartData.vrvp) {
                const vp = chartData.vrvp;
                // POC, VAH, VAL als Preis-Linien beibehalten
                const addVPLine = (price, title, color, style, width) => {
                    if (price && price > 0) {
                        candleSeries.current.createPriceLine({
                            price, color, lineWidth: width || 1,
                            lineStyle: style || LineStyle.Dashed,
                            axisLabelVisible: true, title,
                        });
                    }
                };
                addVPLine(vp.poc, 'POC', '#06b6d4', LineStyle.Solid, 2);
                addVPLine(vp.vah, 'VAH', '#0891b2', LineStyle.Dashed, 1);
                addVPLine(vp.val, 'VAL', '#0891b2', LineStyle.Dashed, 1);

                // Balken als Canvas-Overlay zeichnen
                if (vp.bins && vp.bins.length > 0 && chart.current) {
                    const maxVol = Math.max(...vp.bins.map(b => b.volume));
                    const maxBarWidth = chartContainer.current ? chartContainer.current.clientWidth * 0.15 : 80;
                    const priceScale = chart.current.priceScale('right');

                    // Canvas-Overlay erstellen
                    const existingCanvas = chartContainer.current.querySelector('.vrvp-canvas');
                    if (existingCanvas) existingCanvas.remove();
                    const canvas = document.createElement('canvas');
                    canvas.className = 'vrvp-canvas';
                    canvas.style.position = 'absolute';
                    canvas.style.top = '0';
                    canvas.style.right = '48px';
                    canvas.style.pointerEvents = 'none';
                    canvas.style.zIndex = '5';
                    canvas.width = Math.ceil(maxBarWidth + 10);
                    canvas.height = chartContainer.current.clientHeight;
                    chartContainer.current.style.position = 'relative';
                    chartContainer.current.appendChild(canvas);

                    const drawVRVP = () => {
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        const series = candleSeries.current;
                        if (!series) return;

                        vp.bins.forEach(bin => {
                            const yMid = series.priceToCoordinate(bin.mid);
                            const yHigh = series.priceToCoordinate(bin.high);
                            const yLow = series.priceToCoordinate(bin.low);
                            if (yMid === null || yHigh === null || yLow === null) return;

                            const barH = Math.max(2, Math.abs(yLow - yHigh));
                            const barW = Math.max(2, (bin.volume / maxVol) * maxBarWidth);
                            const y = Math.min(yHigh, yLow);
                            const isPOC = Math.abs(bin.mid - vp.poc) < (bin.high - bin.low);
                            const isVA = bin.mid >= vp.val && bin.mid <= vp.vah;

                            ctx.fillStyle = isPOC ? 'rgba(6, 182, 212, 0.45)' : isVA ? 'rgba(34, 211, 238, 0.25)' : 'rgba(100, 116, 139, 0.18)';
                            ctx.fillRect(canvas.width - barW, y, barW, barH);
                            // Rand
                            ctx.strokeStyle = isPOC ? 'rgba(6, 182, 212, 0.7)' : isVA ? 'rgba(34, 211, 238, 0.4)' : 'rgba(100, 116, 139, 0.3)';
                            ctx.lineWidth = 0.5;
                            ctx.strokeRect(canvas.width - barW, y, barW, barH);
                        });
                    };

                    drawVRVP();
                    // Redraw on scroll/zoom — store refs for cleanup
                    chart.current.timeScale().subscribeVisibleTimeRangeChange(drawVRVP);
                    chart.current.subscribeCrosshairMove(drawVRVP);
                    vrvpSubsRef.current = [drawVRVP];
                }
            }

            // Fibonacci levels — V3.0: Richtungsabhängig (SHORT=abwärts, LONG=aufwärts)
            if (overlays.fib && chartData.fib) {
                const isShort = chartData.fib_direction === 'short';
                const fibLabel = chartData.fib_meta ? `${String(chartData.fib_meta.direction || '').toUpperCase()} ${chartData.fib_meta.timeframe || timeframe}` : '';
                const fibColors = {
                    '0%': '#ef4444', '23%': '#f97316', '38%': '#eab308', '50%': '#22c55e',
                    '61%': '#3b82f6', '78%': '#8b5cf6', '100%': '#a855f7',
                    // Extension-Targets
                    '127%': isShort ? '#f43f5e' : '#06b6d4',
                    '161%': isShort ? '#e11d48' : '#14b8a6',
                    '200%': isShort ? '#be123c' : '#10b981',
                };
                const extendedKeys = ['127%', '161%', '200%'];
                Object.entries(chartData.fib).forEach(([level, price]) => {
                    const isExtended = extendedKeys.includes(level);
                    candleSeries.current.createPriceLine({
                        price, color: fibColors[level] || '#6b7280',
                        lineWidth: 1,
                        lineStyle: isExtended ? LineStyle.Dashed : LineStyle.Dotted,
                        axisLabelVisible: true, title: `Fib ${level}${fibLabel ? ' ' + fibLabel : ''}`,
                    });
                });
            }

            // Pattern markers
            if (overlays.patterns && chartData.patterns) {
                const markers = [];

                // V4.0: Pivot-Marker entfernt (nur Noise) — Pivots werden intern genutzt

                // V2.6b: Richtung bestimmen — nur passende Patterns anzeigen
                const _viewDir = (tickerData?.confluence?.direction || scannerData?.trade_setup?.direction || scannerData?.direction || '').toUpperCase();

                // Chart pattern markers + Linien-Zeichnung
                // V4: Marker-Dedup — nur 1 Marker pro Kerze (höchste Priorität gewinnt)
                // Ohne Dedup stapeln sich Bullish OB + Buyside Liq + H&S etc. auf gleicher Kerze
                if (chartData.patterns.chart_patterns) {
                    const _usedTimes = new Set();
                    const _sevOrder = {'high': 0, 'medium': 1, 'low': 2};
                    const _sorted = [...chartData.patterns.chart_patterns]
                        .filter(p => !_viewDir || _viewDir === 'NEUTRAL' || (_viewDir === 'SHORT' ? p.type !== 'bullish' : p.type !== 'bearish'))
                        .sort((a, b) => (_sevOrder[a.severity] || 2) - (_sevOrder[b.severity] || 2));
                    _sorted.forEach(p => {
                        const markerTime = p.time || (candles.length > 0 ? candles[candles.length - 1].time : null);
                        if (markerTime && !_usedTimes.has(markerTime)) {
                            _usedTimes.add(markerTime);
                            markers.push({
                                time: markerTime,
                                position: p.type === 'bullish' ? 'belowBar' : 'aboveBar',
                                color: p.type === 'bullish' ? '#10b981' : '#ef4444',
                                shape: 'circle',
                                text: (p.pattern || '').substring(0, 12),
                            });
                        }
                        // draw_points: Pattern-Linien einzeichnen
                        if (p.draw_points && p.draw_points.length >= 2) {
                            const validPts = p.draw_points.filter(dp => dp.time && dp.price);
                            if (validPts.length >= 2) {
                                const patColor = p.type === 'bullish' ? 'rgba(16,185,129,0.7)' : 'rgba(239,68,68,0.7)';
                                // Pattern-Verbindungslinie
                                const patLine = chart.current.addLineSeries({
                                    color: patColor, lineWidth: 2, lineStyle: LineStyle.Dashed,
                                    lastValueVisible: false, priceLineVisible: false,
                                    crosshairMarkerVisible: false,
                                });
                                const sorted = [...validPts].sort((a, b) => a.time - b.time);
                                patLine.setData(sorted.map(dp => ({ time: dp.time, value: dp.price })));
                                overlaySeriesRef.current.push(patLine);
                                // Neckline/Target als horizontale Linie
                                if (p.neckline) {
                                    candleSeries.current.createPriceLine({
                                        price: p.neckline, color: '#f59e0b', lineWidth: 1,
                                        lineStyle: LineStyle.Dashed, axisLabelVisible: true,
                                        title: 'Neckline',
                                    });
                                }
                                if (p.target) {
                                    candleSeries.current.createPriceLine({
                                        price: p.target, color: patColor, lineWidth: 1,
                                        lineStyle: LineStyle.Dotted, axisLabelVisible: true,
                                        title: 'Target',
                                    });
                                }
                            }
                        }
                    });
                }

                // Harmonic pattern lines (gefiltert nach Richtung)
                if (chartData.patterns.harmonic) {
                    chartData.patterns.harmonic
                        .filter(h => !_viewDir || _viewDir === 'NEUTRAL' || h.direction === _viewDir)
                        .forEach(h => {
                        if (h.points && h.points.length >= 5) {
                            const hLine = chart.current.addLineSeries({
                                color: h.direction === 'LONG' ? '#10b981' : '#ef4444',
                                lineWidth: 2, lastValueVisible: false, priceLineVisible: false,
                                title: h.pattern || 'Harmonic',
                            });
                            const points = h.points.map(pt => ({ time: pt.time || pt.t, value: pt.price || pt.p })).filter(pt => pt.time && pt.value).sort((a, b) => a.time - b.time);
                            if (points.length > 0) hLine.setData(points);
                            overlaySeriesRef.current.push(hLine);
                        }
                    });
                }

                // Sort markers by time and set them
                if (markers.length > 0) {
                    markers.sort((a, b) => a.time - b.time);
                    candleSeries.current.setMarkers(markers);
                }
            }

            // V2.4: Zoom+Scroll exakt wiederherstellen bei Overlay-Toggle
            if (isOverlayChange && savedVisibleRange.current) {
                try {
                    if (savedVisibleRange.current.logical) {
                        chart.current.timeScale().setVisibleLogicalRange(savedVisibleRange.current.logical);
                    }
                } catch(e) {
                    chart.current.timeScale().fitContent();
                }
            } else {
                // V3.1: Letzte Kerze rechts im Bild — nicht alles reinquetschen
                const totalBars = candles.length;
                const barsToShow = Math.min(totalBars, 80);
                chart.current.timeScale().setVisibleLogicalRange({
                    from: totalBars - barsToShow,
                    to: totalBars - 1,
                });
                savedVisibleRange.current = null;
            }
        } catch (err) { console.error('Chart error:', err); }
        return () => {
            // VRVP event listener cleanup
            if (vrvpSubsRef.current.length > 0 && chart.current) {
                try {
                    vrvpSubsRef.current.forEach(fn => {
                        chart.current.timeScale().unsubscribeVisibleTimeRangeChange(fn);
                        chart.current.unsubscribeCrosshairMove(fn);
                    });
                } catch(e) {}
                vrvpSubsRef.current = [];
            }
            if (chart.current) {
                try {
                    savedVisibleRange.current = {
                        logical: chart.current.timeScale().getVisibleLogicalRange(),
                        scrollPos: chart.current.timeScale().scrollPosition(),
                    };
                } catch(e) {}
                chart.current.remove();
                chart.current = null;
            }
            // VRVP Canvas aufräumen
            if (chartContainer.current) {
                const oldCanvas = chartContainer.current.querySelector('.vrvp-canvas');
                if (oldCanvas) oldCanvas.remove();
            }
        };
    }, [chartData, sidebarMode, customWidth, customHeight, overlays, tickerData]);

    if (loading && !tickerData) {
        return (
            <div className={`detail-sidebar sidebar-${sidebarMode}`} style={customWidth ? {width: customWidth + 'px'} : {}}>
                <div className="detail-sidebar-content" style={{ padding: '24px' }}>
                    <div className="flex items-center justify-between mb-4">
                        <h2 className="text-xl font-bold">{ticker}</h2>
                        <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
                    </div>
                    <div style={{ width: '100%', height: '4px', backgroundColor: '#e5e7eb', borderRadius: '2px', overflow: 'hidden', marginBottom: '12px' }}>
                        <div style={{ width: '100%', height: '100%', background: 'linear-gradient(90deg, #3b82f6, #60a5fa, #3b82f6)', backgroundSize: '200% 100%', animation: 'shimmer 1.5s infinite', borderRadius: '2px' }}></div>
                    </div>
                    <div className="text-sm text-gray-500">Daten werden geladen...</div>
                </div>
            </div>
        );
    }

    const d = tickerData || {};
    const cd = scannerData || {};  // crypto data from Early Movers
    const quality = cd._quality || d._quality || null;
    const tradeHealth = cd.trade_health || d.trade_health || null;
    const marketContext = cd.market_context || d.market_context || tradeHealth?.market_context || quality?.market_context || null;
    const tradeHealthTone = !tradeHealth ? '' :
        tradeHealth.decision === 'TRADEABLE' ? 'border-emerald-200 bg-emerald-50 text-emerald-900' :
        tradeHealth.decision === 'NO_TRADE' ? 'border-red-200 bg-red-50 text-red-900' :
        tradeHealth.decision === 'WAIT_FOR_RETEST' ? 'border-amber-200 bg-amber-50 text-amber-900' :
        'border-sky-200 bg-sky-50 text-sky-900';
    const riskTone = (risk) => risk === 'LOW' ? 'text-emerald-700' : risk === 'MEDIUM' ? 'text-amber-700' : 'text-red-700';
    const riskLabel = (risk) => {
        const key = String(risk || '').toUpperCase();
        return {
            EXTREME: 'extrem',
            HIGH: 'hoch',
            MEDIUM: 'mittel',
            LOW: 'niedrig',
            UNKNOWN: 'unklar',
        }[key] || String(risk || '-').toLowerCase();
    };
    const firstFiniteNumber = (...values) => {
        for (const value of values) {
            const n = Number(value);
            if (Number.isFinite(n) && n > 0) return n;
        }
        return null;
    };
    const firstFiniteChange = (...values) => {
        for (const value of values) {
            const n = Number(value);
            if (Number.isFinite(n)) return n;
        }
        return null;
    };
    // V4: Header-Preis aus Chart-Daten aktualisieren (damit Header und letzte Kerze IMMER übereinstimmen)
