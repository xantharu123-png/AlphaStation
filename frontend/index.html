        ' Big Movers': 'Die größten absoluten Bewegungen des Tages. Zeigt die Top-Movers mit signifikanten Kursänderungen.',
        ' Whale Watch': 'Extremes Volumen (zeitnormalisiert) — Big Player sind aktiv. Besonders relevant bei europäischen Aktien, die normalerweise weniger Volumen haben.',
    };

    const strategyNames = Object.keys(strategies);
    const filtered = strategyNames.filter(s =>
        s.toLowerCase().includes(searchTerm.toLowerCase()) ||
        (strategies[s]?.description || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
        (guideTexts[s] || '').toLowerCase().includes(searchTerm.toLowerCase())
    );

    const getDirectionBadge = (name, strat) => {
        const n = name.toLowerCase();
        if (strat?.harmonic_direction === 'LONG' || n.includes('long') || n.includes('bull') || n.includes('bounce long') || n.includes('breakout') || n.includes('dip buy') || n.includes('reversal hunter') || n.includes('trend reversal') || n.includes('accumulation') || n.includes('gap up') || n.includes('momentum') && !n.includes('short') && !n.includes('bear') && !n.includes('down')) {
            return { label: 'LONG', color: '#10b981' };
        }
        if (strat?.harmonic_direction === 'SHORT' || n.includes('short') || n.includes('bear') || n.includes('breakdown') || n.includes('gap down') || n.includes('fade') || n.includes('distribution')) {
            return { label: 'SHORT', color: '#ef4444' };
        }
        if (n.includes('alle zeigen') || n.includes('all pattern') || strat?.harmonic_direction === 'ALL') {
            return { label: 'ALLE', color: '#6b7280' };
        }
        return { label: 'WATCH', color: '#f59e0b' };
    };

    return (
        <div className="space-y-6">
            <div className="card border border-gray-200 p-4 rounded-lg flex items-center gap-3 guide-search-card">
                <svg className="w-5 h-5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input
                    type="text"
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    placeholder="Strategie suchen..."
                    className="w-full bg-transparent outline-none"
                />
                {searchTerm && <button onClick={() => setSearchTerm('')} className="text-gray-400 hover:text-gray-600 text-lg">\u00d7</button>}
            </div>

            <div className="guide-tabs flex gap-2 border-b border-gray-200 flex-nowrap md:flex-wrap pb-2">
                {marketTypes.map(market => (
                    <button
                        key={market.id}
                        onClick={() => { setActiveMarket(market.id); setExpandedStrategy(null); }}
                        className={`secondary-tab ${activeMarket === market.id ? 'active' : 'inactive'}`}
                    >
                        {market.icon} {market.label}
                    </button>
                ))}
            </div>

            <div className="text-xs text-gray-500">{filtered.length} von {strategyNames.length} Strategien</div>

            <div className="space-y-3">
                {loading ? (
                    <div className="flex justify-center py-8"><div className="loading-spinner"></div></div>
                ) : filtered.length === 0 ? (
                    <div className="text-center text-gray-500 py-8">Keine Strategien gefunden</div>
                ) : (
                    filtered.map((name, idx) => {
                        const strat = strategies[name] || {};
                        const dir = getDirectionBadge(name, strat);
                        const guide = guideTexts[name] || guideTexts[name.trim()] || null;
                        const isExpanded = expandedStrategy === idx;
                        return (
                        <div key={idx} className="card border border-gray-200 rounded-lg overflow-hidden">
                            <div className="p-4 cursor-pointer hover:bg-gray-50" onClick={() => setExpandedStrategy(isExpanded ? null : idx)}>
                                <div className="flex justify-between items-start gap-3">
                                    <div className="flex-1 min-w-0">
                                        <div className="flex items-center gap-2 flex-wrap">
                                            <h3 className="font-semibold text-sm">{name}</h3>
                                            <span className="text-xs font-bold px-2 py-0.5 rounded" style={{background: dir.color + '20', color: dir.color}}>{dir.label}</span>
                                            {strat.display_group && <span className="text-xs px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">{strat.display_group}</span>}
                                            {strat.stocks_only && <span className="text-xs px-1.5 py-0.5 rounded bg-blue-50 text-blue-600">Nur Aktien</span>}
                                            {strat.needs_history && <span className="text-xs px-1.5 py-0.5 rounded bg-purple-50 text-purple-600">Multi-Day</span>}
                                            {strat.needs_harmonic && <span className="text-xs px-1.5 py-0.5 rounded bg-orange-50 text-orange-600">Harmonic</span>}
                                            {strat.needs_volume_profile && <span className="text-xs px-1.5 py-0.5 rounded bg-cyan-50 text-cyan-600">Volume Profile</span>}
                                            {strat.needs_ma && <span className="text-xs px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-600">{strat.ma_type && strat.ma_period ? `${strat.ma_type} ${strat.ma_period}` : 'MA Bounce'}</span>}
                                        </div>
                                        <p className="text-xs text-gray-500 mt-1 truncate">{guide ? guide.substring(0, 80) + '...' : '\u2014'}</p>
                                        {Array.isArray(strat.merged_from) && strat.merged_from.length > 0 && (
                                            <p className="text-xs text-gray-400 mt-1 truncate">Vereint: {strat.merged_from.join(', ')}</p>
                                        )}
                                    </div>
                                    <span className="text-lg text-gray-400 flex-shrink-0">{isExpanded ? '\u2212' : '+'}</span>
                                </div>
                            </div>

                            {isExpanded && (
                                <div className="px-4 pb-4 border-t border-gray-100 space-y-3">
                                    {/* Guide-Text — erklärt WAS die Strategie macht, nicht WIE */}
                                    <div className="pt-3">
                                        <p className="text-sm leading-relaxed">{guide || 'Keine Beschreibung verfügbar.'}</p>
                                    </div>

                                    {/* Allgemeine Hinweise — nur Session-Zeiten, Paare etc. */}
                                    {(strat.best_time || strat.best_pairs) && (
                                    <div className="flex flex-wrap gap-x-6 gap-y-2 text-xs text-gray-600 bg-gray-50 rounded p-3">
                                        {strat.best_time && (
                                            <div><span className="font-semibold text-gray-500">Bestes Zeitfenster:</span> {strat.best_time}</div>
                                        )}
                                        {strat.best_pairs && (
                                            <div><span className="font-semibold text-gray-500">Empfohlene Paare:</span> {strat.best_pairs.join(', ')}</div>
                                        )}
                                    </div>
                                    )}
                                </div>
                            )}
                        </div>
                        );
                    })
                )}
            </div>
        </div>
    );
}

// Pump & Dump Scanner Tab (ehemals New Listing Scanner)
function NewListingTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [results, setResults] = useState(scanCache.newlisting_results || []);
    const [stats, setStats] = useState(scanCache.newlisting_stats || null);
    const [isScanning, setIsScanning] = useState(scanCache.nl_scanning || false);
    const { sorted, toggleSort, sortKey } = useSortable(results, 'pump_pct');
    const pollTimeoutRef = useRef(null);

    // Cleanup polling on unmount
    useEffect(() => {
        return () => { if (pollTimeoutRef.current) clearTimeout(pollTimeoutRef.current); };
    }, []);

    // Always load latest from server on mount
    useEffect(() => {
        const fetchResults = async () => {
            try {
                const response = await fetch(`${API}/api/new-listing-results`);
                if (response.ok) {
                    const data = await response.json();
                    const items = data.data || [];
                    setResults(items);
                    setStats(data.stats);
                    updateScanCache('newlisting_results', items);
                    updateScanCache('newlisting_stats', data.stats);
                }
            } catch (err) { console.error('Error:', err); }
        };
        fetchResults();
    }, []);

    const handleScan = async () => {
        setIsScanning(true);
        updateScanCache('newlisting_scanning', true);
        // Save current cached_at BEFORE scan starts
        let prevCachedAt = null;
        try {
            const preCheck = await fetch(`${API}/api/new-listing-results`);
            if (preCheck.ok) {
                const preData = await preCheck.json();
                prevCachedAt = preData.cached_at || null;
            }
        } catch(e) {}
        try {
            const response = await fetch(`${API}/api/new-listing-scan`, { method: 'POST' });
            if (response.ok) {
                if (window.addToast) window.addToast('Scan gestartet...', 'info');
                // Poll for results with increasing intervals
                const pollResults = async (attempts = 0) => {
                    if (attempts > 12) { // Max 2 minutes (12 * 10s)
                        setIsScanning(false);
                        updateScanCache('newlisting_scanning', false);
                        if (window.addToast) window.addToast('Scan dauert länger...', 'info');
                        return;
                    }
                    try {
                        const res = await fetch(`${API}/api/new-listing-results`);
                        if (res.ok) {
                            const data = await res.json();
                            const items = data.data || [];
                            const isNewData = data.cached_at && data.cached_at !== prevCachedAt;
                            if (isNewData) {
                                setResults(items);
                                setStats(data.stats);
                                updateScanCache('newlisting_results', items);
                                updateScanCache('newlisting_stats', data.stats);
                                setIsScanning(false);
                                updateScanCache('newlisting_scanning', false);
                                if (window.addToast) window.addToast(`Scan fertig: ${items.length} Ergebnisse`, 'success');
                                return;
                            }
                        }
                    } catch (e) { console.error(e); }
                    pollTimeoutRef.current = setTimeout(() => pollResults(attempts + 1), 10000); // Retry in 10s
                };
                pollTimeoutRef.current = setTimeout(() => pollResults(0), 5000); // First poll after 5s
            } else {
                setIsScanning(false);
                updateScanCache('newlisting_scanning', false);
            }
        } catch (err) {
            if (window.addToast) window.addToast('Scan-Fehler', 'error');
            setIsScanning(false);
            updateScanCache('newlisting_scanning', false);
        }
    };

    const getExhaustionColor = (exhaustion) => {
        if (exhaustion >= 70) return 'signal-bullish';   // Hohe Exhaustion = gut für Short = grün
        if (exhaustion >= 40) return 'signal-lightdiv';  // Mittel = gelb/orange
        return 'signal-bearish';                         // Niedrig = Pump noch aktiv = rot
    };
    const pdTypeLabel = (item) => {
        const cat = item.trade_category || '';
        if (cat === 'NEW_LISTING_DUMP') return 'New Listing Dump';
        if (cat === 'EXHAUSTION_WATCH') return 'Dump/Crack Watch';
        if (cat === 'PUMP_RUNNING_WATCH' || cat === 'ACTIVE_PUMP_WATCH') return 'Pump laeuft - warten';
        if (cat === 'NEW_LISTING_TOO_EARLY') return 'Zu frueh';
        if (cat === 'NEW_LISTING_EXPIRED') return 'Alt/Beobachten';
        if (cat === 'ALREADY_DUMPED') return 'Schon gedumpt';
        if (cat === 'WAITING_FOR_HISTORY') return 'Daten fehlen';
        if (cat === 'UNKNOWN_LISTING_AGE') return 'Alter unklar';
        if (cat === 'ANNOUNCEMENT_WATCH') return 'Listing Watch';
        if ((item.listing_source || '').toLowerCase() === 'new_listing') return 'New Listing';
        return 'Beobachten';
    };
    const pdTypeClass = (item) => {
        const cat = item.trade_category || '';
        if (cat === 'NEW_LISTING_DUMP') return 'signal-bearish';
        if (cat === 'EXHAUSTION_WATCH') return 'signal-lightdiv';
        if (cat === 'PUMP_RUNNING_WATCH' || cat === 'ACTIVE_PUMP_WATCH') return 'signal-abwarten';
        if (cat === 'NEW_LISTING_TOO_EARLY' || cat === 'UNKNOWN_LISTING_AGE' || cat === 'WAITING_FOR_HISTORY') return 'signal-abwarten';
        if (cat === 'ALREADY_DUMPED') return 'signal-neutral';
        return 'signal-neutral';
    };
    const pdPrice = (value, digits = 4) => {
        const n = Number(value || 0);
        if (!Number.isFinite(n) || n <= 0) return '—';
        return `$${n.toFixed(digits)}`;
    };

    return (
        <div className="space-y-6">

            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey="new_listing" />
            <div className="p-3 rounded-lg bg-blue-50 border border-blue-100 text-sm text-blue-800">
                Analyse-Modus: <b>JETZT SHORTEN</b> steht nur bei bestaetigtem Crack/Rejection. Darunter erscheinen sinnvolle Dump-/Crack-Watch-Kandidaten mit live Preis/Pump-Kontext; reine Listing-Ankuendigungen ohne Trade-Daten bleiben ausgeblendet und werden nicht als Signal gemailt.
                {stats && (
                    <div className="mt-2 text-xs text-blue-700">
                        Sichtbar: {stats.new_listings || 0} | Short-ready: {stats.tradeable_short_signals || 0} | Watch: {stats.visible_watch_rows || 0} | Rohdaten: {stats.raw_rows || 0} | Ausgeblendete Ankuendigungen: {stats.hidden_announcement_rows || 0}
                    </div>
                )}
            </div>

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('symbol')}>Symbol{sortKey === 'symbol' && ' ↓'}</th>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('exchange')}>Exchange{sortKey === 'exchange' && ' ↓'}</th>
                            <th className="text-center py-2 px-2 sortable-header" onClick={() => toggleSort('trade_category')}>Typ{sortKey === 'trade_category' && ' ↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('price')}>Preis{sortKey === 'price' && ' ↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('pump_pct')}>Pump%{sortKey === 'pump_pct' && ' ↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('from_ath_pct')}>vom ATH%{sortKey === 'from_ath_pct' && ' ↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('exhaustion_score')}>Exhaustion{sortKey === 'exhaustion_score' && ' ↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('funding_rate')}>Funding{sortKey === 'funding_rate' && ' ↓'}</th>
                            <th className="text-center py-2 px-2 sortable-header" onClick={() => toggleSort('signal')}>Signal{sortKey === 'signal' && ' ↓'}</th>
                            <th className="text-right py-2 px-2">Entry / Stop</th>
                            <th className="text-right py-2 px-2">TP1 / TP2</th>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('listing_date')}>Gelistet{sortKey === 'listing_date' && ' ↓'}</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.length === 0 && (
                            <tr>
                                <td colSpan="12" className="py-10 px-2 text-center text-gray-400">
                                    Keine Pump-&-Dump-Kandidaten mit Live-Preis und verwertbarer Pump/Crack-Struktur im Cache. Reine Listing-Ankuendigungen werden hier bewusst nicht als Signal angezeigt.
                                </td>
                            </tr>
                        )}
                        {sorted.map((item, idx) => (
                            <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker({ticker: item.symbol, isCrypto: true, isExchangeCrypto: true, exchange: item.exchange, contract: item.contract, ...item})}>
                                <td className="py-3 px-2 font-semibold">{item.symbol}</td>
                                <td className="py-3 px-2">{item.exchange}</td>

// Penny Stock active trade signals
function PennyStocksTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [isScanning, setIsScanning] = useState(scanCache.penny_scanning || false);
    const [results, setResults] = useState(scanCache.penny_results || []);
    const [diagnostics, setDiagnostics] = useState(scanCache.penny_diagnostics || {});
    const [showWatchRows, setShowWatchRows] = useState(false);
    const pollRef = useRef(null);
    const activeActions = new Set(['JETZT_KAUFEN', 'HALTEN', 'JETZT_VERKAUFEN']);
    const optionalActions = new Set(['TRIGGER_WARTEN', 'BEOBACHTEN']);
    const isVisibleAction = item => {
        const action = String(item?.trade_action || '').toUpperCase();
        return activeActions.has(action) || (showWatchRows && optionalActions.has(action));
    };

    const loadResults = async () => {
        try {
            const response = await fetch(`${API}/api/penny-stocks-results?include_watch=${showWatchRows ? 'true' : 'false'}`);
            if (!response.ok) return null;
            const payload = await response.json();
            const rows = (payload.data || []).filter(isVisibleAction);
            setResults(rows);
            setDiagnostics(payload.diagnostics || {});
            updateScanCache('penny_results', rows);
            updateScanCache('penny_diagnostics', payload.diagnostics || {});
            return payload;
        } catch (error) {
            console.error('Penny scanner load error:', error);
            return null;
        }
    };

    useEffect(() => {
        let cancelled = false;
        fetch(`${API}/api/auth/alert-settings`)
            .then(response => response.ok ? response.json() : null)
            .then(settings => {
                if (!cancelled && settings) setShowWatchRows(!!settings.penny_show_watch_rows);
            })
            .catch(() => {});
        return () => { cancelled = true; };
    }, []);

    useEffect(() => {
        loadResults();
        const interval = setInterval(loadResults, 30000);
        return () => {
            clearInterval(interval);
            if (pollRef.current) clearTimeout(pollRef.current);
        };
    }, [showWatchRows]);

    const handleScan = async () => {
        setIsScanning(true);
        updateScanCache('penny_scanning', true);
        const before = await loadResults();
        const previousStamp = before?.cached_at || null;
        try {
            const response = await fetch(`${API}/api/penny-stocks-scan`, { method: 'POST' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const poll = async (attempt = 0) => {
                const payload = await loadResults();
                if (payload?.cached_at && payload.cached_at !== previousStamp) {
                    setIsScanning(false);
                    updateScanCache('penny_scanning', false);
                    if (window.addToast) window.addToast(`Pennystock-Scan fertig: ${(payload.data || []).length} aktive Trading-Idee(n)`, 'success');
                    return;
                }
                if (attempt >= 120) {
                    setIsScanning(false);
                    updateScanCache('penny_scanning', false);
                    if (window.addToast) window.addToast('Pennystock-Scan laeuft ungewoehnlich lange', 'info');
                    return;
                }
                pollRef.current = setTimeout(() => poll(attempt + 1), 5000);
            };
            pollRef.current = setTimeout(() => poll(0), 5000);
        } catch (error) {
            console.error('Penny scanner start error:', error);
            setIsScanning(false);
            updateScanCache('penny_scanning', false);
            if (window.addToast) window.addToast('Pennystock-Scan konnte nicht gestartet werden', 'error');
        }
    };

    const actionOrder = { JETZT_VERKAUFEN: 0, JETZT_KAUFEN: 1, HALTEN: 2, TRIGGER_WARTEN: 3, BEOBACHTEN: 4 };
    const sorted = results.filter(isVisibleAction).sort((a, b) => {
        const actionDiff = (actionOrder[a.trade_action] ?? 9) - (actionOrder[b.trade_action] ?? 9);
        if (actionDiff) return actionDiff;
        return Number(b.trade_score || b.score || 0) - Number(a.trade_score || a.score || 0)
            || Number(b.entry_quality_score || 0) - Number(a.entry_quality_score || 0);
    });
    const price = value => {
        const number = Number(value);
        if (!Number.isFinite(number) || number <= 0) return '-';
        return `$${number >= 1 ? number.toFixed(3) : number.toFixed(5)}`;
    };
    const compactMoney = value => {
        const number = Number(value || 0);
        if (number >= 1000000) return `$${(number / 1000000).toFixed(1)}M`;
        if (number >= 1000) return `$${(number / 1000).toFixed(0)}K`;
        return number ? `$${number.toFixed(0)}` : '-';
    };
    const actionTone = action => ({
        JETZT_KAUFEN: 'bg-emerald-100 text-emerald-800',
        JETZT_VERKAUFEN: 'bg-red-100 text-red-800',
        HALTEN: 'bg-cyan-100 text-cyan-800',
        TRIGGER_WARTEN: 'bg-amber-100 text-amber-800',
        BEOBACHTEN: 'bg-blue-100 text-blue-800',
    }[action] || 'bg-gray-100 text-gray-700');
    const openRow = item => onSelectTicker({ ...item, direction: 'LONG' });

    return (
        <div className="space-y-5">
            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey="penny_stocks" />

            <div className="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-6">
                {[
                    ['Markt gescannt', diagnostics.snapshot_total],
                    ['Pennystocks geprueft', diagnostics.common_penny_universe],
                    ['5m tief geprueft', diagnostics.deep_checked],
                    ['Rotierend geprueft', diagnostics.rotating_checked],
                    ['Jetzt kaufen', diagnostics.buy_now],
                    ['Aktiv halten', diagnostics.hold_now],
                    ['Jetzt verkaufen', diagnostics.exit_now],
                ].map(([label, value]) => (
                    <div key={label} className="card rounded-lg border border-gray-200 p-3">
                        <div className="text-xs text-gray-500">{label}</div>
                        <div className="mt-1 text-xl font-bold">{value ?? '-'}</div>
                    </div>
                ))}
            </div>

            <div className="md:hidden space-y-3">
                {sorted.map(item => (
                    <button key={item.ticker} onClick={() => openRow(item)} className="scanner-mobile-card card w-full rounded-xl border border-gray-200 p-4 text-left">
                        <div className="flex items-start justify-between gap-3">
                            <div><div className="text-lg font-bold">{item.ticker}</div><div className="text-xs text-gray-500">{item.lifecycle}</div></div>
                            <span className={`rounded px-2 py-1 text-xs font-bold ${actionTone(item.trade_action)}`}>{(item.signal_label || item.trade_action || '').replaceAll('_', ' ')}</span>
                        </div>
                        <div className="mt-3 grid grid-cols-4 gap-2 text-xs">
                            <div><span className="text-gray-500">Trade</span><div className="font-bold">{item.trade_score ?? item.score}</div></div>
                            <div><span className="text-gray-500">Setup</span><div className="font-bold">{item.pump_potential_score}</div></div>
                            <div><span className="text-gray-500">Entry</span><div className="font-bold">{item.entry_quality_score}</div></div>
                            <div><span className="text-gray-500">Risiko</span><div className="font-bold">{item.dump_risk_score}</div></div>
                            <div><span className="text-gray-500">Preis</span><div>{price(item.price)}</div></div>
                            <div><span className="text-gray-500">RVOL</span><div>{Number(item.rvol || 0).toFixed(1)}x</div></div>
                            <div><span className="text-gray-500">$Vol</span><div>{compactMoney(item.dollar_volume)}</div></div>
                        </div>
                        <div className="mt-2 text-[11px] font-semibold text-gray-500">Signal vor {formatCacheAge(item.signal_age_seconds)}</div>
                    </button>
                ))}
                {sorted.length === 0 && <div className="card rounded-xl border border-gray-200 p-6 text-center text-sm text-gray-500">{diagnostics.signal_cache_expired ? 'Der letzte Scan ist zu alt und wird nicht als Trading-Signal angezeigt.' : showWatchRows ? 'Aktuell weder aktive Trading-Signale noch frische Pennystock-Vorstufen.' : 'Aktuell kein bestaetigter Pennystock-Entry und kein aktives Exit-Signal. Der Auto-Scanner prueft alle 5 Minuten weiter.'}</div>}
            </div>

            <div className="card hidden overflow-x-auto rounded-lg border border-gray-200 p-5 md:block">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="py-2 px-2 text-left">Ticker</th>
                            <th className="py-2 px-2 text-center">Grade / Trade</th>
                            <th className="py-2 px-2 text-right">Preis</th>
                            <th className="py-2 px-2 text-right">Aend.%</th>
                            <th className="py-2 px-2 text-right">RVOL</th>
                            <th className="py-2 px-2 text-right">$Vol</th>
                            <th className="py-2 px-2 text-center">Setup</th>
                            <th className="py-2 px-2 text-center">Entry</th>

                            <th className="py-2 px-2 text-left">Phase / Aktion</th>
                            <th className="py-2 px-2 text-right">Entry / Stop</th>
                            <th className="py-2 px-2 text-right">TP1 / TP2</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.map(item => {
                            const setup = item.trade_setup || {};
                            return (
                                <tr key={item.ticker} onClick={() => openRow(item)} className="table-row cursor-pointer border-b border-gray-200">
                                    <td className="py-3 px-2"><span className="font-bold">{item.ticker}</span><div className="text-[11px] text-gray-500">{item.float_data_quality === 'shares_outstanding_proxy' ? `${item.shares_outstanding_m}M shares proxy` : 'Float unbekannt'}</div></td>
                                    <td className="py-3 px-2 text-center"><span className="rounded bg-violet-100 px-2 py-1 text-xs font-bold text-violet-800">{item.grade} {item.trade_score ?? item.score}</span></td>
                                    <td className="py-3 px-2 text-right">{price(item.price)}</td>
                                    <td className={`py-3 px-2 text-right font-semibold ${Number(item.change_pct) >= 0 ? 'color-positive' : 'color-negative'}`}>{Number(item.change_pct || 0).toFixed(1)}%</td>
                                    <td className="py-3 px-2 text-right">{Number(item.rvol || 0).toFixed(1)}x<div className="text-[10px] text-gray-400">{item.rvol_source === 'projected_volume_vs_20d_median' ? '20T Median' : 'Fallback'}</div></td>

// Volume Spikes Tab
function VolumeSpikesTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [isScanning, setIsScanning] = useState(scanCache.vs_scanning || false);
    const [results, setResults] = useState(scanCache.vs_results || []);
    const { sorted, toggleSort, sortKey } = useSortable(results, 'score');
    const pollTimeoutRef = useRef(null);

    // Cleanup polling on unmount
    useEffect(() => {
        return () => { if (pollTimeoutRef.current) clearTimeout(pollTimeoutRef.current); };
    }, []);

    const handleScan = async () => {
        setIsScanning(true);
        updateScanCache('vs_scanning', true);
        // Save current cached_at BEFORE scan starts
        let prevCachedAt = null;
        try {
            const preCheck = await fetch(`${API}/api/volume-spikes-results`);
            if (preCheck.ok) {
                const preData = await preCheck.json();
                prevCachedAt = preData.cached_at || null;
            }
        } catch(e) {}
        try {
            const response = await fetch(`${API}/api/volume-spikes-scan`, { method: 'POST' });
            if (response.ok) {
                if (window.addToast) window.addToast('Scan gestartet...', 'info');
                // Poll for results with increasing intervals
                const pollResults = async (attempts = 0) => {
                    if (attempts > 12) { // Max 2 minutes (12 * 10s)
                        setIsScanning(false);
                        updateScanCache('vs_scanning', false);
                        if (window.addToast) window.addToast('Scan dauert länger...', 'info');
                        return;
                    }
                    try {
                        const res = await fetch(`${API}/api/volume-spikes-results`);
                        if (res.ok) {
                            const data = await res.json();
                            const items = data.data || [];
                            const isNewData = data.cached_at && data.cached_at !== prevCachedAt;
                            if (isNewData) {
                                setResults(items);
                                updateScanCache('vs_results', items);
                                setIsScanning(false);
                                updateScanCache('vs_scanning', false);
                                if (window.addToast) window.addToast(`Scan fertig: ${items.length} Ergebnisse`, 'success');
                                return;
                            }
                        }
                    } catch (e) { console.error(e); }
                    pollTimeoutRef.current = setTimeout(() => pollResults(attempts + 1), 10000); // Retry in 10s
                };
                pollTimeoutRef.current = setTimeout(() => pollResults(0), 5000); // First poll after 5s
            } else {
                setIsScanning(false);
                updateScanCache('vs_scanning', false);
            }
        } catch (err) {
            console.error('Error:', err);
            setIsScanning(false);
            updateScanCache('vs_scanning', false);
        }
    };

    // Always load latest from server on mount
    useEffect(() => {
        const fetchResults = async () => {
            try {
                const response = await fetch(`${API}/api/volume-spikes-results`);
                if (response.ok) {
                    const data = await response.json();
                    const items = data.data || [];
                    setResults(items);
                    updateScanCache('vs_results', items);
                }
            } catch (err) { console.error('Error:', err); }
        };
        fetchResults();
    }, []);

    return (
        <div className="space-y-6">
            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey="volume_spikes" />

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('ticker')}>Ticker</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('price')}>Preis</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('change_pct')}>Änderung%</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('rsi')}>RSI</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('rvol')}>RVOL</th>
                            <th className="text-left py-2 px-2">Signal</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('score')}>Score</th>
                            <th className="text-center py-2 px-2 sortable-header" onClick={() => toggleSort('grade')}>Grade</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('volume')}>Volumen</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('dollar_volume')}>$-Volumen</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.map((item, idx) => {
                            const derivedScore = item.score ?? Math.min(100, Math.round((Number(item.rvol || 0) * 18) + Math.min(Math.abs(Number(item.change_pct || 0)) * 4, 30)));
                            const derivedGrade = item.grade || (derivedScore >= 80 ? 'S' : derivedScore >= 65 ? 'A' : derivedScore >= 50 ? 'B' : derivedScore >= 35 ? 'C' : 'D');
                            return (
                            <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker(item.ticker)}>
                                <td className="py-3 px-2 font-semibold">{item.ticker}</td>
                                <td className="py-3 px-2 text-right">${item.price?.toFixed(2)}</td>
                                <td className={`py-3 px-2 text-right ${item.change_pct >= 0 ? 'color-positive' : 'color-negative'}`}>{item.change_pct?.toFixed(2)}%</td>
                                <td className="py-3 px-2 text-right">{item.rsi != null ? Number(item.rsi).toFixed(1) : '-'}</td>
                                <td className="py-3 px-2 text-right">{item.rvol != null ? `${item.rvol.toFixed(2)}x` : '–'}</td>
                                <td className="py-3 px-2"><span className={`text-xs px-2 py-0.5 rounded font-semibold ${Number(item.rvol || 0) >= 2 ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'}`}>{Number(item.rvol || 0) >= 2 ? 'Spike stark' : 'Spike'}</span></td>
                                <td className="py-3 px-2 text-right font-semibold">{derivedScore}</td>
                                <td className="py-3 px-2 text-center"><span className={`grade-badge grade-${derivedGrade.toLowerCase()}`}>{derivedGrade}</span></td>
                                <td className="py-3 px-2 text-right">{item.volume ? (item.volume / 1000000).toFixed(2) + 'M' : '-'}</td>
                                <td className="py-3 px-2 text-right">{item.dollar_volume ? `$${(item.dollar_volume / 1000000).toFixed(2)}M` : '–'}</td>
                            </tr>
                            );
                        })}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

// ORB Scanner Tab (Opening Range Breakout)
function ORBScannerTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [results, setResults] = useState(null);
    const [loading, setLoading] = useState(false);
    const [cacheAge, setCacheAge] = useState(null);
    const [subView, setSubView] = useState('breakouts');
    const scanTimerRef = useRef(null);

    const loadResults = async () => {
        try {
            const resp = await fetch(`${API}/api/orb-results`);
            const data = await resp.json();
            const payload = Array.isArray(data.data) ? data.data[0] : data.data;
            if (payload) {
                setResults(payload);
                setCacheAge(data.cache_age_seconds);
            }
        } catch (e) { console.error('ORB load error:', e); }
    };

    useEffect(() => {
        loadResults();
        const iv = setInterval(loadResults, 30000);
        return () => { clearInterval(iv); if (scanTimerRef.current) clearTimeout(scanTimerRef.current); };
    }, []);

    const triggerScan = async () => {
        setLoading(true);
        try {
            await fetch(`${API}/api/orb-scan`, { method: 'POST' });
            if (scanTimerRef.current) clearTimeout(scanTimerRef.current);
            scanTimerRef.current = setTimeout(loadResults, 5000);
        } catch (e) { console.error(e); }
        setLoading(false);
    };

    const gradeColor = (g) => ({ S: 'text-yellow-500 font-bold', A: 'text-green-500 font-bold', B: 'text-blue-500', C: 'text-gray-500' }[g] || 'text-gray-400');
    const dirEmoji = (d) => d === 'LONG' ? '⬆️' : d === 'SHORT' ? '⬇️' : '🔄';
    const formatAge = (s) => s == null ? '—' : s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s/60)}min` : `${Math.floor(s/3600)}h`;
    const orbEntryBadgeLabel = (b) => b?.entry_badge_label || (b?.entry_quality ? `Entry ${b.entry_quality}` : '');
    const orbEntryBadgeClass = (b) => {
        const decision = String(b?.trade_decision || b?.trade_health?.decision || '').toUpperCase();
        const tone = String(b?.entry_badge_tone || '').toLowerCase();
        if (tone === 'danger' || decision === 'NO_TRADE') return 'bg-red-100 text-red-700';
        if (tone === 'warning') return 'bg-yellow-100 text-yellow-700';
        const q = String(b?.entry_quality || '').toUpperCase();
        if (q === 'GOOD') return 'bg-green-100 text-green-700';
        if (q === 'EXTENDED' || q === 'LATE') return 'bg-yellow-100 text-yellow-700';
        return 'bg-red-100 text-red-700';
    };

    const orbDecisionRank = (b) => {
        const d = String(b?.trade_decision || b?.trade_health?.decision || '').toUpperCase();
        if (d === 'TRADEABLE') return 0;
        if (['WAIT_FOR_RETEST', 'WAIT_FOR_CONTINUATION', 'WAIT_FOR_TRIGGER', 'WATCH_ONLY'].includes(d)) return 1;
        if (d === 'NO_TRADE') return 9;
        return 5;
    };
    const orbEntryRank = (b) => {
        const q = String(b?.entry_quality || b?.trade_health?.entry_quality || '').toUpperCase();
        if (q === 'GOOD') return 0;
        if (q === 'EXTENDED') return 1;
        if (q === 'LATE') return 2;
        if (q === 'CHASE') return 4;
        return 3;
    };
    const rawBreakouts = results?.breakouts || [];
    const breakouts = [...rawBreakouts].sort((a, b) => (
        orbDecisionRank(a) - orbDecisionRank(b) ||
        orbEntryRank(a) - orbEntryRank(b) ||
        Number(Boolean(a?.late_to_tp1)) - Number(Boolean(b?.late_to_tp1)) ||
        Number(b?.trade_health_score || b?.trade_health?.health_score || 0) - Number(a?.trade_health_score || a?.trade_health?.health_score || 0) ||
        Number(b?.score || 0) - Number(a?.score || 0) ||
        Number(b?.live_rr_ratio || b?.rr_ratio || 0) - Number(a?.live_rr_ratio || a?.rr_ratio || 0) ||
        Number(a?.distance_to_entry_r ?? 999) - Number(b?.distance_to_entry_r ?? 999)
    ));
    const decisionCounts = results?.breakout_decision_counts || {
        tradeable: breakouts.filter(b => String(b?.trade_decision || b?.trade_health?.decision || '').toUpperCase() === 'TRADEABLE').length,
        wait: breakouts.filter(b => ['WAIT_FOR_RETEST', 'WAIT_FOR_CONTINUATION', 'WAIT_FOR_TRIGGER', 'WATCH_ONLY'].includes(String(b?.trade_decision || b?.trade_health?.decision || '').toUpperCase())).length,
        no_trade: breakouts.filter(b => String(b?.trade_decision || b?.trade_health?.decision || '').toUpperCase() === 'NO_TRADE').length,
    };
    const failedBOs = results?.failed_breakouts || [];
    const candidates = results?.candidates || [];
    const stats = results?.stats || {};

    return (
        <div className="space-y-4">
            <div className="card p-4">
                <div className="flex justify-between items-center mb-3">
                    <div>
                        <h2 className="text-lg font-bold">ORB Scanner V2</h2>
                        <p className="text-xs text-gray-500">Opening Range Breakout | Prime 9:45-11:00 ET, Late Review bis 16:00 ET | Mark Fisher ACD + Crabel</p>
                    </div>
                    <div className="flex items-center gap-3">
                        <span className="text-xs text-gray-400">Cache: {formatAge(cacheAge)}</span>
                        <button onClick={triggerScan} disabled={loading} className="btn-primary text-sm px-3 py-1">
                            {loading ? '⏳ Scanning...' : '🔍 Scan'}
                        </button>
                    </div>
                </div>
                {stats.scanned > 0 && (
                    <div className="space-y-1">
                        <div className="flex gap-4 text-xs text-gray-500">
                            <span>Gescannt: {stats.scanned}</span>
                            <span>Kandidaten: {stats.candidates}</span>
                            <span className="text-green-600 font-medium">Breakouts: {stats.breakouts}</span>
                            <span className="text-red-500">Failed: {stats.failed || 0}</span>
                            <span className="text-gray-400">{results?.market_time || ''}</span>
                            {results?.session_quality === 'late_review' && <span className="text-orange-500 font-medium">Late Review</span>}
                        </div>
                        {stats.debug && (
                            <div className="flex gap-3 text-[10px] text-gray-600 font-mono">
                                {stats.debug.api_fail > 0 && <span className="text-red-400">API:{stats.debug.api_fail}</span>}
                                {stats.debug.no_bars > 0 && <span>NoBars:{stats.debug.no_bars}</span>}
                                {stats.debug.no_rth > 0 && <span>NoRTH:{stats.debug.no_rth}</span>}
                                {stats.debug.no_or > 0 && <span>NoOR:{stats.debug.no_or}</span>}
                                {stats.debug.or_wide > 0 && <span>ORweit:{stats.debug.or_wide}</span>}
                                {stats.debug.or_narrow > 0 && <span>OReng:{stats.debug.or_narrow}</span>}
                                {stats.debug.non_stock > 0 && <span>NonStock:{stats.debug.non_stock}</span>}
                                <span className="text-yellow-500">InRange:{stats.debug.in_range}</span>
                                <span className="text-orange-400">Failed:{stats.debug.failed}</span>
                                <span className="text-green-400">Passed:{stats.debug.passed}</span>
                            </div>
                        )}
                    </div>
                )}
            </div>

            <div className="flex gap-2 mb-2">
                <button onClick={() => setSubView('breakouts')} className={`text-xs px-3 py-1 rounded ${subView === 'breakouts' ? 'bg-green-600 text-white' : 'bg-gray-100 text-gray-600'}`}>
                    Breakouts ({breakouts.length})
                </button>
                <button onClick={() => setSubView('failed')} className={`text-xs px-3 py-1 rounded ${subView === 'failed' ? 'bg-red-600 text-white' : 'bg-gray-100 text-gray-600'}`}>
                    Failed BOs ({failedBOs.length})
                </button>
                <button onClick={() => setSubView('candidates')} className={`text-xs px-3 py-1 rounded ${subView === 'candidates' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600'}`}>
                    Kandidaten ({candidates.length})
                </button>
            </div>
            {subView === 'breakouts' && breakouts.length > 0 && (
                <div className="text-xs text-gray-500 bg-blue-50 border border-blue-100 rounded px-3 py-2">
                    Sortierung: Tradeable zuerst, dann Retest/Trigger-Watch, No-Trade zuletzt.
                    <span className="ml-2 text-emerald-700 font-medium">Tradeable: {decisionCounts.tradeable || 0}</span>
                    <span className="ml-2 text-amber-700 font-medium">Warten: {decisionCounts.wait || 0}</span>
                    <span className="ml-2 text-red-700 font-medium">No Trade: {decisionCounts.no_trade || 0}</span>
                </div>
            )}

            {subView === 'breakouts' && breakouts.length > 0 && (
                <div className="space-y-2">
                    {breakouts.map((b, i) => (
                        <div key={i} className="card orb-result-card p-3 cursor-pointer hover:bg-gray-50" onClick={() => onSelectTicker({ticker: b.ticker, ...b})}>
                            <div className="flex justify-between items-start">
                                <div>
                                    <span className="font-bold text-base">{b.ticker}</span>
                                    <span className={`ml-2 ${gradeColor(b.grade)}`}>{b.grade}</span>
                                    <span className="ml-2 text-sm">{dirEmoji(b.direction)} {b.direction}</span>
                                    {b.vol_confirmed && <span className="ml-1 text-xs text-green-600">🔊 Vol✓</span>}
                                    {b.vwap_aligned && <span className="ml-1 text-xs text-blue-500">VWAP✓</span>}
                                    {orbEntryBadgeLabel(b) && <span className={`ml-1 text-xs px-1.5 py-0.5 rounded ${orbEntryBadgeClass(b)}`}>{orbEntryBadgeLabel(b)}</span>}
                                    {b.trade_health && <span className={`ml-1 text-xs px-1.5 py-0.5 rounded ${b.trade_health.decision === 'TRADEABLE' ? 'bg-emerald-100 text-emerald-700' : b.trade_health.decision === 'NO_TRADE' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'}`}>{b.trade_health.decision_label || b.trade_health.decision}</span>}
                                    {b.late_to_tp1 && <span className="ml-1 text-xs px-1.5 py-0.5 rounded bg-red-100 text-red-700">TP1 hit</span>}
                                </div>
                                <div className="text-right">
                                    <div className="font-bold">${b.current_price}</div>
                                    <div className="text-xs text-gray-500">Score: {b.score}/100</div>
                                    <div className="text-xs text-gray-500">Live R:R: {b.live_rr_ratio != null ? b.live_rr_ratio : b.rr_ratio}</div>
                                </div>
                            </div>
                            <div className="mt-2 grid grid-cols-2 md:grid-cols-6 gap-2 text-xs text-gray-600">
                                <div>Gap: <span className={b.gap_pct > 0 ? 'text-green-600' : 'text-red-500'}>{b.gap_pct > 0 ? '+' : ''}{b.gap_pct}%</span></div>
                                <div>RVOL: <span className={b.rvol >= 2 ? 'text-green-600 font-medium' : ''}>{b.rvol}x</span></div>
                                <div>OR: {b.or_size_pct}%</div>
                                <div>ATR: {b.atr_pct || b.prev_atr_pct}%</div>
                                <div>Live R:R: <span className={(b.live_rr_ratio || 0) >= 2 ? 'text-green-600 font-medium' : (b.live_rr_ratio || 0) < 1.5 ? 'text-red-500' : ''}>{b.live_rr_ratio != null ? b.live_rr_ratio : b.rr_ratio}</span></div>
                                <div>Dist: {b.distance_to_entry_r != null ? `${b.distance_to_entry_r}R` : '0R'}</div>
                            </div>
                            <div className="mt-1 flex flex-wrap gap-3 text-xs">
                                <span className="text-green-700">Entry: ${b.entry}</span>
                                <span className="text-green-600">Live: ${b.live_entry || b.current_price}</span>
                                <span className="text-red-500">Tactical Stop: ${b.stop}</span>
                                {b.invalidation_stop && <span className="text-red-700">Invalidation: ${b.invalidation_stop}</span>}
                                <span className="text-blue-600">T1: ${b.target1}</span>
                                <span className="text-blue-400">T2: ${b.target2}</span>
                            </div>
                            <div className="mt-1 text-xs text-gray-500">Trigger R:R: {b.rr_ratio} | Model: {b.rr_model || '50/50 TP1/TP2'} | Asset: {b.asset_check || 'checked'}</div>
                            {b.trade_health && <div className="mt-1 text-xs text-gray-500">Health: {b.trade_health.health_score}/100 | Fakeout: {b.trade_health.fakeout_risk} | Chase: {b.trade_health.chase_risk}</div>}
                            <div className="mt-1 text-xs text-gray-400">{b.score_details}</div>
                        </div>
                    ))}
                </div>
            )}
            {subView === 'breakouts' && breakouts.length === 0 && (
                <div className="card p-6 text-center text-gray-400">
                    <p className="text-lg mb-1">Keine Breakouts</p>
                    {Number(stats.breakouts || 0) > 0 && (
                        <p className="text-xs text-amber-600 mb-1">
                            Backend meldet {stats.breakouts} rohe Breakout(s), aber der aktuelle Cache liefert keine sichtbaren Zeilen. Bitte neu scannen; ORB-Zeilen werden nicht mehr per Signal-Only-Filter versteckt.
                        </p>
                    )}
                    <p className="text-xs">{results?.or_phase === 'expired' ? 'ORB-Fenster abgelaufen — nächster Scan morgen 9:45 ET' : results?.or_phase === 'weekend' ? 'Wochenende — ORB Scanner Mo-Fr 9:45-11:00 ET' : results?.or_phase === 'pre_open' ? 'Pre-Market — ORB Scanner startet 9:45 ET' : results?.or_phase === 'late_review' ? `Late Review aktiv — klassische ORB-Edge reduziert (${results?.market_time || ''})` : `ORB Prime aktiv Mo-Fr 9:45-11:00 ET (${results?.market_time || ''})`}</p>
                </div>
            )}

            {subView === 'failed' && failedBOs.length > 0 && (
                <div className="space-y-2">
                    <p className="text-xs text-gray-500 mb-1">Failed Breakouts = Crabel Reversal Setups (Gegenrichtung handeln)</p>
                    {failedBOs.map((b, i) => (
                        <div key={i} className="card orb-result-card p-3 border-l-4 border-red-400 cursor-pointer hover:bg-gray-50" onClick={() => onSelectTicker({ticker: b.ticker, ...b})}>
                            <div className="flex justify-between">
                                <div>
                                    <span className="font-bold">{b.ticker}</span>
                                    <span className="ml-2 text-sm text-red-500">🔄 {b.direction}</span>
                                </div>
                                <span className="font-bold">${b.current_price}</span>
                            </div>
                            <div className="mt-1 flex gap-3 text-xs">
                                <span>Gap: {b.gap_pct}%</span>
                                <span>RVOL: {b.rvol}x</span>
                                <span className="text-green-700">Entry: ${b.entry}</span>
                                <span className="text-red-500">Stop: ${b.stop}</span>
                                <span className="text-blue-600">Target: ${b.target}</span>
                            </div>
                        </div>
                    ))}
                </div>
            )}
            {subView === 'failed' && failedBOs.length === 0 && (
                <div className="card p-4 text-center text-gray-400 text-sm">Keine Failed Breakouts erkannt</div>
            )}

            {subView === 'candidates' && candidates.length > 0 && (
                <div className="space-y-1">
                    <p className="text-xs text-gray-500 mb-1">Pre-ORB Kandidaten (Gap + RVOL Filter, warten auf Breakout)</p>
                    {candidates.map((c, i) => (
                        <div key={i} className="card orb-result-card p-2 flex justify-between items-center cursor-pointer hover:bg-gray-50 text-sm" onClick={() => onSelectTicker({ticker: c.ticker, ...c})}>
                            <span className="font-medium w-16">{c.ticker}</span>
                            <span className={c.gap_pct > 0 ? 'text-green-600' : 'text-red-500'}>{c.gap_pct > 0 ? '+' : ''}{c.gap_pct}%</span>
                            <span className={c.rvol >= 2 ? 'text-green-600 font-medium' : 'text-gray-500'}>{c.rvol}x</span>
                            <span className="text-gray-500">${c.current}</span>
                            <span className="text-gray-400 text-xs">{c.volume ? (c.volume/1000000).toFixed(1)+'M' : '–'}</span>
                        </div>
                    ))}
                </div>
            )}
        </div>
    );
}

// Suche (Search) Tab
function AutoTraderTab() {
    const [status, setStatus] = useState(null);
    const [loading, setLoading] = useState(true);
    const [actionLoading, setActionLoading] = useState(null);
    const [editConfig, setEditConfig] = useState(null);
    const [showLog, setShowLog] = useState(false);
    const actionTimerRef = useRef(null);

    const fetchStatus = async () => {
        try {
            const res = await fetch(`${API}/api/autotrader/status`);
            if (res.ok) setStatus(await res.json());
        } catch (e) { console.error('AT status error', e); }
        finally { setLoading(false); }
    };

    useEffect(() => {
        fetchStatus();
        const interval = setInterval(fetchStatus, 5000);
        return () => { clearInterval(interval); if (actionTimerRef.current) clearTimeout(actionTimerRef.current); };
    }, []);

    const doAction = async (endpoint, body = null) => {
        setActionLoading(endpoint);
        try {
            const opts = { method: 'POST', headers: { 'Content-Type': 'application/json' } };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(`${API}/api/autotrader/${endpoint}`, opts);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            if (data.ok) {
                if (window.addToast) window.addToast(data.message || 'Erfolgreich', 'success');
            } else {
                if (window.addToast) window.addToast(data.error || 'Fehler', 'error');
            }
            if (actionTimerRef.current) clearTimeout(actionTimerRef.current);
            actionTimerRef.current = setTimeout(fetchStatus, 500);
        } catch (e) {
            if (window.addToast) window.addToast('Verbindungsfehler', 'error');
        }
        setActionLoading(null);
    };

    const saveConfig = async () => {
        if (!editConfig) return;
        await doAction('config', { config: editConfig });
        setEditConfig(null);
    };

    if (loading) return <div style={{ textAlign: 'center', padding: 60 }}><div className="loading-spinner" style={{ margin: '0 auto' }}></div></div>;

    const st = status?.state || {};
    const cfg = editConfig || status?.config || {};
    const isRunning = status?.thread_alive;
    const positions = st.positions || [];
    const logEntries = (status?.log || []).slice().reverse();

    const statusColor = isRunning ? '#10b981' : '#ef4444';
    const statusText = isRunning ? 'Aktiv' : 'Gestoppt';

    return (
        <div className="space-y-4">
            {/* Header */}
            <div className="card" style={{ padding: 20, borderRadius: 12, border: `1px solid ${statusColor}33`, display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
                    <div style={{ width: 48, height: 48, borderRadius: 14, background: `${statusColor}15`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        <svg width="24" height="24" fill="none" stroke={statusColor} viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                    </div>
                    <div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                            <h2 style={{ fontSize: 22, fontWeight: 800, margin: 0 }}>Auto-Trader</h2>
                            <span style={{ fontSize: 11, fontWeight: 700, padding: '3px 10px', borderRadius: 20, background: `${statusColor}15`, color: statusColor }}>{statusText}</span>
                            <span style={{ fontSize: 11, fontWeight: 600, padding: '3px 10px', borderRadius: 20, background: 'rgba(139,92,246,0.1)', color: '#a78bfa' }}>
                                {cfg.mode === 'full' ? 'FULL AUTO' : 'SEMI AUTO'}
                            </span>
                        </div>
                        <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 2 }}>
                            BI Scanner → Broker Bracket Orders {status?.market_hours ? '(Markt offen)' : '(Markt geschlossen)'}
                        </div>
                    </div>
                </div>
                <div style={{ display: 'flex', gap: 8 }}>
                    {!isRunning ? (
                        <button onClick={() => doAction('start')} disabled={actionLoading} className="button" style={{ padding: '8px 20px', background: '#10b981' }}>
                            {actionLoading === 'start' ? 'Startet...' : 'Starten'}
                        </button>
                    ) : (
                        <button onClick={() => doAction('stop')} disabled={actionLoading} className="button" style={{ padding: '8px 20px', background: '#ef4444' }}>
                            {actionLoading === 'stop' ? 'Stoppt...' : 'Stoppen'}
                        </button>
                    )}
                    <button onClick={() => doAction('scan-once')} disabled={actionLoading || isRunning} className="button" style={{ padding: '8px 20px', background: '#3b82f6' }}>
                        {actionLoading === 'scan-once' ? 'Scannt...' : 'Einmal scannen'}
                    </button>
                </div>
            </div>

            {/* Stats Grid */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: 10 }}>
                {[
                    { label: 'Positionen', value: `${positions.length} / ${cfg.max_positions || 5}`, color: '#3b82f6' },
                    { label: 'Trades heute', value: st.trades_today || 0, color: '#8b5cf6' },
                    { label: 'Tages P&L', value: `${(st.daily_pnl || 0) >= 0 ? '+' : ''}${(st.daily_pnl || 0).toFixed(1)}%`, color: (st.daily_pnl || 0) >= 0 ? '#10b981' : '#ef4444' },
                    { label: 'Position Size', value: `$${cfg.position_size || 2000}`, color: '#f59e0b' },
                    { label: 'Min R:R', value: `${cfg.min_rr || 2.0}x`, color: '#06b6d4' },
                    { label: 'Letzter Scan', value: st.last_scan ? new Date(st.last_scan).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'}) : '—', color: '#64748b' },
                ].map((s, i) => (
                    <div key={i} className="card" style={{ padding: 14, borderRadius: 10, border: '1px solid var(--border-color)', textAlign: 'center' }}>
                        <div style={{ fontSize: 11, color: 'var(--text-muted)', marginBottom: 4 }}>{s.label}</div>
                        <div style={{ fontSize: 20, fontWeight: 800, color: s.color }}>{s.value}</div>
                    </div>
                ))}
            </div>

            {/* Positions */}
            <div className="card" style={{ padding: 16, borderRadius: 12, border: '1px solid var(--border-color)' }}>

                    <h3 style={{ fontSize: 15, fontWeight: 700, margin: 0 }}>Offene Positionen</h3>
                    {positions.length > 0 && (

                            Alle zurücksetzen

                    )}
                </div>
                {positions.length === 0 ? (
                    <div style={{ textAlign: 'center', padding: '30px 0', color: 'var(--text-muted)', fontSize: 13 }}>
                        Keine offenen Positionen
                    </div>
                ) : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                        {positions.map((p, i) => (
                            <div key={i} style={{ padding: '12px 14px', background: 'var(--card-bg)', borderRadius: 10, border: '1px solid var(--border-color)' }}>

                                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                        <span style={{ fontSize: 15, fontWeight: 800 }}>{p.ticker}</span>
                                        <span style={{ fontSize: 10, fontWeight: 700, padding: '2px 8px', borderRadius: 6, background: 'rgba(59,130,246,0.12)', color: '#3b82f6' }}>Grade {p.grade}</span>
                                        <span style={{ fontSize: 10, fontWeight: 600, padding: '2px 6px', borderRadius: 4, background: p.mode === 'AUTO' ? 'rgba(16,185,129,0.12)' : 'rgba(245,158,11,0.12)', color: p.mode === 'AUTO' ? '#10b981' : '#f59e0b' }}>{p.mode}</span>
                                    </div>
                                    <span style={{ fontSize: 12, fontWeight: 700, color: '#3b82f6' }}>{p.shares} Shares</span>
                                </div>
                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 8, fontSize: 11 }}>
                                    <div><span style={{ color: 'var(--text-muted)' }}>Entry</span><div style={{ fontWeight: 700 }}>${p.entry}</div></div>
                                    <div><span style={{ color: 'var(--text-muted)' }}>Stop</span><div style={{ fontWeight: 700, color: '#ef4444' }}>${p.stop}</div></div>

                                    <div><span style={{ color: 'var(--text-muted)' }}>TP2</span><div style={{ fontWeight: 700, color: '#10b981' }}>${p.tp2}</div></div>
                                    <div><span style={{ color: 'var(--text-muted)' }}>R:R</span><div style={{ fontWeight: 700, color: '#3b82f6' }}>{p.rr}x</div></div>
                                </div>
                                <div style={{ fontSize: 10, color: 'var(--text-muted)', marginTop: 4 }}>{p.date} {p.time} — Score: {p.score_pct}%</div>
                            </div>
                        ))}
                    </div>
                )}
            </div>

            {/* Settings */}
            <div className="card" style={{ padding: 16, borderRadius: 12, border: '1px solid var(--border-color)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
                    <h3 style={{ fontSize: 15, fontWeight: 700, margin: 0 }}>Einstellungen</h3>
                    {editConfig ? (
                        <div style={{ display: 'flex', gap: 8 }}>
                            <button onClick={saveConfig} className="button" style={{ padding: '5px 14px', fontSize: 12, background: '#10b981' }}>Speichern</button>
                            <button onClick={() => setEditConfig(null)} style={{ padding: '5px 14px', fontSize: 12, background: 'none', border: '1px solid var(--border-color)', borderRadius: 6, cursor: 'pointer', color: 'var(--text-color)' }}>Abbrechen</button>
                        </div>
                    ) : (
                        <button onClick={() => setEditConfig({...cfg})} style={{ padding: '5px 14px', fontSize: 12, background: 'none', border: '1px solid var(--border-color)', borderRadius: 6, cursor: 'pointer', color: 'var(--text-color)' }}>Bearbeiten</button>
                    )}
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 10 }}>
                    {[
                        { key: 'mode', label: 'Modus', type: 'select', options: [{ v: 'semi', l: 'Semi Auto (TWS bestätigen)' }, { v: 'full', l: 'Full Auto (sofort aktiv)' }] },
                        { key: 'max_positions', label: 'Max Positionen', type: 'number' },
                        { key: 'position_size', label: 'Position Size ($)', type: 'number' },
                        { key: 'min_rr', label: 'Min Risk:Reward', type: 'number', step: 0.1 },
                        { key: 'min_bi_pct', label: 'Min BI Score (%)', type: 'number' },
                        { key: 'min_smart_money', label: 'Min Smart Money Hits', type: 'number' },
                        { key: 'scan_interval_min', label: 'Scan Intervall (Min)', type: 'number' },
                        { key: 'max_daily_loss_pct', label: 'Max Tagesverlust (%)', type: 'number', step: 0.5 },
                        { key: 'cooldown_days', label: 'Cooldown (Tage)', type: 'number' },
                        { key: 'min_price', label: 'Min Preis ($)', type: 'number' },
                        { key: 'min_volume', label: 'Min Volumen', type: 'number' },
                        { key: 'max_tickers_scan', label: 'Max Tickers / Scan', type: 'number' },
                    ].map(({ key, label, type, options, step }) => (
                        <div key={key}>
                            <label style={{ fontSize: 11, color: 'var(--text-muted)', display: 'block', marginBottom: 3 }}>{label}</label>
                            {type === 'select' ? (
                                <select value={cfg[key] || ''} disabled={!editConfig}
                                    onChange={e => editConfig && setEditConfig({...editConfig, [key]: e.target.value})}
                                    style={{ width: '100%', padding: '7px 10px', borderRadius: 6, border: '1px solid var(--border-color)', background: 'var(--card-bg)', color: 'var(--text-color)', fontSize: 13 }}>
                                    {options.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
                                </select>
                            ) : (
                                <input type="number" value={cfg[key] ?? ''} disabled={!editConfig} step={step || 1}
                                    onChange={e => editConfig && setEditConfig({...editConfig, [key]: parseFloat(e.target.value) || 0})}
                                    style={{ width: '100%', padding: '7px 10px', borderRadius: 6, border: '1px solid var(--border-color)', background: 'var(--card-bg)', color: 'var(--text-color)', fontSize: 13, boxSizing: 'border-box' }} />
                            )}
                        </div>
                    ))}
                </div>
                <div style={{ marginTop: 10, fontSize: 10, color: 'var(--text-muted)', fontStyle: 'italic' }}>
                    Semi Auto: Orders werden in TWS als inaktiv platziert — du bestätigst manuell. Full Auto: Orders gehen sofort live.
                </div>
            </div>

            {/* Log */}
            <div className="card" style={{ padding: 16, borderRadius: 12, border: '1px solid var(--border-color)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: showLog ? 12 : 0, cursor: 'pointer' }} onClick={() => setShowLog(!showLog)}>
                    <h3 style={{ fontSize: 15, fontWeight: 700, margin: 0 }}>Log ({logEntries.length})</h3>
                    <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>{showLog ? '▲ Einklappen' : '▼ Aufklappen'}</span>
                </div>
                {showLog && (
                    <div style={{ maxHeight: 300, overflowY: 'auto', fontSize: 11, fontFamily: '"SF Mono", "Fira Code", monospace' }}>
                        {logEntries.length === 0 ? (
                            <div style={{ color: 'var(--text-muted)', padding: '16px 0', textAlign: 'center' }}>Noch keine Log-Einträge</div>
                        ) : logEntries.map((entry, i) => (
                            <div key={i} style={{ padding: '4px 0', borderBottom: '1px solid var(--border-color)', display: 'flex', gap: 8 }}>
                                <span style={{ color: '#64748b', flexShrink: 0 }}>{entry.time?.substring(11) || ''}</span>
                                <span style={{ fontWeight: 600, flexShrink: 0, color: entry.level === 'ERROR' ? '#ef4444' : entry.level === 'WARN' ? '#f59e0b' : entry.level === 'TRADE' ? '#10b981' : '#64748b' }}>{entry.level}</span>
                                <span style={{ color: 'var(--text-color)' }}>{entry.msg}</span>
                            </div>
                        ))}
                    </div>
                )}
            </div>

            {/* Broker Hinweis */}
            <div style={{ padding: 14, borderRadius: 10, background: 'rgba(245,158,11,0.06)', border: '1px solid rgba(245,158,11,0.15)', fontSize: 12, color: '#f59e0b' }}>
                <strong>Hinweis:</strong> Der Auto-Trader benötigt eine aktive Broker-Gateway Verbindung auf dem Server. Ohne Broker-Verbindung werden Signale erkannt, aber keine Orders platziert.
            </div>
        </div>
    );
}

function ChartAnalyseTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {} }) {
    const [searchTicker, setSearchTicker] = useState('');
    const [activeTicker, setActiveTicker] = useState(null);
    const [searchResults, setSearchResults] = useState([]);
    const [showDropdown, setShowDropdown] = useState(false);
    const searchTimeout = useRef(null);
    const [tickerData, setTickerData] = useState(null);
    const [chartData, setChartData] = useState(null);
    const [loading, setLoading] = useState(false);
    const [timeframe, setTimeframe] = useState('4H');
    const [overlays, setOverlays] = useState({ ema: true, vwap: false, sr: false, fib: false, patterns: false, bb: false, vrvp: true, vol: false });
    const [aiData, setAiData] = useState(null);
    const [aiLoading, setAiLoading] = useState(false);
    const [showInfoPanel, setShowInfoPanel] = useState(true);
    const chartContainer = useRef(null);
    const chartRef = useRef(null);
    const candleSeriesRef = useRef(null);
    const overlaySeriesRef = useRef([]);
    const vrvpSubsRef = useRef([]);
    const savedVisibleRange = useRef(null);
    const prevOverlaysRef = useRef(null);

    const TIMEFRAMES = ['5m', '15m', '1H', '4H', '1D', '1W'];
    const EMA_COLORS = { ema9: '#f59e0b', ema20: '#3b82f6', ema50: '#ef4444', ema100: '#8b5cf6', ema200: '#14b8a6' };

    const performSearch = async (ticker) => {
        const t = (ticker || searchTicker).trim().toUpperCase();
        if (!t) return;
        setLoading(true);
        setAiData(null);
        setShowDropdown(false);
        try {
            const response = await fetch(`${API}/api/ticker-detail?ticker=${t}`);
            if (response.ok) {
                const data = await response.json();
                setTickerData(data);
                setActiveTicker(t);
                setSearchTicker(t);
            } else {
                setTickerData(null);
                setActiveTicker(null);
                if (window.addToast) window.addToast('Ticker nicht gefunden', 'error');
            }
        } catch (err) {
            setTickerData(null);
            if (window.addToast) window.addToast('Suchfehler', 'error');
        } finally {
            setLoading(false);
        }
    };

    // Autocomplete search
    const handleSearchInput = (val) => {
        setSearchTicker(val.toUpperCase());
        if (searchTimeout.current) clearTimeout(searchTimeout.current);
        if (val.length < 1) { setSearchResults([]); setShowDropdown(false); return; }
        searchTimeout.current = setTimeout(async () => {
            try {
                const res = await fetch(`${API}/api/ticker-search?q=${encodeURIComponent(val)}`);
                if (res.ok) {
                    const data = await res.json();
                    setSearchResults(data.results || []);
                    setShowDropdown((data.results || []).length > 0);
                }
            } catch {}
        }, 300);
    };

    // Fetch chart data when ticker or timeframe changes
    useEffect(() => {
        if (!activeTicker) return;
        const controller = new AbortController();
        const fetchChart = async () => {
            try {
                const allOverlays = 'ema,vwap,sr,fib,patterns,vrvp';
                const chartDirection = [
                    tickerData?.trade_setup?.direction,
                    tickerData?.direction,
                    tickerData?.Signal_Direction,
                    tickerData?.confluence?.direction,
                    tickerData?.trade_action,
                    tickerData?.signal,
                ].filter(Boolean).join(' ');
                const res = await fetch(`${API}/api/chart-data?ticker=${activeTicker}&timeframe=${timeframe}&overlays=${allOverlays}&direction=${encodeURIComponent(chartDirection)}`, { signal: controller.signal });
                if (controller.signal.aborted) return;
                if (res.ok) {
                    setChartData(await res.json());
                } else {
                    setChartData({ ticker: activeTicker, timeframe, candles: [], error: 'Keine Chart-Daten verfügbar' });
                }
            } catch (err) {
                if (err.name === 'AbortError') return;
                setChartData({ ticker: activeTicker, timeframe, candles: [], error: 'Chart-Daten konnten nicht geladen werden' });
            }
        };
        fetchChart();
        return () => controller.abort();
    }, [activeTicker, timeframe]);

    // Render chart
    useEffect(() => {
        if (!chartData || !chartContainer.current) return;
        if (!chartData.candles || chartData.candles.length === 0) return;
        try {
            const isOverlayChange = prevOverlaysRef.current && chartData === prevOverlaysRef.current._chartData;
            if (chartRef.current) {
                try {
                    savedVisibleRange.current = {
                        logical: chartRef.current.timeScale().getVisibleLogicalRange(),
                        scrollPos: chartRef.current.timeScale().scrollPosition(),
                    };
                } catch(e) {}
                chartRef.current.remove();
            }
            prevOverlaysRef.current = { ...overlays, _chartData: chartData };
            overlaySeriesRef.current = [];

            const { createChart, LineStyle, CrosshairMode } = window.LightweightCharts;
            const containerWidth = chartContainer.current.clientWidth || 900;
            const chartHeight = 500;

            chartRef.current = createChart(chartContainer.current, {
                layout: { textColor: '#999', background: { color: '#1a1a2e' }, fontSize: 11 },
                grid: { vertLines: { color: 'rgba(255,255,255,0.04)' }, horzLines: { color: 'rgba(255,255,255,0.04)' } },
                width: containerWidth, height: chartHeight,
                crosshair: { mode: CrosshairMode.Normal },
                rightPriceScale: { borderColor: 'rgba(255,255,255,0.1)' },
                timeScale: { timeVisible: timeframe.includes('m') || timeframe.includes('H'), secondsVisible: false, borderColor: 'rgba(255,255,255,0.1)', rightOffset: 12, barSpacing: 8, minBarSpacing: 4 },
            });

            candleSeriesRef.current = chartRef.current.addCandlestickSeries({
                upColor: '#10b981', downColor: '#ef4444',
                borderUpColor: '#10b981', borderDownColor: '#ef4444',
                wickUpColor: '#10b981', wickDownColor: '#ef4444',
            });
            const candles = (chartData.candles || []).map(c => ({
                time: c.time, open: c.open, high: c.high, low: c.low, close: c.close
            }));
            if (candles.length > 0) candleSeriesRef.current.setData(candles);

            // Volume overlay
            if (overlays.vol && chartData.volume) {
                const volSeries = chartRef.current.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol' });
                chartRef.current.priceScale('vol').applyOptions({ scaleMargins: { top: 0.85, bottom: 0 } });
                volSeries.setData(chartData.volume);
                overlaySeriesRef.current.push(volSeries);
            }

            // EMA lines
            if (overlays.ema && chartData.ema) {
                Object.entries(chartData.ema).forEach(([key, data]) => {
                    if (data && data.length > 0) {
                        const emaMeta = chartData.ema_meta?.[key] || {};
                        const emaTitle = `${key.toUpperCase()} ${emaMeta.timeframe || timeframe}${emaMeta.warmup_ok === false ? ' warmup' : ''}`;
                        const line = chartRef.current.addLineSeries({
                            color: EMA_COLORS[key] || '#888', lineWidth: key === 'ema200' ? 2 : 1,
                            lineStyle: emaMeta.warmup_ok === false ? LineStyle.Dotted : LineStyle.Solid,
                            priceLineVisible: false, lastValueVisible: false, title: emaTitle,
                        });
                        line.setData(data);
                        overlaySeriesRef.current.push(line);
                    }
                });
            }

            // VWAP
            if (overlays.vwap && chartData.vwap && chartData.vwap.length > 0) {
                const vwapLine = chartRef.current.addLineSeries({
                    color: '#f97316', lineWidth: 2, lineStyle: LineStyle.Dotted,
                    priceLineVisible: false, lastValueVisible: false, title: 'VWAP',
                });
                vwapLine.setData(chartData.vwap);
