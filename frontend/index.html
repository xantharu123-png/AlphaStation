// Scanner Tab
function ScannerTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [strategy, setStrategy] = useState('');
    const [marketType, setMarketType] = useState('stocks');
    const [isScanning, setIsScanning] = useState(scanCache.scanner_scanning || false);
    const [results, setResults] = useState(scanCache.scanner_results || []);
    const { sorted, toggleSort, sortKey } = useSortable(results, 'score');
    const { data: strategies } = useAutoRefresh(`/api/strategies?market_type=${marketType}`);
    const pollTimeoutRef = useRef(null);
    const groupedStrategies = useMemo(() => {
        const entries = Object.entries(strategies?.strategies || {});
        return entries.reduce((acc, [name, config]) => {
            const group = config?.display_group || 'Strategien';
            if (!acc[group]) acc[group] = [];
            acc[group].push([name, config]);
            return acc;
        }, {});
    }, [strategies]);

    // Cleanup polling on unmount
    useEffect(() => {
        return () => { if (pollTimeoutRef.current) clearTimeout(pollTimeoutRef.current); };
    }, []);

    useEffect(() => {
        if (strategy && strategies?.strategies && !strategies.strategies[strategy]) {
            setStrategy('');
        }
    }, [strategy, strategies]);

    // Always load latest results from server on mount
    useEffect(() => {
        const loadCached = async () => {
            try {
                const response = await fetch(`${API}/api/scan-results?direction=long`);
                if (response.ok) {
                    const data = await response.json();
                    const items = data.data || [];
                    if (items.length > 0) {
                        setResults(items);
                        updateScanCache('scanner_results', items);
                    }
                }
            } catch (err) { console.error('Error:', err); }
        };
        loadCached();
    }, []);

    const handleScan = async () => {
        setIsScanning(true);
        updateScanCache('scanner_scanning', true);
        // Save current cached_at BEFORE scan starts
        let prevCachedAt = null;
        try {
            const stratLower = strategy.toLowerCase();
            const isBI = stratLower.includes('bi_long') || stratLower.includes('bi_short');
            let preUrl;
            if (isBI) {
                const dir = stratLower.includes('short') ? 'short' : 'long';
                preUrl = `${API}/api/scan-results?direction=${dir}`;
            } else {
                preUrl = `${API}/api/scan-results?strategy=${encodeURIComponent(strategy)}&market_type=${encodeURIComponent(marketType)}`;
            }
            const preCheck = await fetch(preUrl);
            if (preCheck.ok) {
                const preData = await preCheck.json();
                prevCachedAt = preData.cached_at || null;
            }
        } catch(e) {}
        try {
            const response = await fetch(`${API}/api/scan`, { method: 'POST', body: JSON.stringify({ strategy, market_type: marketType }), headers: { 'Content-Type': 'application/json' } });
            if (response.ok) {
                if (window.addToast) window.addToast('Scan gestartet...', 'info');
                // Poll for results with increasing intervals
                const pollResults = async (attempts = 0) => {
                    if (attempts > 12) {
                        setIsScanning(false);
                        updateScanCache('scanner_scanning', false);
                        if (window.addToast) window.addToast('Scan dauert länger...', 'info');
                        return;
                    }
                    try {
                        // Strategie-Name mitsenden für korrekte Cache-Zuordnung
                        const stratLower = strategy.toLowerCase();
                        const isBI = stratLower.includes('bi_long') || stratLower.includes('bi_short');
                        let pollUrl;
                        if (isBI) {
                            const dir = stratLower.includes('short') ? 'short' : 'long';
                            pollUrl = `${API}/api/scan-results?direction=${dir}`;
                        } else {
                            pollUrl = `${API}/api/scan-results?strategy=${encodeURIComponent(strategy)}&market_type=${encodeURIComponent(marketType)}`;
                        }
                        const res = await fetch(pollUrl);
                        if (res.ok) {
                            const data = await res.json();
                            const items = data.data || [];
                            const isNewData = data.cached_at && data.cached_at !== prevCachedAt;
                            if (isNewData) {
                                setResults(items);
                                updateScanCache('scanner_results', items);
                                setIsScanning(false);
                                updateScanCache('scanner_scanning', false);
                                if (window.addToast) window.addToast(`Scan fertig: ${items.length} Ergebnisse`, 'success');
                                return;
                            }
                        }
                    } catch (e) { console.error(e); }
                    pollTimeoutRef.current = setTimeout(() => pollResults(attempts + 1), 10000);
                };
                pollTimeoutRef.current = setTimeout(() => pollResults(0), 3000); // Strategie-Scans sind schnell
            } else {
                setIsScanning(false);
                updateScanCache('scanner_scanning', false);
            }
        } catch (err) {
            if (window.addToast) window.addToast('Scan-Fehler', 'error');
            setIsScanning(false);
            updateScanCache('scanner_scanning', false);
        }
    };

    return (

// BI Scanner Tab
function BIScannerTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [direction, setDirection] = useState('long');
    const [isScanning, setIsScanning] = useState(scanCache.bi_scanning || false);
    const [results, setResults] = useState(scanCache.bi_results || []);
    const { sorted, toggleSort, sortKey } = useSortable(results, 'score');
    const pollRef = useRef(null);

    // Cleanup polling on unmount
    useEffect(() => {
        return () => { if (pollRef.current) clearInterval(pollRef.current); };
    }, []);

    // V2.2: Live-Polling — lädt Zwischenergebnisse während Scan läuft
    const startLivePolling = () => {
        if (pollRef.current) clearInterval(pollRef.current);
        pollRef.current = setInterval(async () => {
            try {
                // Prüfe ob Scan noch läuft
                const scanKey = direction === 'long' ? 'bi_long' : 'bi_short';
                const statusRes = await fetch(`${API}/api/scan-status`);
                let scanRunning = true;
                if (statusRes.ok) {
                    const status = await statusRes.json();
                    const s = status.scans?.[scanKey];
                    scanRunning = s?.running || false;
                }
                // Lade aktuelle Ergebnisse (inkl. Zwischenergebnisse)
                const res = await fetch(`${API}/api/bi-results?direction=${direction}`);
                if (res.ok) {
                    const data = await res.json();
                    const items = data.data || [];
                    if (items.length > 0) {
                        setResults(items);
                        updateScanCache('bi_results', items);
                    }
                }
                // Scan fertig → Polling stoppen
                if (!scanRunning) {
                    clearInterval(pollRef.current);
                    pollRef.current = null;
                    setIsScanning(false);
                    updateScanCache('bi_scanning', false);
                    if (window.addToast) window.addToast('Scan fertig', 'success');
                }
            } catch (e) { console.error(e); }
        }, 8000); // Alle 8 Sekunden
    };

    const handleScan = async () => {
        setIsScanning(true);
        updateScanCache('bi_scanning', true);
        try {
            const response = await fetch(`${API}/api/bi-scan`, { method: 'POST', body: JSON.stringify({ direction }), headers: { 'Content-Type': 'application/json' } });
            if (response.ok) {
                if (window.addToast) window.addToast('Scan gestartet — Ergebnisse erscheinen live...', 'info');
                startLivePolling();
            } else {
                setIsScanning(false);
                updateScanCache('bi_scanning', false);
            }
        } catch (err) {
            console.error('Error:', err);
            setIsScanning(false);
            updateScanCache('bi_scanning', false);
        }
    };

    // Load results on mount / direction change + auto-detect running scan
    useEffect(() => {
        const fetchResults = async () => {
            try {
                const response = await fetch(`${API}/api/bi-results?direction=${direction}`);
                if (response.ok) {
                    const data = await response.json();
                    const items = data.data || [];
                    if (items.length > 0) {
                        setResults(items);
                        updateScanCache('bi_results', items);
                    }
                }
                // Auto-detect: Läuft gerade ein Scan? Dann Live-Polling starten
                const scanKey = direction === 'long' ? 'bi_long' : 'bi_short';
                const statusRes = await fetch(`${API}/api/scan-status`);
                if (statusRes.ok) {
                    const status = await statusRes.json();
                    if (status.scans?.[scanKey]?.running) {
                        setIsScanning(true);
                        startLivePolling();
                    }
                }
            } catch (err) { console.error('Error:', err); }
        };
        fetchResults();
        return () => { if (pollRef.current) clearInterval(pollRef.current); };
    }, [direction]);

    return (
        <div className="space-y-6">
            <div className="card border border-gray-200 p-6 rounded-lg">
                <label className="block text-sm font-semibold mb-3">Richtung</label>
                <div className="flex gap-4">
                    <button onClick={() => setDirection('long')} className={`button ${direction === 'long' ? '' : 'button-secondary'}`}>Long</button>
                    <button onClick={() => setDirection('short')} className={`button ${direction === 'short' ? '' : 'button-secondary'}`}>Short</button>
                </div>
            </div>

            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey={direction === 'long' ? 'bi_long' : 'bi_short'} />

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-center py-2 px-2 sortable-header" onClick={() => toggleSort('grade')}>Grade {sortKey === 'grade' && '↓'}</th>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('ticker')}>Ticker {sortKey === 'ticker' && '↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('price')}>Preis {sortKey === 'price' && '↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('change_pct')}>Chg% {sortKey === 'change_pct' && '↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('rvol')}>RVOL {sortKey === 'rvol' && '↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('volume')}>Volumen {sortKey === 'volume' && '↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('score')}>Score {sortKey === 'score' && '↓'}</th>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('grade_label')}>Signal {sortKey === 'grade_label' && '↓'}</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.map((item, idx) => (
                            <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker(item.ticker)}>
                                <td className="py-3 px-2 text-center"><span className={`grade-badge grade-${(item.grade || 'C').toLowerCase()}`}>{item.grade || 'C'}</span></td>
                                <td className="py-3 px-2 font-semibold">
                                    {item.ticker}
                                    {item.mdr_tag && <span style={{marginLeft:6,fontSize:10,padding:'2px 6px',borderRadius:4,background:(item.mdr_tag.includes('CRASH') || item.mdr_tag.includes('FADING')) ? '#dc2626' : (item.mdr_tag.includes('BLOWOUT') ? '#a855f7' : '#f97316'),color:'#fff',fontWeight:600}}>{item.mdr_tag}</span>}
                                </td>
                                <td className="py-3 px-2 text-right">${item.price?.toFixed(2)}</td>
                                <td className="py-3 px-2 text-right" style={{color: (item.change_pct || 0) >= 0 ? '#10b981' : '#ef4444'}}>{(item.change_pct || 0) >= 0 ? '+' : ''}{(item.change_pct || 0).toFixed(2)}%</td>
                                <td className="py-3 px-2 text-right" style={{color: (item.rvol || 0) >= 2 ? '#f59e0b' : '#9ca3af'}}>{(item.rvol || 0).toFixed(1)}x</td>
                                <td className="py-3 px-2 text-right">{item.volume ? (item.volume >= 1000000 ? (item.volume / 1000000).toFixed(1) + 'M' : (item.volume / 1000).toFixed(0) + 'K') : '–'}</td>
                                <td className="py-3 px-2 text-right font-semibold">{item.score?.toFixed(0)}</td>
                                <td className="py-3 px-2"><span className={`signal-badge signal-${direction === 'long' ? 'bullish' : 'bearish'}`}>{item.grade_label || direction.toUpperCase()}</span></td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

// Biotech Tab
function BiotechTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [isScanning, setIsScanning] = useState(scanCache.biotech_scanning || false);
    const [results, setResults] = useState(scanCache.biotech_results || []);
    const { sorted, toggleSort, sortKey } = useSortable(results, 'score');
    const pollTimeoutRef = useRef(null);

    // Cleanup polling on unmount
    useEffect(() => {
        return () => { if (pollTimeoutRef.current) clearTimeout(pollTimeoutRef.current); };
    }, []);

    const handleScan = async () => {
        setIsScanning(true);
        updateScanCache('biotech_scanning', true);
        // Save current cached_at BEFORE scan starts
        let prevCachedAt = null;
        try {
            const preCheck = await fetch(`${API}/api/biotech-results`);
            if (preCheck.ok) {
                const preData = await preCheck.json();
                prevCachedAt = preData.cached_at || null;
            }
        } catch(e) {}
        try {
            const response = await fetch(`${API}/api/biotech-scan`, { method: 'POST' });
            if (response.ok) {
                if (window.addToast) window.addToast('Scan gestartet...', 'info');
                // Poll for results with increasing intervals
                const pollResults = async (attempts = 0) => {
                    if (attempts > 12) { // Max 2 minutes (12 * 10s)
                        setIsScanning(false);
                        updateScanCache('biotech_scanning', false);
                        if (window.addToast) window.addToast('Scan dauert länger...', 'info');
                        return;
                    }
                    try {
                        const res = await fetch(`${API}/api/biotech-results`);
                        if (res.ok) {
                            const data = await res.json();
                            const items = data.data || [];
                            const isNewData = data.cached_at && data.cached_at !== prevCachedAt;
                            if (isNewData) {
                                setResults(items);
                                updateScanCache('biotech_results', items);
                                setIsScanning(false);
                                updateScanCache('biotech_scanning', false);
                                if (window.addToast) window.addToast(`Scan fertig: ${items.length} Ergebnisse`, 'success');
                                return;
                            }
                        }
                    } catch (e) { console.error(e); }
                    pollTimeoutRef.current = setTimeout(() => pollResults(attempts + 1), 10000); // Retry in 10s
                };
                pollTimeoutRef.current = setTimeout(() => pollResults(0), 5000); // First poll after 5s
            } else {
                setIsScanning(false);
                updateScanCache('biotech_scanning', false);
            }
        } catch (err) {
            console.error('Error:', err);
            setIsScanning(false);
            updateScanCache('biotech_scanning', false);
        }
    };

    // Always load latest results from server on mount
    useEffect(() => {
        const fetchResults = async () => {
            try {
                const response = await fetch(`${API}/api/biotech-results`);
                if (response.ok) {
                    const data = await response.json();
                    const items = data.data || [];
                    if (items.length > 0) {
                        setResults(items);
                        updateScanCache('biotech_results', items);
                    }
                }
            } catch (err) { console.error('Error:', err); }
        };
        fetchResults();
    }, []);

    return (
        <div className="space-y-6">
            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey="biotech" />

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('score')}>Score</th>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('ticker')}>Ticker</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('price')}>Preis</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('mcap_m')}>MCap</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('rvol')}>RVOL</th>
                            <th className="text-left py-2 px-2">Catalyst</th>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('event_result')}>Ergebnis</th>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('chart_health')}>Chart</th>
                            <th className="text-left py-2 px-2">Sentiment</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.map((item, idx) => {
                            const gradeColor = item.grade === 'S' ? '#7c3aed' : item.grade === 'A' ? '#059669' : item.grade === 'B' ? '#2563eb' : '#6b7280';
                            const resultColor = (item.event_result || '').includes('Positiv') ? '#059669' : (item.event_result || '').includes('Negativ') ? '#dc2626' : '#9ca3af';
                            return (
                            <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker(item.ticker)}>
                                <td className="py-3 px-2">
                                    <span style={{ color: gradeColor, fontWeight: 700 }}>{item.grade}</span>
                                    <span className="text-gray-400 text-xs ml-1">{item.score}</span>
                                </td>
                                <td className="py-3 px-2">
                                    <div className="font-semibold">{item.ticker}</div>
                                    <div className="text-xs text-gray-400 truncate" style={{maxWidth:'120px'}}>{item.name}</div>
                                </td>
                                <td className="py-3 px-2 text-right font-mono">${(item.price || item.preis)?.toFixed(2)}</td>
                                <td className="py-3 px-2 text-right text-xs">{item.mcap_m ? (item.mcap_m >= 1000 ? (item.mcap_m/1000).toFixed(1)+'B' : item.mcap_m.toFixed(0)+'M') : '–'}</td>
                                <td className={`py-3 px-2 text-right ${item.rvol >= 2 ? 'color-positive font-semibold' : item.rvol >= 1.3 ? 'color-positive' : ''}`}>{item.rvol?.toFixed(1)}x</td>
                                <td className="py-3 px-2 text-xs" style={{maxWidth:'180px'}}>
                                    <div>{item.catalyst}</div>
                                    {item.catalyst_date && <div className="text-gray-400">{item.catalyst_date}</div>}
                                </td>
                                <td className="py-3 px-2" style={{ color: resultColor, fontWeight: 600 }}>
                                    {(item.event_result || '').includes('Positiv') ? '✅ Positiv' : (item.event_result || '').includes('Negativ') ? '❌ Negativ' : (item.event_result || '').includes('Ausstehend') ? '⏳ Ausstehend' : '–'}
                                </td>
                                <td className="py-3 px-2">
                                    <span className={`text-xs px-2 py-0.5 rounded ${item.chart_health >= 7 ? 'bg-green-100 text-green-700' : item.chart_health >= 4 ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'}`}>
                                        {item.chart || '–'}
                                    </span>
                                </td>
                                <td className="py-3 px-2 text-xs">{item.sentiment || '–'}</td>
                            </tr>
                            );
                        })}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

    };

    useEffect(() => {
        if (scanCache.btc_divergenz_results && scanCache.btc_divergenz_results.length > 0) {
            // fallback from cache
            setResults(scanCache.btc_divergenz_results);
        }
        const fetchResults = async () => {
            try {
                const response = await fetch(`${API}/api/btc-divergenz-results`);
                if (response.ok) {
                    const data = await response.json();
                    const items = data.data || [];
                    if (items.length > 0) {
                        setResults(items);
                        updateScanCache('btc_divergenz_results', items);
                    }
                }
            } catch (err) { console.error('Error:', err); }
        };
        fetchResults();
    }, []);

    const getSignalClass = (signal) => {
        if (signal.includes('KAUFEN')) return 'signal-kaufen';
        if (signal.includes('MEIDEN')) return 'signal-meiden';
        if (signal.includes('WATCH LONG')) return 'signal-kaufen';
        if (signal.includes('WATCH RISIKO')) return 'signal-meiden';
        if (signal.includes('ABWARTEN')) return 'signal-abwarten';
        if (signal.includes('NEUTRAL')) return 'signal-abwarten';
        if (signal.includes('BEOBACHTEN')) return 'signal-beobachten';
        if (signal.includes('WATCH')) return 'signal-beobachten';
        if (signal.includes('BTC')) return 'signal-btc';
        return 'signal-neutral';
    };

    return (
        <div className="space-y-6">
            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey="btc_divergenz" />

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('symbol')}>Symbol</th>
                            <th className="text-left py-2 px-2">Name</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('price')}>Preis</th>
                            <th className="text-right py-2 px-2">1D%</th>
                            <th className="text-right py-2 px-2">5D%</th>
                            <th className="text-right py-2 px-2">Div 1D</th>
                            <th className="text-right py-2 px-2">Div 5D</th>
                            <th className="text-right py-2 px-2">Beta</th>
                            <th className="text-right py-2 px-2">Korrelation</th>
                            <th className="text-right py-2 px-2">Z-Score</th>
                            <th className="text-center py-2 px-2">Signal</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.map((item, idx) => (
                            <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker(item.symbol)}>
                                <td className="py-3 px-2 font-semibold">{item.symbol}</td>
                                <td className="py-3 px-2">{item.name}</td>
                                <td className="py-3 px-2 text-right">${item.price?.toFixed(2)}</td>
                                <td className={`py-3 px-2 text-right ${item.change_1d >= 0 ? 'color-positive' : 'color-negative'}`}>{item.change_1d?.toFixed(2)}%</td>
                                <td className={`py-3 px-2 text-right ${item.change_5d >= 0 ? 'color-positive' : 'color-negative'}`}>{item.change_5d?.toFixed(2)}%</td>
                                <td className="py-3 px-2 text-right">{item.div_1d?.toFixed(2)}</td>
                                <td className="py-3 px-2 text-right">{item.div_5d?.toFixed(2)}</td>
                                <td className="py-3 px-2 text-right">{item.beta?.toFixed(2)}</td>
                                <td className="py-3 px-2 text-right">{item.correlation?.toFixed(3)}</td>
                                <td className="py-3 px-2 text-right">{item.z_score?.toFixed(2)}</td>
                                <td className="py-3 px-2 text-center"><span className={`signal-badge ${getSignalClass(item.signal || '')}`}>{item.signal || '–'}</span></td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

// Early Movers Tab
function EarlyMoversTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [coins, setCoins] = useState(scanCache.em_coins || []);
    const [stats, setStats] = useState(scanCache.em_stats || null);
    const [isScanning, setIsScanning] = useState(false);
    const [phaseFilter, setPhaseFilter] = useState(0); // 0=alle, 1/2/3=Phase
    const { sorted, toggleSort, sortKey } = useSortable(coins, 'score');
    const pollTimeoutRef = useRef(null);

    const formatPrice = (price) => {
        if (price === null || price === undefined) return '–';
        return price >= 1 ? `$${price.toFixed(2)}` : `$${price.toFixed(4)}`;
    };

    const phaseIcon = (p) => p === 1 ? '\u{1F7E2}' : p === 2 ? '\u{1F7E1}' : '\u{1F534}';
    const riskBadge = (r) => r === 'HIGH' ? 'signal-bearish' : r === 'MEDIUM' ? 'signal-lightdiv' : 'signal-bullish';

    useEffect(() => {
        return () => { if (pollTimeoutRef.current) clearTimeout(pollTimeoutRef.current); };
    }, []);

    // Load latest data on mount
    useEffect(() => {
        const fetchResults = async () => {
            try {
                const response = await fetch(`${API}/api/early-movers-results`);
                if (response.ok) {
                    const data = await response.json();
                    const em = (data.data && data.data[0]) || {};
                    const items = em.coins || [];
                    if (items.length > 0) {
                        setCoins(items);
                        setStats(em.stats || null);
                        updateScanCache('em_coins', items);
                        updateScanCache('em_stats', em.stats);
                    }
                }
            } catch (err) { console.error('Error fetching early movers:', err); }
        };
        fetchResults();
    }, []);

    const handleScan = async () => {
        setIsScanning(true);
        let prevCachedAt = null;
        try {
            const preCheck = await fetch(`${API}/api/early-movers-results`);
            if (preCheck.ok) { prevCachedAt = (await preCheck.json()).cached_at || null; }
        } catch(e) {}
        try {
            const response = await fetch(`${API}/api/early-movers-scan`, { method: 'POST' });
            if (response.ok) {
                if (window.addToast) window.addToast('Early Mover Scan gestartet...', 'info');
                const pollResults = async (attempts = 0) => {
                    if (attempts > 12) { setIsScanning(false); return; }
                    try {
                        const res = await fetch(`${API}/api/early-movers-results`);
                        if (res.ok) {
                            const data = await res.json();
                            const em = (data.data && data.data[0]) || {};
                            if (data.cached_at && data.cached_at !== prevCachedAt) {
                                const items = em.coins || [];
                                setCoins(items); setStats(em.stats || null);
                                updateScanCache('em_coins', items);
                                updateScanCache('em_stats', em.stats);
                                setIsScanning(false);
                                if (window.addToast) window.addToast(`Scan fertig: ${items.length} Coins`, 'success');
                                return;
                            }
                        }
                    } catch (e) { console.error(e); }
                    pollTimeoutRef.current = setTimeout(() => pollResults(attempts + 1), 10000);
                };
                pollTimeoutRef.current = setTimeout(() => pollResults(0), 5000);
            } else { setIsScanning(false); }
        } catch (err) {
            if (window.addToast) window.addToast('Scan-Fehler', 'error');
            setIsScanning(false);
        }
    };

    const filtered = phaseFilter > 0 ? sorted.filter(r => r.phase === phaseFilter) : sorted;

    return (
        <div className="space-y-6">
            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey="early_movers" />

            {/* Phase-Filter Buttons */}
            <div className="flex gap-2 flex-wrap items-center">
                <span className="text-sm text-gray-500 mr-2">Phase:</span>
                {[{v:0,l:'Alle'},{v:1,l:'\u{1F7E2} Accumulation'},{v:2,l:'\u{1F7E1} Breakout'},{v:3,l:'\u{1F534} Überhitzt'}].map(f => (
                    <button key={f.v} onClick={() => setPhaseFilter(f.v)}
                        className={`px-3 py-1 rounded-full text-xs font-semibold border transition ${phaseFilter === f.v ? 'bg-gray-800 text-white border-gray-800' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-100'}`}>
                        {f.l}
                        {f.v > 0 && stats ? ` (${f.v === 1 ? stats.phase_1_count : f.v === 2 ? stats.phase_2_count : stats.phase_3_count || 0})` : ''}
                    </button>
                ))}
                {stats && <span className="text-xs text-gray-400 ml-auto">{stats.unified_count || 0} Coins angezeigt{stats.total_found > stats.unified_count ? ` (${stats.total_found} gefunden)` : ''}</span>}
            </div>
            {stats?.data_warning && (
                <div className="text-xs rounded-lg border border-amber-200 bg-amber-50 text-amber-800 px-3 py-2">
                    Datenhinweis: {stats.data_warning}
                </div>
            )}

            {/* Unified Phase Table */}
            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-center py-2 px-2 sortable-header cursor-pointer" onClick={() => toggleSort('phase')}>Phase{sortKey === 'phase' && ' \u2193'}</th>
                            <th className="text-left py-2 px-2 sortable-header cursor-pointer" onClick={() => toggleSort('Symbol')}>Symbol{sortKey === 'Symbol' && ' \u2193'}</th>
                            <th className="text-right py-2 px-2 sortable-header cursor-pointer" onClick={() => toggleSort('Price')}>Preis{sortKey === 'Price' && ' \u2193'}</th>
                            <th className="text-right py-2 px-2 sortable-header cursor-pointer" onClick={() => toggleSort('Change24h')}>24h%{sortKey === 'Change24h' && ' \u2193'}</th>
                            <th className="text-right py-2 px-2 sortable-header cursor-pointer" onClick={() => toggleSort('Change7d')}>7d%{sortKey === 'Change7d' && ' \u2193'}</th>
                            <th className="text-right py-2 px-2 sortable-header cursor-pointer" onClick={() => toggleSort('VolMCapRatio')}>Vol/MCap{sortKey === 'VolMCapRatio' && ' \u2193'}</th>
                            <th className="text-right py-2 px-2 sortable-header cursor-pointer" onClick={() => toggleSort('score')}>Score{sortKey === 'score' && ' \u2193'}</th>
                            <th className="text-center py-2 px-2 sortable-header cursor-pointer" onClick={() => toggleSort('risk_level')}>Risk{sortKey === 'risk_level' && ' \u2193'}</th>
                            <th className="text-center py-2 px-2 sortable-header cursor-pointer" onClick={() => toggleSort('grade')}>Grade{sortKey === 'grade' && ' \u2193'}</th>
                            <th className="text-left py-2 px-2">Long-Plan</th>
                            <th className="text-right py-2 px-2 sortable-header cursor-pointer" onClick={() => toggleSort('entry')}>Entry{sortKey === 'entry' && ' \u2193'}</th>
                            <th className="text-right py-2 px-2">TP1 / TP2</th>
                            <th className="text-center py-2 px-2">BTC</th>
                            <th className="text-left py-2 px-2">Signal</th>
                            <th className="text-left py-2 px-2">Perp</th>
                        </tr>
                    </thead>
                    <tbody>
                        {filtered.map((item, idx) => (
                            <tr key={idx} className="table-row border-b border-gray-200 cursor-pointer hover:bg-gray-50" onClick={() => onSelectTicker({ticker: item.Symbol, isCrypto: true, ...item})}>
                                <td className="py-3 px-2 text-center" title={item.phase_label}>
                                    <span className="text-lg">{phaseIcon(item.phase)}</span>
                                    <span className="text-xs ml-1 text-gray-500">{item.phase}</span>
                                </td>
                                <td className="py-3 px-2">
                                    <span className="font-semibold">{item.Symbol}</span>
                                    {item.source && <span className="text-xs text-gray-400 ml-1">({item.source})</span>}
                                </td>
                                <td className="py-3 px-2 text-right">{formatPrice(item.Price)}</td>
                                <td className={`py-3 px-2 text-right font-semibold ${(item.Change24h||0) >= 0 ? 'color-positive' : 'color-negative'}`}>{item.Change24h ? `${item.Change24h > 0 ? '+' : ''}${item.Change24h.toFixed(1)}%` : '\u2014'}</td>
                                <td className={`py-3 px-2 text-right ${(item.Change7d||0) >= 0 ? 'color-positive' : 'color-negative'}`}>{item.Change7d ? `${item.Change7d > 0 ? '+' : ''}${item.Change7d.toFixed(1)}%` : '\u2014'}</td>
                                <td className={`py-3 px-2 text-right ${(item.VolMCapRatio||0) > 100 ? 'color-negative font-bold' : (item.VolMCapRatio||0) > 60 ? 'text-yellow-600' : ''}`}>{item.VolMCapRatio ? `${item.VolMCapRatio.toFixed(0)}%` : '\u2014'}</td>
                                <td className="py-3 px-2 text-right">
                                    <span className={`signal-badge ${item.score >= 70 ? 'signal-bullish' : item.score >= 40 ? 'signal-lightdiv' : 'signal-neutral'}`}>{item.score}</span>
                                </td>
                                <td className="py-3 px-2 text-center"><span className={`signal-badge ${riskBadge(item.risk_level)}`}>{item.risk_level}</span></td>
                                <td className="py-3 px-2 text-center"><span className={`signal-badge ${item.grade === 'S' ? 'signal-bullish' : item.grade === 'A' ? 'signal-bullish' : item.grade === 'B' ? 'signal-lightdiv' : item.grade === 'C' ? 'signal-bearish' : 'signal-neutral'}`}>{item.grade}</span></td>
                                <td className="py-3 px-2 text-xs">
                                    <span className={`px-2 py-1 rounded font-semibold ${(item.trade_action || '').includes('LONG') ? 'bg-green-100 text-green-800' : (item.trade_action || '').includes('RETEST') ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800'}`}>
                                        {item.trade_setup?.action_label || item.trade_action || 'Watch'}
                                    </span>
                                </td>
                                <td className="py-3 px-2 text-right font-semibold">{item.entry ? formatPrice(item.entry) : '\u2014'}</td>
                                <td className="py-3 px-2 text-right text-xs">
                                    {item.tp1 ? <><span className="color-positive">{formatPrice(item.tp1)}</span> / <span className="color-positive">{formatPrice(item.tp2)}</span></> : '\u2014'}
                                </td>
                                <td className="py-3 px-2 text-center text-xs" title={item.btc_context ? `BTC 24h ${item.btc_context.btc_24h}% | Alpha ${item.btc_context.alpha_24h}%` : ''}>
                                    {item.btc_context ? <span className={item.btc_context.tailwind ? 'color-positive' : 'text-yellow-600'}>{item.btc_context.tailwind ? 'Tailwind' : 'Check'}</span> : '\u2014'}
                                </td>
                                <td className="py-3 px-2 text-sm text-gray-600 truncate max-w-xs" title={item.signal_text}>{item.signal_text || '\u2014'}</td>

                            </tr>
                        ))}

                </table>
                {filtered.length === 0 && <div className="text-center text-gray-400 py-8">Keine Ergebnisse{phaseFilter > 0 ? ` für Phase ${phaseFilter}` : ''} — starte einen Scan</div>}
            </div>

        </div>
    );
}

// Short Scanner Tab
function ShortScannerTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [breakdownStocks, setBreakdownStocks] = useState(scanCache.short_breakdown || []);
    const [isScanning, setIsScanning] = useState(scanCache.short_scanning || false);
    const { sorted: sortedBreakdown, toggleSort: toggleBreakdownSort } = useSortable(breakdownStocks, 'change_pct');
    const pollTimeoutRef = useRef(null);

    // Cleanup polling on unmount
    useEffect(() => {
        return () => { if (pollTimeoutRef.current) clearTimeout(pollTimeoutRef.current); };
    }, []);

    // Always load latest from server on mount
    useEffect(() => {
        const fetchResults = async () => {
            try {
                const response = await fetch(`${API}/api/bear-results`);
                if (response.ok) {
                    const data = await response.json();
                    const bear = (data.data && data.data[0]) || {};
                    setBreakdownStocks(bear.breakdown_stocks || []);
                    updateScanCache('short_breakdown', bear.breakdown_stocks || []);
                }
            } catch (err) { console.error('Error:', err); }
        };
        fetchResults();
    }, []);

    const handleScan = async () => {
        setIsScanning(true);
        updateScanCache('short_scanning', true);
        // Save current cached_at BEFORE scan starts
        let prevCachedAt = null;
        try {
            const preCheck = await fetch(`${API}/api/bear-results`);
            if (preCheck.ok) {
                const preData = await preCheck.json();
                prevCachedAt = preData.cached_at || null;
            }
        } catch(e) {}
        try {
            const response = await fetch(`${API}/api/bear-scan`, { method: 'POST' });
            if (response.ok) {
                if (window.addToast) window.addToast('Scan gestartet...', 'info');
                // Poll for results with increasing intervals
                const pollResults = async (attempts = 0) => {
                    if (attempts > 12) { // Max 2 minutes (12 * 10s)
                        setIsScanning(false);
                        updateScanCache('short_scanning', false);
                        if (window.addToast) window.addToast('Scan dauert länger...', 'info');
                        return;
                    }
                    try {
                        const res = await fetch(`${API}/api/bear-results`);
                        if (res.ok) {
                            const data = await res.json();
                            const bear = (data.data && data.data[0]) || {};
                            const breakdown = bear.breakdown_stocks || [];
                            const isNewData = data.cached_at && data.cached_at !== prevCachedAt;
                            if (isNewData) {
                                setBreakdownStocks(breakdown);
                                updateScanCache('short_breakdown', breakdown);
                                setIsScanning(false);
                                updateScanCache('short_scanning', false);
                                if (window.addToast) window.addToast(`Scan fertig: ${breakdown.length} Short-Kandidaten`, 'success');
                                return;
                            }
                        }
                    } catch (e) { console.error(e); }
                    pollTimeoutRef.current = setTimeout(() => pollResults(attempts + 1), 10000); // Retry in 10s
                };
                pollTimeoutRef.current = setTimeout(() => pollResults(0), 5000); // First poll after 5s
            } else {
                setIsScanning(false);
                updateScanCache('short_scanning', false);
            }
        } catch (err) {
            if (window.addToast) window.addToast('Scan-Fehler', 'error');
            setIsScanning(false);
            updateScanCache('short_scanning', false);
        }
    };

    return (
        <div className="space-y-6">
            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey="bear" />

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                {(
                    <table className="w-full text-sm">
                        <thead className="border-b border-gray-200">
                            <tr>
                                <th className="text-left py-2 px-1 sortable-header" onClick={() => toggleBreakdownSort('grade')}>Grade</th>
                                <th className="text-left py-2 px-1 sortable-header" onClick={() => toggleBreakdownSort('ticker')}>Ticker</th>
                                <th className="text-right py-2 px-1 sortable-header" onClick={() => toggleBreakdownSort('price')}>Preis</th>
                                <th className="text-right py-2 px-1 sortable-header" onClick={() => toggleBreakdownSort('change_pct')}>Chg%</th>
                                <th className="text-right py-2 px-1 sortable-header" onClick={() => toggleBreakdownSort('rvol')}>RVOL</th>
                                <th className="text-right py-2 px-1">$Vol</th>
                                <th className="text-right py-2 px-1 sortable-header" onClick={() => toggleBreakdownSort('ma20_dist')}>MA20</th>
                                <th className="text-right py-2 px-1 sortable-header" onClick={() => toggleBreakdownSort('score')}>Score</th>
                            </tr>
                        </thead>
                        <tbody>
                            {sortedBreakdown.map((item, idx) => {
                                const gradeColors = { S: 'bg-purple-100 text-purple-800', A: 'bg-green-100 text-green-800', B: 'bg-blue-100 text-blue-800', C: 'bg-yellow-100 text-yellow-800', D: 'bg-gray-100 text-gray-500' };
                                const gc = gradeColors[item.grade] || gradeColors.D;
                                const dv = item.dollar_volume || ((item.volume || 0) * (item.price || 0));
                                const dvStr = dv >= 1e6 ? (dv / 1e6).toFixed(1) + 'M' : dv >= 1e3 ? (dv / 1e3).toFixed(0) + 'K' : dv > 0 ? dv.toFixed(0) : '–';
                                return (
                                <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker(item.ticker)} title={item.score_details || ''}>
                                    <td className="py-3 px-1"><span className={`px-2 py-0.5 rounded text-xs font-bold ${gc}`}>{item.grade || '–'}</span></td>
                                    <td className="py-3 px-1 font-semibold">{item.ticker}</td>
                                    <td className="py-3 px-1 text-right">${item.price?.toFixed(2)}</td>
                                    <td className="py-3 px-1 text-right color-negative font-medium">{item.change_pct?.toFixed(1)}%</td>
                                    <td className={`py-3 px-1 text-right ${item.rvol >= 2.0 ? 'font-bold color-positive' : ''}`}>{item.rvol?.toFixed(1)}x</td>
                                    <td className="py-3 px-1 text-right text-gray-600">{dvStr}</td>
                                    <td className="py-3 px-1 text-right color-negative">{item.ma20_dist?.toFixed(1)}%</td>
                                    <td className="py-3 px-1 text-right font-medium">{item.score || 0}</td>
                                </tr>
                                );
                            })}
                        </tbody>
                    </table>
                )}
            </div>
        </div>
    );
}

                        const res = await fetch(`${API}/api/money-flow-results`);
                        if (res.ok) {
                            const data = await res.json();
                            const items = data.data || [];
                            const isNewData = data.cached_at && data.cached_at !== prevCachedAt;
                            if (isNewData) {
                                setResults(items);
                                updateScanCache('moneyflow_results', items);
                                setIsScanning(false);
                                updateScanCache('moneyflow_scanning', false);
                                if (window.addToast) window.addToast(`Scan fertig: ${items.length} Ergebnisse`, 'success');
                                return;
                            }
                        }
                    } catch (e) { console.error(e); }
                    pollTimeoutRef.current = setTimeout(() => pollResults(attempts + 1), 10000); // Retry in 10s
                };
                pollTimeoutRef.current = setTimeout(() => pollResults(0), 5000); // First poll after 5s
            } else {
                setIsScanning(false);
                updateScanCache('moneyflow_scanning', false);
            }
        } catch (err) {
            if (window.addToast) window.addToast('Scan-Fehler', 'error');
            setIsScanning(false);
            updateScanCache('moneyflow_scanning', false);
        }
    };

    const getFlowSignalClass = (signal) => {
        if (signal.includes('ZUFLUSS')) return 'signal-bullish';
        if (signal.includes('ABFLUSS')) return 'signal-bearish';
        return 'signal-neutral';
    };

    return (
        <div className="space-y-6">
            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey="money_flow" />

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('sector')}>Sektor</th>
                            <th className="text-left py-2 px-2">ETF</th>
                            <th className="text-right py-2 px-2">Preis</th>
                            <th className="text-right py-2 px-2">1D%</th>
                            <th className="text-right py-2 px-2">5D%</th>
                            <th className="text-right py-2 px-2">20D%</th>
                            <th className="text-right py-2 px-2">RVOL</th>
                            <th className="text-right py-2 px-2">CMF</th>
                            <th className="text-left py-2 px-2">OBV</th>
                            <th className="text-left py-2 px-2">Flow Signal</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.map((item, idx) => (
                            <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker(item.etf)}>
                                <td className="py-3 px-2 font-semibold">{item.sector}</td>
                                <td className="py-3 px-2">{item.etf}</td>
                                <td className="py-3 px-2 text-right">${item.price?.toFixed(2)}</td>
                                <td className={`py-3 px-2 text-right ${item.change_1d >= 0 ? 'color-positive' : 'color-negative'}`}>{item.change_1d?.toFixed(2)}%</td>
                                <td className={`py-3 px-2 text-right ${item.change_5d >= 0 ? 'color-positive' : 'color-negative'}`}>{item.change_5d?.toFixed(2)}%</td>
                                <td className={`py-3 px-2 text-right ${item.change_20d >= 0 ? 'color-positive' : 'color-negative'}`}>{item.change_20d?.toFixed(2)}%</td>
                                <td className="py-3 px-2 text-right">{item.rvol?.toFixed(2)}</td>
                                <td className={`py-3 px-2 text-right ${(item.cmf ?? 0) >= 0 ? 'color-positive' : 'color-negative'}`}>{item.cmf != null ? item.cmf.toFixed(3) : '–'}</td>
                                <td className="py-3 px-2"><span className={`signal-badge ${item.obv_signal === 'ACCUMULATION' ? 'signal-bullish' : item.obv_signal === 'DISTRIBUTION' ? 'signal-bearish' : 'signal-neutral'}`}>{item.obv_signal === 'ACCUMULATION' ? 'Akkum.' : item.obv_signal === 'DISTRIBUTION' ? 'Distrib.' : 'Neutral'}</span></td>
                                <td className="py-3 px-2"><span className={`signal-badge ${getFlowSignalClass(item.flow_signal || '')}`}>{item.flow_signal || '–'}</span></td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

// Kalender Tab
function KalenderTab() {
    const [events, setEvents] = useState([]);
    const [exchanges, setExchanges] = useState([]);
    const [calendarMeta, setCalendarMeta] = useState(null);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
        const fetchCalendar = async () => {
            try {
                const response = await fetch(`${API}/api/kalender`);
                if (response.ok) {
                    const data = await response.json();
                    setEvents(data.events || []);
                    setExchanges(data.exchanges || []);
                    setCalendarMeta({ source: data.source, note: data.note, timestamp: data.timestamp, official_count: data.official_count, estimated_count: data.estimated_count, official_sources: data.official_sources || [] });
                }
            } catch (err) {
                console.error('Error:', err);
            } finally {
                setLoading(false);
            }
        };
        fetchCalendar();
    }, []);

    const getImportanceClass = (imp) => {
        const i = (imp || '').toLowerCase();
        if (i === 'high' || i.includes('hoch')) return 'importance-high';
        if (i === 'medium' || i.includes('mittel')) return 'importance-medium';
        return 'importance-low';
    };
    const getImportanceLabel = (imp) => {
        const i = (imp || '').toLowerCase();
        if (i === 'high') return 'Hoch';
        if (i === 'medium') return 'Mittel';
        if (i === 'low') return 'Niedrig';
        return imp || '–';
    };
    const getExchangeStatusStyle = (status) => {
        if (status === 'open') return { bg: '#dcfce7', color: '#047857', border: '#86efac' };
        if (status === 'break') return { bg: '#fef3c7', color: '#92400e', border: '#fcd34d' };
        if (status === 'holiday') return { bg: '#fee2e2', color: '#b91c1c', border: '#fca5a5' };
        return { bg: '#f1f5f9', color: '#475569', border: '#cbd5e1' };
    };
    const formatEventDate = (dateStr) => {
        if (!dateStr) return '–';
        const [y, m, d] = dateStr.split('-').map(Number);
        return new Date(y, (m || 1) - 1, d || 1).toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'short', year:'numeric'});
    };
    const todayIso = new Date().toISOString().slice(0, 10);

    return (
        <div className="space-y-6">
            <div className="card border border-gray-200 p-6 rounded-lg">
                <div className="flex items-start justify-between gap-4 mb-4 flex-wrap">
                    <div>
                        <h3 className="text-lg font-bold text-gray-900">Boersenzeiten & Feiertage</h3>
                        <p className="text-sm text-gray-500">Top-5 Maerkte mit lokaler Zeit, Zuerich-Zeit und Feiertagsstatus.</p>
                    </div>
                    <span className="text-xs px-3 py-1 rounded-full bg-blue-50 text-blue-700 border border-blue-100">Live-Zeitcheck</span>
                </div>
                {loading ? (
                    <div className="flex justify-center py-5"><div className="loading-spinner"></div></div>
                ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-3">
                        {exchanges.map((exchange) => {
                            const style = getExchangeStatusStyle(exchange.status);
                            return (
                                <div key={exchange.code} className="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
                                    <div className="flex items-start justify-between gap-2 mb-3">
                                        <div>
                                            <div className="text-sm font-bold text-gray-900">{exchange.name}</div>
                                            <div className="text-xs text-gray-500">{exchange.country} · {exchange.currency}</div>
                                        </div>
                                        <span style={{background: style.bg, color: style.color, borderColor: style.border}} className="text-xs font-bold px-2 py-1 rounded-full border">
                                            {exchange.status_label}
                                        </span>
                                    </div>
                                    <div className="space-y-2 text-xs text-gray-600">
                                        <div>
                                            <div className="font-semibold text-gray-800">Handelszeit lokal</div>
                                            <div>{exchange.regular_hours_local}</div>
                                        </div>
                                        <div>
                                            <div className="font-semibold text-gray-800">In Zuerich</div>
                                            <div>{exchange.regular_hours_zurich}</div>
                                        </div>
                                        {exchange.special_hours && (
                                            <div className="rounded-lg bg-amber-50 border border-amber-100 px-2 py-1 text-amber-800 font-semibold">
                                                {exchange.special_hours}
                                            </div>
                                        )}
                                        {exchange.is_open ? (
                                            <div className="rounded-lg bg-green-50 border border-green-100 px-2 py-1 text-green-800">
                                                Offen bis {exchange.next_close_zurich || exchange.next_close_local}
                                            </div>
                                        ) : (
                                            <div className="rounded-lg bg-gray-50 border border-gray-100 px-2 py-1 text-gray-700">
                                                {exchange.closed_reason || 'Geschlossen'}{exchange.next_open_zurich ? ` · Naechste Oeffnung: ${exchange.next_open_zurich}` : ''}
                                            </div>
                                        )}
                                        {exchange.next_holiday && (
                                            <div>
                                                <span className="font-semibold text-gray-800">Naechster Feiertag:</span> {formatEventDate(exchange.next_holiday.date)} · {exchange.next_holiday.name}
                                            </div>
                                        )}
                                        <div className="pt-1">
                                            <a href={exchange.holiday_source_url || exchange.source_url} target="_blank" rel="noreferrer" className="text-blue-600 hover:underline">
                                                Quelle: {exchange.source}
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                )}
            </div>
            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                {calendarMeta?.note && (
                    <div className="mb-4 rounded-lg border border-green-200 bg-green-50 px-3 py-2 text-xs text-green-800">
                        Kalender-Qualitaet: {calendarMeta.official_count || 0} offizielle Termine ({(calendarMeta.official_sources || []).join(', ') || 'n/a'}), {calendarMeta.estimated_count || 0} markierte Schaetzungen.
                    </div>
                )}
                {calendarMeta?.note && (
                    <div className="mb-4 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-xs text-amber-800">
                        Wichtig: FED/FOMC, CPI, NFP, PPI, GDP/PCE, Retail Sales und ISM PMI kommen aus offiziellen 2026-Quellen. Nur Earnings und Jobless Claims bleiben als geschaetzt markiert.
                    </div>
                )}
                {loading ? (
                    <div className="flex justify-center py-8"><div className="loading-spinner"></div></div>
                ) : (
                    <table className="w-full text-sm">
                        <thead className="border-b border-gray-200">
                            <tr>
                                <th className="text-left py-2 px-2">Datum</th>
                                <th className="text-left py-2 px-2">Uhrzeit</th>
                                <th className="text-left py-2 px-2">Event</th>
                                <th className="text-center py-2 px-2">Wichtigkeit</th>
                                <th className="text-center py-2 px-2">Impact</th>
                                <th className="text-left py-2 px-2">Quelle</th>
                                <th className="text-left py-2 px-2">Beschreibung</th>
                            </tr>
                        </thead>
                        <tbody>
                            {events.length === 0 && (
                                <tr><td colSpan="7" className="py-6 text-center text-gray-400">Keine Events gefunden</td></tr>
                            )}
                            {events.map((event, idx) => (
                                <tr key={idx} className={`table-row border-b border-gray-200 ${event.date === todayIso ? 'bg-amber-50' : ''}`}>
                                    <td className="py-3 px-2 font-semibold whitespace-nowrap">
                                        {formatEventDate(event.date)}
                                        {event.date === todayIso && <span className="ml-2 text-xs px-2 py-0.5 rounded bg-amber-200 text-amber-900">Heute</span>}
                                    </td>
                                    <td className="py-3 px-2 whitespace-nowrap">
                                        <div className="font-semibold">{event.time_local || '–'}</div>
                                        {event.time_et && <div className="text-xs text-gray-400">{event.time_et}</div>}
                                    </td>
                                    <td className="py-3 px-2 font-medium">{event.event}</td>
                                    <td className="py-3 px-2 text-center"><span className={`signal-badge ${getImportanceClass(event.importance)}`}>{getImportanceLabel(event.importance)}</span></td>
                                    <td className="py-3 px-2 text-center text-xs">{event.impact || '–'}</td>
                                    <td className="py-3 px-2 text-xs">
                                        {event.source_url ? (
                                            <a href={event.source_url} target="_blank" rel="noreferrer" className="text-blue-600 hover:underline">{event.estimated ? 'Geschätzt' : event.source}</a>
                                        ) : (
                                            <span className={event.estimated ? 'text-amber-700 font-semibold' : 'text-gray-600'}>{event.estimated ? 'Geschätzt' : (event.source || '–')}</span>
                                        )}
                                    </td>
                                    <td className="py-3 px-2 text-gray-600">{event.description}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                )}
            </div>
        </div>
    );
}

// Crash Monitor Tab
function CrashMonitorTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [fearData, setFearData] = useState(scanCache.crash_fear_data || null);
    const [indices, setIndices] = useState(scanCache.crash_indices || []);
    const [breadth, setBreadth] = useState(scanCache.crash_breadth || null);
    const [isScanning, setIsScanning] = useState(scanCache.crash_scanning || false);
    const [crashError, setCrashError] = useState(null);
    const { sorted, toggleSort } = useSortable(indices, 'name');
    const pollTimeoutRef = useRef(null);

    // Cleanup polling on unmount
    useEffect(() => {
        return () => { if (pollTimeoutRef.current) clearTimeout(pollTimeoutRef.current); };
    }, []);

    // Always load latest from server on mount
    useEffect(() => {
        const fetchData = async () => {
            try {
                const response = await fetch(`${API}/api/crash-monitor-results`);
                if (response.ok) {
                    const data = await response.json();
                    const cm = (data.data && data.data[0]) || {};
                    if (data.status === 'error' || cm.status === 'error') {
                        setCrashError((data.warnings || [cm.message || cm.error || 'Crash Monitor Fehler']).join(' · '));
                        return;
                    }
                    setCrashError(null);
                    if (cm.fear_score !== undefined) {
                        const fd = { score: cm.fear_score || 0, vix: cm.vix?.price || 0, level: cm.fear_level || '' };
                        setFearData(fd);
                        setIndices(cm.indices || []);
                        setBreadth(cm.breadth || null);
                        updateScanCache('crash_fear_data', fd);
                        updateScanCache('crash_indices', cm.indices || []);
                        updateScanCache('crash_breadth', cm.breadth || null);
                    }
                }
            } catch (err) { console.error('Error:', err); }
        };
        fetchData();
    }, []);

    const handleScan = async () => {
        setIsScanning(true);
        updateScanCache('crash_scanning', true);
        // Save current cached_at BEFORE scan starts
        let prevCachedAt = null;
        try {
            const preCheck = await fetch(`${API}/api/crash-monitor-results`);
            if (preCheck.ok) {
                const preData = await preCheck.json();
                prevCachedAt = preData.cached_at || null;
            }
        } catch(e) {}
        try {
            const response = await fetch(`${API}/api/crash-monitor-scan`, { method: 'POST' });
            if (response.ok) {
                if (window.addToast) window.addToast('Scan gestartet...', 'info');
                // Poll for results with increasing intervals
                const pollResults = async (attempts = 0) => {
                    if (attempts > 12) { // Max 2 minutes (12 * 10s)
                        setIsScanning(false);
                        updateScanCache('crash_scanning', false);
                        if (window.addToast) window.addToast('Scan dauert länger...', 'info');
                        return;
                    }
                    try {
                        const res = await fetch(`${API}/api/crash-monitor-results`);
                        if (res.ok) {
                            const data = await res.json();
                            const cm = (data.data && data.data[0]) || {};
                            const isNewData = data.cached_at && data.cached_at !== prevCachedAt;
                            if (isNewData) {
                                if (data.status === 'error' || cm.status === 'error') {
                                    setCrashError((data.warnings || [cm.message || cm.error || 'Crash Monitor Fehler']).join(' · '));
                                    setIsScanning(false);
                                    updateScanCache('crash_scanning', false);
                                    if (window.addToast) window.addToast('Crash Monitor Fehler', 'error');
                                    return;
                                }
                                setCrashError(null);
                                const fearData = { score: cm.fear_score || 0, vix: cm.vix?.price || 0, level: cm.fear_level || '' };
                                setFearData(fearData);
                                setIndices(cm.indices || []);
                                setBreadth(cm.breadth || null);
                                updateScanCache('crash_fear_data', fearData);
                                updateScanCache('crash_indices', cm.indices || []);
                                updateScanCache('crash_breadth', cm.breadth || null);
                                setIsScanning(false);
                                updateScanCache('crash_scanning', false);
                                if (window.addToast) window.addToast(`Scan fertig: Daten aktualisiert`, 'success');
                                return;
                            }
                        }
                    } catch (e) { console.error(e); }
                    pollTimeoutRef.current = setTimeout(() => pollResults(attempts + 1), 10000); // Retry in 10s
                };
                pollTimeoutRef.current = setTimeout(() => pollResults(0), 5000); // First poll after 5s
            } else {
                setIsScanning(false);
                updateScanCache('crash_scanning', false);
            }
        } catch (err) {
            if (window.addToast) window.addToast('Scan-Fehler', 'error');
            setIsScanning(false);
            updateScanCache('crash_scanning', false);
        }
    };

    const fearLevel = fearData?.score ?? 50;
    // V2.5: CNN-kompatible Skala — 0 = Extreme Fear, 100 = Extreme Greed
    const fearText = fearData?.level || (fearLevel <= 20 ? 'EXTREME ANGST' : fearLevel <= 40 ? 'ANGST' : fearLevel <= 60 ? 'NEUTRAL' : fearLevel <= 80 ? 'GIER' : 'EXTREME GIER');
    const fearColor = fearLevel <= 20 ? '#dc2626' : fearLevel <= 40 ? '#d97706' : fearLevel <= 60 ? '#6b7280' : fearLevel <= 80 ? '#2563eb' : '#059669';

    return (
        <div className="space-y-6">
            {crashError && (
                <div className="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">
                    Crash Monitor Fehler: {crashError}
                </div>
            )}
            {/* Fear Score */}
            {fearData && (
                <div className="card border border-gray-200 p-6 rounded-lg">
                    <div className="text-center">
                        <div className="fear-score-display" style={{ color: fearColor }}>
                            {fearLevel.toFixed(0)}
                        </div>
                        <p className="text-lg font-semibold mt-2">{fearText}</p>
                        <p className="text-sm text-gray-600">Fear & Greed Index</p>
                    </div>
                </div>
            )}

            {/* VIX Card */}
            {fearData?.vix && (
                <div className="metric-card" style={{ borderColor: fearColor }}>
                    <div className="flex justify-between items-center">
                        <div>
                            <div className="text-sm font-semibold text-gray-600">VIX</div>
                            <div className="text-2xl font-bold mt-2">{fearData.vix.toFixed(2)}</div>
                        </div>
                        <span className="signal-badge" style={{ backgroundColor: fearColor + '20', color: fearColor }}>
                            {fearData.vix < 15 ? 'Niedrig' : fearData.vix < 25 ? 'Mittel' : 'Hoch'}
                        </span>
                    </div>
                </div>
            )}

            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey="crash_monitor" />

            {/* Indices */}
            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <h3 className="font-semibold mb-4">Indizes</h3>
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('name')}>Name</th>
                            <th className="text-right py-2 px-2">Preis</th>
                            <th className="text-right py-2 px-2">1D%</th>
                            <th className="text-right py-2 px-2">5D%</th>
                            <th className="text-right py-2 px-2">20D%</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.map((item, idx) => (
                            <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker(item.symbol)}>
                                <td className="py-3 px-2 font-semibold">{item.name}</td>
                                <td className="py-3 px-2 text-right">${item.price?.toFixed(2)}</td>
                                <td className={`py-3 px-2 text-right ${item.change_1d >= 0 ? 'color-positive' : 'color-negative'}`}>{item.change_1d?.toFixed(2)}%</td>
                                <td className={`py-3 px-2 text-right ${item.change_5d >= 0 ? 'color-positive' : 'color-negative'}`}>{item.change_5d?.toFixed(2)}%</td>
                                <td className={`py-3 px-2 text-right ${item.change_20d >= 0 ? 'color-positive' : 'color-negative'}`}>{item.change_20d?.toFixed(2)}%</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>

            {/* Market Breadth */}
            {breadth && (
                <div className="card border border-gray-200 p-6 rounded-lg">
                    <h3 className="font-semibold mb-4">Marktbreite</h3>
                    <div className="space-y-4">
                        <div>
                            <div className="flex justify-between mb-2 text-sm">
                                <span>Steigend</span>
                                <span className="font-semibold color-positive">{breadth.advancing}</span>
                            </div>
                            <div className="momentum-bar">
                                <div className="momentum-bar-fill" style={{ width: `${breadth.advancing_pct || 50}%`, backgroundColor: '#059669' }}></div>
                            </div>
                        </div>
                        <div>
                            <div className="flex justify-between mb-2 text-sm">
                                <span>Fallend</span>
                                <span className="font-semibold color-negative">{breadth.declining}</span>
                            </div>
                            <div className="momentum-bar">
                                <div className="momentum-bar-fill" style={{ width: `${breadth.declining_pct || 50}%`, backgroundColor: '#dc2626' }}></div>
                            </div>
                        </div>
                        <div className="flex justify-between items-center mt-4 pt-3 border-t border-gray-100">
                            <div className="text-sm text-gray-600">
                                A/D Ratio: <span className="font-semibold">{breadth.ad_ratio?.toFixed(2)}</span>
                            </div>
                            <span className={`signal-badge ${breadth.breadth_signal === 'BULLISH' ? 'signal-bullish' : breadth.breadth_signal === 'BEARISH' ? 'signal-bearish' : 'signal-neutral'}`}>
                                {breadth.breadth_signal === 'BULLISH' ? 'Bullisch' : breadth.breadth_signal === 'BEARISH' ? 'Bärisch' : breadth.breadth_signal === 'MARKT GESCHLOSSEN' ? 'Markt geschlossen' : 'Neutral'}
                            </span>
                        </div>
                        {breadth.unchanged > 0 && (
                            <div className="text-xs text-gray-400 mt-2">Unverändert: {breadth.unchanged} ({breadth.unchanged_pct?.toFixed(1)}%)</div>
                        )}
                        {breadth.common_stock_filtered && (
                            <div className="text-xs text-gray-400 mt-1">
                                Breadth-Filter: Common Stocks/ADRs · Quelle {breadth.common_stock_source || 'n/a'}{breadth.excluded_non_common ? ` · ausgeschlossen: ${breadth.excluded_non_common}` : ''}
                            </div>
                        )}
                    </div>
                </div>
            )}

            {/* Fear Score Details */}
            {fearData && fearData.score > 0 && (

                    <div className="grid grid-cols-2 gap-3 text-sm">
