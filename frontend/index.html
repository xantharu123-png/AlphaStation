                    </div>
                    <div className="mt-3 text-xs text-gray-500">
                        Score basiert auf: VIX Level & Trend, S&P/Nasdaq/Russell Tages- und Mehrtagesbewegungen, A/D Ratio, Common-Stock-Marktbreite, Nasdaq-vs-S&P Risk Appetite und Small-Cap-vs-S&P Staerke.
                    </div>
                </div>
            )}
        </div>
    );
}

// Watchlist Tab
function WatchlistTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {} }) {
    const [watchlist, setWatchlist] = useState([]);
    const [newTicker, setNewTicker] = useState('');
    const [tickerPrices, setTickerPrices] = useState({});
    const { sorted, toggleSort, sortKey } = useSortable(watchlist, 'ticker');

    useEffect(() => {
        const saved = localStorage.getItem('watchlist');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                setWatchlist(parsed);
            } catch (e) {
                setWatchlist([]);
            }
        }
    }, []);

    useEffect(() => {
        watchlist.forEach(ticker => {
            fetch(`${API}/api/ticker-detail?ticker=${ticker}`)
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (data) {
                        setTickerPrices(prev => ({
                            ...prev,
                            [ticker]: data
                        }));
                    }
                })
                .catch(err => console.error('Error:', err));
        });
    }, [watchlist]);

    const addTicker = () => {
        if (newTicker.trim() && !watchlist.includes(newTicker.toUpperCase())) {
            const updated = [...watchlist, newTicker.toUpperCase()];
            setWatchlist(updated);
            localStorage.setItem('watchlist', JSON.stringify(updated));
            setNewTicker('');
            if (window.addToast) window.addToast(`${newTicker.toUpperCase()} zur Watchlist hinzugefügt`, 'success');
        }
    };

    const removeTicker = (ticker) => {
        const updated = watchlist.filter(t => t !== ticker);
        setWatchlist(updated);
        localStorage.setItem('watchlist', JSON.stringify(updated));
        if (window.addToast) window.addToast(`${ticker} aus Watchlist entfernt`, 'success');
    };

    const exportCSV = () => {
        let csv = 'Ticker,Preis,1D%,5D%,RSI,Grade\n';
        sorted.forEach(ticker => {
            const price = tickerPrices[ticker];
            if (price) {
                csv += `${ticker},${price.price},${price.change_pct},${price.change_5d || 0},${price.rsi || 0},${price.grade || 'N/A'}\n`;
            }
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'watchlist.csv';
        a.click();
    };

    return (
        <div className="space-y-6">
            <div className="card border border-gray-200 p-6 rounded-lg">
                <label className="block text-sm font-semibold mb-3">Ticker hinzufügen</label>
                <div className="flex gap-2">
                    <input
                        type="text"
                        value={newTicker}
                        onChange={(e) => setNewTicker(e.target.value)}
                        onKeyPress={(e) => e.key === 'Enter' && addTicker()}
                        placeholder="z.B. AAPL"
                        className="flex-1"
                    />
                    <button onClick={addTicker} className="button">Hinzufügen</button>
                    <button onClick={exportCSV} className="button button-secondary">CSV</button>
                </div>
            </div>

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('ticker')}>Ticker</th>
                            <th className="text-right py-2 px-2">Preis</th>
                            <th className="text-right py-2 px-2">1D%</th>
                            <th className="text-right py-2 px-2">5D%</th>
                            <th className="text-right py-2 px-2">RSI</th>
                            <th className="text-center py-2 px-2">Grade</th>
                            <th className="text-center py-2 px-2">Aktion</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.map((ticker, idx) => {
                            const price = tickerPrices[ticker];
                            return (
                                <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker(ticker)}>
                                    <td className="py-3 px-2 font-semibold">{ticker}</td>
                                    <td className="py-3 px-2 text-right">${price?.price?.toFixed(2) || '-'}</td>
                                    <td className={`py-3 px-2 text-right ${(price?.change_pct || 0) >= 0 ? 'color-positive' : 'color-negative'}`}>{price?.change_pct?.toFixed(2) || '-'}%</td>
                                    <td className={`py-3 px-2 text-right ${(price?.change_5d || 0) >= 0 ? 'color-positive' : 'color-negative'}`}>{price?.change_5d?.toFixed(2) || '-'}%</td>
                                    <td className="py-3 px-2 text-right">{price?.rsi?.toFixed(1) || '-'}</td>
                                    <td className="py-3 px-2 text-center"><span className={`grade-badge grade-${(price?.grade || 'D').toLowerCase()}`}>{price?.grade || 'D'}</span></td>
                                    <td className="py-3 px-2 text-center"><button onClick={(e) => { e.stopPropagation(); removeTicker(ticker); }} className="button button-danger" style={{ padding: '4px 8px', fontSize: '12px' }}>×</button></td>
                                </tr>
                            );
                        })}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

// Backtest Tab
function BacktestTab() {
    const [ticker, setTicker] = useState('');
    const [strategy, setStrategy] = useState('sma_crossover');
    const [months, setMonths] = useState('6');
    const [isRunning, setIsRunning] = useState(false);
    const [results, setResults] = useState(null);
    const [trades, setTrades] = useState([]);
    const [error, setError] = useState(null);
    const [strategyOptions, setStrategyOptions] = useState([]);

    // Load available strategies from server
    useEffect(() => {
        const fetchStrategies = async () => {
            try {
                const resp = await fetch(`${API}/api/backtest-strategies`);
                if (resp.ok) {
                    const data = await resp.json();
                    setStrategyOptions(data.strategies || []);
                }
            } catch (e) {
                // Fallback if endpoint not available
                setStrategyOptions([
                    { id: 'sma_crossover', name: 'SMA Crossover (20/50)', category: 'Indikator', direction: 'long' },
                    { id: 'ema_crossover', name: 'EMA Crossover (9/21)', category: 'Indikator', direction: 'long' },
                    { id: 'rsi_mean_reversion', name: 'RSI Mean Reversion', category: 'Indikator', direction: 'long' },
                ]);
            }
        };
        fetchStrategies();
    }, []);

    const runBacktest = async () => {
        if (!ticker.trim()) {
            if (window.addToast) window.addToast('Bitte Ticker eingeben', 'error');
            return;
        }

        setIsRunning(true);
        setError(null);
        try {
            const response = await fetch(`${API}/api/run-backtest`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticker: ticker.toUpperCase(), strategy, months: parseInt(months) })
            });

            if (response.ok) {
                const data = await response.json();
                if (data.error) {
                    setError(data.error);
                    setResults(null);
                    setTrades([]);
                    if (window.addToast) window.addToast(data.error, 'error');
                } else if (data.total_trades === 0) {
                    setError('Keine Trades gefunden — probiere einen anderen Zeitraum oder Ticker');
                    setResults(null);
                    setTrades([]);
                    if (window.addToast) window.addToast('Keine Trades gefunden', 'info');
                } else {
                    setResults(data);
                    setTrades(data.trades || []);
                    if (window.addToast) window.addToast(`Backtest: ${data.total_trades} Trades gefunden`, 'success');
                }
            } else {
                const errData = await response.json().catch(() => ({}));
                setError(errData.detail || 'Backtest fehlgeschlagen');
                if (window.addToast) window.addToast('Backtest fehlgeschlagen', 'error');
            }
        } catch (err) {
            setError('Netzwerkfehler');
            if (window.addToast) window.addToast('Fehler beim Backtest', 'error');
        } finally {
            setIsRunning(false);
        }
    };

    return (
        <div className="space-y-6">
            <div className="card border border-gray-200 p-6 rounded-lg">
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                    <div>
                        <label className="block text-sm font-semibold mb-2">Ticker</label>
                        <input
                            type="text"
                            value={ticker}
                            onChange={(e) => setTicker(e.target.value.toUpperCase())}
                            onKeyDown={(e) => e.key === 'Enter' && runBacktest()}
                            placeholder="z.B. AAPL"
                        />
                    </div>
                    <div>
                        <label className="block text-sm font-semibold mb-2">Strategie</label>
                        <select value={strategy} onChange={(e) => setStrategy(e.target.value)}>
                            {(() => {
                                const categories = {};
                                strategyOptions.forEach(s => {
                                    const cat = s.category || 'Sonstige';
                                    if (!categories[cat]) categories[cat] = [];
                                    categories[cat].push(s);
                                });
                                return Object.entries(categories).map(([cat, strats]) => (
                                    <optgroup key={cat} label={cat}>
                                        {strats.map(s => (
                                            <option key={s.id} value={s.id}>{s.name} {s.direction === 'short' ? '(Short)' : ''}</option>
                                        ))}
                                    </optgroup>
                                ));
                            })()}
                        </select>
                    </div>
                    <div>
                        <label className="block text-sm font-semibold mb-2">Zeitraum</label>
                        <select value={months} onChange={(e) => setMonths(e.target.value)}>
                            <option value="3">3 Monate</option>
                            <option value="6">6 Monate</option>
                            <option value="12">12 Monate</option>
                            <option value="24">24 Monate</option>
                        </select>
                    </div>
                    <div className="flex items-end">
                        <button onClick={runBacktest} disabled={isRunning} className="button w-full">
                            {isRunning ? 'Läuft...' : 'Backtest starten'}
                        </button>
                    </div>
                </div>
                {strategyOptions.find(s => s.id === strategy)?.direction === 'short' && (
                    <p className="text-xs text-red-500 mt-1 font-semibold">Short-Strategie — profitiert von fallenden Kursen</p>
                )}
            </div>

            {error && (
                <div className="card border border-red-200 bg-red-50 p-4 rounded-lg text-sm text-red-700">{error}</div>
            )}

            {results && !error && (
                <>
                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                        <div className="metric-card green">
                            <div className="text-xs font-semibold text-gray-500">Trades</div>
                            <div className="text-2xl font-bold mt-1">{results.total_trades}</div>
                        </div>
                        <div className="metric-card blue">
                            <div className="text-xs font-semibold text-gray-500">Gewinnquote</div>
                            <div className="text-2xl font-bold mt-1">{results.win_rate?.toFixed(1)}%</div>
                        </div>
                        <div className="metric-card orange">
                            <div className="text-xs font-semibold text-gray-500">Ø PnL pro Trade</div>
                            <div className={`text-2xl font-bold mt-1 ${(results.avg_pnl ?? 0) >= 0 ? 'color-positive' : 'color-negative'}`}>
                                {(results.avg_pnl ?? 0) >= 0 ? '+' : ''}{(results.avg_pnl ?? 0).toFixed(2)}%
                            </div>
                        </div>
                        <div className="metric-card purple">
                            <div className="text-xs font-semibold text-gray-500">Max Drawdown</div>
                            <div className="text-2xl font-bold mt-1 color-negative">-{(results.max_drawdown ?? 0).toFixed(2)}%</div>
                        </div>
                        <div className="metric-card" style={{ borderColor: (results.total_return ?? 0) >= 0 ? '#10b981' : '#ef4444' }}>
                            <div className="text-xs font-semibold text-gray-500">Gesamtrendite</div>
                            <div className={`text-2xl font-bold mt-1 ${(results.total_return ?? 0) >= 0 ? 'color-positive' : 'color-negative'}`}>
                                {(results.total_return ?? 0) >= 0 ? '+' : ''}{(results.total_return ?? 0).toFixed(2)}%
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="card border border-gray-200 p-3 rounded-lg text-center">
                            <div className="text-xs text-gray-500">Bester Trade</div>
                            <div className="text-lg font-bold color-positive mt-1">+{(results.best_trade ?? 0).toFixed(2)}%</div>
                        </div>
                        <div className="card border border-gray-200 p-3 rounded-lg text-center">
                            <div className="text-xs text-gray-500">Schlechtester Trade</div>
                            <div className="text-lg font-bold color-negative mt-1">{(results.worst_trade ?? 0).toFixed(2)}%</div>
                        </div>
                        <div className="card border border-gray-200 p-3 rounded-lg text-center">
                            <div className="text-xs text-gray-500">Ø Gewinn</div>
                            <div className="text-lg font-bold color-positive mt-1">+{(results.avg_win ?? 0).toFixed(2)}%</div>
                        </div>
                        <div className="card border border-gray-200 p-3 rounded-lg text-center">
                            <div className="text-xs text-gray-500">Ø Verlust</div>
                            <div className="text-lg font-bold color-negative mt-1">{(results.avg_loss ?? 0).toFixed(2)}%</div>
                        </div>
                    </div>

                    {trades.length > 0 && (
                        <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                            <h3 className="font-semibold mb-4">Trade Historie ({trades.length} Trades)</h3>
                            <table className="w-full text-sm">
                                <thead className="border-b border-gray-200">
                                    <tr>
                                        <th className="text-left py-2 px-2">#</th>
                                        <th className="text-left py-2 px-2">Entry</th>
                                        <th className="text-right py-2 px-2">Entry Preis</th>
                                        <th className="text-left py-2 px-2">Exit</th>
                                        <th className="text-right py-2 px-2">Exit Preis</th>
                                        <th className="text-right py-2 px-2">PnL%</th>
                                        <th className="text-center py-2 px-2">Typ</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {trades.map((trade, idx) => (
                                        <tr key={idx} className="table-row border-b border-gray-200">
                                            <td className="py-3 px-2 text-gray-400">{idx + 1}</td>
                                            <td className="py-3 px-2">{trade.entry_date}</td>
                                            <td className="py-3 px-2 text-right">${trade.entry_price?.toFixed(2)}</td>
                                            <td className="py-3 px-2">{trade.exit_date}</td>
                                            <td className="py-3 px-2 text-right">${trade.exit_price?.toFixed(2)}</td>
                                            <td className={`py-3 px-2 text-right font-semibold ${(trade.pnl_pct ?? 0) >= 0 ? 'color-positive' : 'color-negative'}`}>{(trade.pnl_pct ?? 0) >= 0 ? '+' : ''}{(trade.pnl_pct ?? 0).toFixed(2)}%</td>
                                            <td className="py-3 px-2 text-center text-xs">{trade.type || 'LONG'}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </>
            )}
        </div>
    );
}

        'Trend Reversal': 'Sucht kontrollierte Bodenbildung nach einem mehrtägigen Abverkauf. Interessant ist nicht jeder grüne Tag, sondern nur Reversals mit Struktur, Volumen und klarer Veränderung im Verhalten.',

        'Wyckoff Distribution': 'Das Gegenstück zur Akkumulation: Schwäche baut sich schleichend in einer Range auf, bevor der sichtbare Breakdown startet. Gut geeignet, um trügerisch stabile Charts früh skeptisch zu bewerten.',
        // === AKTIEN ===
        'Volume Surge': 'Erkennt Aktien, bei denen plötzlich viel mehr gehandelt wird als üblich UND sich der Preis gleichzeitig bewegt. Wenn beides zusammenkommt, steckt oft echtes Interesse dahinter — nicht nur zufälliges Rauschen. Besonders nützlich um früh in einen Move einzusteigen.',

        'Early Momentum': 'Erkennt Aktien mit einem starken Tagesstart, die ihre Gewinne halten. Wenn der Kurs am Tageshoch oder nahe dran schließt, deutet das auf anhaltendes Momentum hin. Ideal für Intraday-Trader.',
        'Whale Watch': 'Extrem hohes Handelsvolumen kombiniert mit klarer Kursrichtung nach oben. Wenn das Volumen weit über dem Durchschnitt liegt und der Preis steigt, sind wahrscheinlich große institutionelle Käufer ("Whales") aktiv.',
        'Whale Watch Short ': 'Das Short-Gegenstück: Extremes Volumen mit klarem Abverkauf. Große Spieler verkaufen in Menge — der Kurs schließt nahe dem Tagestief. Ein starkes Signal für weitere Schwäche.',
        'Earnings Mover Long': 'Aktien, die nach Quartalszahlen oder News stark nach oben gappen und den Gap halten. Funktioniert im Pre-Market, After-Hours und regulärer Session. Der Gap muss mit hohem Volumen bestätigt sein.',
        'Earnings Mover Short': 'Aktien, die nach schlechten Quartalszahlen oder News stark fallen und sich nicht erholen. Wenn der Kurs nahe dem Tagestief bleibt, deutet das auf weitere Schwäche hin — ein Short-Setup.',
        'Gap Up': 'Einfacher Gap-Scanner: Aktien, die mit einer Lücke nach oben eröffnen. Gaps entstehen durch News, Earnings oder Overnight-Aktivität und bieten oft Trading-Chancen in der ersten Stunde.',
        'Gap Down': 'Erkennt Aktien, die mit einer Lücke nach unten eröffnen. Nützlich für Gap-Fill-Trades (Preis kehrt zum Schlusskurs zurück) oder Continuation-Shorts.',
        'Gap Up (High Vol)': 'Wie Gap Up, aber nur mit besonders hohem Volumen. Die Kombination Gap + Volumen zeigt echtes Momentum und nicht nur ein dünnes Overnight-Geschäft.',
        'Gap Down (High Vol)': 'Gap nach unten mit überdurchschnittlichem Volumen — oft durch schlechte News oder Earnings ausgelöst. Stärkeres Signal als ein normaler Gap Down.',
        'Long Wick Up': 'Erkennt Kerzen mit langer oberer Wick (Docht): Der Preis stieg stark, wurde dann aber zurückgewiesen. Dieses Candlestick-Pattern zeigt Verkaufsdruck an höheren Preisen und deutet oft auf eine Umkehr nach unten hin.',
        'Long Wick Down': 'Das Gegenteil: Eine lange untere Wick zeigt, dass der Preis stark fiel, aber von Käufern aufgefangen wurde. Bekannt als "Hammer" in der Candlestick-Analyse — ein bullisches Umkehrsignal.',
        'Insider Buying': 'Zeigt Aktien, bei denen Unternehmensinsider (CEOs, CFOs, Direktoren) eigene Aktien kaufen. Wenn diejenigen kaufen, die das Unternehmen am besten kennen, ist das ein starkes bullisches Signal.',
        'Insider Selling': 'Große Insider-Verkäufe können ein Warnsignal sein. Allerdings verkaufen Insider aus vielen Gründen (Steuern, Diversifikation) — es muss nicht immer negativ sein. Trotzdem ein wichtiger Datenpunkt.',
        'Consolidation ': 'Findet Aktien in einer mehrtägigen Seitwärtsphase mit sinkendem Volumen. Diese "Ruhe vor dem Sturm" geht oft einem großen Ausbruch voraus — die Richtung ist allerdings noch unklar. Basiert auf Wyckoff-Prinzipien.',
        'Consolidation Breakout ': 'Der nächste Schritt nach der Konsolidierung: Erkennt Aktien, die gerade aus einer engen mehrtägigen Range ausbrechen. Der Ausbruch wird durch erhöhtes Volumen bestätigt — ein starkes Einstiegssignal.',
        'Reversal Setup ': 'Sucht mehrtägige Abverkäufe, bei denen sich heute eine bullische Umkehr andeutet. Wenn nach mehreren roten Tagen plötzlich Käufer mit erhöhtem Volumen einsteigen, bildet sich möglicherweise ein Boden.',
        'Tight Range ': 'Extrem enge Tagesrange bei niedrigem Volumen — die Aktie bewegt sich kaum noch. Dieses extreme Gleichgewicht löst sich fast immer in einem großen Move auf. Die Richtung ist allerdings noch unklar.',
        'High Volume Churn ': 'Hohes Volumen OHNE Preisfortschritt. Das klingt langweilig, ist aber eines der wichtigsten Signale: Wenn viel gehandelt wird aber der Preis sich nicht bewegt, wechseln Aktien von schwachen zu starken Händen (Akkumulation) oder umgekehrt (Distribution).',
        'Volume Void Long ⬆': 'Identifiziert Preiszonen über dem aktuellen Kurs, in denen historisch sehr wenig gehandelt wurde. In diesen "Volumen-Löchern" gibt es kaum Widerstand — der Preis kann schnell durchrutschen. Ein Volume-Profile-basiertes Setup.',
        'Volume Void Short ⬇': 'Das Short-Gegenstück: Preiszonen unter dem aktuellen Kurs mit wenig historischem Volumen. Wenn der Preis dort hinein fällt, gibt es wenig Support und er kann schnell weiter fallen.',
        'Harmonic Bullish ⬆': 'Scannt nach bullischen Harmonic Patterns wie Gartley, Bat, Butterfly und Crab. Diese Fibonacci-basierten Umkehr-Patterns werden seit Jahrzehnten von professionellen Tradern genutzt. Der Entry erfolgt am Punkt D des XABCD-Patterns.',
        'Harmonic Bearish ⬇': 'Bärische Harmonic Patterns für Short-Setups. Gleiche Methodik wie die bullische Variante, nur in die andere Richtung.',
        'Harmonic All Patterns ': 'Zeigt alle erkannten Harmonic Patterns unabhängig von der Richtung. Nützlich wenn du alle Fibonacci-Setups auf einen Blick sehen willst.',
        'Wyckoff Accumulation ⬆': 'Basiert auf der Wyckoff-Methode: Erkennt Phasen, in denen Smart Money leise in einer Trading Range kauft. Klassische Zeichen sind sinkendes Volumen in der Range und versteckte Stärke. Einer der professionellsten und zuverlässigsten Ansätze der technischen Analyse — entwickelt von Richard Wyckoff in den 1930ern.',
        'Wyckoff Distribution ⬇': 'Das Gegenteil der Akkumulation: Smart Money verkauft leise in einer Trading Range, während der Markt noch stabil aussieht. Erkennt versteckte Schwäche bevor der Abverkauf beginnt. Basiert auf der gleichen Wyckoff-Methodik.',
        'SMA 50 Bounce Long ': 'Der 50-Tage-Durchschnitt (SMA 50) ist eine der wichtigsten Support-Zonen. Wenn der Preis von oben an den SMA 50 herankommt und der MA nach oben zeigt, bietet das oft eine Kaufgelegenheit. Swing-Trader nutzen dieses Setup regelmäßig.',
        'SMA 50 Bounce Short ': 'Wenn eine Aktie im Abwärtstrend den SMA 50 von unten erreicht, wirkt er als Widerstand. Der Preis prallt oft nach unten ab — ein Short-Setup.',
        'SMA 200 Bounce Long ': 'Der 200-Tage-Durchschnitt ist DER wichtigste langfristige Moving Average. Legendäre Trader wie Paul Tudor Jones nutzen ihn als ultimativen Support. Wenn eine Aktie den SMA 200 testet und hält, ist das oft ein starkes Kaufsignal.',
        'SMA 200 Bounce Short ': 'Im Abwärtstrend wirkt der SMA 200 als massive Widerstandszone. Wenn eine gefallene Aktie bis zum SMA 200 steigt, wird sie dort oft abgewiesen.',
        'EMA 21 Bounce (Swing) ': 'Der EMA 21 ist der klassische Swing-Trading Moving Average, bekannt durch Linda Raschke\'s "Holy Grail" Setup. Ein Pullback zur EMA 21 im Aufwärtstrend bietet eine der zuverlässigsten Einstiegsmöglichkeiten für Swing-Trades.',
        // === CRYPTO ===
        ' Alle zeigen': 'Zeigt alle verfügbaren Assets ohne Filter an. Nützlich um einen Gesamtüberblick über den Markt zu bekommen.',
        'Low Cap Rockets ': 'Findet kleine Kryptowährungen mit niedriger Marktkapitalisierung und explosiven Moves. Small Caps können sich vervielfachen, sind aber auch extrem riskant. Nur Coins mit echtem Volumen werden angezeigt.',
        'Accumulation ': 'Erkennt Coins, die seitwärts handeln aber leicht erhöhtes Volumen zeigen. Das deutet darauf hin, dass jemand still und leise Positionen aufbaut. Oft ein Vorbote eines größeren Moves.',
        // === FUTURES ===
        'Futures Momentum ': 'Erkennt Futures-Kontrakte mit starker Tagesbewegung. In den Futures-Märkten zählen schon kleinere Bewegungen, da oft mit hohem Hebel gehandelt wird.',
        'Futures Breakdown ': 'Starker Abverkauf bei Futures — potenzielle Short-Chance. Futures-Breakdowns können sich schnell beschleunigen durch Margin Calls.',
        'Futures Reversal ': 'Trendumkehr bei Futures: Nach einer schwachen Session dreht der Markt nach oben. Reversal-Trades in Futures sind besonders bei Rohstoffen profitabel.',
        'Globex Gap ': 'Der Globex ist der elektronische Futures-Markt, der auch über Nacht läuft. Dieser Scanner findet Gaps zwischen dem US-Schlusskurs und der aktuellen Overnight-Session. Besonders relevant für Index-Futures (ES, NQ).',
        'London Open Momentum 🇬🇧': 'Erkennt Momentum bei Eröffnung der Londoner Börse um 08:00 UTC. Der Londoner Markt bringt frische Liquidität und oft neue Trendrichtung. Besonders relevant für Gold, Öl und europäische Indizes.',
        'NY Open Breakout ': 'Momentum bei US-Börsenöffnung — die liquideste Phase des Tages. Hier entstehen die größten Moves. Besonders profitabel für Index-Futures und Energie-Futures.',
        'High Volatility ': 'Findet Futures mit überdurchschnittlicher Tagesbewegung. Hohe Volatilität bedeutet größere Chancen (und Risiken) — ideal für aktive Daytrader.',
        'Low Volatility Squeeze ': 'Extrem enge Range bei Futures — die Volatilität ist zusammengepresst wie eine Feder. Historisch folgt auf solche Phasen fast immer ein großer Ausbruch.',
        'VIX Spike Alert ': 'Erkennt starke Anstiege im VIX (Angst-Index). Wenn der VIX sprunghaft steigt, absichern sich große Spieler gegen einen Crash. Kann sowohl Warnsignal als auch Contrarian-Buy-Signal sein.',
        // === FOREX ===
        'Forex Momentum ': 'Erkennt Währungspaare mit starker Pip-Bewegung. Im Forex-Markt zählen schon kleine Bewegungen, da mit großem Hebel gehandelt wird.',
        'Forex Reversal ': 'Trendumkehr bei Währungspaaren: Nach einem starken Vortag dreht die Richtung. Forex-Reversals an Schlüsselniveaus sind eine der profitabelsten Strategien.',
        'Pip Hunter ': 'Zeigt die größten Pip-Bewegungen des Tages. Nützlich um die aktivsten Paare zu finden und dort nach Setups zu suchen.',
        'Tokyo Session 🇯🇵': 'Bewegungen während der Tokyo/Asien Session (00:00-09:00 UTC). Oft ruhiger, aber JPY-Paare (USDJPY, EURJPY) können hier sehr aktiv sein. Ideal für Trader in asiatischen Zeitzonen.',
        'London Session 🇬🇧': 'Die London-Session (08:00-17:00 UTC) hat die höchste Liquidität weltweit. EUR und GBP-Paare sind besonders aktiv. Die besten Breakout-Setups entstehen in der ersten Stunde.',
        'NY Session ': 'US-Session (13:00-22:00 UTC) mit Fokus auf USD-Paare. Die zweite große Liquiditätsphase des Tages. EURUSD, GBPUSD und USDJPY sind besonders aktiv.',
        'London/NY Overlap ': 'Die Überlappung von London und New York ist die volatilste Phase überhaupt. Maximale Liquidität und die größten Moves des Tages. Die beste Zeit für Forex-Trading.',
        'Safe Haven Flow ': 'Erkennt Risk-Off Bewegungen: Investoren fliehen in sichere Währungen wie CHF und JPY. Wenn USDCHF und USDJPY fallen, deutet das auf Angst im Markt hin. Ein wichtiges Stimmungsbarometer.',
        'Risk-On Rally ': 'Das Gegenteil: Risikofreudige Währungen wie AUD und NZD steigen. Das zeigt Optimismus im Markt und Appetite für Risiko. Oft korreliert mit steigenden Aktienmärkten.',
        'Exotic Movers ': 'Große Bewegungen in Emerging-Market-Währungen. Exotische Paare haben höhere Spreads aber auch größere Schwankungen. Für erfahrene Forex-Trader.',
        'Range Bound ': 'Findet Währungspaare mit minimaler Bewegung — ideal für Range-Trading-Strategien. Kauf am unteren Ende der Range, Verkauf am oberen.',
        // === INTERNATIONAL ===
        ' Gewinner': 'Zeigt alle Aktien der Börse, die heute im Plus sind. Einfacher Überblick über die stärksten Werte des Tages.',
        ' Verlierer': 'Zeigt alle Aktien im Minus. Nützlich um Schwäche zu identifizieren oder Dip-Buy-Kandidaten zu finden.',
        ' Momentum': 'Die stärksten positiven Bewegungen des Tages. Für europäische Blue-Chips sind schon moderate Moves signifikant.',
        ' Breakout': 'Starker Ausbruch nach oben — der Kurs schließt nahe dem Tageshoch. Zeigt klare bullische Stärke.',
        ' Breakdown': 'Starker Abverkauf — der Kurs schließt nahe dem Tagestief. Zeigt Verkaufsdruck und mögliche Short-Setups.',
        ' Dip Buy': 'Moderate Schwäche bei soliden Aktien. Ein Rücksetzer bei niedrigem Panik-Level kann eine Kaufgelegenheit sein.',
        ' Volume Spike': 'Deutlich überdurchschnittliches Volumen (zeitnormalisiert). Wenn eine normalerweise ruhige europäische Aktie plötzlich viel gehandelt wird, passiert etwas Wichtiges.',
        ' Reversal': 'Trendumkehr: Gestern stark gefallen, heute Bounce. Zeigt, dass Käufer einsteigen und der Abverkauf möglicherweise vorbei ist.',
        ' Bull Flag': 'Konsolidierung nach starkem Vortag — die Aktie pausiert in einer engen Range. Oft ein Zeichen, dass der Aufwärtstrend weitergeht.',
        ' Bear Flag': 'Konsolidierung nach Abverkauf — enge Range nach rotem Vortag. Zeigt, dass Verkäufer noch nicht fertig sind.',
        ' Big Movers': 'Die größten absoluten Bewegungen des Tages. Zeigt die Top-Movers mit signifikanten Kursänderungen.',
        ' Whale Watch': 'Extremes Volumen (zeitnormalisiert) — Big Player sind aktiv. Besonders relevant bei europäischen Aktien, die normalerweise weniger Volumen haben.',
    };

    const strategyNames = Object.keys(strategies);
    const filtered = strategyNames.filter(s =>
        s.toLowerCase().includes(searchTerm.toLowerCase()) ||
        (strategies[s]?.description || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
        (guideTexts[s] || '').toLowerCase().includes(searchTerm.toLowerCase())
    );

    const getDirectionBadge = (name, strat) => {
        const n = name.toLowerCase();
        if (strat?.harmonic_direction === 'LONG' || n.includes('long') || n.includes('bull') || n.includes('bounce long') || n.includes('breakout') || n.includes('dip buy') || n.includes('reversal hunter') || n.includes('trend reversal') || n.includes('accumulation') || n.includes('gap up') || n.includes('momentum') && !n.includes('short') && !n.includes('bear') && !n.includes('down')) {
            return { label: 'LONG', color: '#10b981' };
        }
        if (strat?.harmonic_direction === 'SHORT' || n.includes('short') || n.includes('bear') || n.includes('breakdown') || n.includes('gap down') || n.includes('fade') || n.includes('distribution')) {
            return { label: 'SHORT', color: '#ef4444' };
        }
        if (n.includes('alle zeigen') || n.includes('all pattern') || strat?.harmonic_direction === 'ALL') {
            return { label: 'ALLE', color: '#6b7280' };
        }
        return { label: 'WATCH', color: '#f59e0b' };
    };

    return (
        <div className="space-y-6">
            <div className="card border border-gray-200 p-4 rounded-lg flex items-center gap-3 guide-search-card">
                <svg className="w-5 h-5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input
                    type="text"
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    placeholder="Strategie suchen..."
                    className="w-full bg-transparent outline-none"
                />
                {searchTerm && <button onClick={() => setSearchTerm('')} className="text-gray-400 hover:text-gray-600 text-lg">\u00d7</button>}
            </div>

            <div className="guide-tabs flex gap-2 border-b border-gray-200 flex-nowrap md:flex-wrap pb-2">
                {marketTypes.map(market => (
                    <button
                        key={market.id}
                        onClick={() => { setActiveMarket(market.id); setExpandedStrategy(null); }}
                        className={`secondary-tab ${activeMarket === market.id ? 'active' : 'inactive'}`}
                    >
                        {market.icon} {market.label}
                    </button>
                ))}
            </div>

            <div className="text-xs text-gray-500">{filtered.length} von {strategyNames.length} Strategien</div>

            <div className="space-y-3">
                {loading ? (
                    <div className="flex justify-center py-8"><div className="loading-spinner"></div></div>
                ) : filtered.length === 0 ? (
                    <div className="text-center text-gray-500 py-8">Keine Strategien gefunden</div>
                ) : (
                    filtered.map((name, idx) => {
                        const strat = strategies[name] || {};
                        const dir = getDirectionBadge(name, strat);
                        const guide = guideTexts[name] || guideTexts[name.trim()] || null;
                        const isExpanded = expandedStrategy === idx;
                        return (
                        <div key={idx} className="card border border-gray-200 rounded-lg overflow-hidden">
                            <div className="p-4 cursor-pointer hover:bg-gray-50" onClick={() => setExpandedStrategy(isExpanded ? null : idx)}>
                                <div className="flex justify-between items-start gap-3">
                                    <div className="flex-1 min-w-0">
                                        <div className="flex items-center gap-2 flex-wrap">
                                            <h3 className="font-semibold text-sm">{name}</h3>
                                            <span className="text-xs font-bold px-2 py-0.5 rounded" style={{background: dir.color + '20', color: dir.color}}>{dir.label}</span>
                                            {strat.display_group && <span className="text-xs px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">{strat.display_group}</span>}
                                            {strat.stocks_only && <span className="text-xs px-1.5 py-0.5 rounded bg-blue-50 text-blue-600">Nur Aktien</span>}
                                            {strat.needs_history && <span className="text-xs px-1.5 py-0.5 rounded bg-purple-50 text-purple-600">Multi-Day</span>}
                                            {strat.needs_harmonic && <span className="text-xs px-1.5 py-0.5 rounded bg-orange-50 text-orange-600">Harmonic</span>}
                                            {strat.needs_volume_profile && <span className="text-xs px-1.5 py-0.5 rounded bg-cyan-50 text-cyan-600">Volume Profile</span>}
                                            {strat.needs_ma && <span className="text-xs px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-600">{strat.ma_type && strat.ma_period ? `${strat.ma_type} ${strat.ma_period}` : 'MA Bounce'}</span>}
                                        </div>
                                        <p className="text-xs text-gray-500 mt-1 truncate">{guide ? guide.substring(0, 80) + '...' : '\u2014'}</p>
                                        {Array.isArray(strat.merged_from) && strat.merged_from.length > 0 && (
                                            <p className="text-xs text-gray-400 mt-1 truncate">Vereint: {strat.merged_from.join(', ')}</p>
                                        )}
                                    </div>
                                    <span className="text-lg text-gray-400 flex-shrink-0">{isExpanded ? '\u2212' : '+'}</span>
                                </div>
                            </div>

                            {isExpanded && (
                                <div className="px-4 pb-4 border-t border-gray-100 space-y-3">
                                    {/* Guide-Text — erklärt WAS die Strategie macht, nicht WIE */}
                                    <div className="pt-3">
                                        <p className="text-sm leading-relaxed">{guide || 'Keine Beschreibung verfügbar.'}</p>
                                    </div>

                                    {/* Allgemeine Hinweise — nur Session-Zeiten, Paare etc. */}
                                    {(strat.best_time || strat.best_pairs) && (
                                    <div className="flex flex-wrap gap-x-6 gap-y-2 text-xs text-gray-600 bg-gray-50 rounded p-3">
                                        {strat.best_time && (
                                            <div><span className="font-semibold text-gray-500">Bestes Zeitfenster:</span> {strat.best_time}</div>
                                        )}
                                        {strat.best_pairs && (
                                            <div><span className="font-semibold text-gray-500">Empfohlene Paare:</span> {strat.best_pairs.join(', ')}</div>
                                        )}
                                    </div>
                                    )}
                                </div>
                            )}
                        </div>
                        );
                    })
                )}
            </div>
        </div>
    );
}

// Pump & Dump Scanner Tab (ehemals New Listing Scanner)
function NewListingTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [results, setResults] = useState(scanCache.newlisting_results || []);
    const [stats, setStats] = useState(scanCache.newlisting_stats || null);
    const [isScanning, setIsScanning] = useState(scanCache.nl_scanning || false);
    const { sorted, toggleSort, sortKey } = useSortable(results, 'pump_pct');
    const pollTimeoutRef = useRef(null);

    // Cleanup polling on unmount
    useEffect(() => {
        return () => { if (pollTimeoutRef.current) clearTimeout(pollTimeoutRef.current); };
    }, []);

    // Always load latest from server on mount
    useEffect(() => {
        const fetchResults = async () => {
            try {
                const response = await fetch(`${API}/api/new-listing-results`);
                if (response.ok) {
                    const data = await response.json();
                    const items = data.data || [];
                    if (items.length > 0) {
                        setResults(items);
                        setStats(data.stats);
                        updateScanCache('newlisting_results', items);
                        updateScanCache('newlisting_stats', data.stats);
                    }
                }
            } catch (err) { console.error('Error:', err); }
        };
        fetchResults();
    }, []);

    const handleScan = async () => {
        setIsScanning(true);
        updateScanCache('newlisting_scanning', true);
        // Save current cached_at BEFORE scan starts
        let prevCachedAt = null;
        try {
            const preCheck = await fetch(`${API}/api/new-listing-results`);
            if (preCheck.ok) {
                const preData = await preCheck.json();
                prevCachedAt = preData.cached_at || null;
            }
        } catch(e) {}
        try {
            const response = await fetch(`${API}/api/new-listing-scan`, { method: 'POST' });
            if (response.ok) {
                if (window.addToast) window.addToast('Scan gestartet...', 'info');
                // Poll for results with increasing intervals
                const pollResults = async (attempts = 0) => {
                    if (attempts > 12) { // Max 2 minutes (12 * 10s)
                        setIsScanning(false);
                        updateScanCache('newlisting_scanning', false);
                        if (window.addToast) window.addToast('Scan dauert länger...', 'info');
                        return;
                    }
                    try {
                        const res = await fetch(`${API}/api/new-listing-results`);
                        if (res.ok) {
                            const data = await res.json();
                            const items = data.data || [];
                            const isNewData = data.cached_at && data.cached_at !== prevCachedAt;
                            if (isNewData) {
                                setResults(items);
                                setStats(data.stats);
                                updateScanCache('newlisting_results', items);
                                updateScanCache('newlisting_stats', data.stats);
                                setIsScanning(false);
                                updateScanCache('newlisting_scanning', false);
                                if (window.addToast) window.addToast(`Scan fertig: ${items.length} Ergebnisse`, 'success');
                                return;
                            }
                        }
                    } catch (e) { console.error(e); }
                    pollTimeoutRef.current = setTimeout(() => pollResults(attempts + 1), 10000); // Retry in 10s
                };
                pollTimeoutRef.current = setTimeout(() => pollResults(0), 5000); // First poll after 5s
            } else {
                setIsScanning(false);
                updateScanCache('newlisting_scanning', false);
            }
        } catch (err) {
            if (window.addToast) window.addToast('Scan-Fehler', 'error');
            setIsScanning(false);
            updateScanCache('newlisting_scanning', false);
        }
    };

    const getExhaustionColor = (exhaustion) => {
        if (exhaustion >= 70) return 'signal-bullish';   // Hohe Exhaustion = gut für Short = grün
        if (exhaustion >= 40) return 'signal-lightdiv';  // Mittel = gelb/orange
        return 'signal-bearish';                         // Niedrig = Pump noch aktiv = rot
    };
    const pdTypeLabel = (item) => {
        const cat = item.trade_category || '';
        if (cat === 'NEW_LISTING_DUMP') return 'New Listing Dump';
        if (cat === 'ACTIVE_PUMP_WATCH') return 'Active Pump Watch';
        if (cat === 'NEW_LISTING_TOO_EARLY') return 'Zu frueh';
        if (cat === 'NEW_LISTING_EXPIRED') return 'Alt/Radar';
        if (cat === 'UNKNOWN_LISTING_AGE') return 'Alter unklar';
        if ((item.listing_source || '').toLowerCase() === 'new_listing') return 'New Listing';
        return 'Radar';
    };
    const pdTypeClass = (item) => {
        const cat = item.trade_category || '';
        if (cat === 'NEW_LISTING_DUMP') return 'signal-bearish';
        if (cat === 'ACTIVE_PUMP_WATCH') return 'signal-lightdiv';
        if (cat === 'NEW_LISTING_TOO_EARLY' || cat === 'UNKNOWN_LISTING_AGE') return 'signal-abwarten';
        return 'signal-neutral';
    };

    return (
        <div className="space-y-6">

            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey="new_listing" />

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('symbol')}>Symbol{sortKey === 'symbol' && ' ↓'}</th>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('exchange')}>Exchange{sortKey === 'exchange' && ' ↓'}</th>
                            <th className="text-center py-2 px-2 sortable-header" onClick={() => toggleSort('trade_category')}>Typ{sortKey === 'trade_category' && ' ↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('price')}>Preis{sortKey === 'price' && ' ↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('pump_pct')}>Pump%{sortKey === 'pump_pct' && ' ↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('from_ath_pct')}>vom ATH%{sortKey === 'from_ath_pct' && ' ↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('exhaustion_score')}>Exhaustion{sortKey === 'exhaustion_score' && ' ↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('funding_rate')}>Funding{sortKey === 'funding_rate' && ' ↓'}</th>
                            <th className="text-center py-2 px-2 sortable-header" onClick={() => toggleSort('signal')}>Signal{sortKey === 'signal' && ' ↓'}</th>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('listing_date')}>Gelistet{sortKey === 'listing_date' && ' ↓'}</th>
                        </tr>
                    </thead>
                    <tbody>

// Volume Spikes Tab
function VolumeSpikesTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [isScanning, setIsScanning] = useState(scanCache.vs_scanning || false);
    const [results, setResults] = useState(scanCache.vs_results || []);
    const { sorted, toggleSort, sortKey } = useSortable(results, 'score');
    const pollTimeoutRef = useRef(null);

    // Cleanup polling on unmount
    useEffect(() => {
        return () => { if (pollTimeoutRef.current) clearTimeout(pollTimeoutRef.current); };
    }, []);

    const handleScan = async () => {
        setIsScanning(true);
        updateScanCache('vs_scanning', true);
        // Save current cached_at BEFORE scan starts
        let prevCachedAt = null;
        try {
            const preCheck = await fetch(`${API}/api/volume-spikes-results`);
            if (preCheck.ok) {
                const preData = await preCheck.json();
                prevCachedAt = preData.cached_at || null;
            }
        } catch(e) {}
        try {
            const response = await fetch(`${API}/api/volume-spikes-scan`, { method: 'POST' });
            if (response.ok) {
                if (window.addToast) window.addToast('Scan gestartet...', 'info');
                // Poll for results with increasing intervals
                const pollResults = async (attempts = 0) => {
                    if (attempts > 12) { // Max 2 minutes (12 * 10s)
                        setIsScanning(false);
                        updateScanCache('vs_scanning', false);
                        if (window.addToast) window.addToast('Scan dauert länger...', 'info');
                        return;
                    }
                    try {
                        const res = await fetch(`${API}/api/volume-spikes-results`);
                        if (res.ok) {
                            const data = await res.json();
                            const items = data.data || [];
                            const isNewData = data.cached_at && data.cached_at !== prevCachedAt;
                            if (isNewData) {
                                setResults(items);
                                updateScanCache('vs_results', items);
                                setIsScanning(false);
                                updateScanCache('vs_scanning', false);
                                if (window.addToast) window.addToast(`Scan fertig: ${items.length} Ergebnisse`, 'success');
                                return;
                            }
                        }
                    } catch (e) { console.error(e); }
                    pollTimeoutRef.current = setTimeout(() => pollResults(attempts + 1), 10000); // Retry in 10s
                };
                pollTimeoutRef.current = setTimeout(() => pollResults(0), 5000); // First poll after 5s
            } else {
                setIsScanning(false);
                updateScanCache('vs_scanning', false);
            }
        } catch (err) {
            console.error('Error:', err);
            setIsScanning(false);
            updateScanCache('vs_scanning', false);
        }
    };

    // Always load latest from server on mount
    useEffect(() => {
        const fetchResults = async () => {
            try {
                const response = await fetch(`${API}/api/volume-spikes-results`);
                if (response.ok) {
                    const data = await response.json();
                    const items = data.data || [];
                    if (items.length > 0) {
                        setResults(items);
                        updateScanCache('vs_results', items);
                    }
                }
            } catch (err) { console.error('Error:', err); }
        };
        fetchResults();
    }, []);

    return (
        <div className="space-y-6">
            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey="volume_spikes" />

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('ticker')}>Ticker</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('price')}>Preis</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('change_pct')}>Änderung%</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('volume')}>Volumen</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('rvol')}>RVOL</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('dollar_volume')}>$-Volumen</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.map((item, idx) => (
                            <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker(item.ticker)}>
                                <td className="py-3 px-2 font-semibold">{item.ticker}</td>
                                <td className="py-3 px-2 text-right">${item.price?.toFixed(2)}</td>
                                <td className={`py-3 px-2 text-right ${item.change_pct >= 0 ? 'color-positive' : 'color-negative'}`}>{item.change_pct?.toFixed(2)}%</td>
                                <td className="py-3 px-2 text-right">{item.volume ? (item.volume / 1000000).toFixed(2) + 'M' : '–'}</td>
                                <td className="py-3 px-2 text-right">{item.rvol?.toFixed(2)}</td>
                                <td className="py-3 px-2 text-right">{item.dollar_volume ? `$${(item.dollar_volume / 1000000).toFixed(2)}M` : '–'}</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

        } catch (e) { console.error('AT status error', e); }
        finally { setLoading(false); }
    };

    useEffect(() => {
        fetchStatus();
        const interval = setInterval(fetchStatus, 5000);
        return () => { clearInterval(interval); if (actionTimerRef.current) clearTimeout(actionTimerRef.current); };
    }, []);

    const doAction = async (endpoint, body = null) => {
        setActionLoading(endpoint);
        try {
            const opts = { method: 'POST', headers: { 'Content-Type': 'application/json' } };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(`${API}/api/autotrader/${endpoint}`, opts);

                            <span style={{ fontSize: 11, fontWeight: 600, padding: '3px 10px', borderRadius: 20, background: 'rgba(139,92,246,0.1)', color: '#a78bfa' }}>

                        </button>
                    ) : (
                        <button onClick={() => doAction('stop')} disabled={actionLoading} className="button" style={{ padding: '8px 20px', background: '#ef4444' }}>
                            {actionLoading === 'stop' ? 'Stoppt...' : 'Stoppen'}
                        </button>
                    )}
                    <button onClick={() => doAction('scan-once')} disabled={actionLoading || isRunning} className="button" style={{ padding: '8px 20px', background: '#3b82f6' }}>
                        {actionLoading === 'scan-once' ? 'Scannt...' : 'Einmal scannen'}
                    </button>
                </div>
            </div>

            {/* Stats Grid */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: 10 }}>
                {[
                    { label: 'Positionen', value: `${positions.length} / ${cfg.max_positions || 5}`, color: '#3b82f6' },
                    { label: 'Trades heute', value: st.trades_today || 0, color: '#8b5cf6' },
                    { label: 'Tages P&L', value: `${(st.daily_pnl || 0) >= 0 ? '+' : ''}${(st.daily_pnl || 0).toFixed(1)}%`, color: (st.daily_pnl || 0) >= 0 ? '#10b981' : '#ef4444' },
                    { label: 'Position Size', value: `$${cfg.position_size || 2000}`, color: '#f59e0b' },
                    { label: 'Min R:R', value: `${cfg.min_rr || 2.0}x`, color: '#06b6d4' },
                    { label: 'Letzter Scan', value: st.last_scan ? new Date(st.last_scan).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'}) : '—', color: '#64748b' },
                ].map((s, i) => (
                    <div key={i} className="card" style={{ padding: 14, borderRadius: 10, border: '1px solid var(--border-color)', textAlign: 'center' }}>
                        <div style={{ fontSize: 11, color: 'var(--text-muted)', marginBottom: 4 }}>{s.label}</div>
                        <div style={{ fontSize: 20, fontWeight: 800, color: s.color }}>{s.value}</div>
                    </div>
                ))}
            </div>

            {/* Positions */}
            <div className="card" style={{ padding: 16, borderRadius: 12, border: '1px solid var(--border-color)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                    <h3 style={{ fontSize: 15, fontWeight: 700, margin: 0 }}>Offene Positionen</h3>
                    {positions.length > 0 && (
                        <button onClick={() => doAction('clear-positions')} style={{ fontSize: 11, color: '#ef4444', background: 'none', border: 'none', cursor: 'pointer', fontWeight: 600 }}>
                            Alle zurücksetzen
                        </button>
                    )}
                </div>
                {positions.length === 0 ? (
                    <div style={{ textAlign: 'center', padding: '30px 0', color: 'var(--text-muted)', fontSize: 13 }}>
                        Keine offenen Positionen
                    </div>
                ) : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                        {positions.map((p, i) => (
                            <div key={i} style={{ padding: '12px 14px', background: 'var(--card-bg)', borderRadius: 10, border: '1px solid var(--border-color)' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                        <span style={{ fontSize: 15, fontWeight: 800 }}>{p.ticker}</span>
                                        <span style={{ fontSize: 10, fontWeight: 700, padding: '2px 8px', borderRadius: 6, background: 'rgba(59,130,246,0.12)', color: '#3b82f6' }}>Grade {p.grade}</span>
                                        <span style={{ fontSize: 10, fontWeight: 600, padding: '2px 6px', borderRadius: 4, background: p.mode === 'AUTO' ? 'rgba(16,185,129,0.12)' : 'rgba(245,158,11,0.12)', color: p.mode === 'AUTO' ? '#10b981' : '#f59e0b' }}>{p.mode}</span>
                                    </div>
                                    <span style={{ fontSize: 12, fontWeight: 700, color: '#3b82f6' }}>{p.shares} Shares</span>
                                </div>
                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 8, fontSize: 11 }}>
                                    <div><span style={{ color: 'var(--text-muted)' }}>Entry</span><div style={{ fontWeight: 700 }}>${p.entry}</div></div>
                                    <div><span style={{ color: 'var(--text-muted)' }}>Stop</span><div style={{ fontWeight: 700, color: '#ef4444' }}>${p.stop}</div></div>
                                    <div><span style={{ color: 'var(--text-muted)' }}>TP1</span><div style={{ fontWeight: 700, color: '#10b981' }}>${p.tp1}</div></div>
                                    <div><span style={{ color: 'var(--text-muted)' }}>TP2</span><div style={{ fontWeight: 700, color: '#10b981' }}>${p.tp2}</div></div>
                                    <div><span style={{ color: 'var(--text-muted)' }}>R:R</span><div style={{ fontWeight: 700, color: '#3b82f6' }}>{p.rr}x</div></div>
                                </div>
                                <div style={{ fontSize: 10, color: 'var(--text-muted)', marginTop: 4 }}>{p.date} {p.time} — Score: {p.score_pct}%</div>
                            </div>
                        ))}
                    </div>
                )}
            </div>

            {/* Settings */}
            <div className="card" style={{ padding: 16, borderRadius: 12, border: '1px solid var(--border-color)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
                    <h3 style={{ fontSize: 15, fontWeight: 700, margin: 0 }}>Einstellungen</h3>
                    {editConfig ? (
                        <div style={{ display: 'flex', gap: 8 }}>
                            <button onClick={saveConfig} className="button" style={{ padding: '5px 14px', fontSize: 12, background: '#10b981' }}>Speichern</button>
                            <button onClick={() => setEditConfig(null)} style={{ padding: '5px 14px', fontSize: 12, background: 'none', border: '1px solid var(--border-color)', borderRadius: 6, cursor: 'pointer', color: 'var(--text-color)' }}>Abbrechen</button>
                        </div>
                    ) : (
                        <button onClick={() => setEditConfig({...cfg})} style={{ padding: '5px 14px', fontSize: 12, background: 'none', border: '1px solid var(--border-color)', borderRadius: 6, cursor: 'pointer', color: 'var(--text-color)' }}>Bearbeiten</button>
                    )}
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 10 }}>
                    {[
                        { key: 'mode', label: 'Modus', type: 'select', options: [{ v: 'semi', l: 'Semi Auto (TWS bestätigen)' }, { v: 'full', l: 'Full Auto (sofort aktiv)' }] },
                        { key: 'max_positions', label: 'Max Positionen', type: 'number' },
                        { key: 'position_size', label: 'Position Size ($)', type: 'number' },
                        { key: 'min_rr', label: 'Min Risk:Reward', type: 'number', step: 0.1 },
                        { key: 'min_bi_pct', label: 'Min BI Score (%)', type: 'number' },
                        { key: 'min_smart_money', label: 'Min Smart Money Hits', type: 'number' },
                        { key: 'scan_interval_min', label: 'Scan Intervall (Min)', type: 'number' },
                        { key: 'max_daily_loss_pct', label: 'Max Tagesverlust (%)', type: 'number', step: 0.5 },
                        { key: 'cooldown_days', label: 'Cooldown (Tage)', type: 'number' },
                        { key: 'min_price', label: 'Min Preis ($)', type: 'number' },
                        { key: 'min_volume', label: 'Min Volumen', type: 'number' },
                        { key: 'max_tickers_scan', label: 'Max Tickers / Scan', type: 'number' },
                    ].map(({ key, label, type, options, step }) => (
                        <div key={key}>
                            <label style={{ fontSize: 11, color: 'var(--text-muted)', display: 'block', marginBottom: 3 }}>{label}</label>
                            {type === 'select' ? (
                                <select value={cfg[key] || ''} disabled={!editConfig}
                                    onChange={e => editConfig && setEditConfig({...editConfig, [key]: e.target.value})}
                                    style={{ width: '100%', padding: '7px 10px', borderRadius: 6, border: '1px solid var(--border-color)', background: 'var(--card-bg)', color: 'var(--text-color)', fontSize: 13 }}>
                                    {options.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
                                </select>
                            ) : (
                                <input type="number" value={cfg[key] ?? ''} disabled={!editConfig} step={step || 1}
                                    onChange={e => editConfig && setEditConfig({...editConfig, [key]: parseFloat(e.target.value) || 0})}
                                    style={{ width: '100%', padding: '7px 10px', borderRadius: 6, border: '1px solid var(--border-color)', background: 'var(--card-bg)', color: 'var(--text-color)', fontSize: 13, boxSizing: 'border-box' }} />
                            )}
                        </div>
                    ))}
                </div>
                <div style={{ marginTop: 10, fontSize: 10, color: 'var(--text-muted)', fontStyle: 'italic' }}>
                    Semi Auto: Orders werden in TWS als inaktiv platziert — du bestätigst manuell. Full Auto: Orders gehen sofort live.
                </div>
            </div>

            {/* Log */}
            <div className="card" style={{ padding: 16, borderRadius: 12, border: '1px solid var(--border-color)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: showLog ? 12 : 0, cursor: 'pointer' }} onClick={() => setShowLog(!showLog)}>
                    <h3 style={{ fontSize: 15, fontWeight: 700, margin: 0 }}>Log ({logEntries.length})</h3>
                    <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>{showLog ? '▲ Einklappen' : '▼ Aufklappen'}</span>
                </div>
                {showLog && (
                    <div style={{ maxHeight: 300, overflowY: 'auto', fontSize: 11, fontFamily: '"SF Mono", "Fira Code", monospace' }}>
                        {logEntries.length === 0 ? (
                            <div style={{ color: 'var(--text-muted)', padding: '16px 0', textAlign: 'center' }}>Noch keine Log-Einträge</div>
                        ) : logEntries.map((entry, i) => (
                            <div key={i} style={{ padding: '4px 0', borderBottom: '1px solid var(--border-color)', display: 'flex', gap: 8 }}>
                                <span style={{ color: '#64748b', flexShrink: 0 }}>{entry.time?.substring(11) || ''}</span>
                                <span style={{ fontWeight: 600, flexShrink: 0, color: entry.level === 'ERROR' ? '#ef4444' : entry.level === 'WARN' ? '#f59e0b' : entry.level === 'TRADE' ? '#10b981' : '#64748b' }}>{entry.level}</span>
                                <span style={{ color: 'var(--text-color)' }}>{entry.msg}</span>
                            </div>
                        ))}
                    </div>
                )}
            </div>

            {/* IBKR Hinweis */}
            <div style={{ padding: 14, borderRadius: 10, background: 'rgba(245,158,11,0.06)', border: '1px solid rgba(245,158,11,0.15)', fontSize: 12, color: '#f59e0b' }}>
                <strong>Hinweis:</strong> Der Auto-Trader benötigt eine aktive IBKR TWS/Gateway Verbindung auf dem Server. Ohne IBKR-Verbindung werden Signale erkannt, aber keine Orders platziert.
            </div>
        </div>
    );
}

function ChartAnalyseTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {} }) {
    const [searchTicker, setSearchTicker] = useState('');
    const [activeTicker, setActiveTicker] = useState(null);
    const [searchResults, setSearchResults] = useState([]);
    const [showDropdown, setShowDropdown] = useState(false);
    const searchTimeout = useRef(null);
    const [tickerData, setTickerData] = useState(null);
    const [chartData, setChartData] = useState(null);
    const [loading, setLoading] = useState(false);
    const [timeframe, setTimeframe] = useState('4H');
    const [overlays, setOverlays] = useState({ ema: true, vwap: false, sr: false, fib: false, patterns: false, bb: false, vrvp: true, vol: false });
    const [aiData, setAiData] = useState(null);
    const [aiLoading, setAiLoading] = useState(false);
    const [showInfoPanel, setShowInfoPanel] = useState(true);
    const chartContainer = useRef(null);
    const chartRef = useRef(null);
    const candleSeriesRef = useRef(null);
    const overlaySeriesRef = useRef([]);
    const vrvpSubsRef = useRef([]);
    const savedVisibleRange = useRef(null);
    const prevOverlaysRef = useRef(null);

    const TIMEFRAMES = ['5m', '15m', '1H', '4H', '1D', '1W'];
    const EMA_COLORS = { ema9: '#f59e0b', ema20: '#3b82f6', ema50: '#ef4444', ema100: '#8b5cf6', ema200: '#14b8a6' };

    const performSearch = async (ticker) => {
        const t = (ticker || searchTicker).trim().toUpperCase();
        if (!t) return;
        setLoading(true);
        setAiData(null);
        setShowDropdown(false);
        try {
            const response = await fetch(`${API}/api/ticker-detail?ticker=${t}`);
            if (response.ok) {
                const data = await response.json();
                setTickerData(data);
                setActiveTicker(t);
                setSearchTicker(t);
            } else {
                setTickerData(null);
                setActiveTicker(null);
                if (window.addToast) window.addToast('Ticker nicht gefunden', 'error');
            }
        } catch (err) {
            setTickerData(null);
            if (window.addToast) window.addToast('Suchfehler', 'error');
        } finally {
            setLoading(false);
        }
    };

    // Autocomplete search
    const handleSearchInput = (val) => {
        setSearchTicker(val.toUpperCase());
        if (searchTimeout.current) clearTimeout(searchTimeout.current);
        if (val.length < 1) { setSearchResults([]); setShowDropdown(false); return; }
        searchTimeout.current = setTimeout(async () => {
            try {
                const res = await fetch(`${API}/api/ticker-search?q=${encodeURIComponent(val)}`);
                if (res.ok) {
                    const data = await res.json();
                    setSearchResults(data.results || []);
                    setShowDropdown((data.results || []).length > 0);
                }
            } catch {}
        }, 300);
    };

    // Fetch chart data when ticker or timeframe changes
    useEffect(() => {
        if (!activeTicker) return;
        const controller = new AbortController();
        const fetchChart = async () => {
            try {
                const allOverlays = 'ema,vwap,sr,fib,patterns,vrvp';
                const res = await fetch(`${API}/api/chart-data?ticker=${activeTicker}&timeframe=${timeframe}&overlays=${allOverlays}`, { signal: controller.signal });
                if (controller.signal.aborted) return;
                if (res.ok) {
                    setChartData(await res.json());
                } else {
                    setChartData({ ticker: activeTicker, timeframe, candles: [], error: 'Keine Chart-Daten verfügbar' });
                }
            } catch (err) {
                if (err.name === 'AbortError') return;
                setChartData({ ticker: activeTicker, timeframe, candles: [], error: 'Chart-Daten konnten nicht geladen werden' });
            }
        };
        fetchChart();
        return () => controller.abort();
    }, [activeTicker, timeframe]);

    // Render chart
    useEffect(() => {
        if (!chartData || !chartContainer.current) return;
        if (!chartData.candles || chartData.candles.length === 0) return;
        try {
            const isOverlayChange = prevOverlaysRef.current && chartData === prevOverlaysRef.current._chartData;
            if (chartRef.current) {
                try {
                    savedVisibleRange.current = {
                        logical: chartRef.current.timeScale().getVisibleLogicalRange(),
                        scrollPos: chartRef.current.timeScale().scrollPosition(),
                    };
                } catch(e) {}
                chartRef.current.remove();
            }
            prevOverlaysRef.current = { ...overlays, _chartData: chartData };
            overlaySeriesRef.current = [];

            const { createChart, LineStyle, CrosshairMode } = window.LightweightCharts;
            const containerWidth = chartContainer.current.clientWidth || 900;
            const chartHeight = 500;

            chartRef.current = createChart(chartContainer.current, {
                layout: { textColor: '#999', background: { color: '#1a1a2e' }, fontSize: 11 },
                grid: { vertLines: { color: 'rgba(255,255,255,0.04)' }, horzLines: { color: 'rgba(255,255,255,0.04)' } },
                width: containerWidth, height: chartHeight,
                crosshair: { mode: CrosshairMode.Normal },
                rightPriceScale: { borderColor: 'rgba(255,255,255,0.1)' },
                timeScale: { timeVisible: timeframe.includes('m') || timeframe.includes('H'), secondsVisible: false, borderColor: 'rgba(255,255,255,0.1)', rightOffset: 12, barSpacing: 8, minBarSpacing: 4 },
            });

            candleSeriesRef.current = chartRef.current.addCandlestickSeries({
                upColor: '#10b981', downColor: '#ef4444',
                borderUpColor: '#10b981', borderDownColor: '#ef4444',
                wickUpColor: '#10b981', wickDownColor: '#ef4444',
            });
            const candles = (chartData.candles || []).map(c => ({
                time: c.time, open: c.open, high: c.high, low: c.low, close: c.close
            }));
            if (candles.length > 0) candleSeriesRef.current.setData(candles);

            // Volume overlay
            if (overlays.vol && chartData.volume) {
                const volSeries = chartRef.current.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol' });
                chartRef.current.priceScale('vol').applyOptions({ scaleMargins: { top: 0.85, bottom: 0 } });
                volSeries.setData(chartData.volume);
                overlaySeriesRef.current.push(volSeries);
            }

            // EMA lines
            if (overlays.ema && chartData.ema) {
                Object.entries(chartData.ema).forEach(([key, data]) => {
                    if (data && data.length > 0) {
                        const line = chartRef.current.addLineSeries({
                            color: EMA_COLORS[key] || '#888', lineWidth: key === 'ema200' ? 2 : 1,
                            priceLineVisible: false, lastValueVisible: false, title: key.toUpperCase(),
                        });
                        line.setData(data);
                        overlaySeriesRef.current.push(line);
                    }
                });
            }

            // VWAP
            if (overlays.vwap && chartData.vwap && chartData.vwap.length > 0) {
                const vwapLine = chartRef.current.addLineSeries({
                    color: '#f97316', lineWidth: 2, lineStyle: LineStyle.Dotted,
                    priceLineVisible: false, lastValueVisible: false, title: 'VWAP',
                });
                vwapLine.setData(chartData.vwap);
                overlaySeriesRef.current.push(vwapLine);
            }

            // Bollinger Bands
            if (overlays.bb && chartData.bollinger && chartData.bollinger.length > 0) {
                const bbUpper = chartRef.current.addLineSeries({ color: 'rgba(147,51,234,0.5)', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, title: 'BB+' });
                const bbLower = chartRef.current.addLineSeries({ color: 'rgba(147,51,234,0.5)', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, title: 'BB-' });
                bbUpper.setData(chartData.bollinger.map(b => ({ time: b.time, value: b.upper })));
                bbLower.setData(chartData.bollinger.map(b => ({ time: b.time, value: b.lower })));
                overlaySeriesRef.current.push(bbUpper, bbLower);
            }

            // Support/Resistance
            if (overlays.sr && chartData.sr) {
                const sr = chartData.sr;
                const addPriceLine = (price, title, color, style, width) => {
                    if (price && price > 0) {
                        candleSeriesRef.current.createPriceLine({ price, color, lineWidth: width || 1, lineStyle: style || LineStyle.Dashed, axisLabelVisible: true, title });
                    }
                };
                if (sr.support_levels) {
                    sr.support_levels.slice(0, 4).forEach((lvl, i) => {
                        const lw = Math.min(3, Math.max(1, Math.ceil((lvl.strength || 1) / 2)));
                        addPriceLine(lvl.price, `S${i+1} ${lvl.type || ''}`, '#10b981', (lvl.strength || 1) >= 4 ? LineStyle.Solid : LineStyle.Dashed, lw);
                    });
                }
                if (sr.resistance_levels) {
                    sr.resistance_levels.slice(0, 4).forEach((lvl, i) => {
                        const lw = Math.min(3, Math.max(1, Math.ceil((lvl.strength || 1) / 2)));
                        addPriceLine(lvl.price, `R${i+1} ${lvl.type || ''}`, '#ef4444', (lvl.strength || 1) >= 4 ? LineStyle.Solid : LineStyle.Dashed, lw);
                    });
                }
                if (sr.pivot) addPriceLine(sr.pivot, 'Pivot', '#fbbf24', LineStyle.Solid, 1);
                if (sr.pdh) addPriceLine(sr.pdh, 'PDH', '#94a3b8', LineStyle.Dotted, 1);
                if (sr.pdl) addPriceLine(sr.pdl, 'PDL', '#94a3b8', LineStyle.Dotted, 1);
                if (sr.period_high) addPriceLine(sr.period_high, 'Period High', '#64748b', LineStyle.Dotted, 1);
                if (sr.period_low) addPriceLine(sr.period_low, 'Period Low', '#64748b', LineStyle.Dotted, 1);
            }

            // Diagonal Trendlines
            if (overlays.sr && chartData.trendlines) {
                chartData.trendlines.forEach(tl => {
                    if (tl.points && tl.points.length >= 2) {
                        const color = tl.type === 'support' ? '#10b981' : '#ef4444';
                        const tlLine = chartRef.current.addLineSeries({
                            color, lineWidth: 2, lineStyle: LineStyle.Solid,
                            lastValueVisible: false, priceLineVisible: false,
                            crosshairMarkerVisible: false,
                        });
                        tlLine.setData(tl.points.map(p => ({ time: p.time, value: p.price })));
                        overlaySeriesRef.current.push(tlLine);
                    }
                });
            }

            // VRVP
            if (overlays.vrvp && chartData.vrvp) {
