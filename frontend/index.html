// SIGNAL PERFORMANCE TAB — Track-Record des Signal-Trackers
// Daten: GET /api/signal-performance?days=N (Pro/Elite via Tab-Gate,
// Admin immer). Buckets siehe modules/signal_tracker.load_performance_summary.
// ══════════════════════════════════════════════════════════════
function SignalPerformanceTab() {
    const [days, setDays] = useState(30);
    const [perf, setPerf] = useState(null);
    const [perfError, setPerfError] = useState('');
    const [forbidden, setForbidden] = useState(false);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
        let cancelled = false;
        const loadPerformance = async () => {
            setLoading(true);
            setPerfError('');
            setForbidden(false);
            try {
                const res = await fetch(`${API}/api/signal-performance?days=${days}`);
                if (cancelled) return;
                if (res.ok) {
                    setPerf(await res.json());
                } else if (res.status === 403) {
                    setForbidden(true);
                    setPerf(null);
                } else {
                    let detail = '';
                    try { detail = (await res.json()).detail || ''; } catch (e) {}
                    setPerfError(`Performance-Daten konnten nicht geladen werden (${res.status})${detail ? `: ${detail}` : ''}`);
                }
            } catch (err) {
                if (!cancelled) setPerfError('Performance-Daten konnten nicht geladen werden (Netzwerkfehler).');
            }
            if (!cancelled) setLoading(false);
        };
        loadPerformance();
        return () => { cancelled = true; };
    }, [days]);

    const fmtR = (v) => (v === null || v === undefined) ? '—' : `${Number(v) > 0 ? '+' : ''}${Number(v).toFixed(2)}R`;
    const fmtPct = (v) => (v === null || v === undefined) ? '—' : `${Number(v).toFixed(1)}%`;
    const rTone = (v) => (v ?? 0) > 0 ? 'text-green-600' : (v ?? 0) < 0 ? 'text-red-600' : 'text-gray-600';
    const statusBadge = (sig) => {
        const status = sig.status || 'OPEN';
        if (status === 'STOP_HIT') return { label: 'STOP', cls: 'bg-red-100 text-red-700' };
        if (status === 'TP2_HIT') return { label: 'TP2', cls: 'bg-green-100 text-green-700' };
        if (status === 'TP1_HIT_OPEN') return { label: 'TP1 · OPEN', cls: 'bg-blue-100 text-blue-700' };
        if (status === 'EXPIRED') return sig.tp1_hit_at
            ? { label: 'TP1', cls: 'bg-green-100 text-green-700' }
            : { label: 'EXPIRED', cls: 'bg-gray-100 text-gray-600' };
        if (status === 'UNTRACKED') return { label: 'UNTRACKED', cls: 'bg-gray-100 text-gray-500' };
        return { label: 'OPEN', cls: 'bg-blue-100 text-blue-700' };
    };

    const total = perf?.total || {};
    const scanners = Object.entries(perf?.per_scanner || {}).sort((a, b) => (b[1].sum_r ?? 0) - (a[1].sum_r ?? 0));
    const recent = perf?.recent || [];
    const hasSignals = (total.signals || 0) > 0;

    const headCards = [
        { label: 'Signale gesamt', value: String(total.signals ?? 0), cls: 'text-gray-900' },
        { label: 'Hit-Rate', value: fmtPct(total.win_rate_pct), cls: 'text-gray-900', hint: 'TP1+TP2 vs. entschieden' },
        { label: 'Summe R', value: fmtR(total.sum_r), cls: rTone(total.sum_r) },
        { label: 'Ø R', value: fmtR(total.avg_r), cls: rTone(total.avg_r) },
        { label: 'Offene Positionen', value: String(total.open ?? 0), cls: 'text-blue-600' },
    ];

    return (
        <div className="space-y-6">
            {/* Kopf: Titel + Zeitraum-Schalter 7/30/90 */}
            <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                    <h2 className="text-lg font-bold text-gray-900">Signal-Performance</h2>
                    <div className="text-xs text-gray-500">Track-Record aller versendeten Trade-Signale — automatisch ausgewertet, nicht kuratiert.</div>
                </div>
                <div className="flex items-center gap-1">
                    {[7, 30, 90].map(d => (
                        <button key={d} onClick={() => setDays(d)}
                            className={`px-3 py-1.5 rounded-lg text-sm font-medium border ${days === d ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}>
                            {d} Tage
                        </button>
                    ))}
                </div>
            </div>

            {forbidden && (
                <div className="card border border-amber-200 bg-amber-50 text-amber-900 px-4 py-4 rounded-lg text-sm">
                    <div className="font-semibold">Performance-Ansicht benötigt Pro-Plan</div>
                    <div>Der Track-Record (Hit-Rate, R-Bilanz, letzte Signale) ist Teil von Pro und Elite. Upgrade über „Pläne &amp; Preise“.</div>
                </div>
            )}

            {perfError && !forbidden && (
                <div className="card border border-red-200 bg-red-50 text-red-800 px-4 py-3 rounded-lg text-sm">{perfError}</div>
            )}

            {loading && !perf && !forbidden && !perfError && (
                <div className="card border border-gray-200 p-6 rounded-lg text-center text-gray-400 animate-pulse">Lade Performance-Daten…</div>
            )}

            {perf && !forbidden && !hasSignals && (
                <div className="card border border-gray-200 p-8 rounded-lg text-center text-gray-500">
                    <div className="font-semibold text-gray-700 mb-1">Noch keine Signale im gewählten Zeitraum</div>
                    <div className="text-sm">Sobald Scanner-Alerts versendet werden, erscheint hier automatisch der Track-Record. Zeitraum vergrößern (90 Tage) kann helfen.</div>
                </div>
            )}

            {perf && !forbidden && hasSignals && (
                <>
                    {/* Kopf-Karten */}
                    <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                        {headCards.map(c => (
                            <div key={c.label} className="card border border-gray-200 rounded-lg p-4">
                                <div className="text-xs text-gray-500">{c.label}</div>
                                <div className={`text-2xl font-bold ${c.cls}`}>{c.value}</div>
                                {c.hint && <div className="text-[10px] text-gray-400 mt-0.5">{c.hint}</div>}
                            </div>
                        ))}
                    </div>

                    {/* Tabelle pro Scanner */}
                    <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                        <h3 className="font-semibold text-gray-900 mb-3">Performance pro Scanner</h3>
                        <table className="w-full text-sm">
                            <thead className="border-b border-gray-200 text-gray-500">
                                <tr>
                                    <th className="text-left py-2 px-1">Scanner</th>
                                    <th className="text-right py-2 px-1">Signale</th>
                                    <th className="text-right py-2 px-1">TP1</th>
                                    <th className="text-right py-2 px-1">TP2</th>
                                    <th className="text-right py-2 px-1">Stop</th>
                                    <th className="text-right py-2 px-1">Offen</th>
                                    <th className="text-right py-2 px-1">Hit-Rate</th>
                                    <th className="text-right py-2 px-1">Ø R</th>
                                    <th className="text-right py-2 px-1">Σ R</th>
                                    <th className="text-right py-2 px-1">Alerts/Tag</th>
                                </tr>
                            </thead>
                            <tbody>
                                {scanners.map(([scanner, s]) => (
                                    <tr key={scanner} className={`border-b border-gray-100 ${(s.sum_r ?? 0) > 0 ? 'bg-green-50' : (s.sum_r ?? 0) < 0 ? 'bg-red-50' : ''}`}>
                                        <td className="py-2 px-1 font-medium text-gray-900">{scanner}</td>
                                        <td className="py-2 px-1 text-right">{s.signals ?? 0}</td>
                                        <td className="py-2 px-1 text-right text-green-700">{s.tp1_hit ?? 0}</td>
                                        <td className="py-2 px-1 text-right text-green-700 font-semibold">{s.tp2_hit ?? 0}</td>
                                        <td className="py-2 px-1 text-right text-red-600">{s.stop_hit ?? 0}</td>
                                        <td className="py-2 px-1 text-right text-blue-600">{s.open ?? 0}</td>
                                        <td className="py-2 px-1 text-right font-medium">{fmtPct(s.win_rate_pct)}</td>
                                        <td className={`py-2 px-1 text-right ${rTone(s.avg_r)}`}>{fmtR(s.avg_r)}</td>
                                        <td className={`py-2 px-1 text-right font-semibold ${rTone(s.sum_r)}`}>{fmtR(s.sum_r)}</td>
                                        <td className="py-2 px-1 text-right text-gray-500">{(s.alerts_per_day ?? 0).toFixed(2)}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {/* Letzte Signale */}
                    <div className="card border border-gray-200 p-6 rounded-lg">
                        <h3 className="font-semibold text-gray-900 mb-3">Letzte Signale</h3>
                        {recent.length === 0 && <div className="text-sm text-gray-400">Keine Signale im Zeitfenster.</div>}
                        <div className="divide-y divide-gray-100">
                            {recent.map(sig => {
                                const badge = statusBadge(sig);
                                return (
                                    <div key={sig.id} className="flex flex-wrap items-center gap-2 py-2 text-sm">
                                        <span className="text-xs text-gray-400 w-20">{String(sig.created_at || '').slice(0, 10)}</span>
                                        <span className="font-semibold text-gray-900 w-20">{sig.ticker}</span>
                                        <span className="text-xs text-gray-500 flex-1 min-w-[90px]">{sig.scanner}</span>
                                        <span className={`text-xs px-2 py-0.5 rounded font-medium ${String(sig.direction).toLowerCase() === 'short' ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-700'}`}>{String(sig.direction || 'long').toUpperCase()}</span>
                                        <span className={`text-xs px-2 py-0.5 rounded font-semibold ${badge.cls}`}>{badge.label}</span>
                                        <span className={`w-16 text-right font-medium ${rTone(sig.r_realized)}`}>{sig.r_realized === null || sig.r_realized === undefined ? '—' : fmtR(sig.r_realized)}</span>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </>
            )}

            {!forbidden && (
                <div className="text-xs text-gray-400">
                    Auswertung: First-Touch konservativ (Stop vor Ziel), TP1 = halbe Position. Crypto stündlicher Spot-Check.
                </div>
            )}
        </div>
    );
}

// Unified Crypto Signals Tab
function CryptoTradeSignalsTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [items, setItems] = useState(scanCache.crypto_trade_signals_items || []);
    const [stats, setStats] = useState(scanCache.crypto_trade_signals_stats || null);
    const [isScanning, setIsScanning] = useState(false);
    const { sorted, toggleSort, sortKey } = useSortable(items, 'entry_score');
    const pollTimeoutRef = useRef(null);
    const lastLoadedCachedAtRef = useRef(scanCache.crypto_trade_signals_cached_at || null);

    const formatPrice = (price) => {
        const p = Number(price);
        if (!Number.isFinite(p)) return '-';
        if (Math.abs(p) >= 100) return `$${p.toFixed(2)}`;
        if (Math.abs(p) >= 10) return `$${p.toFixed(3)}`;
        if (Math.abs(p) >= 1) return `$${p.toFixed(4)}`;
        if (Math.abs(p) >= 0.01) return `$${p.toFixed(6)}`;
        return `$${p.toFixed(8)}`;
    };
    const formatPct = (v) => {
        const n = Number(v);
        if (!Number.isFinite(n)) return '-';
        return `${n >= 0 ? '+' : ''}${n.toFixed(1)}%`;
    };
    const statusView = (item) => {
        const action = String(item.trade_action || item.decision || '').toUpperCase();
        if (action === 'JETZT_LONG') return { label: 'JETZT LONG', cls: 'bg-green-100 text-green-800', detail: '5m Breakout/Reclaim bestaetigt' };
        if (action === 'JETZT_SHORT') return { label: 'JETZT SHORT', cls: 'bg-red-100 text-red-800', detail: '5m Crack/Rejection bestaetigt' };
        if (action === 'LONG_ARMED') return { label: 'LONG BEREIT', cls: 'bg-cyan-100 text-cyan-800', detail: 'Kein Market-Buy: 5m Breakout/Reclaim abwarten' };
        if (action === 'SHORT_WATCH') return { label: 'SHORT WATCH', cls: 'bg-amber-100 text-amber-800', detail: 'Pump/Exhaustion: Strukturbruch abwarten' };
        return { label: 'WARTEN', cls: 'bg-amber-100 text-amber-800', detail: item.signal_label || 'Noch kein Signal' };
    };
    const targetSource = (item) => {
        const parts = [];
        if (item.vrvp_applied) parts.push(`VRVP ${item.vrvp_timeframe || ''}`.trim());
        if (item.tp1_source) parts.push(String(item.tp1_source).replaceAll('_', ' '));
        if (item.tp2_source && item.tp2_source !== item.tp1_source) parts.push(String(item.tp2_source).replaceAll('_', ' '));
        return parts.length ? parts.join(' | ') : 'Struktur/Measured Move';
    };

    const applyResults = (data) => {
        const nextItems = data.data || [];
        const nextStats = data.stats || null;
        setItems(nextItems);
        setStats(nextStats);
        updateScanCache('crypto_trade_signals_items', nextItems);
        updateScanCache('crypto_trade_signals_stats', nextStats);
        updateScanCache('crypto_trade_signals_cached_at', data.cached_at || null);
        lastLoadedCachedAtRef.current = data.cached_at || null;
        return nextItems;
    };

    const loadResults = async ({ force = false } = {}) => {
        try {
            const response = await fetch(`${API}/api/crypto-trade-signals-results`);
            if (!response.ok) return;
            const data = await response.json();
            if (!force && data.cached_at && lastLoadedCachedAtRef.current === data.cached_at) return;
            applyResults(data);
        } catch (err) {
            console.error('Error fetching crypto trade signals:', err);
        }
    };

    useEffect(() => {
        loadResults({ force: true });
        return () => { if (pollTimeoutRef.current) clearTimeout(pollTimeoutRef.current); };
    }, []);

    const schedulerLastRun = schedulerStatus?.scans?.crypto_trade_signals?.last_run || schedulerStatus?.scans?.crypto_explosion?.last_run || schedulerStatus?.scans?.new_listing?.last_run || null;
    useEffect(() => {
        if (!schedulerLastRun) return;
        loadResults({ force: false });
    }, [schedulerLastRun]);

    const handleScan = async () => {
        setIsScanning(true);
        let prevCachedAt = null;
        try {
            const preCheck = await fetch(`${API}/api/crypto-trade-signals-results`);
            if (preCheck.ok) prevCachedAt = (await preCheck.json()).cached_at || null;
        } catch(e) {}
        try {
            const response = await fetch(`${API}/api/crypto-trade-signals-scan`, { method: 'POST' });
            if (!response.ok) {
                setIsScanning(false);
                if (window.addToast) window.addToast('Crypto Signals Scan konnte nicht gestartet werden', 'error');
                return;
            }
            if (window.addToast) window.addToast('Crypto Signals Scan gestartet...', 'info');
            const pollResults = async (attempts = 0) => {
                if (attempts > 18) { setIsScanning(false); return; }
                try {
                    const res = await fetch(`${API}/api/crypto-trade-signals-results`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.cached_at && data.cached_at !== prevCachedAt) {
                            const nextItems = applyResults(data);
                            setIsScanning(false);
                            if (window.addToast) window.addToast(`Scan fertig: ${nextItems.length} Crypto-Signale`, 'success');
                            return;
                        }
                    }
                } catch (e) { console.error(e); }
                pollTimeoutRef.current = setTimeout(() => pollResults(attempts + 1), 10000);
            };
            pollTimeoutRef.current = setTimeout(() => pollResults(0), 5000);
        } catch (err) {
            console.error(err);
            setIsScanning(false);
            if (window.addToast) window.addToast('Crypto Signals Scan-Fehler', 'error');
        }
    };

    return (
        <div className="space-y-6">
            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey="crypto_trade_signals" />
            <div className="text-xs rounded-lg border border-cyan-100 bg-cyan-50 text-cyan-900 px-3 py-2">
                Crypto Signals: ein Coin bekommt genau eine Richtung. <b>JETZT LONG</b> kommt aus frischem 5m Breakout/Reclaim, <b>JETZT SHORT</b> aus bestaetigtem Pump/New-Listing-Crack. Watch/Armed ist Vorbereitung, kein Blind-Entry.
            </div>
            {stats && (
                <div className="flex gap-3 flex-wrap text-xs text-gray-500">
                    <span>{stats.result_count || items.length} Kandidaten</span>
                    <span>{stats.long_count || 0} Long</span>
                    <span>{stats.short_count || 0} Short</span>
                    <span>{stats.trade_now_count || 0} jetzt tradebar</span>
                    <span>{stats.wait_count || 0} Watch/Armed</span>
                    {stats.scanner_note && <span>{stats.scanner_note}</span>}
                </div>
            )}
            {stats && (stats.result_count || 0) > 0 && (stats.long_count || 0) === 0 && (stats.short_count || 0) > 0 && (
                <div className="text-xs rounded-lg border border-amber-100 bg-amber-50 text-amber-900 px-3 py-2">
                    Aktuell 0 Long-Kandidaten: Die Long-Engine (Explosion) zeigt nur frische, bestaetigte 5m-Ausbrueche — keiner aktiv.
                    Im Risk-Off-Markt ist typischerweise die Short-Seite (Pump-Exhaustion) aktiver. Das ist kein Fehler, sondern Marktlage.
                </div>

// Short Scanner Tab
function ShortScannerTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [breakdownStocks, setBreakdownStocks] = useState(scanCache.short_breakdown || []);
    const [isScanning, setIsScanning] = useState(scanCache.short_scanning || false);
    const [shortMessage, setShortMessage] = useState('');
    const [shortQuality, setShortQuality] = useState(null);
    const { sorted: sortedBreakdown, toggleSort: toggleBreakdownSort } = useSortable(breakdownStocks, 'change_pct');
    const pollTimeoutRef = useRef(null);

    const applyBearResults = (data, fallbackMessage = '') => {
        const bear = (data.data && data.data[0]) || {};
        const breakdown = bear.breakdown_stocks || [];
        const quality = data.data_quality || {};
        const warnings = [
            ...(data.warnings || []),
            ...((quality && quality.warnings) || []),
            ...((bear.diagnostics && bear.diagnostics.no_stock_reason) ? [bear.diagnostics.no_stock_reason] : []),
        ].filter(Boolean);
        setBreakdownStocks(breakdown);
        updateScanCache('short_breakdown', breakdown);
        setShortQuality(quality);
        setShortMessage(breakdown.length === 0 ? (warnings[0] || fallbackMessage || 'Keine aktuellen Short-Aktien gefunden. Die Sicherheitsfilter haben alle Kandidaten entfernt oder der Markt liefert gerade keine verwertbaren Loser.') : '');
        return { bear, breakdown };
    };

    const explainFailedResponse = async (response) => {
        let detail = '';
        try {
            const body = await response.json();
            detail = body.detail || body.message || '';
        } catch (e) {}
        if (response.status === 401) return 'Nicht eingeloggt oder Session abgelaufen. Bitte neu einloggen, dann Short-Scanner erneut starten.';
        if (response.status === 403) return 'Dein aktueller Plan darf den Short-Scanner nicht nutzen.';
        return `Short-Scanner konnte nicht geladen werden (${response.status})${detail ? `: ${detail}` : ''}`;
    };

    // Cleanup polling on unmount
    useEffect(() => {
        return () => { if (pollTimeoutRef.current) clearTimeout(pollTimeoutRef.current); };
    }, []);

    // Always load latest from server on mount
    useEffect(() => {
        const fetchResults = async () => {
            try {
                const response = await fetch(`${API}/api/bear-results`);
                if (response.ok) {
                    const data = await response.json();
                    applyBearResults(data);
                } else {
                    setShortMessage(await explainFailedResponse(response));
                }
            } catch (err) { console.error('Error:', err); }
        };
        fetchResults();
    }, []);

    const handleScan = async () => {
        setIsScanning(true);
        updateScanCache('short_scanning', true);
        // Save current cached_at BEFORE scan starts
        let prevCachedAt = null;
        try {
            const preCheck = await fetch(`${API}/api/bear-results`);
            if (preCheck.ok) {
                const preData = await preCheck.json();
                prevCachedAt = preData.cached_at || null;
            }
        } catch(e) {}
        try {
            const response = await fetch(`${API}/api/bear-scan`, { method: 'POST' });
            if (response.ok) {
                if (window.addToast) window.addToast('Scan gestartet...', 'info');
                // Poll for results with increasing intervals
                const pollResults = async (attempts = 0) => {
                    if (attempts > 12) { // Max 2 minutes (12 * 10s)
                        setIsScanning(false);
                        updateScanCache('short_scanning', false);
                        if (window.addToast) window.addToast('Scan dauert länger...', 'info');
                        return;
                    }
                    try {
                        const res = await fetch(`${API}/api/bear-results`);
                        if (res.ok) {
                            const data = await res.json();
                            const { breakdown } = applyBearResults(data, 'Scan fertig, aber keine handelbaren Short-Aktien gefunden.');
                            const isNewData = data.cached_at && data.cached_at !== prevCachedAt;
                            if (isNewData) {
                                setIsScanning(false);
                                updateScanCache('short_scanning', false);
                                if (window.addToast) window.addToast(`Scan fertig: ${breakdown.length} Short-Kandidaten`, 'success');
                                return;
                            }
                        }
                    } catch (e) { console.error(e); }
                    pollTimeoutRef.current = setTimeout(() => pollResults(attempts + 1), 10000); // Retry in 10s
                };
                pollTimeoutRef.current = setTimeout(() => pollResults(0), 5000); // First poll after 5s
            } else {
                setShortMessage(await explainFailedResponse(response));
                setIsScanning(false);
                updateScanCache('short_scanning', false);
            }
        } catch (err) {
            if (window.addToast) window.addToast('Scan-Fehler', 'error');
            setIsScanning(false);
            updateScanCache('short_scanning', false);
        }
    };

    return (
        <div className="space-y-6">
            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey="bear" />

            {shortMessage && (
                <div className="rounded-lg border border-amber-200 bg-amber-50 text-amber-900 px-4 py-3 text-sm">
                    <div className="font-semibold">Short-Scanner Diagnose</div>
                    <div>{shortMessage}</div>
                    {shortQuality?.diagnostics && (
                        <div className="mt-2 text-xs text-amber-800">
                            Kandidaten: {shortQuality.diagnostics.raw_candidates ?? 0} |
                            ETFs/Produkte entfernt: {shortQuality.diagnostics.excluded_non_common ?? 0} |
                            zu wenig Volumen: {shortQuality.diagnostics.dollar_volume_filtered ?? 0} |
                            keine Historie: {shortQuality.diagnostics.history_missing ?? 0}
                        </div>
                    )}
                </div>
            )}

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                {(
                    <table className="w-full text-sm">
                        <thead className="border-b border-gray-200">
                            <tr>
                                <th className="text-left py-2 px-1 sortable-header" onClick={() => toggleBreakdownSort('ticker')}>Ticker</th>
                                <th className="text-right py-2 px-1 sortable-header" onClick={() => toggleBreakdownSort('price')}>Preis</th>
                                <th className="text-right py-2 px-1 sortable-header" onClick={() => toggleBreakdownSort('change_pct')}>Änderung%</th>
                                <th className="text-right py-2 px-1 sortable-header" onClick={() => toggleBreakdownSort('rsi')}>RSI</th>
                                <th className="text-right py-2 px-1 sortable-header" onClick={() => toggleBreakdownSort('rvol')}>RVOL</th>
                                <th className="text-left py-2 px-1">Breakdown</th>
                                <th className="text-right py-2 px-1 sortable-header" onClick={() => toggleBreakdownSort('score')}>Score</th>
                                <th className="text-center py-2 px-1 sortable-header" onClick={() => toggleBreakdownSort('grade')}>Grade</th>
                                <th className="text-right py-2 px-1">$Vol</th>
                                <th className="text-right py-2 px-1 sortable-header" onClick={() => toggleBreakdownSort('ma20_dist')}>MA20</th>
                            </tr>
                        </thead>
                        <tbody>
                            {sortedBreakdown.map((item, idx) => {
                                const gradeColors = { S: 'bg-purple-100 text-purple-800', A: 'bg-green-100 text-green-800', B: 'bg-blue-100 text-blue-800', C: 'bg-yellow-100 text-yellow-800', D: 'bg-gray-100 text-gray-500' };
                                const gc = gradeColors[item.grade] || gradeColors.D;
                                const dv = item.dollar_volume || ((item.volume || 0) * (item.price || 0));
                                const dvStr = dv >= 1e6 ? (dv / 1e6).toFixed(1) + 'M' : dv >= 1e3 ? (dv / 1e3).toFixed(0) + 'K' : dv > 0 ? dv.toFixed(0) : '–';
                                return (
                                <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker(item.ticker)} title={item.score_details || ''}>
                                    <td className="py-3 px-1 font-semibold">{item.ticker}</td>
                                    <td className="py-3 px-1 text-right">${item.price?.toFixed(2)}</td>
                                    <td className="py-3 px-1 text-right color-negative font-medium">{item.change_pct?.toFixed(1)}%</td>
                                    <td className="py-3 px-1 text-right">{item.rsi != null ? Number(item.rsi).toFixed(1) : '-'}</td>
                                    <td className={`py-3 px-1 text-right ${item.rvol >= 2.0 ? 'font-bold color-positive' : ''}`}>{item.rvol?.toFixed(1)}x</td>
                                    <td className="py-3 px-1">
                                        <span className="text-xs px-2 py-0.5 rounded bg-red-100 text-red-700 font-semibold">Breakdown</span>
                                        <div className="text-xs text-gray-500">MA20 {item.ma20_dist?.toFixed(1)}%</div>
                                    </td>
                                    <td className="py-3 px-1 text-right font-medium">{item.score || 0}</td>
                                    <td className="py-3 px-1 text-center"><span className={`px-2 py-0.5 rounded text-xs font-bold ${gc}`}>{item.grade || '-'}</span></td>
                                    <td className="py-3 px-1 text-right text-gray-600">{dvStr}</td>
                                    <td className="py-3 px-1 text-right color-negative">{item.ma20_dist?.toFixed(1)}%</td>
                                </tr>
                                );
                            })}
                        </tbody>
                    </table>
                )}
                {sortedBreakdown.length === 0 && (
                    <div className="text-center text-gray-500 py-8">
                        Keine Short-Aktien in der aktuellen Liste. Wenn der Markt offen ist, starte einen Scan; sonst wartet der Scanner auf echte Breakdown-Daten.
                    </div>
                )}
            </div>
        </div>
    );
}

function SectorNarrativeTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null, getToken = () => null }) {

    const { sorted, toggleSort } = useSortable(results, 'narrative_score');
    const pollTimeoutRef = useRef(null);

    const frequencyOptions = [
        { value: 'off', label: 'Aus' },
        { value: 'daily', label: 'Taeglich' },
        { value: 'twice_daily', label: '2x taeglich' },
        { value: 'weekly', label: 'Woechentlich' },
    ];

    const loadNarrativePulse = async () => {
        try {
            const response = await fetch(`${API}/api/narrative-pulse`);
            if (response.ok) {
                const data = await response.json();
                const payload = data.data || {};
                const meta = { cached_at: data.cached_at, cache_age_seconds: data.cache_age_seconds, note: data.note };
                setNarrative(payload);
                setNarrativeMeta(meta);
                updateScanCache('narrative_pulse', payload);
                updateScanCache('narrative_meta', meta);
            }
        } catch (err) { console.error('Narrative error:', err); }
    };

    const fetchResults = async () => {
        try {
            const response = await fetch(`${API}/api/money-flow-results`);
            if (response.ok) {
                const data = await response.json();
                const items = data.data || [];
                setResults(items);
                updateScanCache('moneyflow_results', items);
            }
        } catch (err) { console.error('Error:', err); }
        await loadNarrativePulse();
    };

    const loadAlertSettings = async () => {

            const response = await fetch(`${API}/api/auth/alert-settings`);
            if (response.ok) setAlertSettings(await response.json());

    };
