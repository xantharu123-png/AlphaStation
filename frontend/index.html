<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Station - Trading Scanner</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React, ReactDOM, Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * { font-family: 'Inter', sans-serif; }

        :root {
            --bg-primary: #f8f9fb;
            --bg-secondary: #ffffff;
            --border-color: #e5e7eb;
            --text-primary: #1a1a2e;
            --text-muted: #6b7280;
            --accent: #2563eb;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --grade-s: #7c3aed;
            --grade-a: #059669;
            --grade-b: #2563eb;
            --grade-c: #d97706;
            --score-start: #f59e0b;
            --score-end: #f97316;
        }

        [data-theme="dark"] {
            --bg-primary: #0f1117;
            --bg-secondary: #161822;
            --border-color: #1e2130;
            --text-primary: #e2e8f0;
            --text-muted: #8b92a6;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body { background-color: var(--bg-primary); color: var(--text-primary); transition: background-color 0.3s, color 0.3s; }
        .card { background-color: var(--bg-secondary); border-color: var(--border-color); transition: background-color 0.3s, border-color 0.3s; }
        .table-row { border-color: var(--border-color); transition: background-color 0.2s; }
        .table-row:hover { background-color: rgba(37, 99, 235, 0.04); }
        [data-theme="dark"] .table-row:hover { background-color: rgba(59, 130, 246, 0.08); }

        .metric-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }

        .score-badge {
            background: linear-gradient(135deg, var(--score-start) 0%, var(--score-end) 100%);
            color: white; padding: 4px 10px; border-radius: 16px; font-size: 12px; font-weight: 600;
        }

        .grade-badge { padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; color: white; }
        .grade-s { background-color: var(--grade-s); }
        .grade-a { background-color: var(--grade-a); }
        .grade-b { background-color: var(--grade-b); }
        .grade-c { background-color: var(--grade-c); }
        .grade-d { background-color: #9ca3af; }

        .border-left-s { border-left: 3px solid var(--grade-s); }
        .border-left-a { border-left: 3px solid var(--grade-a); }
        .border-left-b { border-left: 3px solid var(--grade-b); }
        .border-left-c { border-left: 3px solid var(--grade-c); }
        .border-left-d { border-left: 3px solid #9ca3af; }

        .tab-active { border-bottom: 2px solid var(--accent); color: var(--accent); }
        .tab-inactive { color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab-inactive:hover { color: var(--text-primary); }

        .icon-button { cursor: pointer; transition: transform 0.2s, color 0.2s; }
        .icon-button:hover { transform: scale(1.1); color: var(--accent); }

        .settings-panel, .detail-panel {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        .detail-panel { margin-top: 16px; animation: slideDown 0.3s ease-out; }
        .settings-panel { animation: slideInRight 0.3s ease-out; }

        @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border-color); transition: 0.3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: 0.3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        .status-online { background-color: var(--success); width: 8px; height: 8px; border-radius: 50%; display: inline-block; animation: pulse 2s infinite; }
        .status-offline { background-color: var(--danger); width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .spinner { border: 3px solid var(--border-color); border-top: 3px solid var(--accent); border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .signal-badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .signal-stark { background-color: rgba(220, 38, 38, 0.12); color: #dc2626; }
        .signal-steigend { background-color: rgba(234, 88, 12, 0.12); color: #ea580c; }
        .signal-leicht { background-color: rgba(217, 119, 6, 0.12); color: #d97706; }
        .signal-fallend { background-color: rgba(5, 150, 105, 0.12); color: #059669; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        // ── API Configuration ──
        const API_BASE = window.location.hostname === 'localhost'
            ? 'http://localhost:8000'
            : `http://${window.location.hostname}:8000`;

        async function apiFetch(endpoint, options = {}) {
            try {
                const resp = await fetch(`${API_BASE}${endpoint}`, {
                    ...options,
                    headers: { 'Content-Type': 'application/json', ...options.headers },
                });
                if (!resp.ok) throw new Error(`API ${resp.status}`);
                return await resp.json();
            } catch (err) {
                console.error(`API Error ${endpoint}:`, err);
                return null;
            }
        }

        // ── Helper Functions ──
        const gradeFor = (score) => score >= 90 ? 'S' : score >= 75 ? 'A' : score >= 60 ? 'B' : score >= 40 ? 'C' : 'D';
        const gradeBorder = (g) => ({ S: 'border-left-s', A: 'border-left-a', B: 'border-left-b', C: 'border-left-c', D: 'border-left-d' }[g] || '');
        const gradeBadgeCls = (g) => ({ S: 'grade-s', A: 'grade-a', B: 'grade-b', C: 'grade-c', D: 'grade-d' }[g] || 'grade-d');
        const signalColor = (s) => s === 'BUY' || s === 'LONG' ? 'text-green-600' : s === 'SELL' || s === 'SHORT' ? 'text-red-600' : 'text-yellow-600';
        const changeColor = (v) => v > 0 ? 'text-green-600' : v < 0 ? 'text-red-600' : 'text-gray-500';
        const fmt = (v, d=2) => v != null && !isNaN(v) ? Number(v).toFixed(d) : '-';
        const fmtVol = (v) => { if (!v) return '-'; if (v >= 1e9) return (v/1e9).toFixed(1)+'B'; if (v >= 1e6) return (v/1e6).toFixed(1)+'M'; if (v >= 1e3) return (v/1e3).toFixed(0)+'K'; return String(v); };
        const signalBadgeCls = (s) => ({ STARK: 'signal-stark', Steigend: 'signal-steigend', Leicht: 'signal-leicht', Fallend: 'signal-fallend' }[s] || '');

        // ── Auto-Refresh Hook — polls API every N ms, no manual scan needed ──
        function useAutoRefresh(fetchFn, intervalMs = 30000) {
            const [initialLoad, setInitialLoad] = useState(true);
            const fetchRef = useRef(fetchFn);
            fetchRef.current = fetchFn;
            useEffect(() => {
                let mounted = true;
                const load = async () => { await fetchRef.current(); if (mounted) setInitialLoad(false); };
                load();
                const iv = setInterval(load, intervalMs);
                return () => { mounted = false; clearInterval(iv); };
            }, [intervalMs]);
            return initialLoad;
        }

        // ── Reusable Components ──
        function Spinner() { return <div className="flex justify-center py-12"><div className="spinner"></div></div>; }
        function EmptyState({ title, subtitle }) {
            return <div className="empty-state"><div className="text-lg font-medium mb-2">{title}</div><div className="text-sm">{subtitle}</div></div>;
        }
        function MetricCard({ label, value, sub, subColor }) {
            return (
                <div className="metric-card">
                    <div className="text-sm font-medium text-gray-500 mb-2">{label}</div>
                    <div className="text-3xl font-bold mb-1">{value}</div>
                    {sub && <div className={`text-sm font-medium ${subColor || 'text-gray-500'}`}>{sub}</div>}
                </div>
            );
        }
        function RefreshIndicator({ label }) {
            return (
                <div className="flex items-center gap-2 text-xs text-gray-400">
                    <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <span>{label || 'Auto-Refresh aktiv'}</span>
                </div>
            );
        }
        function TableHead({ columns }) {
            return (
                <thead><tr className="border-b border-gray-200 bg-gray-50">
                    {columns.map(c => <th key={c} className="px-5 py-3 text-left text-xs font-semibold text-gray-600 uppercase">{c}</th>)}
                </tr></thead>
            );
        }

        // ── Scanner Tab ──
        function ScannerTab({ apiOk }) {
            const [data, setData] = useState([]);
            const [selected, setSelected] = useState(null);
            const [settings, setSettings] = useState({ market: 'stocks', strategy: 'Volume Surge', timeframe: '1D' });
            const [showSettings, setShowSettings] = useState(false);

            const loadResults = useCallback(async () => {
                const res = await apiFetch('/api/bi-results?direction=long');
                if (res && res.data) setData(res.data);
            }, []);

            const loading = useAutoRefresh(loadResults, 30000);

            const candidates = data.map((d, i) => ({
                id: i, ticker: d.ticker || d.symbol || '-', score: d.score || d.total_score || 0,
                grade: d.grade || gradeFor(d.score || d.total_score || 0),
                signal: d.signal || d.direction || 'WATCH',
                rr: d.rr || d.risk_reward || '-', entry: d.entry || d.entry_price || '-',
                stop: d.stop || d.stop_loss || '-', target: d.target || d.take_profit || '-',
                volume: d.volume || d.vol || 0, rvol: d.rvol || d.relative_volume || 0,
                change: d.change_pct || d.change || 0, price: d.price || d.close || 0,
                rsi: d.rsi || '-', ma20: d.ma20 || '-', description: d.reason || d.description || '',
            }));

            const gradeCount = { S: candidates.filter(c=>c.grade==='S').length, A: candidates.filter(c=>c.grade==='A').length };
            const avgScore = candidates.length ? Math.round(candidates.reduce((s,c)=>s+c.score,0)/candidates.length) : 0;

            return (
                <div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                        <MetricCard label="KANDIDATEN" value={candidates.length} sub={candidates.length > 0 ? `${candidates.length} gefunden` : 'Kein Scan'} subColor={candidates.length > 0 ? 'text-green-600' : ''} />
                        <MetricCard label="GRADE S/A" value={gradeCount.S + gradeCount.A} sub="Top-Setups" />
                        <MetricCard label="DURCHSCHN. SCORE" value={avgScore || '-'} sub={avgScore > 70 ? 'Stark' : avgScore > 50 ? 'Mittel' : '-'} subColor={avgScore > 70 ? 'text-green-600' : ''} />
                        <MetricCard label="STATUS" value={loading ? 'Scannt...' : 'Bereit'} sub={apiOk ? 'API verbunden' : 'API offline'} subColor={apiOk ? 'text-green-600' : 'text-red-600'} />
                    </div>

                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-lg font-semibold">Trading Candidates</h2>
                        <button onClick={() => setShowSettings(!showSettings)} className="icon-button p-2" title="Einstellungen">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clipRule="evenodd"/></svg>
                        </button>
                    </div>

                    {showSettings && (
                        <div className="settings-panel mb-6">
                            <h3 className="text-lg font-semibold mb-4">Einstellungen</h3>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div>
                                    <label className="block text-sm font-medium mb-2">Markt</label>
                                    <select value={settings.market} onChange={e => setSettings({...settings, market: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white">
                                        <option value="stocks">US Aktien</option><option value="crypto">Krypto</option><option value="futures">Futures</option><option value="forex">Forex</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2">Strategie</label>
                                    <select value={settings.strategy} onChange={e => setSettings({...settings, strategy: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white">
                                        <option>Volume Surge</option><option>Bull Flag</option><option>Bear Flag</option><option>Breakout Long</option><option>Breakdown Short</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2">Timeframe</label>
                                    <select value={settings.timeframe} onChange={e => setSettings({...settings, timeframe: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white">
                                        <option>5M</option><option>15M</option><option>1H</option><option>4H</option><option>1D</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    )}

                    {loading ? <Spinner /> : candidates.length === 0 ?
                        <EmptyState title="Keine Kandidaten" subtitle="Scans laufen automatisch im Hintergrund — Daten erscheinen in Kuerze" /> : (
                        <div className="card border border-gray-200 rounded-lg overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full">
                                    <TableHead columns={['Ticker','Score','Grade','Signal','R:R','Entry','Stop','Target']} />
                                    <tbody>
                                        {candidates.map(c => (
                                            <React.Fragment key={c.id}>
                                                <tr onClick={() => setSelected(selected?.id === c.id ? null : c)}
                                                    className={`table-row border-b cursor-pointer ${gradeBorder(c.grade)}`}>
                                                    <td className="px-5 py-4 font-semibold text-blue-600">{c.ticker}</td>
                                                    <td className="px-5 py-4"><span className="score-badge">{c.score}</span></td>
                                                    <td className="px-5 py-4"><span className={`grade-badge ${gradeBadgeCls(c.grade)}`}>{c.grade}</span></td>
                                                    <td className={`px-5 py-4 font-medium ${signalColor(c.signal)}`}>{c.signal}</td>
                                                    <td className="px-5 py-4 text-sm">{c.rr}</td>
                                                    <td className="px-5 py-4 text-sm font-semibold">${fmt(c.entry)}</td>
                                                    <td className="px-5 py-4 text-sm font-semibold text-red-600">${fmt(c.stop)}</td>
                                                    <td className="px-5 py-4 text-sm font-semibold text-green-600">${fmt(c.target)}</td>
                                                </tr>
                                                {selected?.id === c.id && (
                                                    <tr><td colSpan="8" className="px-5 py-4">
                                                        <div className="detail-panel">
                                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                                <div>
                                                                    <h4 className="font-semibold text-lg mb-3">{c.ticker} - Analyse</h4>
                                                                    <p className="text-gray-500 mb-4">{c.description || 'Keine Details verfuegbar.'}</p>
                                                                    <div className="space-y-2 text-sm">
                                                                        <div><strong>Preis:</strong> ${fmt(c.price)}</div>
                                                                        <div><strong>Volume:</strong> {fmtVol(c.volume)}</div>
                                                                        <div><strong>RVOL:</strong> {fmt(c.rvol)}x</div>
                                                                        <div><strong>RSI:</strong> {c.rsi}</div>
                                                                    </div>
                                                                </div>
                                                                <div>
                                                                    <h4 className="font-semibold mb-3">Trade Setup</h4>
                                                                    <div className="space-y-3 text-sm">
                                                                        <div className="p-3 bg-blue-50 rounded-lg"><div className="text-gray-500">Entry</div><div className="text-lg font-bold text-blue-600">${fmt(c.entry)}</div></div>
                                                                        <div className="p-3 bg-red-50 rounded-lg"><div className="text-gray-500">Stop Loss</div><div className="text-lg font-bold text-red-600">${fmt(c.stop)}</div></div>
                                                                        <div className="p-3 bg-green-50 rounded-lg"><div className="text-gray-500">Target</div><div className="text-lg font-bold text-green-600">${fmt(c.target)}</div></div>
                                                                        <div className="p-3 bg-gray-100 rounded-lg"><div className="text-gray-500">R:R</div><div className="text-lg font-bold">{c.rr}</div></div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </td></tr>
                                                )}
                                            </React.Fragment>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ── BI Scanner Tab ──
        function BIScannerTab() {
            const [direction, setDirection] = useState('long');
            const [data, setData] = useState([]);
            const [selected, setSelected] = useState(null);
            const [cacheAge, setCacheAge] = useState(null);

            const loadResults = useCallback(async () => {
                const res = await apiFetch(`/api/bi-results?direction=${direction}`);
                if (res && res.data) { setData(res.data); setCacheAge(res.cache_age_seconds); }
            }, [direction]);

            const loading = useAutoRefresh(loadResults, 30000);

            const items = data.map((d, i) => ({
                id: i, ticker: d.ticker || d.symbol || '-', score: d.score || d.total_score || 0,
                grade: d.grade || gradeFor(d.score || d.total_score || 0),
                direction: d.direction || direction.toUpperCase(),
                price: d.price || d.close || 0, change: d.change_pct || d.change || 0,
                rvol: d.rvol || d.relative_volume || 0, volume: d.volume || 0,
                pattern: d.pattern || d.setup || '-', reason: d.reason || d.description || '',
                entry: d.entry || d.entry_price || 0, stop: d.stop || d.stop_loss || 0, target: d.target || d.take_profit || 0,
            }));

            const topCount = items.filter(i => i.score >= 75).length;
            const avgScore = items.length ? Math.round(items.reduce((s,i)=>s+i.score,0)/items.length) : 0;

            return (
                <div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                        <MetricCard label="BI KANDIDATEN" value={items.length} sub={items.length > 0 ? 'Breakout Imminent' : 'Kein Scan'} subColor="text-blue-600" />
                        <MetricCard label="TOP SETUPS" value={topCount} sub="Score >= 75" subColor="text-green-600" />
                        <MetricCard label="DURCHSCHN. SCORE" value={avgScore || '-'} />
                        <MetricCard label="CACHE ALTER" value={cacheAge != null ? Math.round(cacheAge/60) + ' Min' : '-'} sub={cacheAge != null ? 'Letzte Aktualisierung' : 'Noch kein Scan'} />
                    </div>

                    <div className="flex justify-between items-center mb-4">
                        <div className="flex items-center gap-4">
                            <h2 className="text-lg font-semibold">BI Scanner</h2>
                            <div className="flex bg-gray-100 rounded-lg p-1">
                                <button onClick={() => setDirection('long')}
                                    className={`px-4 py-1.5 rounded-md text-sm font-medium transition ${direction==='long' ? 'bg-green-600 text-white' : 'text-gray-600 hover:text-gray-900'}`}>
                                    LONG</button>
                                <button onClick={() => setDirection('short')}
                                    className={`px-4 py-1.5 rounded-md text-sm font-medium transition ${direction==='short' ? 'bg-red-600 text-white' : 'text-gray-600 hover:text-gray-900'}`}>
                                    SHORT</button>
                            </div>
                        </div>
                        <div className="text-xs text-gray-400">{cacheAge != null ? `Aktualisiert vor ${Math.round(cacheAge/60)} Min` : 'Lade...'}</div>
                    </div>

                    {loading ? <Spinner /> : items.length === 0 ?
                        <EmptyState title="Keine BI Kandidaten" subtitle="Scans laufen automatisch im Hintergrund" /> : (
                        <div className="card border border-gray-200 rounded-lg overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full">
                                    <TableHead columns={['Ticker','Score','Grade','Richtung','Preis','Change %','RVOL','Pattern']} />
                                    <tbody>
                                        {items.map(item => (
                                            <React.Fragment key={item.id}>
                                                <tr onClick={() => setSelected(selected?.id === item.id ? null : item)}
                                                    className={`table-row border-b cursor-pointer ${gradeBorder(item.grade)}`}>
                                                    <td className="px-5 py-4 font-semibold text-blue-600">{item.ticker}</td>
                                                    <td className="px-5 py-4"><span className="score-badge">{item.score}</span></td>
                                                    <td className="px-5 py-4"><span className={`grade-badge ${gradeBadgeCls(item.grade)}`}>{item.grade}</span></td>
                                                    <td className={`px-5 py-4 font-medium ${item.direction === 'LONG' || item.direction === 'long' ? 'text-green-600' : 'text-red-600'}`}>{item.direction}</td>
                                                    <td className="px-5 py-4 text-sm font-semibold">${fmt(item.price)}</td>
                                                    <td className={`px-5 py-4 text-sm font-medium ${changeColor(item.change)}`}>{item.change > 0 ? '+' : ''}{fmt(item.change)}%</td>
                                                    <td className="px-5 py-4 text-sm">{fmt(item.rvol)}x</td>
                                                    <td className="px-5 py-4 text-sm">{item.pattern}</td>
                                                </tr>
                                                {selected?.id === item.id && (
                                                    <tr><td colSpan="8" className="px-5 py-4">
                                                        <div className="detail-panel">

                                        {data.map((item, i) => (
                                            <tr key={i} className="table-row border-b">
                                                <td className="px-5 py-4 font-semibold">{item.event}</td>
                                                <td className="px-5 py-4 text-sm">{item.date}</td>
                                                <td className="px-5 py-4"><span className={`px-2 py-1 rounded text-xs font-semibold ${typeCls(item.type)}`}>{item.type}</span></td>
                                                <td className="px-5 py-4"><span className={`px-2 py-1 rounded text-xs font-semibold ${impactCls(item.impact)}`}>{item.impact}</span></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ── Crash Monitor Tab ──
        function CrashMonitorTab() {
            const [data, setData] = useState({});

            const loadResults = useCallback(async () => {
                const res = await apiFetch('/api/crash-monitor-results');
                if (res && res.data && res.data.length > 0) setData(res.data[0] || {});
            }, []);

            const loading = useAutoRefresh(loadResults, 30000);

            const vix = data.vix || {};
            const indices = data.indices || [];
            const breadth = data.breadth || {};

            const vixLevelCls = (l) => ({
                'EXTREME': 'bg-red-600 text-white',
                'HIGH': 'bg-red-100 text-red-700',
                'ELEVATED': 'bg-yellow-100 text-yellow-700',
                'LOW': 'bg-green-100 text-green-700',
            }[l] || 'bg-gray-100 text-gray-600');

            const breadthCls = (s) => ({
                'BULLISH': 'bg-green-100 text-green-700',
                'BEARISH': 'bg-red-100 text-red-700',
                'NEUTRAL': 'bg-gray-100 text-gray-600',
            }[s] || 'bg-gray-100 text-gray-600');

            return (
                <div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                        <div className="metric-card">
                            <div className="text-sm font-medium text-gray-500 mb-2">VIX INDEX</div>
                            <div className="text-3xl font-bold mb-1">{vix.price || '-'}</div>
                            {vix.level && <span className={`px-2 py-1 rounded text-xs font-semibold ${vixLevelCls(vix.level)}`}>{vix.level}</span>}
                        </div>
                        <MetricCard label="VIX 1D" value={vix.change_1d ? (vix.change_1d > 0 ? '+' : '') + fmt(vix.change_1d) + '%' : '-'} sub="Tagesveraenderung" subColor={changeColor(vix.change_1d)} />
                        <div className="metric-card">
                            <div className="text-sm font-medium text-gray-500 mb-2">MARKTBREITE</div>
                            <div className="text-3xl font-bold mb-1">{breadth.ad_ratio || '-'}</div>
                            {breadth.breadth_signal && <span className={`px-2 py-1 rounded text-xs font-semibold ${breadthCls(breadth.breadth_signal)}`}>{breadth.breadth_signal}</span>}
                        </div>
                        <MetricCard label="ADV / DEC" value={breadth.advancing && breadth.declining ? breadth.advancing + ' / ' + breadth.declining : '-'} sub="Steigend vs Fallend" />
                    </div>

                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-lg font-semibold">Crash Monitor</h2>
                    </div>

                    {loading ? <Spinner /> : indices.length === 0 ?
                        <EmptyState title="Keine Monitor-Daten" subtitle="Scans laufen automatisch im Hintergrund" /> : (
                        <div className="card border border-gray-200 rounded-lg overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full">
                                    <TableHead columns={['Index','Name','Preis','1D %','5D %','20D %']} />
                                    <tbody>
                                        {indices.map((item, i) => (
                                            <tr key={i} className="table-row border-b">
                                                <td className="px-5 py-4 font-semibold text-blue-600">{item.ticker}</td>
                                                <td className="px-5 py-4 text-sm">{item.name}</td>
                                                <td className="px-5 py-4 text-sm font-semibold">${fmt(item.price)}</td>
                                                <td className={`px-5 py-4 text-sm font-medium ${changeColor(item.change_1d)}`}>{item.change_1d > 0 ? '+' : ''}{fmt(item.change_1d)}%</td>
                                                <td className={`px-5 py-4 text-sm font-medium ${changeColor(item.change_5d)}`}>{item.change_5d > 0 ? '+' : ''}{fmt(item.change_5d)}%</td>
                                                <td className={`px-5 py-4 text-sm font-medium ${changeColor(item.change_20d)}`}>{item.change_20d > 0 ? '+' : ''}{fmt(item.change_20d)}%</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ── Main App ──
        function AlphaStation() {
            const [theme, setTheme] = useState('light');
            const [activeTab, setActiveTab] = useState('Scanner');
            const [apiOk, setApiOk] = useState(false);
            const [marketSession, setMarketSession] = useState({ session: '-', detail: '' });
            const [scanStatus, setScanStatus] = useState({});

            // Check API health + scan status on mount
            useEffect(() => {
                const check = async () => {
                    const res = await apiFetch('/api/health');
                    setApiOk(!!res && res.status === 'healthy');
                    const mkt = await apiFetch('/api/market-status');
                    if (mkt) setMarketSession(mkt);
                    const ss = await apiFetch('/api/scan-status');
                    if (ss && ss.scans) setScanStatus(ss.scans);
                };
                check();
                const iv = setInterval(check, 30000);
                return () => clearInterval(iv);
            }, []);

            const toggleTheme = () => {
                const next = theme === 'light' ? 'dark' : 'light';
                setTheme(next);
                document.documentElement.setAttribute('data-theme', next);
            };

            const tabs = ['Scanner', 'BI Scanner', 'Biotech', 'BTC-Divergenz', 'Early Movers', 'Short Scanner', 'Money Flow', 'Kalender', 'Crash Monitor'];

            const renderTab = () => {
                switch (activeTab) {
                    case 'Scanner': return <ScannerTab apiOk={apiOk} />;
                    case 'BI Scanner': return <BIScannerTab />;
                    case 'Biotech': return <BiotechTab />;
                    case 'Short Scanner': return <ShortScannerTab />;
                    case 'BTC-Divergenz': return <BTCDivergenzTab />;
                    case 'Early Movers': return <EarlyMoversTab />;
                    case 'Money Flow': return <MoneyFlowTab />;
                    case 'Kalender': return <KalenderTab />;
                    case 'Crash Monitor': return <CrashMonitorTab />;
                    default: return <ScannerTab apiOk={apiOk} />;
                }
            };

            return (
                <div data-theme={theme} className="min-h-screen">
                    {/* Header */}
                    <header className="card border-b border-gray-200 sticky top-0 z-50">
                        <div className="max-w-full px-6 py-4 flex items-center justify-between">
                            <h1 className="text-2xl font-bold">Alpha Station</h1>
                            <div className="flex items-center gap-6">
                                <div className="text-sm text-right" style={{color: 'var(--text-muted)'}}>
                                    <div className="font-semibold" style={{color: 'var(--text-primary)'}}>V70.7 Pro</div>
                                    <div className="flex items-center gap-2 justify-end">
                                        <span className={apiOk ? 'status-online' : 'status-offline'}></span>
                                        <span>{apiOk ? 'Server Online' : 'Server Offline'}</span>
                                        {Object.values(scanStatus).some(s => s.running) && (
                                            <span className="text-xs text-blue-500 font-medium ml-1">Scannt...</span>
                                        )}
                                    </div>
                                    <div>{marketSession.session} {marketSession.detail ? `- ${marketSession.detail}` : ''}</div>
                                </div>
                                <button onClick={toggleTheme} className="icon-button p-2" title="Theme wechseln">
                                    {theme === 'light' ? '\u{1F319}' : '\u{2600}\u{FE0F}'}
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Tab Navigation */}
                    <nav className="card border-b border-gray-200 px-6 py-0 sticky top-16 z-40">
                        <div className="flex gap-8 overflow-x-auto">
                            {tabs.map(tab => (
                                <button key={tab} onClick={() => setActiveTab(tab)}
                                    className={`py-4 font-medium whitespace-nowrap transition-all ${activeTab === tab ? 'tab-active' : 'tab-inactive'}`}>
                                    {tab}
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="max-w-full px-6 py-6">
                        {renderTab()}
                    </main>

                    {/* Footer */}
                    <footer className="text-center py-4 text-xs" style={{color: 'var(--text-muted)'}}>
                        Alpha Station V70.7 Pro &middot; {marketSession.session}
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<AlphaStation />);
    </script>
</body>
</html>
