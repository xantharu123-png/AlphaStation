    <script>
    (function() {
        function showBootError(message) {
            const msg = String(message || 'Unbekannter Frontend-Fehler');
            const buildMeta = document.querySelector('meta[name="alpha-build"]');
            const buildLabel = buildMeta ? buildMeta.getAttribute('content') : 'unknown';
            if (document.getElementById('boot-error-overlay')) return;
            const overlay = document.createElement('div');
            overlay.id = 'boot-error-overlay';
            overlay.style.position = 'fixed';
            overlay.style.inset = '0';
            overlay.style.zIndex = '99999';
            overlay.style.background = '#0f172a';
            overlay.style.color = '#f8fafc';
            overlay.style.padding = '32px';
            overlay.style.fontFamily = 'Inter, sans-serif';
            overlay.innerHTML =
                '<div style=\"max-width:900px;margin:0 auto;display:flex;min-height:100vh;align-items:center;\">' +
                    '<div>' +
                        '<div style=\"font-size:28px;font-weight:800;margin-bottom:12px;\">Alpha Station konnte nicht geladen werden</div>' +
                        '<div style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8;margin-bottom:12px;\">Build ' + buildLabel + '</div>' +
                        '<div style=\"font-size:15px;line-height:1.7;color:#cbd5e1;margin-bottom:18px;\">Die Seite ist nicht absichtlich leer. Unten steht die konkrete Browser-Fehlermeldung.</div>' +
                        '<pre style=\"white-space:pre-wrap;word-break:break-word;background:#111827;border:1px solid rgba(148,163,184,0.25);border-radius:14px;padding:18px;font-size:13px;line-height:1.6;color:#fda4af;\">' + msg + '</pre>' +
                    '</div>' +
                '</div>';
            document.addEventListener('DOMContentLoaded', function appendOverlay() {
                if (!document.body.contains(overlay)) document.body.appendChild(overlay);
            }, { once: true });
            if (document.body) document.body.appendChild(overlay);
        }
        window.showBootError = showBootError;

        window.addEventListener('error', function(event) {
            showBootError(event && (event.message || (event.error && event.error.stack) || event.error));
        });

        window.addEventListener('unhandledrejection', function(event) {
            const reason = event ? event.reason : null;
            showBootError((reason && (reason.stack || reason.message)) || reason || 'Unhandled promise rejection');
        });

        window.addEventListener('load', function() {
            setTimeout(function() {
                const root = document.getElementById('root');
                if (root && root.children.length === 0) {
                    const missing = [];
                    if (!window.React) missing.push('React fehlt');
                    if (!window.ReactDOM) missing.push('ReactDOM fehlt');
                    if (!window.Babel) missing.push('Babel fehlt');
                    const info = missing.length > 0
                        ? 'Fehlende Runtime: ' + missing.join(', ')
                        : 'Die Runtime ist geladen, aber die App hat nichts in #root gerendert.';
                    showBootError(info);
                }
            }, 2500);
        });
    })();
    </script>

<script type="text/plain" id="app-source">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

function useAuth() {
    const [user, setUser] = useState(null);
    const [limits, setLimits] = useState(null);
    const [loading, setLoading] = useState(true);

    const checkAuth = useCallback(async () => {
        const token = localStorage.getItem('as_token');
        if (!token) { setLoading(false); return; }
        try {
            const res = await fetch(`${API}/api/auth/me`, { headers: { 'Authorization': `Bearer ${token}` } });
            if (res.ok) {
                const data = await res.json();
                setUser(data.user);
                setLimits(data.limits);
            } else {
                localStorage.removeItem('as_token');
                setUser(null); setLimits(null);
            }
        } catch { }
        setLoading(false);
    }, []);

    useEffect(() => { checkAuth(); }, [checkAuth]);

    const login = async (email, password) => {
        try {
            const res = await fetch(`${API}/api/auth/login`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (res.ok && data.token) {
                localStorage.setItem('as_token', data.token);
                window.location.reload();
                return { success: true };
            }
            return { success: false, message: data.detail || data.message || 'Login fehlgeschlagen' };
        } catch (err) {
            return { success: false, message: 'Server nicht erreichbar' };
        }
    };

    const register = async (email, password, name) => {
        try {
            const res = await fetch(`${API}/api/auth/register`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, name })
            });
            const data = await res.json();
            if (res.ok && data.token) {
                localStorage.setItem('as_token', data.token);
                window.location.reload();
                return { success: true };
            }
            return { success: false, message: data.detail || data.message || 'Registrierung fehlgeschlagen' };
        } catch (err) {
            return { success: false, message: 'Server nicht erreichbar' };
        }
    };

    const logout = () => {
        localStorage.removeItem('as_token');
        setUser(null); setLimits(null);
    };

    const getToken = () => localStorage.getItem('as_token');

    return { user, limits, loading, login, register, logout, getToken, checkAuth };
}

                                    <p style={{ marginBottom: 12 }}>Die aktuellen Preise sind auf der Plattform einsehbar. Der $1 Trial gewährt 24 Stunden vollen Zugang und verlängert sich nicht automatisch. Abonnements (Basic $29/Monat, Pro $79/Monat, Elite $149/Monat) werden monatlich über Stripe abgerechnet. Der Auto-Trader ist ausschließlich im Elite-Plan enthalten. Alle Preise verstehen sich in US-Dollar. Der Anbieter behält sich Preisanpassungen vor, wobei bestehende Abonnements bis zum Ende der laufenden Periode unberührt bleiben.</p>

                                    <p style={{ fontWeight: 700, color: '#f1f5f9', marginBottom: 8, marginTop: 24 }}>6. Kündigung</p>

                                    <p style={{ fontWeight: 700, color: '#f1f5f9', marginBottom: 8, marginTop: 24 }}>7. Verfügbarkeit</p>

                                    <p style={{ fontWeight: 700, color: '#f1f5f9', marginBottom: 8, marginTop: 24 }}>8. Geistiges Eigentum</p>
                                    <p style={{ marginBottom: 12 }}>Alle Inhalte, Algorithmen, Scanner-Logiken und Darstellungen der Plattform sind urheberrechtlich geschützt. Das Kopieren, Weiterverbreiten oder kommerzielle Nutzen der Analysen, Signale oder Software ist ohne ausdrückliche Genehmigung untersagt.</p>

                                    <p style={{ fontWeight: 700, color: '#f1f5f9', marginBottom: 8, marginTop: 24 }}>9. Nutzungsbeschränkungen</p>
                                    <p style={{ marginBottom: 12 }}>Der Nutzer verpflichtet sich, den Dienst nicht missbräuchlich zu nutzen. Insbesondere ist es untersagt: automatisierte Zugriffe (Bots, Scraping) ohne API-Berechtigung durchzuführen, den Dienst für illegale Zwecke zu verwenden, Sicherheitsmechanismen zu umgehen oder den Account an Dritte weiterzugeben.</p>

                                    <p style={{ fontWeight: 700, color: '#f1f5f9', marginBottom: 8, marginTop: 24 }}>10. Auto-Trader</p>
                                    <p style={{ marginBottom: 12 }}>Der Auto-Trader (verfügbar im Elite-Plan) ermöglicht die automatisierte oder semi-automatisierte Platzierung von Wertpapier-Orders über die Anbindung an Interactive Brokers (IBKR). Der Nutzer ist allein verantwortlich für: die korrekte Konfiguration des Auto-Traders (Position Size, Max Positionen, Stop-Loss Limits), die Sicherstellung einer funktionierenden IBKR-Verbindung, die Überwachung offener Positionen und die Einhaltung aller geltenden Handelsregeln und Regulierungen. Der Auto-Trader führt Orders basierend auf algorithmischen Signalen aus. Der Anbieter garantiert weder die Richtigkeit der Signale noch die fehlerfreie Ausführung von Orders. Der Nutzer sollte den Auto-Trader nicht unbeaufsichtigt im Full-Auto-Modus betreiben, sofern er die Risiken nicht vollständig versteht und akzeptiert. Der Anbieter empfiehlt den Semi-Auto-Modus, bei dem Orders in der IBKR Trader Workstation zur manuellen Bestätigung vorgelegt werden.</p>

                                    <p style={{ fontWeight: 700, color: '#f1f5f9', marginBottom: 8, marginTop: 24 }}>11. Kryptowährungen</p>
                                    <p style={{ marginBottom: 12 }}>Alpha Station bietet Scanner und Analysen für Kryptowährungen an (Early Movers, Whale Tracking, Funding Rates, BTC-Divergenz). Kryptowährungen sind hochvolatile, spekulative Anlageinstrumente. Der Kryptowährungsmarkt ist weitgehend unreguliert und unterliegt extremen Preisschwankungen. Der Anbieter übernimmt keine Haftung für Verluste aus Kryptowährungs-Investments. Die bereitgestellten Daten stammen von Drittanbietern (CoinGecko, Exchanges) und können unvollständig, verzögert oder fehlerhaft sein.</p>

                                    <p style={{ fontWeight: 700, color: '#f1f5f9', marginBottom: 8, marginTop: 24 }}>12. Änderungen der AGB</p>

                                    <p style={{ fontWeight: 700, color: '#f1f5f9', marginBottom: 8, marginTop: 24 }}>13. Schlussbestimmungen</p>

                                </div>

                        {showLegal === 'datenschutz' && (

                                    <p style={{ fontWeight: 700, color: '#f1f5f9', marginBottom: 8, marginTop: 24 }}>2. Erhobene Daten</p>

                                    <p style={{ fontWeight: 700, color: '#f1f5f9', marginBottom: 8, marginTop: 24 }}>3. Zweck der Verarbeitung</p>

                                    <p style={{ fontWeight: 700, color: '#f1f5f9', marginBottom: 8, marginTop: 24 }}>5. Speicherdauer</p>

                                    <p style={{ fontWeight: 700, color: '#f1f5f9', marginBottom: 8, marginTop: 24 }}>6. Rechte der Nutzer</p>

                                    <p style={{ fontWeight: 700, color: '#f1f5f9', marginBottom: 8, marginTop: 24 }}>7. Cookies</p>
                                    <p style={{ marginBottom: 12 }}>Alpha Station verwendet ausschließlich technisch notwendige Cookies und LocalStorage zur Sitzungsverwaltung (Login-Token). Es werden keine Tracking-Cookies oder Analyse-Tools von Drittanbietern eingesetzt.</p>

                                        <strong style={{ color: '#f1f5f9' }}>Alpha Station</strong><br />
                                        Miroslav Mikulic<br />
                                        <br />

                                    <p style={{ fontWeight: 700, color: '#f1f5f9', marginBottom: 8, marginTop: 24 }}>Haftungshinweis</p>
                                    <p style={{ marginBottom: 12 }}>Alpha Station stellt technische Analysetools für den Wertpapierhandel bereit. Der Dienst bietet keine Anlageberatung und keine Aufforderung zum Handel. Alle bereitgestellten Informationen, Analysen und Handelsvorschläge dienen ausschließlich zu Informationszwecken. Jede Investitionsentscheidung liegt in der alleinigen Verantwortung des Nutzers. Der Handel mit Wertpapieren birgt Risiken bis hin zum Totalverlust.</p>

            {/* ── Auth Modal ── */}

// ── Pricing Page ──
function PricingPage({ currentPlan, getToken }) {
    const [loading, setLoading] = useState(null);
    const plans = [
        { id: 'basic', name: 'Basic', price: 29, features: ['4 Scanner Tabs', 'Scan alle 30 Min', '30 Ticker-Details / Stunde', 'Breakdown Stocks'] },
        { id: 'pro', name: 'Pro', price: 79, popular: true, features: ['Alle Scanner Tabs', 'Echtzeit Scans (5 Min)', 'Volle Sidebar-Analyse', 'Email Alerts', 'Trade Setups (Entry/Stop/TP)', 'Unbegrenzte Ticker-Details'] },
        { id: 'elite', name: 'Elite', price: 149, features: ['Alles aus Pro', 'Auto-Trader (IBKR)', 'ORB Scanner', 'Backtesting', 'API Access', 'Priority Support'] },
    ];

    const handleCheckout = async (planId) => {
        setLoading(planId);
        try {
            const token = getToken();
            const res = await fetch(`${API}/api/auth/checkout`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ plan: planId })
            });
            if (res.ok) {
                const data = await res.json();
                if (data.url) window.location.href = data.url;
            } else {
                const err = await res.json();
                if (window.addToast) window.addToast(err.detail || 'Fehler beim Checkout', 'error');
            }
        } catch (e) {
            if (window.addToast) window.addToast('Verbindungsfehler', 'error');
        }
        setLoading(null);
    };

    return (
        <div style={{ maxWidth: 960, margin: '0 auto', padding: '40px 20px' }}>
            <h2 style={{ textAlign: 'center', fontSize: 24, fontWeight: 700, marginBottom: 8 }}>Wähle deinen Plan</h2>
            <p style={{ textAlign: 'center', color: 'var(--text-muted)', marginBottom: 40 }}>Jederzeit kündbar — keine versteckten Kosten</p>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: 24 }}>
                {plans.map(plan => (
                    <div key={plan.id} className="card" style={{ padding: 28, borderRadius: 12, border: plan.popular ? '2px solid #3b82f6' : '1px solid var(--border-color)', position: 'relative' }}>
                        {plan.popular && <div style={{ position: 'absolute', top: -12, left: '50%', transform: 'translateX(-50%)', background: '#3b82f6', color: '#fff', fontSize: 11, fontWeight: 700, padding: '3px 12px', borderRadius: 20 }}>BELIEBT</div>}
                        <h3 style={{ fontSize: 20, fontWeight: 700, marginBottom: 4 }}>{plan.name}</h3>
                        <div style={{ marginBottom: 20 }}>
                            <span style={{ fontSize: 36, fontWeight: 800 }}>${plan.price}</span>
                            <span style={{ color: 'var(--text-muted)', fontSize: 14 }}>/Monat</span>
                        </div>
                        <ul style={{ listStyle: 'none', padding: 0, marginBottom: 24 }}>
                            {plan.features.map((f, i) => (
                                <li key={i} style={{ padding: '6px 0', fontSize: 14, color: 'var(--text-muted)' }}>
                                    <span style={{ color: '#10b981', marginRight: 8 }}>✓</span>{f}
                                </li>
                            ))}
                        </ul>
                        <button onClick={() => handleCheckout(plan.id)} disabled={loading === plan.id || currentPlan === plan.id}
                            style={{ width: '100%', padding: '10px 0', border: 'none', borderRadius: 8, fontSize: 14, fontWeight: 600, cursor: 'pointer',
                                background: currentPlan === plan.id ? '#374151' : (plan.popular ? '#3b82f6' : '#1e293b'),
                                color: '#fff', opacity: loading === plan.id ? 0.6 : 1 }}>
                            {currentPlan === plan.id ? 'Aktueller Plan' : (loading === plan.id ? '...' : 'Jetzt starten')}
                        </button>
                    </div>
                ))}
            </div>
        </div>
    );
}

// Custom Hooks
function useAutoRefresh(url, interval = 30000, dependency = []) {
    const [data, setData] = useState(null);
    const [loading, setLoading] = useState(true);
    const [error, setError] = useState(null);

    useEffect(() => {
        const fetchData = async () => {
            try {
                setLoading(true);
                const response = await fetch(API + url);
                if (!response.ok) throw new Error('API Error');
                const result = await response.json();
                setData(result);
                setError(null);
            } catch (err) {
                setError(err.message);
                if (window.addToast) window.addToast('Fehler beim Abrufen der Daten', 'error');
            } finally {
                setLoading(false);
            }
        };

        fetchData();
        const timer = setInterval(fetchData, interval);
        return () => clearInterval(timer);
    }, dependency);

    return { data, loading, error };
}

function useSortable(data, defaultKey = null, defaultDesc = true) {
    const [sortKey, setSortKey] = useState(defaultKey);
    const [sortDesc, setSortDesc] = useState(defaultDesc);  // V2.7: Default absteigend (beste zuerst)

    const sorted = useMemo(() => {
        if (!data || !sortKey) return data;
        return [...data].sort((a, b) => {
            const aVal = a[sortKey];
            const bVal = b[sortKey];
            if (typeof aVal === 'number' && typeof bVal === 'number') {
                return sortDesc ? bVal - aVal : aVal - bVal;
            }
            return sortDesc ? String(bVal).localeCompare(String(aVal)) : String(aVal).localeCompare(String(bVal));
        });
    }, [data, sortKey, sortDesc]);

    const toggleSort = (key) => {
        if (sortKey === key) {
            setSortDesc(!sortDesc);
        } else {
            setSortKey(key);
            // V2.7: Numerische Spalten starten absteigend (beste zuerst), Text aufsteigend
            const numericKeys = ['score','price','change_pct','rvol','volume','change_1d','chg_5d','pump_pct','phase','Price','Change24h','Change7d','VolMCapRatio','EarlyScore','DegenScore','WhaleScore','risk_level','grade'];
            setSortDesc(numericKeys.includes(key));
        }
    };

    return { sorted, toggleSort, sortKey, sortDesc };
}

// Global helper: relative time display (German)
function getRelativeTime(timestamp, isFuture = false) {
        if (!timestamp) return 'nie';
        // Server sends UTC timestamps without 'Z' suffix — force UTC interpretation
        const raw = String(timestamp);
        const date = new Date(raw.endsWith('Z') ? raw : raw + 'Z');
        const now = new Date();
        const diffMs = isFuture ? (date - now) : (now - date);
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);

        if (isFuture) {
            if (diffMs < 0) return 'überfällig';
            if (diffMins < 1) return 'gleich';
            if (diffMins < 60) return `in ${diffMins} min`;
            if (diffHours < 24) return `in ${diffHours}h`;
            return date.toLocaleDateString('de-DE');
        }
        if (diffMins < 1) return 'gerade eben';
        if (diffMins < 60) return `vor ${diffMins} min`;
        if (diffHours < 24) return `vor ${diffHours}h`;
        return date.toLocaleDateString('de-DE');
}

// Helper: extract scan timing info for ScanControl from schedulerStatus
function getScanTiming(schedulerStatus, scanKey) {
    if (!schedulerStatus?.scans?.[scanKey]) return { lastScan: null, nextScan: null };
    const scan = schedulerStatus.scans[scanKey];
    return {
        lastScan: scan.last_run ? getRelativeTime(scan.last_run) : null,
        nextScan: scan.next_run ? getRelativeTime(scan.next_run, true) : null,
    };
}

function formatCacheAge(seconds) {
    if (seconds === null || seconds === undefined) return 'kein Cache';
    if (seconds < 60) return `${seconds}s alt`;
    const mins = Math.floor(seconds / 60);
    if (mins < 60) return `${mins} min alt`;
    const hours = Math.floor(mins / 60);
    if (hours < 48) return `${hours}h alt`;
    return `${Math.floor(hours / 24)} Tage alt`;
}

                            if (signal.aborted) return;
                        }
                        try {
                            const res = await fetch(`${API}/api/crypto-chart?coin_id=${coinId}&days=30`, { signal });
                            if (signal.aborted) return;
                            if (res.ok) {
                                const chartJson = await res.json();
                                if (chartJson.candles && chartJson.candles.length > 0) {
                                    setChartData(chartJson);
                                    cryptoSuccess = true;
                                    break;
                                }
                                // Backend returned empty candles (rate_limited) — retry
                                continue;
                            }
                        } catch (retryErr) {
                            if (retryErr.name === 'AbortError') return;
                            continue;
                        }
                    }
                    if (!cryptoSuccess && !signal.aborted) {
                        setChartData({ ticker, timeframe: '1D', candles: [], error: 'Crypto-Chart vorübergehend nicht verfügbar — CoinGecko Rate Limit' });
                    }
                } else {
                    const allOverlays = 'ema,vwap,sr,fib,patterns,vrvp';
                    const res = await fetch(`${API}/api/chart-data?ticker=${ticker}&timeframe=${timeframe}&overlays=${allOverlays}`, { signal });
                    if (signal.aborted) return;
                    if (res.ok) {
                        setChartData(await res.json());
                    } else {
                        setChartData({ ticker, timeframe, candles: [], error: 'Keine Chart-Daten verfügbar' });
                    }
                }
            } catch (err) {
                if (err.name === 'AbortError') return;  // Abgebrochen — ignorieren
                console.error('Chart data error:', err);
                setChartData({ ticker, timeframe, candles: [], error: 'Chart-Daten konnten nicht geladen werden' });
            }
        };
        fetchChart();
        return () => controller.abort();  // Vorherigen Request abbrechen
    }, [ticker, timeframe, isCrypto, isExchangeCrypto]);

    const loadAiAnalysis = async () => {
        setAiLoading(true);
        try {
            const token = localStorage.getItem('as_token');
            const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
            const res = await fetch(`${API}/api/ai-analysis?ticker=${ticker}`, { headers });
            const data = await res.json();
            if (data.error === 'ai_not_available' || data.error === 'ai_limit_reached') {
                setAiData({ analysis: data.message, upgrade_required: true });
            } else if (res.ok) {
                setAiData(data);
            } else {
                setAiData({ analysis: 'API Fehler: ' + res.status });
            }
        } catch (err) {
            setAiData({ analysis: 'Verbindungsfehler' });
        } finally {
            setAiLoading(false);
        }
    };

    const getChartWidth = () => {
        if (customWidth) return customWidth - 60;
        if (sidebarMode === 'full') return window.innerWidth - 60;
        if (sidebarMode === 'wide') return 720 - 60;
        return 480 - 60;
    };

    const getChartHeight = () => {
        if (customHeight) return customHeight;
        return sidebarMode === 'full' ? Math.max(500, window.innerHeight * 0.55) : sidebarMode === 'wide' ? 380 : 250;
    };

    // Render chart with all overlays
    useEffect(() => {
        if (!chartData || !chartContainer.current) return;
        if (!chartData.candles || chartData.candles.length === 0) return; // No data to render
        try {
            // V2.4: Zoom+Scroll exakt speichern vor Rebuild
            // Erkennung: ist es nur ein Overlay/Resize-Wechsel (gleiche Daten)?
            const isOverlayChange = prevOverlaysRef.current && chartData === prevOverlaysRef.current._chartData;
            if (chart.current) {
                try {
                    savedVisibleRange.current = {
                        logical: chart.current.timeScale().getVisibleLogicalRange(),
                        scrollPos: chart.current.timeScale().scrollPosition(),
                    };
                } catch(e) {}
                chart.current.remove();
            }
            prevOverlaysRef.current = { ...overlays, _chartData: chartData };
            overlaySeriesRef.current = [];

            const { createChart, LineStyle, CrosshairMode } = window.LightweightCharts;
            const chartWidth = getChartWidth();
            const chartHeight = getChartHeight();

            chart.current = createChart(chartContainer.current, {
                layout: { textColor: '#999', background: { color: '#1a1a2e' }, fontSize: 11 },
                grid: { vertLines: { color: 'rgba(255,255,255,0.04)' }, horzLines: { color: 'rgba(255,255,255,0.04)' } },
                width: chartWidth, height: chartHeight,
                crosshair: { mode: CrosshairMode.Normal },
                rightPriceScale: { borderColor: 'rgba(255,255,255,0.1)' },
                timeScale: { timeVisible: timeframe.includes('m') || timeframe.includes('H'), secondsVisible: false, borderColor: 'rgba(255,255,255,0.1)', rightOffset: 12, barSpacing: 8, minBarSpacing: 4 },
            });

            // Candlestick series
            candleSeries.current = chart.current.addCandlestickSeries({
                upColor: '#10b981', downColor: '#ef4444',
                borderUpColor: '#10b981', borderDownColor: '#ef4444',
                wickUpColor: '#10b981', wickDownColor: '#ef4444',
            });
            const candles = (chartData.candles || []).map(c => ({
                time: c.time, open: c.open, high: c.high, low: c.low, close: c.close
            }));
            if (candles.length > 0) candleSeries.current.setData(candles);

            // Volume overlay
            if (overlays.vol && chartData.volume) {
                const volSeries = chart.current.addHistogramSeries({
                    priceFormat: { type: 'volume' },
                    priceScaleId: 'vol',
                });
                chart.current.priceScale('vol').applyOptions({ scaleMargins: { top: 0.85, bottom: 0 } });
                volSeries.setData(chartData.volume);
                overlaySeriesRef.current.push(volSeries);
            }

            // EMA lines
            if (overlays.ema && chartData.ema) {
                Object.entries(chartData.ema).forEach(([key, data]) => {
                    if (data && data.length > 0) {
                        const line = chart.current.addLineSeries({
                            color: EMA_COLORS[key] || '#888',
                            lineWidth: key === 'ema200' ? 2 : 1,
                            priceLineVisible: false,
                            lastValueVisible: false,
                            title: key.toUpperCase(),
                        });
                        line.setData(data);
                        overlaySeriesRef.current.push(line);
                    }
                });
            }

            // VWAP line
            if (overlays.vwap && chartData.vwap && chartData.vwap.length > 0) {
                const vwapLine = chart.current.addLineSeries({
                    color: '#f97316', lineWidth: 2,
                    lineStyle: LineStyle.Dotted,
                    priceLineVisible: false, lastValueVisible: false,
                    title: 'VWAP',
                });
                vwapLine.setData(chartData.vwap);
                overlaySeriesRef.current.push(vwapLine);
            }

            // Bollinger Bands
            if (overlays.bb && chartData.bollinger && chartData.bollinger.length > 0) {
                const bbUpper = chart.current.addLineSeries({
                    color: 'rgba(147,51,234,0.5)', lineWidth: 1,
                    priceLineVisible: false, lastValueVisible: false, title: 'BB+',
                });
                const bbLower = chart.current.addLineSeries({
                    color: 'rgba(147,51,234,0.5)', lineWidth: 1,
                    priceLineVisible: false, lastValueVisible: false, title: 'BB-',
                });
                bbUpper.setData(chartData.bollinger.map(b => ({ time: b.time, value: b.upper })));
                bbLower.setData(chartData.bollinger.map(b => ({ time: b.time, value: b.lower })));
                overlaySeriesRef.current.push(bbUpper, bbLower);
            }

            // Support/Resistance — REAL swing-based levels from backend
            if (overlays.sr && chartData.sr) {
                const sr = chartData.sr;
                const addPriceLine = (price, title, color, style, width) => {
                    if (price && price > 0) {
                        candleSeries.current.createPriceLine({
                            price, color, lineWidth: width || 1,
                            lineStyle: style || LineStyle.Dashed,
                            axisLabelVisible: true, title,
                        });
                    }
                };
                // Real support levels (from swing analysis)
                if (sr.support_levels) {
                    sr.support_levels.slice(0, 4).forEach((lvl, i) => {
                        const strength = lvl.strength || 1;
                        const lw = Math.min(3, Math.max(1, Math.ceil(strength / 2)));
                        addPriceLine(lvl.price, `S${i+1} ${lvl.type || ''}`, '#10b981', strength >= 4 ? LineStyle.Solid : LineStyle.Dashed, lw);
                    });
                }
                // Real resistance levels
                if (sr.resistance_levels) {
                    sr.resistance_levels.slice(0, 4).forEach((lvl, i) => {
                        const strength = lvl.strength || 1;
                        const lw = Math.min(3, Math.max(1, Math.ceil(strength / 2)));
                        addPriceLine(lvl.price, `R${i+1} ${lvl.type || ''}`, '#ef4444', strength >= 4 ? LineStyle.Solid : LineStyle.Dashed, lw);
                    });
                }
                // Pivot if available
                if (sr.pivot) addPriceLine(sr.pivot, 'Pivot', '#fbbf24', LineStyle.Solid, 1);
                // PDH/PDL (Previous Day High/Low)
                if (sr.pdh) addPriceLine(sr.pdh, 'PDH', '#94a3b8', LineStyle.Dotted, 1);
                if (sr.pdl) addPriceLine(sr.pdl, 'PDL', '#94a3b8', LineStyle.Dotted, 1);
                // Period High/Low
                if (sr.period_high) addPriceLine(sr.period_high, 'Period High', '#64748b', LineStyle.Dotted, 1);
                if (sr.period_low) addPriceLine(sr.period_low, 'Period Low', '#64748b', LineStyle.Dotted, 1);
            }

            // Diagonal Trendlines
            if (overlays.sr && chartData.trendlines) {
                chartData.trendlines.forEach(tl => {
                    if (tl.points && tl.points.length >= 2) {
                        const color = tl.type === 'support' ? '#10b981' : '#ef4444';
                        const tlLine = chart.current.addLineSeries({
                            color, lineWidth: 2, lineStyle: LineStyle.Solid,
                            lastValueVisible: false, priceLineVisible: false,
                            crosshairMarkerVisible: false,
                        });
                        tlLine.setData(tl.points.map(p => ({ time: p.time, value: p.price })));
                        overlaySeriesRef.current.push(tlLine);
                    }
                });
            }

            // VRVP — V2.3: Volume Profile als Balken (horizontales Histogramm)
            if (overlays.vrvp && chartData.vrvp) {
                const vp = chartData.vrvp;
                // POC, VAH, VAL als Preis-Linien beibehalten
                const addVPLine = (price, title, color, style, width) => {
                    if (price && price > 0) {
                        candleSeries.current.createPriceLine({
                            price, color, lineWidth: width || 1,
                            lineStyle: style || LineStyle.Dashed,
                            axisLabelVisible: true, title,
                        });
                    }
                };
                addVPLine(vp.poc, 'POC', '#06b6d4', LineStyle.Solid, 2);
                addVPLine(vp.vah, 'VAH', '#0891b2', LineStyle.Dashed, 1);
                addVPLine(vp.val, 'VAL', '#0891b2', LineStyle.Dashed, 1);

                // Balken als Canvas-Overlay zeichnen
                if (vp.bins && vp.bins.length > 0 && chart.current) {
                    const maxVol = Math.max(...vp.bins.map(b => b.volume));
                    const maxBarWidth = chartContainer.current ? chartContainer.current.clientWidth * 0.15 : 80;
                    const priceScale = chart.current.priceScale('right');

                    // Canvas-Overlay erstellen
                    const existingCanvas = chartContainer.current.querySelector('.vrvp-canvas');
                    if (existingCanvas) existingCanvas.remove();
                    const canvas = document.createElement('canvas');
                    canvas.className = 'vrvp-canvas';
                    canvas.style.position = 'absolute';
                    canvas.style.top = '0';
                    canvas.style.right = '48px';
                    canvas.style.pointerEvents = 'none';
                    canvas.style.zIndex = '5';
                    canvas.width = Math.ceil(maxBarWidth + 10);
                    canvas.height = chartContainer.current.clientHeight;
                    chartContainer.current.style.position = 'relative';
                    chartContainer.current.appendChild(canvas);

                    const drawVRVP = () => {
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        const series = candleSeries.current;
                        if (!series) return;

                        vp.bins.forEach(bin => {
                            const yMid = series.priceToCoordinate(bin.mid);
                            const yHigh = series.priceToCoordinate(bin.high);
                            const yLow = series.priceToCoordinate(bin.low);
                            if (yMid === null || yHigh === null || yLow === null) return;

                            const barH = Math.max(2, Math.abs(yLow - yHigh));
                            const barW = Math.max(2, (bin.volume / maxVol) * maxBarWidth);
                            const y = Math.min(yHigh, yLow);
                            const isPOC = Math.abs(bin.mid - vp.poc) < (bin.high - bin.low);
                            const isVA = bin.mid >= vp.val && bin.mid <= vp.vah;

                            ctx.fillStyle = isPOC ? 'rgba(6, 182, 212, 0.45)' : isVA ? 'rgba(34, 211, 238, 0.25)' : 'rgba(100, 116, 139, 0.18)';
                            ctx.fillRect(canvas.width - barW, y, barW, barH);
                            // Rand
                            ctx.strokeStyle = isPOC ? 'rgba(6, 182, 212, 0.7)' : isVA ? 'rgba(34, 211, 238, 0.4)' : 'rgba(100, 116, 139, 0.3)';
                            ctx.lineWidth = 0.5;
                            ctx.strokeRect(canvas.width - barW, y, barW, barH);
                        });
                    };

                    drawVRVP();
                    // Redraw on scroll/zoom — store refs for cleanup
                    chart.current.timeScale().subscribeVisibleTimeRangeChange(drawVRVP);
                    chart.current.subscribeCrosshairMove(drawVRVP);
                    vrvpSubsRef.current = [drawVRVP];
                }
            }

            // Fibonacci levels — V3.0: Richtungsabhängig (SHORT=abwärts, LONG=aufwärts)
            if (overlays.fib && chartData.fib) {
                const isShort = chartData.fib_direction === 'short';
                const fibColors = {
                    '0%': '#ef4444', '23%': '#f97316', '38%': '#eab308', '50%': '#22c55e',
                    '61%': '#3b82f6', '78%': '#8b5cf6', '100%': '#a855f7',
                    // Extension-Targets
                    '127%': isShort ? '#f43f5e' : '#06b6d4',
                    '161%': isShort ? '#e11d48' : '#14b8a6',
                    '200%': isShort ? '#be123c' : '#10b981',
                };
                const extendedKeys = ['127%', '161%', '200%'];
                Object.entries(chartData.fib).forEach(([level, price]) => {
                    const isExtended = extendedKeys.includes(level);
                    candleSeries.current.createPriceLine({
                        price, color: fibColors[level] || '#6b7280',
                        lineWidth: 1,
                        lineStyle: isExtended ? LineStyle.Dashed : LineStyle.Dotted,
                        axisLabelVisible: true, title: `Fib ${level}`,
                    });
                });
            }

            // Pattern markers
            if (overlays.patterns && chartData.patterns) {
                const markers = [];

                // V4.0: Pivot-Marker entfernt (nur Noise) — Pivots werden intern genutzt

                // V2.6b: Richtung bestimmen — nur passende Patterns anzeigen
                const _viewDir = (d.confluence?.direction || '').toUpperCase();

                // Chart pattern markers + Linien-Zeichnung
                // V4: Marker-Dedup — nur 1 Marker pro Kerze (höchste Priorität gewinnt)
                // Ohne Dedup stapeln sich Bullish OB + Buyside Liq + H&S etc. auf gleicher Kerze
                if (chartData.patterns.chart_patterns) {
                    const _usedTimes = new Set();
                    const _sevOrder = {'high': 0, 'medium': 1, 'low': 2};
                    const _sorted = [...chartData.patterns.chart_patterns]
                        .filter(p => !_viewDir || _viewDir === 'NEUTRAL' || (_viewDir === 'SHORT' ? p.type !== 'bullish' : p.type !== 'bearish'))
                        .sort((a, b) => (_sevOrder[a.severity] || 2) - (_sevOrder[b.severity] || 2));
                    _sorted.forEach(p => {
                        const markerTime = p.time || (candles.length > 0 ? candles[candles.length - 1].time : null);
                        if (markerTime && !_usedTimes.has(markerTime)) {
                            _usedTimes.add(markerTime);
                            markers.push({
                                time: markerTime,
                                position: p.type === 'bullish' ? 'belowBar' : 'aboveBar',
                                color: p.type === 'bullish' ? '#10b981' : '#ef4444',
                                shape: 'circle',
                                text: (p.pattern || '').substring(0, 12),
                            });
                        }
                        // draw_points: Pattern-Linien einzeichnen
                        if (p.draw_points && p.draw_points.length >= 2) {
                            const validPts = p.draw_points.filter(dp => dp.time && dp.price);
                            if (validPts.length >= 2) {
                                const patColor = p.type === 'bullish' ? 'rgba(16,185,129,0.7)' : 'rgba(239,68,68,0.7)';
                                // Pattern-Verbindungslinie
                                const patLine = chart.current.addLineSeries({
                                    color: patColor, lineWidth: 2, lineStyle: LineStyle.Dashed,
                                    lastValueVisible: false, priceLineVisible: false,
                                    crosshairMarkerVisible: false,
                                });
                                const sorted = [...validPts].sort((a, b) => a.time - b.time);
                                patLine.setData(sorted.map(dp => ({ time: dp.time, value: dp.price })));
                                overlaySeriesRef.current.push(patLine);
                                // Neckline/Target als horizontale Linie
                                if (p.neckline) {
                                    candleSeries.current.createPriceLine({
                                        price: p.neckline, color: '#f59e0b', lineWidth: 1,
                                        lineStyle: LineStyle.Dashed, axisLabelVisible: true,
                                        title: 'Neckline',
                                    });
                                }
                                if (p.target) {
                                    candleSeries.current.createPriceLine({
                                        price: p.target, color: patColor, lineWidth: 1,
                                        lineStyle: LineStyle.Dotted, axisLabelVisible: true,
                                        title: 'Target',
                                    });
                                }
                            }
                        }
                    });
                }

                // Harmonic pattern lines (gefiltert nach Richtung)
                if (chartData.patterns.harmonic) {
                    chartData.patterns.harmonic
                        .filter(h => !_viewDir || _viewDir === 'NEUTRAL' || h.direction === _viewDir)
                        .forEach(h => {
                        if (h.points && h.points.length >= 5) {
                            const hLine = chart.current.addLineSeries({
                                color: h.direction === 'LONG' ? '#10b981' : '#ef4444',
                                lineWidth: 2, lastValueVisible: false, priceLineVisible: false,
                                title: h.pattern || 'Harmonic',
                            });
                            const points = h.points.map(pt => ({ time: pt.time || pt.t, value: pt.price || pt.p })).filter(pt => pt.time && pt.value).sort((a, b) => a.time - b.time);
                            if (points.length > 0) hLine.setData(points);
                            overlaySeriesRef.current.push(hLine);
                        }
                    });
                }

                // Sort markers by time and set them
                if (markers.length > 0) {
                    markers.sort((a, b) => a.time - b.time);
                    candleSeries.current.setMarkers(markers);
                }
            }

            // V2.4: Zoom+Scroll exakt wiederherstellen bei Overlay-Toggle
            if (isOverlayChange && savedVisibleRange.current) {
                try {
                    if (savedVisibleRange.current.logical) {
                        chart.current.timeScale().setVisibleLogicalRange(savedVisibleRange.current.logical);
                    }
                } catch(e) {
                    chart.current.timeScale().fitContent();
                }
            } else {
                // V3.1: Letzte Kerze rechts im Bild — nicht alles reinquetschen
                const totalBars = candles.length;
                const barsToShow = Math.min(totalBars, 80);
                chart.current.timeScale().setVisibleLogicalRange({
                    from: totalBars - barsToShow,
                    to: totalBars - 1,
                });
                savedVisibleRange.current = null;
            }
        } catch (err) { console.error('Chart error:', err); }
        return () => {
            // VRVP event listener cleanup
            if (vrvpSubsRef.current.length > 0 && chart.current) {
                try {
                    vrvpSubsRef.current.forEach(fn => {
                        chart.current.timeScale().unsubscribeVisibleTimeRangeChange(fn);
                        chart.current.unsubscribeCrosshairMove(fn);
                    });
                } catch(e) {}
                vrvpSubsRef.current = [];
            }
            if (chart.current) {
                try {
                    savedVisibleRange.current = {
                        logical: chart.current.timeScale().getVisibleLogicalRange(),
                        scrollPos: chart.current.timeScale().scrollPosition(),
                    };
                } catch(e) {}
                chart.current.remove();
                chart.current = null;
            }
            // VRVP Canvas aufräumen
            if (chartContainer.current) {
                const oldCanvas = chartContainer.current.querySelector('.vrvp-canvas');
                if (oldCanvas) oldCanvas.remove();
            }
        };
    }, [chartData, sidebarMode, customWidth, customHeight, overlays, tickerData]);

    if (loading && !tickerData) {
        return (
            <div className={`detail-sidebar sidebar-${sidebarMode}`} style={customWidth ? {width: customWidth + 'px'} : {}}>
                <div className="detail-sidebar-content" style={{ padding: '24px' }}>
                    <div className="flex items-center justify-between mb-4">
                        <h2 className="text-xl font-bold">{ticker}</h2>
                        <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
                    </div>
                    <div style={{ width: '100%', height: '4px', backgroundColor: '#e5e7eb', borderRadius: '2px', overflow: 'hidden', marginBottom: '12px' }}>
                        <div style={{ width: '100%', height: '100%', background: 'linear-gradient(90deg, #3b82f6, #60a5fa, #3b82f6)', backgroundSize: '200% 100%', animation: 'shimmer 1.5s infinite', borderRadius: '2px' }}></div>
                    </div>
                    <div className="text-sm text-gray-500">Daten werden geladen...</div>
                </div>
            </div>
        );
    }

    const d = tickerData || {};
    const cd = scannerData || {};  // crypto data from Early Movers
    const quality = cd._quality || d._quality || null;
    const tradeHealth = cd.trade_health || d.trade_health || null;
    const marketContext = cd.market_context || d.market_context || tradeHealth?.market_context || quality?.market_context || null;
    const tradeHealthTone = !tradeHealth ? '' :
        tradeHealth.decision === 'TRADEABLE' ? 'border-emerald-200 bg-emerald-50 text-emerald-900' :
        tradeHealth.decision === 'NO_TRADE' ? 'border-red-200 bg-red-50 text-red-900' :
        tradeHealth.decision === 'WAIT_FOR_RETEST' ? 'border-amber-200 bg-amber-50 text-amber-900' :
        'border-sky-200 bg-sky-50 text-sky-900';
    const riskTone = (risk) => risk === 'LOW' ? 'text-emerald-700' : risk === 'MEDIUM' ? 'text-amber-700' : 'text-red-700';
    // V4: Header-Preis aus Chart-Daten aktualisieren (damit Header und letzte Kerze IMMER übereinstimmen)
    // Vorher: ticker-detail und chart-data hatten verschiedene Cache-Zeiten → Preis-Diskrepanz
    const _chartLastCandle = chartData?.candles?.length > 0 ? chartData.candles[chartData.candles.length - 1] : null;
    const _chartPrice = _chartLastCandle ? _chartLastCandle.close : null;
    const _chartPrevClose = chartData?.candles?.length > 1 ? chartData.candles[chartData.candles.length - 2].close : null;
    const _chartChange = (_chartPrice && _chartPrevClose && _chartPrevClose > 0) ? ((_chartPrice - _chartPrevClose) / _chartPrevClose * 100) : null;
    const price = Number(isExchangeCrypto ? cd.price : isCrypto ? cd.Price : (_chartPrice || d.price)) || 0;
    const change = Number(isExchangeCrypto ? cd.change_24h : isCrypto ? cd.Change24h : (_chartChange != null ? _chartChange : d.change_1d)) || 0;
    const changeClass = change >= 0 ? 'color-positive' : 'color-negative';
    const signalColor = s => s === 'bullish' ? '#059669' : s === 'bearish' ? '#dc2626' : '#6b7280';
    const modeIcon = sidebarMode === 'normal' ? '⬜' : sidebarMode === 'wide' ? '◻️' : '⬛';
    const modeLabel = sidebarMode === 'normal' ? 'Normal' : sidebarMode === 'wide' ? 'Breit' : 'Vollbild';

    // Simple markdown-to-HTML: bold, headers, line breaks
    const renderMarkdown = (text) => {
        if (!text) return '';
        // Escape HTML first to prevent XSS
        let safe = text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        // Then apply markdown formatting
        return safe
            .replace(/\*\*(\d+)\.\s*(.*?)\*\*/g, '<br/><strong>$1. $2</strong>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\n/g, '<br/>');
    };

    // Use grid layout in wide/full mode
    const isWide = sidebarMode === 'wide' || sidebarMode === 'full' || (customWidth && customWidth > 600);

    return (
        <div ref={sidebarRef} className={`detail-sidebar sidebar-${sidebarMode}`} style={customWidth ? {width: customWidth + 'px', transition: 'none'} : {}}>
            {/* Drag Handle */}
            <div className="sidebar-resize-handle" onMouseDown={startResize}></div>

            <div className="detail-sidebar-content" style={{ overflowY: 'auto', maxHeight: '100vh', paddingBottom: '40px' }}>
                {/* Header */}
                <div className="flex justify-between items-start mb-4">
                    <div>
                        <h2 className="text-2xl font-bold">{ticker}</h2>
                        <p className="text-2xl font-bold mt-1">
                            ${price < 0.01 ? price.toPrecision(4) : price.toFixed(2)} <span className={`text-lg font-semibold ${changeClass}`}>({change.toFixed(2)}%)</span>
                        </p>
                    </div>
                    <div className="flex gap-2 items-center">
                        <button onClick={cycleMode} className="sidebar-mode-btn" title={`Modus: ${modeLabel}`}>
                            {sidebarMode === 'normal' ? '↔' : sidebarMode === 'wide' ? '⛶' : '▪'}
                        </button>
                        <button onClick={onClose} className="text-2xl font-bold hover:text-red-500">×</button>
                    </div>
                </div>

                {/* Grade + Confluence — BI Scanner Grade hat Vorrang (kommt direkt vom Backend) */}
                <div className="mb-4">
                    <div className="flex gap-2 items-center">
                        {d.signal_grade && (
                            <span className={`grade-badge grade-${d.signal_grade.toLowerCase()}`}>
                                Grade {d.signal_grade} ({d.signal_score != null ? Math.round(d.signal_score) : 0}P)
                            </span>
                        )}
                        {d.confluence && (
                            <span className={`signal-badge signal-${d.confluence.direction === 'LONG' ? 'bullish' : d.confluence.direction === 'SHORT' ? 'bearish' : 'neutral'}`}>
                                {d.confluence.direction}
                            </span>
                        )}
                        {d.bi_scanner && (
                            <span className="text-xs text-blue-500 font-medium ml-1">via BI Scanner</span>
                        )}
                    </div>
                    {d.bi_scanner && d.bi_scanner.grade_label && (
                        <div className="text-xs text-gray-500 mt-1">{d.bi_scanner.grade_label}</div>
                    )}
                </div>

                {marketContext && (
                    <div className="border border-slate-200 bg-slate-900 text-slate-50 p-3 rounded-lg mb-3 text-xs">
                        <div className="flex items-center justify-between gap-2 mb-2">
                            <h4 className="font-semibold text-sm">Market Weather</h4>
                            <span className={`font-bold ${marketContext.regime === 'RISK_ON' ? 'text-emerald-300' : marketContext.regime === 'NEUTRAL' ? 'text-amber-300' : 'text-red-300'}`}>
                                {marketContext.regime || 'NEUTRAL'}
                            </span>
                        </div>
                        <div className="grid grid-cols-3 gap-2">
                            <div><div className="text-slate-400">Mode</div><div className="font-semibold">{marketContext.trade_mode || '-'}</div></div>
                            <div><div className="text-slate-400">Risk</div><div className="font-semibold">{marketContext.overall_risk_score != null ? `${marketContext.overall_risk_score}/100` : '-'}</div></div>
                            <div><div className="text-slate-400">Size</div><div className="font-semibold">{marketContext.size_multiplier != null ? `${Math.round(marketContext.size_multiplier * 100)}%` : '-'}</div></div>
                        </div>
                        <div className="mt-2 text-slate-300">
                            Headline: <span className="font-semibold">{marketContext.headline_level || 'LOW'}</span> | Event: <span className="font-semibold">{marketContext.event_level || 'LOW'}</span> | Fear: <span className="font-semibold">{marketContext.fear_score ?? '-'}</span>
                        </div>
                    </div>
                )}

                {tradeHealth && (
                    <div className={`border p-3 rounded-lg mb-3 text-xs ${tradeHealthTone}`}>
                        <div className="flex items-center justify-between gap-2 mb-2">
                            <h4 className="font-semibold text-sm">Trade Health</h4>
                            <span className="font-bold">{tradeHealth.decision_label || tradeHealth.decision} ({tradeHealth.health_score}/100)</span>
                        </div>
                        <div className="grid grid-cols-3 gap-2">
                            <div>
                                <div className="opacity-70">Entry</div>
                                <div className="font-semibold">{tradeHealth.entry_quality} {tradeHealth.entry_quality_score != null ? `${tradeHealth.entry_quality_score}/100` : ''}</div>
                            </div>
                            <div>
                                <div className="opacity-70">Fakeout</div>
                                <div className={`font-semibold ${riskTone(tradeHealth.fakeout_risk)}`}>{tradeHealth.fakeout_risk}</div>
                            </div>
                            <div>
                                <div className="opacity-70">Chase</div>
                                <div className={`font-semibold ${riskTone(tradeHealth.chase_risk)}`}>{tradeHealth.chase_risk}</div>
                            </div>
                        </div>
                        {tradeHealth.metrics && (
                            <div className="mt-2 grid grid-cols-2 gap-2 opacity-80">
                                <div>Live R:R: <span className="font-semibold">{tradeHealth.metrics.live_rr != null ? tradeHealth.metrics.live_rr : '-'}</span></div>
                                <div>Distanz: <span className="font-semibold">{tradeHealth.metrics.distance_to_entry_r != null ? `${tradeHealth.metrics.distance_to_entry_r}R` : '-'}</span></div>
                            </div>
                        )}
                        {tradeHealth.exclusion_reasons && tradeHealth.exclusion_reasons.length > 0 && (
                            <div className="mt-2 rounded border border-red-200 bg-white/60 p-2 text-red-800">
                                {tradeHealth.exclusion_reasons.slice(0, 3).join(' | ')}
                            </div>
                        )}
                        {tradeHealth.warnings && tradeHealth.warnings.length > 0 && (
                            <div className="mt-2 opacity-90">{tradeHealth.warnings.slice(0, 4).join(' | ')}</div>
                        )}
                        {tradeHealth.positives && tradeHealth.positives.length > 0 && (
                            <div className="mt-2 text-emerald-700">{tradeHealth.positives.slice(0, 3).join(' | ')}</div>
                        )}
                    </div>
                )}

                {quality && (
                    <div className="bg-slate-50 border border-slate-200 p-3 rounded-lg mb-3 text-xs">
                        <h4 className="font-semibold text-sm mb-2">Warum ist das Signal drin?</h4>
                        <div className="space-y-1">
                            {(quality.why_in || []).slice(0, 5).map((line, i) => (
                                <div key={i} className="text-slate-700">• {line}</div>
                            ))}
                        </div>
                        <div className="mt-2 grid grid-cols-2 gap-2 text-slate-500">
                            <div>Quelle: <span className="font-semibold text-slate-700">{quality.data_source || 'Scanner'}</span></div>
                            <div>Datenalter: <span className="font-semibold text-slate-700">{formatCacheAge(quality.data_age_seconds)}</span></div>
                        </div>
                        {quality.warnings && quality.warnings.length > 0 && (
                            <div className="mt-2 rounded border border-amber-200 bg-amber-50 p-2 text-amber-800">
                                {quality.warnings.slice(0, 4).join(' | ')}
                            </div>
                        )}
                    </div>
                )}

                {/* Timeframe Selector */}
                <div className="flex gap-1 mb-2 flex-wrap">
                    {TIMEFRAMES.map(tf => (
                        <button key={tf} onClick={() => setTimeframe(tf)}
                            className={`px-2 py-1 text-xs rounded ${timeframe === tf ? 'bg-blue-600 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`}>
                            {tf}
                        </button>
                    ))}
                </div>

                {/* Overlay Toggles */}
                <div className="flex gap-1 mb-3 flex-wrap">
                    {[
                        { key: 'ema', label: 'EMA', color: '#3b82f6' },
                        { key: 'vwap', label: 'VWAP', color: '#f97316' },
                        { key: 'sr', label: 'S/R', color: '#fbbf24' },
                        { key: 'fib', label: 'Fib', color: '#8b5cf6' },
                        { key: 'bb', label: 'BB', color: '#9333ea' },
                        { key: 'vrvp', label: 'VRVP', color: '#06b6d4' },
                        { key: 'patterns', label: 'Patterns', color: '#10b981' },
                        { key: 'vol', label: 'Vol', color: '#6b7280' },
                    ].map(({ key, label, color }) => (
                        <button key={key}
                            onClick={() => setOverlays(prev => ({...prev, [key]: !prev[key]}))}
                            className="px-2 py-1 text-xs rounded font-semibold"
                            style={{
                                background: overlays[key] ? color : `${color}22`,
                                color: overlays[key] ? '#fff' : color,
                                border: `1.5px solid ${overlays[key] ? color : `${color}55`}`,
                                opacity: overlays[key] ? 1 : 0.6,
                            }}>
                            {label}
                        </button>
                    ))}
                </div>

                {/* Chart */}
                {chartData && chartData.candles && chartData.candles.length === 0 ? (
                    <div className="text-center py-8 text-gray-500 text-sm bg-gray-800 rounded-lg mb-4">
                        {(chartData.error || '').includes('Versuch') ? (
                            <div className="flex items-center justify-center gap-2">
                                <div className="loading-spinner" style={{width:16,height:16,borderWidth:2}}></div>
                                <span>{chartData.error}</span>
                            </div>
                        ) : (chartData.error || 'Keine Chart-Daten verfügbar')}
                    </div>
                ) : !chartData ? (
                    <div className="flex justify-center py-8 mb-4"><div className="loading-spinner"></div></div>
                ) : null}
                <div style={{ position: 'relative' }}>
                    {/* V2.5: Expand-Button oben links im Chart */}
                    {chartData && chartData.candles && chartData.candles.length > 0 && (
                        <button onClick={() => {
                            const halfScreen = Math.round(window.innerWidth * 0.5);
                            if (customWidth && customWidth >= halfScreen - 50) {
                                setCustomWidth(null); setSidebarMode('normal');
                            } else {
                                setCustomWidth(halfScreen); setSidebarMode('custom');
                            }
                        }}
                        style={{ position: 'absolute', top: '8px', left: '8px', zIndex: 10, background: 'rgba(30,30,50,0.8)', border: '1px solid rgba(255,255,255,0.15)', borderRadius: '6px', padding: '4px 8px', cursor: 'pointer', color: '#ccc', fontSize: '14px', display: 'flex', alignItems: 'center', gap: '4px', backdropFilter: 'blur(4px)' }}
                        onMouseEnter={(e) => { e.currentTarget.style.background = 'rgba(59,130,246,0.6)'; e.currentTarget.style.color = '#fff'; }}
                        onMouseLeave={(e) => { e.currentTarget.style.background = 'rgba(30,30,50,0.8)'; e.currentTarget.style.color = '#ccc'; }}
                        title={customWidth && customWidth >= Math.round(window.innerWidth * 0.5) - 50 ? 'Sidebar verkleinern' : 'Sidebar auf 50% erweitern'}>
                            <span style={{ fontSize: '16px' }}>{customWidth && customWidth >= Math.round(window.innerWidth * 0.5) - 50 ? '⊟' : '⊞'}</span>
                        </button>
                    )}
                    <div ref={chartContainer} className="chart-container" style={{ borderRadius: '8px 8px 0 0', overflow: 'hidden', display: chartData && chartData.candles && chartData.candles.length > 0 ? 'block' : 'none' }}></div>
                </div>
                {/* V2.4: Chart-Höhe Drag-Handle */}
                {chartData && chartData.candles && chartData.candles.length > 0 && (
                    <div onMouseDown={startHeightResize}
                        style={{ height: '6px', cursor: 'row-resize', background: 'transparent', borderRadius: '0 0 8px 8px', marginBottom: '16px', transition: 'background 0.2s' }}
                        onMouseEnter={(e) => e.currentTarget.style.background = 'rgba(59,130,246,0.5)'}
                        onMouseLeave={(e) => e.currentTarget.style.background = 'transparent'}
                        title="Chart-Höhe ziehen"
                    ></div>
                )}

                {/* Pattern Info */}
                {/* V2.6b: Pattern-Badges nach Richtung gefiltert */}
                {chartData?.patterns?.chart_patterns && chartData.patterns.chart_patterns.length > 0 && (() => {
                    const _vd = (d.confluence?.direction || '').toUpperCase();
                    const filtered = chartData.patterns.chart_patterns.filter(p => !_vd || _vd === 'NEUTRAL' || (_vd === 'SHORT' ? p.type !== 'bullish' : p.type !== 'bearish'));
                    return filtered.length > 0 ? (
                    <div className="mb-3 text-xs">
                        {filtered.map((p, i) => (
                            <span key={i} className={`inline-block mr-2 mb-1 px-2 py-1 rounded ${p.type === 'bullish' ? 'bg-green-900 text-green-300' : 'bg-red-900 text-red-300'}`}>
                                {p.pattern} ({p.confidence || ''})
                            </span>
                        ))}
                    </div>
                    ) : null;
                })()}
                {chartData?.patterns?.harmonic && chartData.patterns.harmonic.length > 0 && (() => {
                    const _vd = (d.confluence?.direction || '').toUpperCase();
                    const filtered = chartData.patterns.harmonic.filter(h => (!_vd || _vd === 'NEUTRAL' || h.direction === _vd) && (h.score || 0) >= 30);
                    return filtered.length > 0 ? (
                    <div className="mb-3 text-xs">
                        {filtered.map((h, i) => (
                            <span key={i} className={`inline-block mr-2 mb-1 px-2 py-1 rounded ${h.direction === 'LONG' ? 'bg-green-900 text-green-300' : 'bg-red-900 text-red-300'}`}>
                                {h.pattern} {h.direction} (Score: {h.score || ''})
                            </span>
                        ))}
                    </div>
                    ) : null;
                })()}

                {/* Content Grid - 2 columns when wide */}
                <div style={isWide ? { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' } : {}}>

                {/* Pump & Dump Detail Panel */}
                {isExchangeCrypto && scannerData && (
                <>
                <div className="bg-gray-50 p-3 rounded-lg mb-3 text-xs">
                    <h4 className="font-semibold text-sm mb-2">Pump & Dump Info</h4>
                    <div className="grid grid-cols-2 gap-2">
                        <div><span className="text-gray-500">Exchange</span> <span className="font-semibold text-blue-600">{scannerData.exchange || '–'}</span></div>
                        <div><span className="text-gray-500">Contract</span> <span className="font-semibold text-xs">{scannerData.contract || '–'}</span></div>
                        <div><span className="text-gray-500">Preis</span> <span className="font-semibold">${scannerData.price?.toFixed(6) || '–'}</span></div>
                        <div><span className="text-gray-500">24h Change</span> <span className={`font-semibold ${(scannerData.change_24h||0) >= 0 ? 'color-positive' : 'color-negative'}`}>{scannerData.change_24h?.toFixed(1) || '–'}%</span></div>
                        {scannerData.volume_24h && <div><span className="text-gray-500">Vol 24h</span> <span className="font-semibold">{scannerData.volume_24h > 1e6 ? (scannerData.volume_24h/1e6).toFixed(1)+'M' : scannerData.volume_24h > 1e3 ? (scannerData.volume_24h/1e3).toFixed(0)+'K' : scannerData.volume_24h}</span></div>}
                        {scannerData.listing_date && <div><span className="text-gray-500">Gelistet</span> <span className="font-semibold">{scannerData.listing_date}</span></div>}
                    </div>
                </div>
                <div className="bg-gray-50 p-3 rounded-lg mb-3 text-xs">
                    <h4 className="font-semibold text-sm mb-2">Exhaustion Analyse</h4>
                    <div className="grid grid-cols-2 gap-2">
                        <div><span className="text-gray-500">Exhaustion</span> <span className={`font-semibold px-2 py-0.5 rounded ${(scannerData.exhaustion_score||0) >= 70 ? 'bg-green-100 text-green-800' : (scannerData.exhaustion_score||0) >= 40 ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800'}`}>{scannerData.exhaustion_score?.toFixed(0) || '–'}/100</span></div>
                        <div><span className="text-gray-500">Signal</span> <span className={`font-semibold px-2 py-0.5 rounded ${scannerData.signal?.includes('SHORT') ? 'bg-red-100 text-red-800' : scannerData.signal === 'WATCH' ? 'bg-yellow-100 text-yellow-800' : 'bg-gray-100 text-gray-800'}`}>{scannerData.signal || '–'}</span></div>
                        <div><span className="text-gray-500">Pump %</span> <span className={`font-semibold ${(scannerData.pump_pct||0) > 0 ? 'color-positive' : 'color-negative'}`}>{scannerData.pump_pct ? `+${scannerData.pump_pct}%` : '–'}</span></div>
                        <div><span className="text-gray-500">vom ATH %</span> <span className="font-semibold color-negative">{scannerData.from_ath_pct ? `-${scannerData.from_ath_pct}%` : '–'}</span></div>
                        {scannerData.confirmations > 0 && <div className="col-span-2"><span className="text-gray-500">Bestätigungen</span> <span className={`font-semibold px-2 py-0.5 rounded ${scannerData.confirmations >= 3 ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800'}`}>{scannerData.confirmations}/5</span></div>}
                    </div>
                </div>
                <div className="bg-gray-50 p-3 rounded-lg mb-3 text-xs">
                    <h4 className="font-semibold text-sm mb-2">Short-Indikatoren</h4>
                    <div className="grid grid-cols-2 gap-2">
                        <div><span className="text-gray-500">Funding Rate</span> <span className={`font-semibold ${(scannerData.funding_rate||0) > 0.05 ? 'color-negative' : (scannerData.funding_rate||0) > 0 ? 'text-yellow-600' : ''}`}>{scannerData.funding_rate != null ? `${scannerData.funding_rate.toFixed(3)}%` : '–'}</span></div>
                        <div><span className="text-gray-500">Long %</span> <span className={`font-semibold ${(scannerData.long_pct||50) > 65 ? 'color-negative' : ''}`}>{scannerData.long_pct != null ? `${scannerData.long_pct.toFixed(0)}%` : '–'}</span></div>
                        <div><span className="text-gray-500">Red Candles</span> <span className={`font-semibold ${(scannerData.red_streak||0) >= 4 ? 'color-negative' : ''}`}>{scannerData.red_streak || '–'}</span></div>
                        <div><span className="text-gray-500">Vol Ratio</span> <span className="font-semibold">{scannerData.vol_ratio || '–'}x</span></div>
                        <div><span className="text-gray-500">BTC Divergenz</span> <span className={`font-semibold ${(scannerData.btc_divergence||0) < -5 ? 'color-negative' : ''}`}>{scannerData.btc_divergence ? `${scannerData.btc_divergence > 0 ? '+' : ''}${scannerData.btc_divergence}%` : '–'}</span></div>
                        <div><span className="text-gray-500">Alter</span> <span className="font-semibold">{scannerData.hours_tracked || '–'}h</span></div>
                    </div>
                </div>
                {scannerData.exhaustion_details && Array.isArray(scannerData.exhaustion_details) && (
                <div className="bg-gray-50 p-3 rounded-lg mb-3 text-xs">
                    <h4 className="font-semibold text-sm mb-2">Score Details</h4>
                    <div className="space-y-1">
                        {scannerData.exhaustion_details.map((line, i) => (
                            <div key={i} className="text-xs text-gray-600">{line}</div>
                        ))}
                    </div>
                </div>
                )}
                </>
                )}

                {/* Crypto Detail Panel (CoinGecko) */}
                {isCrypto && !isExchangeCrypto && cd && (
                <>
                <div className="bg-gray-50 p-3 rounded-lg mb-3 text-xs">
                    <h4 className="font-semibold text-sm mb-2">Crypto Info</h4>
                    <div className="grid grid-cols-2 gap-2">
                        <div><span className="text-gray-500">Name</span> <span className="font-semibold">{cd.Name || '–'}</span></div>
                        <div><span className="text-gray-500">Narrative</span> <span className="font-semibold">{cd.Narrative || '–'}</span></div>
                        <div><span className="text-gray-500">MCap</span> <span className="font-semibold">{cd.MCap ? (cd.MCap > 1e9 ? (cd.MCap/1e9).toFixed(1)+'B' : cd.MCap > 1e6 ? (cd.MCap/1e6).toFixed(0)+'M' : (cd.MCap/1e3).toFixed(0)+'K') : '–'}</span></div>
                        <div><span className="text-gray-500">Rank</span> <span className="font-semibold">#{cd.Rank || '–'}</span></div>
                    </div>
                </div>
                <div className="bg-gray-50 p-3 rounded-lg mb-3 text-xs">
                    <h4 className="font-semibold text-sm mb-2">Performance</h4>
                    <div className="grid grid-cols-3 gap-2">
                        <div><span className="text-gray-500">1h</span> <span className={`font-semibold ${(cd.Change1h||0) >= 0 ? 'color-positive' : 'color-negative'}`}>{cd.Change1h?.toFixed(1) || '–'}%</span></div>
                        <div><span className="text-gray-500">24h</span> <span className={`font-semibold ${(cd.Change24h||0) >= 0 ? 'color-positive' : 'color-negative'}`}>{cd.Change24h?.toFixed(1) || '–'}%</span></div>
                        <div><span className="text-gray-500">7d</span> <span className={`font-semibold ${(cd.Change7d||0) >= 0 ? 'color-positive' : 'color-negative'}`}>{cd.Change7d?.toFixed(1) || '–'}%</span></div>
                        <div><span className="text-gray-500">Vol/MCap</span> <span className="font-semibold">{cd.VolMCapRatio?.toFixed(1) || '–'}%</span></div>
                        <div><span className="text-gray-500">Vol 24h</span> <span className="font-semibold">{cd.Vol24h ? (cd.Vol24h > 1e9 ? (cd.Vol24h/1e9).toFixed(1)+'B' : cd.Vol24h > 1e6 ? (cd.Vol24h/1e6).toFixed(0)+'M' : (cd.Vol24h/1e3).toFixed(0)+'K') : '–'}</span></div>
                        {cd.IsTrending && <div><span className="text-xs px-2 py-1 rounded bg-purple-100 text-purple-800 font-semibold">TRENDING</span></div>}
                    </div>
                </div>
                <div className="bg-gray-50 p-3 rounded-lg mb-3 text-xs">
                    <h4 className="font-semibold text-sm mb-2">Scanner Daten</h4>
                    <div className="grid grid-cols-2 gap-2">
                        {cd.EarlyScore && <div><span className="text-gray-500">Score</span> <span className={`font-semibold px-2 py-0.5 rounded ${cd.EarlyScore >= 70 ? 'bg-green-100 text-green-800' : cd.EarlyScore >= 40 ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800'}`}>{cd.EarlyScore}</span></div>}
                        {cd.DegenScore && <div><span className="text-gray-500">DegenScore</span> <span className="font-semibold">{cd.DegenScore}</span></div>}
                        {cd.WhaleScore && <div><span className="text-gray-500">WhaleScore</span> <span className="font-semibold">{cd.WhaleScore}</span></div>}
                        {cd.Signal && <div className="col-span-2"><span className="text-gray-500">Signal</span> <span className="font-semibold">{cd.Signal}</span></div>}
                        {cd.HasPerp && <div><span className="text-gray-500">Perp</span> <span className="font-semibold text-blue-600">{cd.BestExchange || 'Ja'}</span></div>}
                        {cd.FundingRate != null && <div><span className="text-gray-500">Funding</span> <span className="font-semibold">{(cd.FundingRate * 100).toFixed(3)}%</span></div>}
                        {cd.OI_Ratio && <div><span className="text-gray-500">OI Ratio</span> <span className="font-semibold">{cd.OI_Ratio.toFixed(2)}x</span></div>}
                        {cd.Signals && <div className="col-span-2"><span className="text-gray-500">Signale</span> <span className="font-semibold text-xs">{Array.isArray(cd.Signals) ? cd.Signals.join(', ') : cd.Signals}</span></div>}
                    </div>
                </div>
                </>
                )}

                {/* Price Action — Stock only */}
                {!isCrypto && (
                <div className="bg-gray-50 p-3 rounded-lg mb-3 text-xs">
                    <h4 className="font-semibold text-sm mb-2">Preis</h4>
                    <div className="grid grid-cols-3 gap-2">
                        <div><span className="text-gray-500">1D</span> <span className={change >= 0 ? 'color-positive' : 'color-negative'}>{change}%</span></div>
                        <div><span className="text-gray-500">5D</span> <span className={(d.change_5d ?? 0) >= 0 ? 'color-positive' : 'color-negative'}>{d.change_5d}%</span></div>
                        <div><span className="text-gray-500">20D</span> <span className={(d.change_20d ?? 0) >= 0 ? 'color-positive' : 'color-negative'}>{d.change_20d}%</span></div>

        </div>
    );
}
