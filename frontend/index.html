                    {activeTab === 'volume-spikes' && <VolumeSpikesTab onSelectTicker={gatedSelectTicker} scanCache={scanCache} updateScanCache={updateScanCache} schedulerStatus={schedulerStatus} />}
                    {activeTab === 'penny-stocks' && <PennyStocksTab onSelectTicker={gatedSelectTicker} scanCache={scanCache} updateScanCache={updateScanCache} schedulerStatus={schedulerStatus} />}
                    {activeTab === 'orb' && <ORBScannerTab onSelectTicker={gatedSelectTicker} scanCache={scanCache} updateScanCache={updateScanCache} schedulerStatus={schedulerStatus} />}
                    {activeTab === 'autotrader' && <AutoTraderTab />}
                    {activeTab === 'chart-analyse' && <ChartAnalyseTab onSelectTicker={gatedSelectTicker} scanCache={scanCache} updateScanCache={updateScanCache} />}
                    {activeTab === 'signal-performance' && <SignalPerformanceTab />}
                    {activeTab === 'admin' && <AdminTab />}
                </div>
            )}

            {/* Detail Sidebar */}
            {selectedTicker && (
                <DetailSidebar ticker={selectedTicker} onClose={() => { setSelectedTicker(null); setScannerItemData(null); }} scannerData={scannerItemData} />
            )}

            {/* Toast Container */}
            <ToastContainer />
            <TradeReminderPoller />
        </div>
    );
}

// Scanner Tab
function ScannerTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const defaultStockStrategy = 'Momentum Breakout Long';
    const [strategy, setStrategy] = useState(scanCache.scanner_strategy || defaultStockStrategy);
    const [marketType, setMarketType] = useState('stocks');
    const [isScanning, setIsScanning] = useState(scanCache.scanner_scanning || false);
    const [results, setResults] = useState(scanCache.scanner_results || []);
    const [scanInfo, setScanInfo] = useState(scanCache.scanner_info || null);
    const { sorted, toggleSort, sortKey } = useSortable(results, 'score');
    const { data: strategies } = useAutoRefresh(`/api/strategies?market_type=${marketType}`);
    const pollTimeoutRef = useRef(null);
    const groupedStrategies = useMemo(() => {
        const entries = Object.entries(strategies?.strategies || {});
        return entries.reduce((acc, [name, config]) => {
            const group = config?.display_group || 'Strategien';
            if (!acc[group]) acc[group] = [];
            acc[group].push([name, config]);
            return acc;
        }, {});
    }, [strategies]);

    // Cleanup polling on unmount
    useEffect(() => {
        return () => { if (pollTimeoutRef.current) clearTimeout(pollTimeoutRef.current); };
    }, []);

    useEffect(() => {
        const names = Object.keys(strategies?.strategies || {});
        if (!names.length) return;
        const preferred = marketType === 'stocks' && names.includes(defaultStockStrategy)
            ? defaultStockStrategy
            : names[0];
        if (!strategy || !strategies.strategies[strategy]) {
            setStrategy(preferred);
            updateScanCache('scanner_strategy', preferred);
        }
    }, [strategy, strategies, marketType]);

    const handleStrategyChange = (value) => {
        setStrategy(value);
        updateScanCache('scanner_strategy', value);
        setResults([]);
        updateScanCache('scanner_results', []);
        setScanInfo(null);
        updateScanCache('scanner_info', null);
    };

    const resultsUrlFor = (strategyName = strategy) => {
        if (!strategyName) return null;
        const stratLower = String(strategyName || '').toLowerCase();
        const isBI = stratLower.includes('bi_long') || stratLower.includes('bi_short');
        if (isBI) {
            const dir = stratLower.includes('short') ? 'short' : 'long';
            return `${API}/api/scan-results?direction=${dir}`;
        }
        return `${API}/api/scan-results?strategy=${encodeURIComponent(strategyName)}&market_type=${encodeURIComponent(marketType)}`;
    };

    const rememberScanInfo = (data) => {
        const info = {
            cached_at: data?.cached_at || null,
            cache_age_seconds: data?.cache_age_seconds ?? null,
            diagnostics: data?.diagnostics || null,
            warnings: data?.warnings || [],
            scan_error: data?.scan_error || null,
        };
        setScanInfo(info);
        updateScanCache('scanner_info', info);
    };

    // Always load latest results for the selected strategy. Do not fall back to
    // BI-long here, otherwise the strategy tab can show an unrelated empty cache.
    useEffect(() => {
        const loadCached = async () => {
            const url = resultsUrlFor(strategy);
            if (!url) return;
            try {
                const response = await fetch(url);
                if (response.ok) {
                    const data = await response.json();
                    const items = data.data || [];
                    setResults(items);
                    updateScanCache('scanner_results', items);
                    rememberScanInfo(data);
                }
            } catch (err) { console.error('Error:', err); }
        };
        loadCached();
    }, [strategy, marketType]);

    const handleScan = async () => {
        if (!strategy) {
            if (window.addToast) window.addToast('Bitte zuerst eine Strategie waehlen', 'warning');
            return;
        }
        setIsScanning(true);
        updateScanCache('scanner_scanning', true);
        // Save current cached_at BEFORE scan starts
        let prevCachedAt = null;
        try {
            const preUrl = resultsUrlFor(strategy);
            if (!preUrl) throw new Error('strategy missing');
            const preCheck = await fetch(preUrl);
            if (preCheck.ok) {
                const preData = await preCheck.json();
                prevCachedAt = preData.cached_at || null;
            }
        } catch(e) {}
        try {
            const response = await fetch(`${API}/api/scan`, { method: 'POST', body: JSON.stringify({ strategy, market_type: marketType }), headers: { 'Content-Type': 'application/json' } });
            if (response.ok) {
                if (window.addToast) window.addToast('Scan gestartet...', 'info');
                // Poll for results with increasing intervals
                const pollResults = async (attempts = 0) => {
                    if (attempts > 60) {
                        setIsScanning(false);
                        updateScanCache('scanner_scanning', false);
                        if (window.addToast) window.addToast('Scan dauert länger...', 'info');
                        return;
                    }
                    try {
                        // Strategie-Name mitsenden für korrekte Cache-Zuordnung
                        const pollUrl = resultsUrlFor(strategy);
                        if (!pollUrl) throw new Error('strategy missing');
                        const res = await fetch(pollUrl);
                        if (res.ok) {
                            const data = await res.json();
                            const items = data.data || [];
                            if (data.scan_error && !data.scan_running) {
                                rememberScanInfo(data);
                                setIsScanning(false);
                                updateScanCache('scanner_scanning', false);
                                if (window.addToast) window.addToast(`Scan fehlgeschlagen: ${data.scan_error}`, 'error');
                                return;
                            }
                            const isNewData = data.cached_at && data.cached_at !== prevCachedAt;
                            if (isNewData) {
                                setResults(items);
                                updateScanCache('scanner_results', items);
                                rememberScanInfo(data);
                                setIsScanning(false);
                                updateScanCache('scanner_scanning', false);
                                if (window.addToast) window.addToast(`Scan fertig: ${items.length} Ergebnisse`, 'success');
                                return;
                            }
                        }
                    } catch (e) { console.error(e); }
                    pollTimeoutRef.current = setTimeout(() => pollResults(attempts + 1), 10000);
                };
                pollTimeoutRef.current = setTimeout(() => pollResults(0), 3000); // Strategie-Scans sind schnell
            } else {
                setIsScanning(false);
                updateScanCache('scanner_scanning', false);
            }
        } catch (err) {
            if (window.addToast) window.addToast('Scan-Fehler', 'error');
            setIsScanning(false);
            updateScanCache('scanner_scanning', false);
        }
    };

    const scanWarnings = Array.isArray(scanInfo?.warnings) ? scanInfo.warnings : [];
    const visibleWarnings = isScanning ? [] : scanWarnings.filter((warning) => {
        const text = String(warning || '');
        return !text.startsWith('Cache ') &&
            text !== 'Keine Treffer im Cache' &&
            !text.startsWith('Strategie-Cache ist alt');
    });
    const cacheAgeLabel = Number.isFinite(Number(scanInfo?.cache_age_seconds))
        ? `Datenstand: ${formatCacheAge(Number(scanInfo.cache_age_seconds))}`
        : null;
    const cacheIsStale = scanWarnings.some((warning) =>
        String(warning || '').startsWith('Cache alt:') || String(warning || '').startsWith('Strategie-Cache ist alt')
    );
    const getBreakoutQuality = (item) => {
        const score = item?.breakout_continuation_score ?? item?.Breakout_Continuation_Score;
        const label = item?.breakout_continuation_label ?? item?.Breakout_Continuation_Label;
        const risk = item?.breakout_fakeout_risk ?? item?.Breakout_Fakeout_Risk;
        if (score == null && !label && !risk) return null;
        const s = Number(score || 0);
        const tone = risk === 'LOW' ? 'good' : (risk === 'MEDIUM' ? 'warn' : 'bad');
        const riskLabel = ({LOW: 'niedrig', MEDIUM: 'mittel', HIGH: 'hoch', CRITICAL: 'sehr hoch'})[risk] || '-';
        return { score: s, label: label || 'Breakout-Bestaetigung', risk: riskLabel, tone };
    };
    const breakoutQualityHelp = 'Qualitaetsbewertung, keine Gewinnwahrscheinlichkeit: Schlusskurslage, oberer Wick, RVOL, Halt des Breakout-Levels und Ueberdehnung.';
    const breakoutBadgeStyle = (tone) => ({
        display: 'inline-flex',
        alignItems: 'center',
        gap: 4,
        padding: '3px 7px',
        borderRadius: 6,
        fontSize: 11,
        fontWeight: 700,
        background: tone === 'good' ? '#d1fae5' : tone === 'warn' ? '#fef3c7' : '#fee2e2',
        color: tone === 'good' ? '#047857' : tone === 'warn' ? '#92400e' : '#b91c1c',
    });

    return (
        <div className="space-y-6">
            <div className="card border border-gray-200 p-6 rounded-lg strategy-select-card">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label className="block text-sm font-semibold mb-2">Strategie</label>
                        <select value={strategy} onChange={(e) => handleStrategyChange(e.target.value)} className="w-full">
                            <option value="">Wählen Sie eine Strategie...</option>
                            {Object.entries(groupedStrategies).map(([group, items]) => (
                                <optgroup key={group} label={group}>
                                    {items.map(([name]) => (
                                        <option key={name} value={name}>{name}</option>
                                    ))}
                                </optgroup>
                            ))}
                        </select>
                    </div>
                    <div>
                        <label className="block text-sm font-semibold mb-2">Markttyp</label>
                        <select value={marketType} onChange={(e) => setMarketType(e.target.value)} className="w-full">
                            <option value="stocks">Aktien</option>
                            <option value="crypto">Crypto</option>
                            <option value="futures">Futures</option>
                            <option value="forex">Forex</option>
                        </select>
                    </div>
                </div>
            </div>

            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} />

            {!isScanning && cacheAgeLabel && (
                <div className={`-mt-4 px-1 text-right text-[11px] ${cacheIsStale ? 'text-amber-600' : 'text-gray-400'}`}>
                    {cacheAgeLabel}
                </div>
            )}

            {visibleWarnings.length > 0 && (
                <div className="p-3 rounded-lg border border-red-200 bg-red-50 text-red-800 text-sm">
                    {visibleWarnings.join(' | ')}
                </div>
            )}

            <div className="card border border-gray-200 p-6 rounded-lg scanner-results-card">
                <div className="md:hidden">
                    {sorted.length === 0 ? (
                        <div className="text-sm text-gray-500 text-center py-6">
                            {isScanning ? 'Scan laeuft noch - Ergebnisse erscheinen automatisch, sobald der Cache aktualisiert ist.' : 'Noch keine Scanner-Ergebnisse vorhanden.'}
                        </div>
                    ) : (
                        sorted.map((item, idx) => (
                            <button key={idx} className="scanner-mobile-card w-full text-left" onClick={() => marketType === 'crypto' ? onSelectTicker({ticker: item.ticker, isCrypto: true, ...item}) : onSelectTicker(item.ticker)}>
                                <div className="flex items-start justify-between gap-3">
                                    <div>
                                        <div className="flex items-center gap-2 flex-wrap">
                                            <div className="text-base font-bold">{item.ticker}</div>
                                            <span className={`grade-badge grade-${(item.grade || 'C').toLowerCase()}`}>{item.grade || 'C'}</span>
                                            {item.mdr_tag && <span style={{fontSize:10,padding:'2px 6px',borderRadius:999,background:(item.mdr_tag.includes('CRASH') || item.mdr_tag.includes('FADING')) ? '#dc2626' : (item.mdr_tag.includes('BLOWOUT') ? '#a855f7' : '#f97316'),color:'#fff',fontWeight:600}}>{item.mdr_tag}</span>}
                                        </div>
                                        <div className="text-xs text-gray-500 mt-1">Tap für Detailansicht</div>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-lg font-bold">{item.score?.toFixed(1) || '–'}</div>
                                        <div className="text-xs text-gray-500">Score</div>
                                    </div>
                                </div>
                                <div className="scanner-mobile-grid">
                                    <div>
                                        <div className="scanner-mobile-label">Preis</div>
                                        <div className="scanner-mobile-value">${item.price?.toFixed(2) || '–'}</div>
                                    </div>
                                    <div>
                                        <div className="scanner-mobile-label">Änderung</div>
                                        <div className={`scanner-mobile-value ${item.change_pct >= 0 ? 'color-positive' : 'color-negative'}`}>{item.change_pct != null ? `${item.change_pct.toFixed(2)}%` : '–'}</div>
                                    </div>
                                    <div>
                                        <div className="scanner-mobile-label">RSI</div>
                                        <div className="scanner-mobile-value">{item.rsi?.toFixed(1) || '–'}</div>
                                    </div>
                                    <div>
                                        <div className="scanner-mobile-label">RVOL</div>
                                        <div className="scanner-mobile-value">{item.rvol != null ? `${item.rvol.toFixed(2)}x` : '–'}</div>
                                    </div>
                                    {getBreakoutQuality(item) && (
                                        <div>
                                            <div className="scanner-mobile-label" title={breakoutQualityHelp}>Breakout-Bestaetigung</div>
                                            <div className="scanner-mobile-value">
                                                <span style={breakoutBadgeStyle(getBreakoutQuality(item).tone)} title={breakoutQualityHelp}>
                                                    {getBreakoutQuality(item).label} {getBreakoutQuality(item).score}/100
                                                </span>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </button>
                        ))
                    )}
                </div>
                <div className="hidden md:block overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('ticker')}>Ticker {sortKey === 'ticker' && '↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('price')}>Preis {sortKey === 'price' && '↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('change_pct')}>Änderung% {sortKey === 'change_pct' && '↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('rsi')}>RSI {sortKey === 'rsi' && '↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('rvol')}>RVOL {sortKey === 'rvol' && '↓'}</th>
                            <th className="text-center py-2 px-2" title={breakoutQualityHelp}>Breakout-Bestaetigung</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('score')}>Score {sortKey === 'score' && '↓'}</th>
                            <th className="text-center py-2 px-2">Grade</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.length === 0 && (
                            <tr>
                                <td colSpan="8" className="py-8 text-center text-gray-500">
                                    {isScanning ? 'Scan laeuft noch - Ergebnisse erscheinen automatisch, sobald der Cache aktualisiert ist.' : 'Noch keine Scanner-Ergebnisse vorhanden.'}
                                </td>
                            </tr>
                        )}
                        {sorted.map((item, idx) => (
                            <tr key={idx} className="table-row border-b border-gray-200" onClick={() => marketType === 'crypto' ? onSelectTicker({ticker: item.ticker, isCrypto: true, ...item}) : onSelectTicker(item.ticker)}>
                                <td className="py-3 px-2 font-semibold">
                                    {item.ticker}
                                    {item.mdr_tag && <span style={{marginLeft:6,fontSize:10,padding:'2px 6px',borderRadius:4,background:(item.mdr_tag.includes('CRASH') || item.mdr_tag.includes('FADING')) ? '#dc2626' : (item.mdr_tag.includes('BLOWOUT') ? '#a855f7' : '#f97316'),color:'#fff',fontWeight:600}}>{item.mdr_tag}</span>}
                                </td>
                                <td className="py-3 px-2 text-right">${item.price?.toFixed(2)}</td>
                                <td className={`py-3 px-2 text-right ${item.change_pct >= 0 ? 'color-positive' : 'color-negative'}`}>{item.change_pct?.toFixed(2)}%</td>
                                <td className="py-3 px-2 text-right">{item.rsi?.toFixed(1)}</td>
                                <td className="py-3 px-2 text-right">{item.rvol != null ? `${item.rvol.toFixed(2)}x` : '–'}</td>
                                <td className="py-3 px-2 text-center">
                                    {getBreakoutQuality(item) ? (
                                        <div className="inline-flex flex-col items-center gap-1">
                                            <span style={breakoutBadgeStyle(getBreakoutQuality(item).tone)} title={breakoutQualityHelp}>
                                                {getBreakoutQuality(item).label}
                                            </span>
                                            <span className="text-xs text-gray-500" title={breakoutQualityHelp}>Qualitaet {getBreakoutQuality(item).score}/100 | Risiko {getBreakoutQuality(item).risk}</span>
                                        </div>
                                    ) : '–'}
                                </td>
                                <td className="py-3 px-2 text-right font-semibold">{item.score?.toFixed(1)}</td>
                                <td className="py-3 px-2 text-center"><span className={`grade-badge grade-${(item.grade || 'C').toLowerCase()}`}>{item.grade || 'C'}</span></td>
                            </tr>
                        ))}
                    </tbody>
                </table>
                </div>
            </div>
        </div>
    );
}

// BI Scanner Tab
function BIScannerTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [direction, setDirection] = useState('long');
    const [isScanning, setIsScanning] = useState(scanCache.bi_scanning || false);
    const [results, setResults] = useState(scanCache.bi_results || []);
    const [diagnostics, setDiagnostics] = useState(scanCache.bi_diagnostics || null);
    const { sorted, toggleSort, sortKey } = useSortable(results, 'score');
    const pollRef = useRef(null);

    // Cleanup polling on unmount
    useEffect(() => {
        return () => { if (pollRef.current) clearInterval(pollRef.current); };
    }, []);

    // V2.2: Live-Polling — lädt Zwischenergebnisse während Scan läuft
    const startLivePolling = () => {
        if (pollRef.current) clearInterval(pollRef.current);
        pollRef.current = setInterval(async () => {
            try {
                // Prüfe ob Scan noch läuft
                const scanKey = direction === 'long' ? 'bi_long' : 'bi_short';
                const statusRes = await fetch(`${API}/api/scan-status`);
                let scanRunning = true;
                if (statusRes.ok) {
                    const status = await statusRes.json();
                    const s = status.scans?.[scanKey];
                    scanRunning = s?.running || false;
                }
                // Lade aktuelle Ergebnisse (inkl. Zwischenergebnisse)
                const res = await fetch(`${API}/api/bi-results?direction=${direction}`);
                if (res.ok) {
                    const data = await res.json();
                    const items = data.data || [];
                    setResults(items);
                    setDiagnostics(data.diagnostics || null);
                    updateScanCache('bi_results', items);
                    updateScanCache('bi_diagnostics', data.diagnostics || null);
                }
                // Scan fertig → Polling stoppen
                if (!scanRunning) {
                    clearInterval(pollRef.current);
                    pollRef.current = null;
                    setIsScanning(false);
                    updateScanCache('bi_scanning', false);
                    if (window.addToast) window.addToast('Scan fertig', 'success');
                }
            } catch (e) { console.error(e); }
        }, 8000); // Alle 8 Sekunden
    };

    const handleScan = async () => {
        setIsScanning(true);
        updateScanCache('bi_scanning', true);
        try {
            const response = await fetch(`${API}/api/bi-scan`, { method: 'POST', body: JSON.stringify({ direction }), headers: { 'Content-Type': 'application/json' } });
            if (response.ok) {
                if (window.addToast) window.addToast('Scan gestartet — Ergebnisse erscheinen live...', 'info');
                startLivePolling();
            } else {
                setIsScanning(false);
                updateScanCache('bi_scanning', false);
            }
        } catch (err) {
            console.error('Error:', err);
            setIsScanning(false);
            updateScanCache('bi_scanning', false);
        }
    };

    // Load results on mount / direction change + auto-detect running scan
    useEffect(() => {
        const fetchResults = async () => {
            try {
                const response = await fetch(`${API}/api/bi-results?direction=${direction}`);
                if (response.ok) {
                    const data = await response.json();
                    const items = data.data || [];
                    setResults(items);
                    setDiagnostics(data.diagnostics || null);
                    updateScanCache('bi_results', items);
                    updateScanCache('bi_diagnostics', data.diagnostics || null);
                }
                // Auto-detect: Läuft gerade ein Scan? Dann Live-Polling starten
                const scanKey = direction === 'long' ? 'bi_long' : 'bi_short';
                const statusRes = await fetch(`${API}/api/scan-status`);
                if (statusRes.ok) {
                    const status = await statusRes.json();
                    if (status.scans?.[scanKey]?.running) {
                        setIsScanning(true);
                        startLivePolling();
                    }
                }
            } catch (err) { console.error('Error:', err); }
        };
        fetchResults();
        return () => { if (pollRef.current) clearInterval(pollRef.current); };
    }, [direction]);

    return (
        <div className="space-y-6">
            <div className="card border border-gray-200 p-6 rounded-lg">
                <label className="block text-sm font-semibold mb-3">Richtung</label>
                <div className="flex gap-4">
                    <button onClick={() => setDirection('long')} className={`button ${direction === 'long' ? '' : 'button-secondary'}`}>Long</button>
                    <button onClick={() => setDirection('short')} className={`button ${direction === 'short' ? '' : 'button-secondary'}`}>Short</button>
                </div>
            </div>

            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey={direction === 'long' ? 'bi_long' : 'bi_short'} />

            <div className="text-sm rounded-lg border border-blue-200 bg-blue-50 text-blue-900 px-4 py-3">
                <b>BI Kandidatenmodus:</b> Die Tabelle zeigt bewusst mehr Setups zur manuellen Pruefung. Mails bleiben strenger und gehen nur raus, wenn Trade Health, RVOL, Level, R:R und Asset-Filter passen.
                <span className="block mt-1 text-xs">
                    KANDIDAT = interessant, aber noch nicht stark genug fuer automatische Mail. WARTEN = Timing/Retest/Trigger fehlt. JETZT = alle Trade-Gates bestanden. NO TRADE = harter Blocker.
                </span>
                {diagnostics && <span className="ml-2 text-blue-700">Cache: {diagnostics.visible_candidates ?? results.length} sichtbar / {diagnostics.raw_cache_results ?? results.length} roh.</span>}
                {diagnostics?.cache_partial && <span className="ml-2 text-amber-700 font-semibold">Zwischenstand: {diagnostics.checked || 0}/{diagnostics.total || '?'} geprueft. Ticker sind jetzt ueber A-Z verteilt, nicht alphabetisch vorne.</span>}
            </div>

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('ticker')}>Ticker {sortKey === 'ticker' && '↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('price')}>Preis {sortKey === 'price' && '↓'}</th>

                    </thead>
                    <tbody>
                        {sorted.map((item, idx) => {
                            const action = String(item.trade_action || item.trade_signal || item.scanner_decision || '').toUpperCase();
                            const reasons = item.scanner_suppression_reasons || item._quality?.exclusion_reasons || [];
                            const mailGateReasons = new Set(['grade_below_alert_threshold', 'score_below_alert_threshold', 'rvol_below_alert_threshold']);
                            const alertGateOnly = reasons.length > 0 && reasons.every(r => mailGateReasons.has(String(r)));
                            const isNow = action.includes('NOW') || action.includes('JETZT');
                            const isWait = action.includes('WAIT') || action.includes('WARTEN');
                            const isNoTrade = !alertGateOnly && (action.includes('NO_TRADE') || action.includes('NICHT'));
                            const isCandidate = action.includes('CANDIDATE') || action.includes('KANDIDAT') || alertGateOnly;
                            const actionCls = isNow ? 'bg-green-100 text-green-800' : isNoTrade ? 'bg-red-100 text-red-800' : isWait ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800';

                            const criteria = item.bi_criteria || {};
                            const criteriaText = criteria.total ? `${criteria.passed}/${criteria.total} Kriterien` : '';
                            const blocker = alertGateOnly ? 'Mail-Gate nicht erreicht, aber kein harter No-Trade' : reasons.slice(0, 2).join(', ');
                            const statusText = [criteriaText, blocker || item.signal_label || item.grade_label].filter(Boolean).join(' | ');

                                    </td>
                                    <td className="py-3 px-2 text-right">${item.price?.toFixed(2)}</td>
                                    <td className="py-3 px-2 text-right" style={{color: (item.change_pct || 0) >= 0 ? '#10b981' : '#ef4444'}}>{(item.change_pct || 0) >= 0 ? '+' : ''}{(item.change_pct || 0).toFixed(2)}%</td>
                                    <td className="py-3 px-2 text-right">{item.rsi != null ? Number(item.rsi).toFixed(1) : '–'}</td>
                                    <td className="py-3 px-2 text-right" style={{color: (item.rvol || 0) >= 2 ? '#f59e0b' : '#9ca3af'}}>{(item.rvol || 0).toFixed(1)}x</td>
                                    <td className="py-3 px-2"><span className={`px-2 py-1 rounded text-xs font-semibold ${actionCls}`}>{actionLabel}</span></td>
                                    <td className="py-3 px-2 text-right font-semibold">{Number(item.score ?? 0).toFixed(0)}</td>
                                    <td className="py-3 px-2 text-center"><span title={`Setup Grade: ${item.setup_grade || item.raw_grade || '-'} | Trade Grade: ${item.grade || 'C'} | Setup ${Number(item.setup_score ?? item.raw_score ?? item.BI_Score ?? 0).toFixed(0)}`} className={`grade-badge grade-${(item.grade || 'C').toLowerCase()}`}>{item.grade || 'C'}</span></td>
                                    <td className="py-3 px-2 text-right">{item.volume ? (item.volume >= 1000000 ? (item.volume / 1000000).toFixed(1) + 'M' : (item.volume / 1000).toFixed(0) + 'K') : '–'}</td>
                                    <td className="py-3 px-2 text-xs text-gray-600 max-w-xs truncate" title={statusText}>{statusText || direction.toUpperCase()}</td>
                                </tr>
                            );
                        })}
                    </tbody>
                </table>
                {sorted.length === 0 && <div className="text-center text-gray-400 py-8">Keine BI-Kandidaten im Cache. Scan starten oder warten, bis der Hintergrundscan fertig ist.</div>}
            </div>
        </div>
    );
}

            const preCheck = await fetch(`${API}/api/biotech-results`);

            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey="btc_divergenz" />
            <div className="p-3 rounded-lg bg-orange-50 border border-orange-100 text-sm text-orange-900">
                Signal-Only Modus: BTC-Divergenz zeigt keine Watchliste mehr. Ein Coin erscheint hier erst, wenn relative Staerke/Schwaeche plus echter Entry-Trigger zu einem handelbaren Signal werden.
            </div>

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('symbol')}>Coin</th>
                            <th className="text-left py-2 px-2">Name</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('price')}>Preis</th>
                            <th className="text-right py-2 px-2">24h</th>
                            <th className="text-right py-2 px-2">7d</th>
                            <th className="text-right py-2 px-2">Alpha 24h</th>
                            <th className="text-right py-2 px-2">Alpha 7d</th>
                            <th className="text-center py-2 px-2">BTC</th>
                            <th className="text-center py-2 px-2 sortable-header" onClick={() => toggleSort('score')}>Score</th>
                            <th className="text-center py-2 px-2">Signal</th>
                            <th className="text-left py-2 px-2">Perp</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.map((item, idx) => (
                            <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker({ticker: item.symbol, isCrypto: true, isExchangeCrypto: !!item.contract, exchange: item.exchange, contract: item.contract, ...item})}>
                                <td className="py-3 px-2 font-semibold">{item.symbol}</td>
                                <td className="py-3 px-2">{item.name}</td>
                                <td className="py-3 px-2 text-right">{formatDivPrice(item.price)}</td>
                                <td className={`py-3 px-2 text-right ${item.change_1d >= 0 ? 'color-positive' : 'color-negative'}`}>{fmtPct(item.change_1d)}</td>
                                <td className={`py-3 px-2 text-right ${(item.change_7d ?? item.change_5d) >= 0 ? 'color-positive' : 'color-negative'}`}>{fmtPct(item.change_7d ?? item.change_5d)}</td>
                                <td className={`py-3 px-2 text-right ${(item.alpha_24h ?? item.div_1d) >= 0 ? 'color-positive' : 'color-negative'}`}>{fmtPct(item.alpha_24h ?? item.div_1d)}</td>
                                <td className={`py-3 px-2 text-right ${(item.alpha_7d ?? item.div_5d) >= 0 ? 'color-positive' : 'color-negative'}`}>{fmtPct(item.alpha_7d ?? item.div_5d)}</td>
                                <td className="py-3 px-2 text-center text-xs" title={`BTC 24h ${fmtPct(item.btc_24h)} | BTC 7d ${fmtPct(item.btc_7d)}`}>{item.btc_regime || '—'}</td>
                                <td className="py-3 px-2 text-center"><span className={`signal-badge ${(item.score || 0) >= 75 ? 'signal-bullish' : (item.score || 0) >= 55 ? 'signal-lightdiv' : 'signal-neutral'}`}>{item.grade || ''} {item.score ?? '—'}</span></td>
                                <td className="py-3 px-2 text-center"><span className={`signal-badge ${getSignalClass(item.signal || '')}`}>{item.signal || '–'}</span></td>
                                <td className="py-3 px-2"><span className={`text-xs px-2 py-1 rounded ${item.has_perp ? 'bg-blue-100 text-blue-800' : 'text-gray-500'}`}>{item.has_perp ? item.best_exchange || item.exchange || 'Perp' : '—'}</span></td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

// Early Movers Tab
function EarlyMoversTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [coins, setCoins] = useState(scanCache.em_coins || []);
    const [stats, setStats] = useState(scanCache.em_stats || null);
    const [isScanning, setIsScanning] = useState(false);
    const [phaseFilter, setPhaseFilter] = useState(0); // 0=alle, 1/2/3=Phase
    const { sorted, toggleSort, sortKey } = useSortable(coins, 'entry_score');
    const pollTimeoutRef = useRef(null);
    const lastLoadedCachedAtRef = useRef(scanCache.em_cached_at || null);

    const formatPrice = (price) => {
        if (price === null || price === undefined) return '–';
        if (price >= 100) return `$${price.toFixed(2)}`;
        if (price >= 1) return `$${price.toFixed(4)}`;
        if (price >= 0.01) return `$${price.toFixed(6)}`;
        return `$${price.toFixed(8)}`;
    };

    const phaseIcon = (p) => p === 1 ? '\u{1F7E2}' : p === 2 ? '\u{1F7E1}' : '\u{1F534}';
    const riskBadge = (r) => r === 'HIGH' ? 'signal-bearish' : r === 'MEDIUM' ? 'signal-lightdiv' : 'signal-bullish';
    const finalDecisionOf = (item) => String(item.trade_decision || item.trade_health?.decision || '').toUpperCase();
    const timingBadge = (item) => {
        const decision = finalDecisionOf(item);
        const signal = String(item.trade_signal || '').toUpperCase();
        const action = String(item.trade_action || '').toUpperCase();
        if (decision === 'NO_TRADE') return { label: 'NO TRADE', cls: 'signal-bearish' };
        if (decision === 'WAIT_FOR_RETEST') return { label: 'RETEST WARTEN', cls: 'signal-lightdiv' };
        if (decision === 'WAIT_FOR_TRIGGER') return { label: 'ENTRY WARTEN', cls: 'signal-abwarten' };
        if (decision === 'WAIT_FOR_CONTINUATION') return { label: 'FORTSETZUNG', cls: 'signal-lightdiv' };
        if (decision === 'WATCH_ONLY') return { label: 'WATCH', cls: 'signal-abwarten' };
        if (signal === 'JETZT_TRADEN') return { label: 'READY', cls: 'signal-bullish' };
        if (signal === 'EXPLOSION_ARMED' || item.pre_breakout_armed) return { label: 'WATCH', cls: 'signal-abwarten' };
        if (signal === 'NICHT_TRADEN' || action === 'NO_LONG_CHASE') return { label: 'NO TRADE', cls: 'signal-bearish' };
        if (action === 'WAIT_FOR_LIQUIDITY') return { label: 'LIQUIDITAET', cls: 'signal-bearish' };
        if (action === 'WAIT_FOR_RETEST') return { label: 'RETEST WARTEN', cls: 'signal-lightdiv' };
        if (action === 'LONG_TRIGGER' && !item.execution_trigger_ok) return { label: 'ENTRY WARTEN', cls: 'signal-abwarten' };
        if (action === 'WAIT_FOR_CONTINUATION') return { label: 'FORTSETZUNG', cls: 'signal-lightdiv' };
        if (signal === 'WARTEN' || action === 'WAIT_FOR_BTC_CONFIRMATION') return { label: 'WARTEN', cls: 'signal-lightdiv' };
        return { label: 'WATCH', cls: 'signal-abwarten' };
    };
    const actionBadge = (item) => {
        const decision = finalDecisionOf(item);
        const decisionLabel = item.trade_decision_label || item.trade_health?.decision_label || '';
        const signal = String(item.trade_signal || '').toUpperCase();
        const action = String(item.trade_action || item.entry_status || '').toUpperCase();
        if (decision === 'NO_TRADE') {
            return { label: 'NICHT TRADEN', detail: decisionLabel || 'Trade Health blockt dieses Setup', cls: 'bg-red-100 text-red-800' };
        }
        if (decision === 'WAIT_FOR_RETEST') {
            return { label: 'WARTEN AUF RETEST', detail: decisionLabel || 'Retest nahe Entry abwarten', cls: 'bg-amber-100 text-amber-800' };
        }
        if (decision === 'WAIT_FOR_TRIGGER') {
            return { label: 'ENTRY WARTEN', detail: decisionLabel || 'Entry-Bestaetigung fehlt noch', cls: 'bg-blue-100 text-blue-800' };
        }
        if (decision === 'WAIT_FOR_CONTINUATION') {
            return { label: 'FORTSETZUNG FEHLT', detail: decisionLabel || 'Neue Flag/VWAP-Hold abwarten', cls: 'bg-amber-100 text-amber-800' };
        }
        if (decision === 'WATCH_ONLY') {
            return { label: 'SETUP WATCH', detail: decisionLabel || 'Noch kein Entry', cls: 'bg-sky-100 text-sky-800' };
        }
        if (signal === 'JETZT_TRADEN') {
            return { label: 'JETZT TRADEN', detail: 'Execution bestaetigt', cls: 'bg-green-100 text-green-800' };
        }
        if (signal === 'EXPLOSION_ARMED' || item.pre_breakout_armed) {
            return { label: 'KEIN TRADE', detail: 'Nur Watch: erst nach sauberem Entry-Trigger handeln', cls: 'bg-amber-100 text-amber-800' };
        }
        if (signal === 'NICHT_TRADEN' || action === 'NO_LONG_CHASE' || action === 'NO_TRADE') {
            return { label: 'NICHT TRADEN', detail: 'Kein Entry', cls: 'bg-red-100 text-red-800' };
        }
        if (action === 'WAIT_FOR_RETEST') {
            return { label: 'WARTEN AUF RETEST', detail: 'Retest nahe Entry abwarten', cls: 'bg-amber-100 text-amber-800' };
        }
        if (action === 'WAIT_FOR_CONTINUATION') {
            return { label: 'FORTSETZUNG FEHLT', detail: 'Neue Flag/VWAP-Hold abwarten', cls: 'bg-amber-100 text-amber-800' };
        }
        if (action === 'WAIT_FOR_BTC_CONFIRMATION') {
            return { label: 'BTC FEHLT', detail: 'BTC muss bestaetigen', cls: 'bg-yellow-100 text-yellow-800' };
        }
        if (action === 'WAIT_FOR_LIQUIDITY') {
            return { label: 'LIQUIDITAET FEHLT', detail: 'Orderbuch/Perp zu duenn', cls: 'bg-yellow-100 text-yellow-800' };
        }
        if (action === 'LONG_TRIGGER') {
            return { label: 'ENTRY WARTEN', detail: 'Noch keine Entry-Bestaetigung', cls: 'bg-blue-100 text-blue-800' };
        }
        if (signal === 'WARTEN') {
            return { label: 'WARTEN', detail: 'Noch keine Entry-Freigabe', cls: 'bg-yellow-100 text-yellow-800' };
        }
        return { label: 'SETUP WATCH', detail: 'Noch kein Entry', cls: 'bg-sky-100 text-sky-800' };
    };
    const earlyRiskLabelMap = {
        observe_only_scanner: 'nur Beobachtung',
        no_intraday_execution_trigger: 'Entry abwarten',
        retest_trigger_missing: 'Retest fehlt',
        no_market_entry: 'kein Market-Entry',
        extreme_volume_turnover: 'extremer Umsatz',
        turnover_without_alpha: 'Umsatz ohne BTC-Alpha',
        extreme_turnover_churn: 'Churn/Distribution',
        very_high_volume_turnover: 'sehr hoher Umsatz',
        high_volume_turnover: 'hoher Umsatz',
        overheated_phase3: 'ueberhitzt',
        btc_headwind: 'BTC Gegenwind',
        data_warning: 'Daten unsicher',
        oi_snapshot_only: 'OI nur Snapshot',
        manipulation_spread: 'Spread/Manipulationsrisiko',
        no_perp_execution_market: 'kein Perp-Trigger',
        thin_perp_liquidity: 'Perp-Liquiditaet duenn',
        perp_liquidity_watch: 'Perp-Liquiditaet mittel',
        thin_spot_liquidity: 'Gesamtvolumen duenn',
        thin_orderbook: 'Orderbuch duenn',
        market_impact_risk: 'Market-Impact Risiko',
        chased_from_entry: 'zu weit vom Entry',
        weak_structural_targets: 'Ziele zu eng',
        duplicate_targets: 'TP1/TP2 ungueltig',
        targets_too_close: 'Ziele zu nah',
        invalid_target_plan: 'Tradeplan ungueltig',
        pre_breakout_score_below_threshold: 'Entry-Setup zu schwach',
        not_pre_breakout_coil: 'kein echter Coil',
        pre_breakout_armed: 'Breakout-Watch',
    };
    const waitOnlyEntryReasons = new Set([
        'observe_only_scanner',
        'no_intraday_execution_trigger',
        'requires_5m_trigger',
        'no_market_entry',
        'micro_trigger_missing',
        'pre_breakout_armed',
        'not_pre_breakout_coil',
        'pre_breakout_score_below_threshold',
    ]);
    const isConfirmedEarlyTrade = (item) => {
        const signal = String(item.trade_signal || '').toUpperCase();
        const decision = finalDecisionOf(item);
        if (decision && decision !== 'TRADEABLE') return false;
        return signal === 'JETZT_TRADEN' && !!(item.execution_trigger_ok || item.alertable_crypto || String(item.signal_quality || '').toLowerCase() === 'tradeable');
    };
    const humanizeEntryRisk = (flag) => earlyRiskLabelMap[String(flag || '').toLowerCase()] || String(flag || '').replaceAll('_', ' ');
    const getEntryRiskReasons = (item) => {
        const reasons = Array.isArray(item.risk_reasons) ? item.risk_reasons : [];
        const fallback = reasons.length > 0 ? reasons : (Array.isArray(item.risk_flags) ? item.risk_flags : []);
        if (!isConfirmedEarlyTrade(item)) return fallback;
        return fallback.filter(reason => !waitOnlyEntryReasons.has(String(reason || '').toLowerCase()));
    };
    const getPrimaryEntryReason = (item) => {
        const reasons = getEntryRiskReasons(item);
        const meaningful = reasons.filter(r => String(r || '').toLowerCase() !== 'observe_only_scanner');
        if (meaningful.length > 0) return meaningful[0];
        const action = String(item.trade_action || '').toUpperCase();
        if (action === 'WAIT_FOR_RETEST') return 'retest_trigger_missing';
        if (action === 'LONG_TRIGGER' && !item.execution_trigger_ok) return 'no_intraday_execution_trigger';
        return reasons[0];
    };
    const getEntryRiskTitle = (item) => {
        const reasons = getEntryRiskReasons(item);
        return reasons.length > 0 ? reasons.map(humanizeEntryRisk).join(' | ') : 'Keine Entry-Warnung';
    };
    const getSetupScoreTitle = (item) => {
        const raw = item.raw_score != null ? `Raw ${item.raw_score}` : 'Raw n/a';
        const source = item.source || 'Early Mover';
        return `Setup Score = Coin-Qualitaet (${source}, ${raw}). Entry Score = Handelsnaehe jetzt.`;
    };
    const targetPctFromEntry = (target, entry) => {
        const t = Number(target);
        const e = Number(entry);
        if (!Number.isFinite(t) || !Number.isFinite(e) || e <= 0) return '';
        return `+${(((t - e) / e) * 100).toFixed(1)}%`;
    };
    const targetQualityTone = (quality, flags = []) => {
        const q = String(quality || '').toUpperCase();
        const f = Array.isArray(flags) ? flags.map(flag => String(flag || '').toLowerCase()) : [];
        if (q.includes('WEAK') || f.some(flag => ['weak_structural_targets', 'targets_too_close', 'duplicate_targets', 'target_plan_invalid'].includes(flag))) return 'text-amber-700';
        if (q.includes('VRVP')) return 'text-cyan-700';
        if (q === 'STRUCTURAL') return 'text-emerald-700';
        return 'text-gray-600';
    };
    const targetQualityLabel = (quality, flags = []) => {
        const q = String(quality || '').toUpperCase();
        const f = Array.isArray(flags) ? flags.map(flag => String(flag || '').toLowerCase()) : [];
        if (q.includes('WEAK') || f.some(flag => ['weak_structural_targets', 'targets_too_close', 'duplicate_targets', 'target_plan_invalid'].includes(flag))) return 'Zielzonen schwach';
        if (q.includes('VRVP') || f.includes('vrvp_target_confirmed')) return 'VRVP/Volume-Profile Ziel';
        if (q === 'STRUCTURAL') return 'Strukturziel';
        return 'Zielquelle unklar';
    };
    const humanizeTargetSource = (source) => {
        const s = String(source || '').toLowerCase();
        const map = {
            '24h_high_liquidity': '24h Hoch / Liquiditaet',
            '127_2_range_extension': 'Fib 127.2% aus 24h-Range',
            '161_8_range_extension': 'Fib 161.8% aus 24h-Range',
            '200_0_range_extension': 'Fib 200% aus 24h-Range',
            '261_8_range_extension': 'Fib 261.8% aus 24h-Range',
            'breakout_measured_move_127': 'Measured Move 127%',
            'breakout_measured_move_161': 'Measured Move 161%',
            'breakout_measured_move_200': 'Measured Move 200%',
            'breakout_measured_move_261': 'Measured Move 261%',
            'vrvp_vah_resistance': 'VRVP VAH',
            'vrvp_poc_acceptance': 'VRVP POC',
            'vrvp_hvn_resistance': 'VRVP HVN',
            'vrvp_lvn_upper_edge': 'VRVP LVN Kante',
            'vrvp_val_support': 'VRVP VAL',
        };
        const clean = s.replace('_too_close', '').replace('_projected_extension_no_clean_structure', '');
        return map[clean] || String(source || '-').replaceAll('_', ' ');
    };

    useEffect(() => {
        return () => { if (pollTimeoutRef.current) clearTimeout(pollTimeoutRef.current); };
    }, []);

    const loadResults = async ({ force = false } = {}) => {
        try {
            const response = await fetch(`${API}/api/early-movers-results`);
            if (response.ok) {
                const data = await response.json();
                const em = (data.data && data.data[0]) || {};
                const nextCachedAt = data.cached_at || null;
                if (!force && nextCachedAt && lastLoadedCachedAtRef.current === nextCachedAt) return;
                const items = em.coins || [];
                setCoins(items);
                setStats(em.stats || null);
                lastLoadedCachedAtRef.current = nextCachedAt;
                updateScanCache('em_coins', items);
                updateScanCache('em_stats', em.stats);
                updateScanCache('em_cached_at', nextCachedAt);
            }
        } catch (err) { console.error('Error fetching early movers:', err); }
    };

    // Load latest data on mount.
    useEffect(() => { loadResults({ force: true }); }, []);

    // If the background scheduler finishes a new Early-Mover scan while this tab is open,
    // refresh the result table automatically. Otherwise the header says "last scan X min"
    // but the table can still show an older empty cache.
    const schedulerLastRun = schedulerStatus?.scans?.early_movers?.last_run || null;
    useEffect(() => {
        if (!schedulerLastRun) return;
        loadResults({ force: false });
    }, [schedulerLastRun]);

    const handleScan = async () => {
        setIsScanning(true);
        let prevCachedAt = null;
        try {
            const preCheck = await fetch(`${API}/api/early-movers-results`);
            if (preCheck.ok) { prevCachedAt = (await preCheck.json()).cached_at || null; }
        } catch(e) {}
        try {
            const response = await fetch(`${API}/api/early-movers-scan`, { method: 'POST' });
            if (response.ok) {
                if (window.addToast) window.addToast('Early Mover Scan gestartet...', 'info');
                const pollResults = async (attempts = 0) => {
                    if (attempts > 12) { setIsScanning(false); return; }
                    try {
                        const res = await fetch(`${API}/api/early-movers-results`);
                        if (res.ok) {
                            const data = await res.json();
                            const em = (data.data && data.data[0]) || {};
                            if (data.cached_at && data.cached_at !== prevCachedAt) {
                                const items = em.coins || [];
                                setCoins(items); setStats(em.stats || null);
                                updateScanCache('em_coins', items);
                                updateScanCache('em_stats', em.stats);
                                setIsScanning(false);
                                if (window.addToast) window.addToast(`Scan fertig: ${items.length} Coins`, 'success');
                                return;
                            }
                        }
                    } catch (e) { console.error(e); }
                    pollTimeoutRef.current = setTimeout(() => pollResults(attempts + 1), 10000);
                };
                pollTimeoutRef.current = setTimeout(() => pollResults(0), 5000);
            } else { setIsScanning(false); }
        } catch (err) {
            if (window.addToast) window.addToast('Scan-Fehler', 'error');
            setIsScanning(false);
        }
    };

    const filtered = phaseFilter > 0 ? sorted.filter(r => r.phase === phaseFilter) : sorted;

    return (
        <div className="space-y-6">
            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey="early_movers" />

            {/* Phase-Filter Buttons */}
            <div className="flex gap-2 flex-wrap items-center">
                <span className="text-sm text-gray-500 mr-2">Phase:</span>
                {[{v:0,l:'Alle'},{v:1,l:'\u{1F7E2} Accumulation'},{v:2,l:'\u{1F7E1} Breakout'},{v:3,l:'\u{1F534} Überhitzt'}].map(f => (
                    <button key={f.v} onClick={() => setPhaseFilter(f.v)}
                        className={`px-3 py-1 rounded-full text-xs font-semibold border transition ${phaseFilter === f.v ? 'bg-gray-800 text-white border-gray-800' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-100'}`}>
                        {f.l}
                        {f.v > 0 && stats ? ` (${f.v === 1 ? stats.phase_1_count : f.v === 2 ? stats.phase_2_count : stats.phase_3_count || 0})` : ''}
                    </button>
                ))}
                {stats && <span className="text-xs text-gray-400 ml-auto">
                    {stats.unified_count || 0} angezeigt · {stats.market_universe_target || stats.total_coins || 1000} analysiert
                    {stats.intraday_trigger_checks != null ? ` · ${stats.intraday_trigger_checks}/${stats.intraday_trigger_scan_limit || 1000} Trigger geprüft` : ''}
                </span>}
                {stats && <span className="text-xs text-sky-600 ml-2">
                    {stats.coins_suppressed_watch_rows ? ` · ${stats.coins_suppressed_watch_rows} schwache/blocked Kandidaten unterdrueckt` : ''}
                    {stats.trade_now_count != null ? ` · ${stats.trade_now_count} jetzt tradebar` : ''}
                </span>}
            </div>
            {stats?.data_warning && (
                <div className="text-xs rounded-lg border border-amber-200 bg-amber-50 text-amber-800 px-3 py-2">
                    Datenhinweis: {stats.data_warning}
                </div>
            )}
            <div className="text-xs rounded-lg border border-sky-100 bg-sky-50 text-sky-800 px-3 py-2">
                Analyse-Modus: Die Liste zeigt wieder starke Early-Mover-Kandidaten mit Grade, Setup-Score und Entry-Score. JETZT TRADEN heisst bestaetigter Entry; WARTEN/RETEST/WATCH ist nur Vorbereitung, nicht blind kaufen.
            </div>

            {/* Unified Phase Table */}
            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-center py-2 px-2 sortable-header cursor-pointer" onClick={() => toggleSort('phase')}>Phase{sortKey === 'phase' && ' \u2193'}</th>
                            <th className="text-left py-2 px-2 sortable-header cursor-pointer" onClick={() => toggleSort('Symbol')}>Symbol{sortKey === 'Symbol' && ' \u2193'}</th>
                            <th className="text-right py-2 px-2 sortable-header cursor-pointer" onClick={() => toggleSort('Price')}>Preis{sortKey === 'Price' && ' \u2193'}</th>
                            <th className="text-right py-2 px-2 sortable-header cursor-pointer" onClick={() => toggleSort('Change24h')}>24h%{sortKey === 'Change24h' && ' \u2193'}</th>
                            <th className="text-right py-2 px-2 sortable-header cursor-pointer" onClick={() => toggleSort('Change7d')}>7d%{sortKey === 'Change7d' && ' \u2193'}</th>
                            <th className="text-right py-2 px-2 sortable-header cursor-pointer" onClick={() => toggleSort('VolMCapRatio')}>Vol/MCap{sortKey === 'VolMCapRatio' && ' \u2193'}</th>
                            <th className="text-center py-2 px-2 sortable-header cursor-pointer" title="Grade/Setup = Coin-Staerke, Entry = Handelsfreigabe jetzt" onClick={() => toggleSort('entry_score')}>Grade / Scores{sortKey === 'entry_score' && ' \u2193'}</th>
                            <th className="text-left py-2 px-2">Aktion</th>
                            <th className="text-right py-2 px-2 sortable-header cursor-pointer" onClick={() => toggleSort('entry')}>Entry{sortKey === 'entry' && ' \u2193'}</th>
                            <th className="text-right py-2 px-2">TP1 / TP2</th>
                            <th className="text-center py-2 px-2">BTC</th>
                            <th className="text-left py-2 px-2">Perp</th>
                        </tr>
                    </thead>
                    <tbody>
                        {filtered.map((item, idx) => {
                            const timing = timingBadge(item);
                            const actionView = actionBadge(item);
                            const confirmedTrade = isConfirmedEarlyTrade(item);
                            const primaryReason = getPrimaryEntryReason(item);
                            const setupScore = item.setup_score ?? item.score ?? 0;
                            const explosionScore = item.explosion_score ?? null;
                            const isArmed = String(item.trade_signal || '').toUpperCase() === 'EXPLOSION_ARMED' || item.pre_breakout_armed;
                            const mainScore = isArmed && explosionScore != null ? explosionScore : setupScore;
                            const mainScoreLabel = isArmed ? 'X' : (item.grade || '');
                            const entryScore = item.entry_score ?? 0;
                            const entryScoreClass = item.pre_breakout_armed ? 'signal-bullish' : entryScore >= 80 ? 'signal-bullish' : entryScore >= 55 ? 'signal-lightdiv' : 'signal-abwarten';
                            const tp1Pct = targetPctFromEntry(item.tp1, item.entry);
                            const tp2Pct = targetPctFromEntry(item.tp2, item.entry);
                            const itemTargetFlags = Array.isArray(item.risk_flags) ? item.risk_flags : [];
                            const targetTone = targetQualityTone(item.target_quality, itemTargetFlags);
                            const targetLabel = targetQualityLabel(item.target_quality, itemTargetFlags);
                            return (
                            <tr key={idx} className="table-row border-b border-gray-200 cursor-pointer hover:bg-gray-50" onClick={() => onSelectTicker({ticker: item.Symbol, isCrypto: true, ...item})}>
                                <td className="py-3 px-2 text-center" title={item.phase_label}>
                                    <span className="text-lg">{phaseIcon(item.phase)}</span>
                                    <span className="text-xs ml-1 text-gray-500">{item.phase}</span>
                                </td>
                                <td className="py-3 px-2">
                                    <span className="font-semibold">{item.Symbol}</span>
                                    {item.source && <span className="text-xs text-gray-400 ml-1">({item.source})</span>}
                                </td>
                                <td className="py-3 px-2 text-right">{formatPrice(item.Price)}</td>
                                <td className={`py-3 px-2 text-right font-semibold ${(item.Change24h||0) >= 0 ? 'color-positive' : 'color-negative'}`}>{item.Change24h ? `${item.Change24h > 0 ? '+' : ''}${item.Change24h.toFixed(1)}%` : '\u2014'}</td>
                                <td className={`py-3 px-2 text-right ${(item.Change7d||0) >= 0 ? 'color-positive' : 'color-negative'}`}>{item.Change7d ? `${item.Change7d > 0 ? '+' : ''}${item.Change7d.toFixed(1)}%` : '\u2014'}</td>
                                <td className={`py-3 px-2 text-right ${(item.VolMCapRatio||0) > 100 ? 'color-negative font-bold' : (item.VolMCapRatio||0) > 60 ? 'text-yellow-600' : ''}`}>{item.VolMCapRatio ? `${item.VolMCapRatio.toFixed(0)}%` : '\u2014'}</td>
                                <td className="py-3 px-2 text-center" title={`${getSetupScoreTitle(item)} | Setup-Risk ${item.risk_level || '-'} | Entry: ${getEntryRiskTitle(item)}`}>
                                    <div className="flex items-center justify-center gap-1">
                                        <span className={`signal-badge ${mainScore >= 80 ? 'signal-bullish' : mainScore >= 55 ? 'signal-lightdiv' : 'signal-neutral'}`} title={isArmed ? `Explosion Score ${explosionScore} | Setup ${setupScore}` : undefined}>{mainScoreLabel} {mainScore}</span>
                                        <span className={`signal-badge ${entryScoreClass}`}>Entry {entryScore}</span>
                                    </div>
                                    <div className="text-[11px] text-gray-500 mt-1 max-w-[170px] truncate mx-auto">
                                        <span className={`font-semibold ${timing.cls}`}>{timing.label}</span> - Setup-Risk <span className={item.risk_level === 'LOW' ? 'color-positive' : item.risk_level === 'MEDIUM' ? 'text-yellow-600' : 'color-negative'}>{item.risk_level || '-'}</span>
                                    </div>
                                    {primaryReason && (
                                        <div className="text-[11px] text-amber-700 max-w-[170px] truncate mx-auto">
                                            {humanizeEntryRisk(primaryReason)}
                                        </div>
                                    )}
                                </td>
                                <td className="py-3 px-2 text-xs">
                                    <span className={`px-2 py-1 rounded font-semibold ${actionView.cls}`}>
                                        {actionView.label}
                                    </span>
                                    <div className="text-[11px] text-gray-500 mt-1 max-w-[180px] truncate" title={confirmedTrade ? actionView.detail : (item.signal_label || actionView.detail)}>{String(confirmedTrade ? actionView.detail : (item.signal_label || actionView.detail)).replace('Achtung beobachten: ', '')}</div>
                                </td>
                                <td className="py-3 px-2 text-right font-semibold">{item.entry ? formatPrice(item.entry) : '\u2014'}</td>
                                <td className="py-3 px-2 text-right text-xs" title={`TP1: ${humanizeTargetSource(item.tp1_source)} | TP2: ${humanizeTargetSource(item.tp2_source)} | ${targetLabel}`}>
                                    {item.tp1 ? (
                                        <>
                                            <div><span className={`font-semibold ${targetTone}`}>{formatPrice(item.tp1)}</span> <span className="text-gray-400">{tp1Pct}</span></div>
                                            <div><span className={`font-semibold ${targetTone}`}>{formatPrice(item.tp2)}</span> <span className="text-gray-400">{tp2Pct}</span></div>
                                            <div className={`text-[10px] ${targetTone}`}>{targetLabel}</div>
                                            {item.trade_signal !== 'JETZT_TRADEN' && <div className="text-[10px] text-gray-400">Plan nach Trigger</div>}
                                        </>
                                    ) : '\u2014'}
                                </td>
                                <td className="py-3 px-2 text-center text-xs" title={item.btc_context ? `BTC 24h ${item.btc_context.btc_24h}% | Alpha ${item.btc_context.alpha_24h}%` : ''}>
                                    {item.btc_context ? <span className={item.btc_context.tailwind ? 'color-positive' : 'text-yellow-600'}>{item.btc_context.tailwind ? 'Tailwind' : 'Check'}</span> : '\u2014'}
                                </td>
                                <td className="py-3 px-2"><span className={`text-xs px-2 py-1 rounded ${item.HasPerp ? 'bg-blue-100 text-blue-800' : 'text-gray-500'}`}>{item.HasPerp ? item.BestExchange || 'Perp' : '–'}</span></td>
                            </tr>
                        )})}
                    </tbody>
                </table>
                {filtered.length === 0 && <div className="text-center text-gray-400 py-8">Keine ausreichend guten Early-Mover-Kandidaten{phaseFilter > 0 ? ` fuer Phase ${phaseFilter}` : ''}. Schwache, illiquide oder geblockte Coins werden weiter unterdrueckt.</div>}
            </div>

        </div>
    );
}
