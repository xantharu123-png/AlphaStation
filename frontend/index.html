        try {
            const next = { ...(alertSettings || {}), narrative_email_frequency: frequency };
            setAlertSettings(next);
            const response = await fetch(`${API}/api/auth/alert-settings`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    enabled: next.email_alerts_enabled,
                    alert_email: next.alert_email,
                    narrative_email_frequency: frequency
                })
            });
            const data = await response.json();
            if (response.ok && data.settings) {
                setAlertSettings(data.settings);
                if (window.addToast) window.addToast('Sektor-Mail gespeichert', 'success');
            } else if (window.addToast) {
                window.addToast(data.detail || 'Sektor-Mail konnte nicht gespeichert werden', 'error');
            }
        } catch (err) {
            if (window.addToast) window.addToast('Sektor-Mail konnte nicht gespeichert werden', 'error');
        }
        setSettingsSaving(false);
    };

    const handleScan = async () => {
        setIsScanning(true);
        updateScanCache('moneyflow_scanning', true);
        let prevCachedAt = null;
        try {
            const preCheck = await fetch(`${API}/api/money-flow-results`);
            if (preCheck.ok) {
                const preData = await preCheck.json();
                prevCachedAt = preData.cached_at || null;
            }
        } catch(e) {}
        try {
            const response = await fetch(`${API}/api/money-flow-scan`, { method: 'POST' });
            if (response.ok) {
                if (window.addToast) window.addToast('Sektor-Scan gestartet...', 'info');
                const pollResults = async (attempts = 0) => {
                    if (attempts > 12) {
                        setIsScanning(false);
                        updateScanCache('moneyflow_scanning', false);
                        if (window.addToast) window.addToast('Sektor-Scan dauert laenger...', 'info');
                        return;
                    }
                    try {
                        const res = await fetch(`${API}/api/money-flow-results`);
                        if (res.ok) {
                            const data = await res.json();
                            const items = data.data || [];
                            const isNewData = data.cached_at && data.cached_at !== prevCachedAt;
                            if (isNewData) {
                                setResults(items);
                                updateScanCache('moneyflow_results', items);
                                await loadNarrativePulse();
                                setIsScanning(false);
                                updateScanCache('moneyflow_scanning', false);
                                if (window.addToast) window.addToast(`Sektor-Scan fertig: ${items.length} Themen`, 'success');
                                return;
                            }
                        }
                    } catch (e) { console.error(e); }
                    pollTimeoutRef.current = setTimeout(() => pollResults(attempts + 1), 10000);
                };
                pollTimeoutRef.current = setTimeout(() => pollResults(0), 5000);
            } else {
                setIsScanning(false);
                updateScanCache('moneyflow_scanning', false);
            }
        } catch (err) {
            if (window.addToast) window.addToast('Sektor-Scan Fehler', 'error');
            setIsScanning(false);
            updateScanCache('moneyflow_scanning', false);
        }
    };

    const getFlowSignalClass = (signal) => {
        if ((signal || '').includes('ZUFLUSS')) return 'signal-bullish';
        if ((signal || '').includes('ABFLUSS')) return 'signal-bearish';
        return 'signal-neutral';
    };
    const formatPct = (value) => value == null ? '-' : `${Number(value).toFixed(2)}%`;
    const formatScore = (value) => value == null ? '-' : Number(value).toFixed(1);
    const formatCachedAt = (iso) => {
        if (!iso) return 'noch kein Cache';
        try { return new Date(iso).toLocaleString('de-DE'); } catch { return iso; }
    };
    const frequency = alertSettings?.narrative_email_frequency || 'daily';
    const canEmail = alertSettings?.has_email_alerts !== false && (alertSettings?.email_alerts_enabled ?? true);

    const NarrativePanel = ({ title, items, tone }) => (
        <div className="card border border-gray-200 p-5 rounded-lg">
            <div className="flex items-center justify-between mb-3">
                <h3 className="text-lg font-bold text-gray-900">{title}</h3>
                <span className={`signal-badge ${tone === 'bull' ? 'signal-bullish' : 'signal-bearish'}`}>{tone === 'bull' ? 'LONG-Bias' : 'SHORT/Risk-Bias'}</span>
            </div>
            <div className="space-y-3">
                {(items || []).slice(0, 5).map((item, idx) => {
                    const reps = item.representatives || [];
                    return (
                        <div key={`${item.ticker || item.sector}-${idx}`} className="rounded-xl border border-gray-100 bg-white p-3">
                            <div className="flex items-start justify-between gap-3">
                                <div>
                                    <div className="font-bold text-gray-900">{item.sector || item.narrative}</div>
                                    <div className="text-xs text-gray-500">{item.ticker} Proxy | {item.bias || 'NEUTRAL'}</div>
                                </div>
                                <div className={`font-extrabold ${Number(item.narrative_score || 0) >= 0 ? 'color-positive' : 'color-negative'}`}>
                                    {formatScore(item.narrative_score)}
                                </div>
                            </div>
                            <div className="grid grid-cols-4 gap-2 text-xs mt-3">
                                <div><span className="text-gray-500">1D</span><div className={item.change_1d >= 0 ? 'color-positive' : 'color-negative'}>{formatPct(item.change_1d)}</div></div>
                                <div><span className="text-gray-500">5D</span><div className={item.change_5d >= 0 ? 'color-positive' : 'color-negative'}>{formatPct(item.change_5d)}</div></div>
                                <div><span className="text-gray-500">20D</span><div className={item.change_20d >= 0 ? 'color-positive' : 'color-negative'}>{formatPct(item.change_20d)}</div></div>
                                <div><span className="text-gray-500">RVOL</span><div>{item.rvol != null ? `${Number(item.rvol).toFixed(2)}x` : '-'}</div></div>
                            </div>
                            {reps.length > 0 && (
                                <div className="mt-3 text-xs text-gray-600">
                                    Beispiele: {reps.map(rep => `${rep.ticker} ${Number(rep.change_5d || 0).toFixed(1)}%`).join(', ')}
                                </div>
                            )}
                        </div>
                    );
                })}
                {(!items || items.length === 0) && <div className="text-sm text-gray-500 py-6 text-center">Noch keine Narrative-Daten.</div>}
            </div>
        </div>
    );

    return (
        <div className="space-y-6">
            <div className="card border border-blue-100 bg-blue-50 p-5 rounded-lg">
                <div className="flex flex-wrap items-start justify-between gap-4">
                    <div>
                        <h2 className="text-xl font-extrabold text-gray-900">Sektoren & Narrative</h2>
                        <p className="text-sm text-blue-900 mt-1">
                            Zeigt, welche Markt-Themen gerade Kapital anziehen oder verlieren. Das ist Kontext fuer Long/Short-Ideen, kein eigener Sofort-Trade.
                        </p>
                        <div className="text-xs text-blue-800 mt-2">Letztes Update: {formatCachedAt(narrativeMeta.cached_at)}</div>
                    </div>
                    <div className="rounded-xl border border-blue-200 bg-white p-3 min-w-[260px]">
                        <label className="text-xs font-bold text-gray-700 block mb-2">Narrative-Mail</label>
                        <select
                            value={frequency}
                            disabled={settingsSaving || !canEmail}
                            onChange={e => saveNarrativeFrequency(e.target.value)}
                            className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white"
                        >
                            {frequencyOptions.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                        </select>
                        <div className="text-xs text-gray-500 mt-2">
                            {canEmail ? 'Waehle, wie oft du den Sektor-/Narrative-Pulse per Mail bekommst.' : 'Mail-Alerts sind im Account aus oder im Plan nicht aktiv.'}
                        </div>
                    </div>
                </div>
            </div>

            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey="money_flow" />

            <div className="grid grid-cols-1 xl:grid-cols-2 gap-4">
                <NarrativePanel title="Bullischste Themen" items={narrative?.bullish || []} tone="bull" />
                <NarrativePanel title="Bearischste Themen" items={narrative?.bearish || []} tone="bear" />
            </div>

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <div className="flex items-center justify-between gap-3 mb-4 flex-wrap">
                    <h3 className="text-lg font-bold text-gray-900">Alle Sektoren & Themen</h3>
                    <span className="text-xs text-gray-500">Nach Narrative-Score sortierbar</span>
                </div>
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('sector')}>Sektor/Thema</th>
                            <th className="text-left py-2 px-2">Proxy</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('narrative_score')}>Score</th>
                            <th className="text-right py-2 px-2">Preis</th>
                            <th className="text-right py-2 px-2">1D%</th>
                            <th className="text-right py-2 px-2">5D%</th>
                            <th className="text-right py-2 px-2">20D%</th>
                            <th className="text-right py-2 px-2">RVOL</th>
                            <th className="text-right py-2 px-2">CMF</th>
                            <th className="text-left py-2 px-2">OBV</th>
                            <th className="text-left py-2 px-2">Signal</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.map((item, idx) => {
                            const ticker = item.ticker || item.etf;
                            return (
                                <tr key={idx} className="table-row border-b border-gray-200" onClick={() => ticker && onSelectTicker(ticker)}>
                                    <td className="py-3 px-2 font-semibold">{item.sector || item.narrative}</td>
                                    <td className="py-3 px-2">{ticker || '-'}</td>
                                    <td className={`py-3 px-2 text-right font-bold ${Number(item.narrative_score || 0) >= 0 ? 'color-positive' : 'color-negative'}`}>{formatScore(item.narrative_score)}</td>
                                    <td className="py-3 px-2 text-right">{item.price != null ? `$${Number(item.price).toFixed(2)}` : '-'}</td>
                                    <td className={`py-3 px-2 text-right ${item.change_1d >= 0 ? 'color-positive' : 'color-negative'}`}>{formatPct(item.change_1d)}</td>
                                    <td className={`py-3 px-2 text-right ${item.change_5d >= 0 ? 'color-positive' : 'color-negative'}`}>{formatPct(item.change_5d)}</td>
                                    <td className={`py-3 px-2 text-right ${item.change_20d >= 0 ? 'color-positive' : 'color-negative'}`}>{formatPct(item.change_20d)}</td>
                                    <td className="py-3 px-2 text-right">{item.rvol != null ? `${Number(item.rvol).toFixed(2)}x` : '-'}</td>
                                    <td className={`py-3 px-2 text-right ${Number(item.cmf || 0) >= 0 ? 'color-positive' : 'color-negative'}`}>{item.cmf != null ? Number(item.cmf).toFixed(3) : '-'}</td>
                                    <td className="py-3 px-2"><span className={`signal-badge ${item.obv_signal === 'ACCUMULATION' ? 'signal-bullish' : item.obv_signal === 'DISTRIBUTION' ? 'signal-bearish' : 'signal-neutral'}`}>{item.obv_signal === 'ACCUMULATION' ? 'Akkum.' : item.obv_signal === 'DISTRIBUTION' ? 'Distrib.' : 'Neutral'}</span></td>
                                    <td className="py-3 px-2"><span className={`signal-badge ${getFlowSignalClass(item.flow_signal || '')}`}>{item.flow_signal || '-'}</span></td>
                                </tr>
                            );
                        })}
                    </tbody>
                </table>
                {sorted.length === 0 && <div className="text-center text-gray-500 py-8">Noch keine Sektor-Daten. Scan starten.</div>}
            </div>
        </div>
    );
}

// Kalender Tab
function KalenderTab() {
    const [events, setEvents] = useState([]);
    const [exchanges, setExchanges] = useState([]);
    const [calendarMeta, setCalendarMeta] = useState(null);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
        const fetchCalendar = async () => {
            try {
                const response = await fetch(`${API}/api/kalender`);
                if (response.ok) {
                    const data = await response.json();
                    setEvents(data.events || []);
                    setExchanges(data.exchanges || []);
                    setCalendarMeta({ source: data.source, note: data.note, timestamp: data.timestamp, official_count: data.official_count, estimated_count: data.estimated_count, official_sources: data.official_sources || [] });
                }
            } catch (err) {
                console.error('Error:', err);
            } finally {
                setLoading(false);
            }
        };
        fetchCalendar();
    }, []);

    const getImportanceClass = (imp) => {
        const i = (imp || '').toLowerCase();
        if (i === 'high' || i.includes('hoch')) return 'importance-high';
        if (i === 'medium' || i.includes('mittel')) return 'importance-medium';
        return 'importance-low';
    };
    const getImportanceLabel = (imp) => {
        const i = (imp || '').toLowerCase();
        if (i === 'high') return 'Hoch';
        if (i === 'medium') return 'Mittel';
        if (i === 'low') return 'Niedrig';
        return imp || '–';
    };
    const getExchangeStatusStyle = (status) => {
        if (status === 'open') return { bg: '#dcfce7', color: '#047857', border: '#86efac' };
        if (status === 'break') return { bg: '#fef3c7', color: '#92400e', border: '#fcd34d' };
        if (status === 'holiday') return { bg: '#fee2e2', color: '#b91c1c', border: '#fca5a5' };
        return { bg: '#f1f5f9', color: '#475569', border: '#cbd5e1' };
    };
    const formatEventDate = (dateStr) => {
        if (!dateStr) return '–';
        const [y, m, d] = dateStr.split('-').map(Number);
        return new Date(y, (m || 1) - 1, d || 1).toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'short', year:'numeric'});
    };
    const todayIso = new Date().toISOString().slice(0, 10);

    return (
        <div className="space-y-6">
            <div className="card border border-gray-200 p-6 rounded-lg">
                <div className="flex items-start justify-between gap-4 mb-4 flex-wrap">
                    <div>
                        <h3 className="text-lg font-bold text-gray-900">Boersenzeiten & Feiertage</h3>
                        <p className="text-sm text-gray-500">Top-5 Maerkte mit lokaler Zeit, Zuerich-Zeit und Feiertagsstatus.</p>
                    </div>
                    <span className="text-xs px-3 py-1 rounded-full bg-blue-50 text-blue-700 border border-blue-100">Live-Zeitcheck</span>
                </div>
                {loading ? (
                    <div className="flex justify-center py-5"><div className="loading-spinner"></div></div>
                ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-3">
                        {exchanges.map((exchange) => {
                            const style = getExchangeStatusStyle(exchange.status);
                            return (
                                <div key={exchange.code} className="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
                                    <div className="flex items-start justify-between gap-2 mb-3">
                                        <div>
                                            <div className="text-sm font-bold text-gray-900">{exchange.name}</div>
                                            <div className="text-xs text-gray-500">{exchange.country} · {exchange.currency}</div>
                                        </div>
                                        <span style={{background: style.bg, color: style.color, borderColor: style.border}} className="text-xs font-bold px-2 py-1 rounded-full border">
                                            {exchange.status_label}
                                        </span>
                                    </div>
                                    <div className="space-y-2 text-xs text-gray-600">
                                        <div>
                                            <div className="font-semibold text-gray-800">Handelszeit lokal</div>
                                            <div>{exchange.regular_hours_local}</div>
                                        </div>
                                        <div>
                                            <div className="font-semibold text-gray-800">In Zuerich</div>
                                            <div>{exchange.regular_hours_zurich}</div>
                                        </div>
                                        {exchange.special_hours && (
                                            <div className="rounded-lg bg-amber-50 border border-amber-100 px-2 py-1 text-amber-800 font-semibold">
                                                {exchange.special_hours}
                                            </div>
                                        )}
                                        {exchange.is_open ? (
                                            <div className="rounded-lg bg-green-50 border border-green-100 px-2 py-1 text-green-800">
                                                Offen bis {exchange.next_close_zurich || exchange.next_close_local}
                                            </div>
                                        ) : (
                                            <div className="rounded-lg bg-gray-50 border border-gray-100 px-2 py-1 text-gray-700">
                                                {exchange.closed_reason || 'Geschlossen'}{exchange.next_open_zurich ? ` · Naechste Oeffnung: ${exchange.next_open_zurich}` : ''}
                                            </div>
                                        )}
                                        {exchange.next_holiday && (
                                            <div>
                                                <span className="font-semibold text-gray-800">Naechster Feiertag:</span> {formatEventDate(exchange.next_holiday.date)} · {exchange.next_holiday.name}
                                            </div>
                                        )}
                                        <div className="pt-1">
                                            <a href={exchange.holiday_source_url || exchange.source_url} target="_blank" rel="noreferrer" className="text-blue-600 hover:underline">
                                                Quelle: {exchange.source}
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                )}
            </div>
            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                {calendarMeta?.note && (
                    <div className="mb-4 rounded-lg border border-green-200 bg-green-50 px-3 py-2 text-xs text-green-800">
                        Kalender-Qualitaet: {calendarMeta.official_count || 0} offizielle Termine ({(calendarMeta.official_sources || []).join(', ') || 'n/a'}), {calendarMeta.estimated_count || 0} markierte Schaetzungen.
                    </div>
                )}
                {calendarMeta?.note && (
                    <div className="mb-4 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-xs text-amber-800">
                        Wichtig: FED/FOMC, CPI, NFP, PPI, GDP/PCE, Retail Sales und ISM PMI kommen aus offiziellen 2026-Quellen. Nur Earnings und Jobless Claims bleiben als geschaetzt markiert.
                    </div>
                )}
                {loading ? (
                    <div className="flex justify-center py-8"><div className="loading-spinner"></div></div>
                ) : (
                    <table className="w-full text-sm">
                        <thead className="border-b border-gray-200">
                            <tr>
                                <th className="text-left py-2 px-2">Datum</th>
                                <th className="text-left py-2 px-2">Uhrzeit</th>
                                <th className="text-left py-2 px-2">Event</th>
                                <th className="text-center py-2 px-2">Wichtigkeit</th>
                                <th className="text-center py-2 px-2">Impact</th>
                                <th className="text-left py-2 px-2">Quelle</th>
                                <th className="text-left py-2 px-2">Beschreibung</th>
                            </tr>
                        </thead>
                        <tbody>
                            {events.length === 0 && (
                                <tr><td colSpan="7" className="py-6 text-center text-gray-400">Keine Events gefunden</td></tr>
                            )}
                            {events.map((event, idx) => (
                                <tr key={idx} className={`table-row border-b border-gray-200 ${event.date === todayIso ? 'bg-amber-50' : ''}`}>
                                    <td className="py-3 px-2 font-semibold whitespace-nowrap">
                                        {formatEventDate(event.date)}
                                        {event.date === todayIso && <span className="ml-2 text-xs px-2 py-0.5 rounded bg-amber-200 text-amber-900">Heute</span>}
                                    </td>
                                    <td className="py-3 px-2 whitespace-nowrap">
                                        <div className="font-semibold">{event.time_local || '–'}</div>
                                        {event.time_et && <div className="text-xs text-gray-400">{event.time_et}</div>}
                                    </td>
                                    <td className="py-3 px-2 font-medium">{event.event}</td>
                                    <td className="py-3 px-2 text-center"><span className={`signal-badge ${getImportanceClass(event.importance)}`}>{getImportanceLabel(event.importance)}</span></td>
                                    <td className="py-3 px-2 text-center text-xs">{event.impact || '–'}</td>
                                    <td className="py-3 px-2 text-xs">
                                        {event.source_url ? (
                                            <a href={event.source_url} target="_blank" rel="noreferrer" className="text-blue-600 hover:underline">{event.estimated ? 'Geschätzt' : event.source}</a>
                                        ) : (
                                            <span className={event.estimated ? 'text-amber-700 font-semibold' : 'text-gray-600'}>{event.estimated ? 'Geschätzt' : (event.source || '–')}</span>
                                        )}
                                    </td>
                                    <td className="py-3 px-2 text-gray-600">{event.description}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                )}
            </div>
        </div>
    );
}

// Crash Monitor Tab
function CrashMonitorTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [fearData, setFearData] = useState(scanCache.crash_fear_data || null);
    const [indices, setIndices] = useState(scanCache.crash_indices || []);
    const [breadth, setBreadth] = useState(scanCache.crash_breadth || null);
    const [isScanning, setIsScanning] = useState(scanCache.crash_scanning || false);
    const [crashError, setCrashError] = useState(null);
    const { sorted, toggleSort } = useSortable(indices, 'name');
    const pollTimeoutRef = useRef(null);

    // Cleanup polling on unmount
    useEffect(() => {
        return () => { if (pollTimeoutRef.current) clearTimeout(pollTimeoutRef.current); };
    }, []);

    // Always load latest from server on mount
    useEffect(() => {
        const fetchData = async () => {
            try {
                const response = await fetch(`${API}/api/crash-monitor-results`);
                if (response.ok) {
                    const data = await response.json();
                    const cm = (data.data && data.data[0]) || {};
                    if (data.status === 'error' || cm.status === 'error') {
                        setCrashError((data.warnings || [cm.message || cm.error || 'Crash Monitor Fehler']).join(' · '));
                        return;
                    }
                    setCrashError(null);
                    if (cm.fear_score !== undefined) {
                        const fd = { score: cm.fear_score || 0, vix: cm.vix?.price || 0, level: cm.fear_level || '' };
                        setFearData(fd);
                        setIndices(cm.indices || []);
                        setBreadth(cm.breadth || null);
                        updateScanCache('crash_fear_data', fd);
                        updateScanCache('crash_indices', cm.indices || []);
                        updateScanCache('crash_breadth', cm.breadth || null);
                    }
                }
            } catch (err) { console.error('Error:', err); }
        };
        fetchData();
    }, []);

    const handleScan = async () => {
        setIsScanning(true);
        updateScanCache('crash_scanning', true);
        // Save current cached_at BEFORE scan starts
        let prevCachedAt = null;
        try {
            const preCheck = await fetch(`${API}/api/crash-monitor-results`);
            if (preCheck.ok) {
                const preData = await preCheck.json();
                prevCachedAt = preData.cached_at || null;
            }
        } catch(e) {}
        try {
            const response = await fetch(`${API}/api/crash-monitor-scan`, { method: 'POST' });
            if (response.ok) {
                if (window.addToast) window.addToast('Scan gestartet...', 'info');
                // Poll for results with increasing intervals
                const pollResults = async (attempts = 0) => {
                    if (attempts > 12) { // Max 2 minutes (12 * 10s)
                        setIsScanning(false);
                        updateScanCache('crash_scanning', false);
                        if (window.addToast) window.addToast('Scan dauert länger...', 'info');
                        return;
                    }
                    try {
                        const res = await fetch(`${API}/api/crash-monitor-results`);
                        if (res.ok) {
                            const data = await res.json();
                            const cm = (data.data && data.data[0]) || {};
                            const isNewData = data.cached_at && data.cached_at !== prevCachedAt;
                            if (isNewData) {
                                if (data.status === 'error' || cm.status === 'error') {
                                    setCrashError((data.warnings || [cm.message || cm.error || 'Crash Monitor Fehler']).join(' · '));
                                    setIsScanning(false);
                                    updateScanCache('crash_scanning', false);
                                    if (window.addToast) window.addToast('Crash Monitor Fehler', 'error');
                                    return;
                                }
                                setCrashError(null);
                                const fearData = { score: cm.fear_score || 0, vix: cm.vix?.price || 0, level: cm.fear_level || '' };
                                setFearData(fearData);
                                setIndices(cm.indices || []);
                                setBreadth(cm.breadth || null);
                                updateScanCache('crash_fear_data', fearData);
                                updateScanCache('crash_indices', cm.indices || []);
                                updateScanCache('crash_breadth', cm.breadth || null);
                                setIsScanning(false);
                                updateScanCache('crash_scanning', false);
                                if (window.addToast) window.addToast(`Scan fertig: Daten aktualisiert`, 'success');
                                return;
                            }
                        }
                    } catch (e) { console.error(e); }
                    pollTimeoutRef.current = setTimeout(() => pollResults(attempts + 1), 10000); // Retry in 10s
                };
                pollTimeoutRef.current = setTimeout(() => pollResults(0), 5000); // First poll after 5s
            } else {
                setIsScanning(false);
                updateScanCache('crash_scanning', false);
            }
        } catch (err) {
            if (window.addToast) window.addToast('Scan-Fehler', 'error');
            setIsScanning(false);
            updateScanCache('crash_scanning', false);
        }
    };

    const fearLevel = fearData?.score ?? 50;
    // V2.5: CNN-kompatible Skala — 0 = Extreme Fear, 100 = Extreme Greed
    const fearText = fearData?.level || (fearLevel <= 20 ? 'EXTREME ANGST' : fearLevel <= 40 ? 'ANGST' : fearLevel <= 60 ? 'NEUTRAL' : fearLevel <= 80 ? 'GIER' : 'EXTREME GIER');
    const fearColor = fearLevel <= 20 ? '#dc2626' : fearLevel <= 40 ? '#d97706' : fearLevel <= 60 ? '#6b7280' : fearLevel <= 80 ? '#2563eb' : '#059669';

    return (
        <div className="space-y-6">
            {crashError && (
                <div className="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">
                    Crash Monitor Fehler: {crashError}
                </div>
            )}
            {/* Fear Score */}
            {fearData && (
                <div className="card border border-gray-200 p-6 rounded-lg">
                    <div className="text-center">
                        <div className="fear-score-display" style={{ color: fearColor }}>
                            {fearLevel.toFixed(0)}
                        </div>
                        <p className="text-lg font-semibold mt-2">{fearText}</p>
                        <p className="text-sm text-gray-600">Fear & Greed Index</p>
                    </div>
                </div>
            )}

            {/* VIX Card */}
            {fearData?.vix && (
                <div className="metric-card" style={{ borderColor: fearColor }}>
                    <div className="flex justify-between items-center">
                        <div>
                            <div className="text-sm font-semibold text-gray-600">VIX</div>
                            <div className="text-2xl font-bold mt-2">{fearData.vix.toFixed(2)}</div>
                        </div>
                        <span className="signal-badge" style={{ backgroundColor: fearColor + '20', color: fearColor }}>
                            {fearData.vix < 15 ? 'Niedrig' : fearData.vix < 25 ? 'Mittel' : 'Hoch'}
                        </span>
                    </div>
                </div>
            )}

            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey="crash_monitor" />

            {/* Indices */}
            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <h3 className="font-semibold mb-4">Indizes</h3>
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('name')}>Name</th>
                            <th className="text-right py-2 px-2">Preis</th>
                            <th className="text-right py-2 px-2">1D%</th>
                            <th className="text-right py-2 px-2">5D%</th>
                            <th className="text-right py-2 px-2">20D%</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.map((item, idx) => (
                            <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker(item.symbol)}>
                                <td className="py-3 px-2 font-semibold">{item.name}</td>
                                <td className="py-3 px-2 text-right">${item.price?.toFixed(2)}</td>
                                <td className={`py-3 px-2 text-right ${item.change_1d >= 0 ? 'color-positive' : 'color-negative'}`}>{item.change_1d?.toFixed(2)}%</td>
                                <td className={`py-3 px-2 text-right ${item.change_5d >= 0 ? 'color-positive' : 'color-negative'}`}>{item.change_5d?.toFixed(2)}%</td>
                                <td className={`py-3 px-2 text-right ${item.change_20d >= 0 ? 'color-positive' : 'color-negative'}`}>{item.change_20d?.toFixed(2)}%</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>

            {/* Market Breadth */}
            {breadth && (
                <div className="card border border-gray-200 p-6 rounded-lg">
                    <h3 className="font-semibold mb-4">Marktbreite</h3>
                    <div className="space-y-4">
                        <div>
                            <div className="flex justify-between mb-2 text-sm">
                                <span>Steigend</span>
                                <span className="font-semibold color-positive">{breadth.advancing}</span>
                            </div>
                            <div className="momentum-bar">
                                <div className="momentum-bar-fill" style={{ width: `${breadth.advancing_pct || 50}%`, backgroundColor: '#059669' }}></div>
                            </div>
                        </div>
                        <div>
                            <div className="flex justify-between mb-2 text-sm">
                                <span>Fallend</span>
                                <span className="font-semibold color-negative">{breadth.declining}</span>
                            </div>
                            <div className="momentum-bar">
                                <div className="momentum-bar-fill" style={{ width: `${breadth.declining_pct || 50}%`, backgroundColor: '#dc2626' }}></div>
                            </div>
                        </div>
                        <div className="flex justify-between items-center mt-4 pt-3 border-t border-gray-100">
                            <div className="text-sm text-gray-600">
                                A/D Ratio: <span className="font-semibold">{breadth.ad_ratio?.toFixed(2)}</span>
                            </div>
                            <span className={`signal-badge ${breadth.breadth_signal === 'BULLISH' ? 'signal-bullish' : breadth.breadth_signal === 'BEARISH' ? 'signal-bearish' : 'signal-neutral'}`}>
                                {breadth.breadth_signal === 'BULLISH' ? 'Bullisch' : breadth.breadth_signal === 'BEARISH' ? 'Bärisch' : breadth.breadth_signal === 'MARKT GESCHLOSSEN' ? 'Markt geschlossen' : 'Neutral'}
                            </span>
                        </div>
                        {breadth.unchanged > 0 && (
                            <div className="text-xs text-gray-400 mt-2">Unverändert: {breadth.unchanged} ({breadth.unchanged_pct?.toFixed(1)}%)</div>
                        )}
                        {breadth.common_stock_filtered && (
                            <div className="text-xs text-gray-400 mt-1">
                                Breadth-Filter: Common Stocks/ADRs · Quelle {breadth.common_stock_source || 'n/a'}{breadth.excluded_non_common ? ` · ausgeschlossen: ${breadth.excluded_non_common}` : ''}
                            </div>
                        )}
                    </div>
                </div>
            )}

            {/* Fear Score Details */}
            {fearData && fearData.score > 0 && (
                <div className="card border border-gray-200 p-6 rounded-lg">
                    <h3 className="font-semibold mb-4">Fear-Score Komponenten</h3>
                    <div className="grid grid-cols-2 gap-3 text-sm">
                        <div className="flex justify-between"><span className="text-gray-600">VIX Level</span><span className="font-semibold">{fearData.vix?.toFixed(1)}</span></div>
                        <div className="flex justify-between"><span className="text-gray-600">Fear & Greed</span><span className="font-bold" style={{color: fearColor}}>{fearLevel}/100</span></div>
                    </div>
                    <div className="mt-3 text-xs text-gray-500">
                        Score basiert auf: VIX Level & Trend, S&P/Nasdaq/Russell Tages- und Mehrtagesbewegungen, A/D Ratio, Common-Stock-Marktbreite, Nasdaq-vs-S&P Risk Appetite und Small-Cap-vs-S&P Staerke.
                    </div>
                </div>
            )}
        </div>
    );
}

// Watchlist Tab
function WatchlistTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {} }) {
    const [watchlist, setWatchlist] = useState([]);
    const [newTicker, setNewTicker] = useState('');
    const [tickerPrices, setTickerPrices] = useState({});
    const { sorted, toggleSort, sortKey } = useSortable(watchlist, 'ticker');

    useEffect(() => {
        const saved = localStorage.getItem('watchlist');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                setWatchlist(parsed);
            } catch (e) {
                setWatchlist([]);
            }
        }
    }, []);

    useEffect(() => {
        watchlist.forEach(ticker => {
            fetch(`${API}/api/ticker-detail?ticker=${ticker}`)
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (data) {
                        setTickerPrices(prev => ({
                            ...prev,
                            [ticker]: data
                        }));
                    }
                })
                .catch(err => console.error('Error:', err));
        });
    }, [watchlist]);

    const addTicker = () => {
        if (newTicker.trim() && !watchlist.includes(newTicker.toUpperCase())) {
            const updated = [...watchlist, newTicker.toUpperCase()];
            setWatchlist(updated);
            localStorage.setItem('watchlist', JSON.stringify(updated));
            setNewTicker('');
            if (window.addToast) window.addToast(`${newTicker.toUpperCase()} zur Watchlist hinzugefügt`, 'success');
        }
    };

    const removeTicker = (ticker) => {
        const updated = watchlist.filter(t => t !== ticker);
        setWatchlist(updated);
        localStorage.setItem('watchlist', JSON.stringify(updated));
        if (window.addToast) window.addToast(`${ticker} aus Watchlist entfernt`, 'success');
    };

    const exportCSV = () => {
        let csv = 'Ticker,Preis,1D%,5D%,RSI,Grade\n';
        sorted.forEach(ticker => {
            const price = tickerPrices[ticker];
            if (price) {
                csv += `${ticker},${price.price},${price.change_pct},${price.change_5d || 0},${price.rsi || 0},${price.grade || 'N/A'}\n`;
            }
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'watchlist.csv';
        a.click();
    };

    return (
        <div className="space-y-6">
            <div className="card border border-gray-200 p-6 rounded-lg">
                <label className="block text-sm font-semibold mb-3">Ticker hinzufügen</label>
                <div className="flex gap-2">
                    <input
                        type="text"
                        value={newTicker}
                        onChange={(e) => setNewTicker(e.target.value)}
                        onKeyPress={(e) => e.key === 'Enter' && addTicker()}
                        placeholder="z.B. AAPL"
                        className="flex-1"
                    />
                    <button onClick={addTicker} className="button">Hinzufügen</button>
                    <button onClick={exportCSV} className="button button-secondary">CSV</button>
                </div>
            </div>

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('ticker')}>Ticker</th>
                            <th className="text-right py-2 px-2">Preis</th>
                            <th className="text-right py-2 px-2">1D%</th>
                            <th className="text-right py-2 px-2">5D%</th>
                            <th className="text-right py-2 px-2">RSI</th>
                            <th className="text-center py-2 px-2">Grade</th>
                            <th className="text-center py-2 px-2">Aktion</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.map((ticker, idx) => {
                            const price = tickerPrices[ticker];
                            return (
                                <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker(ticker)}>
                                    <td className="py-3 px-2 font-semibold">{ticker}</td>
                                    <td className="py-3 px-2 text-right">${price?.price?.toFixed(2) || '-'}</td>
                                    <td className={`py-3 px-2 text-right ${(price?.change_pct || 0) >= 0 ? 'color-positive' : 'color-negative'}`}>{price?.change_pct?.toFixed(2) || '-'}%</td>
                                    <td className={`py-3 px-2 text-right ${(price?.change_5d || 0) >= 0 ? 'color-positive' : 'color-negative'}`}>{price?.change_5d?.toFixed(2) || '-'}%</td>
                                    <td className="py-3 px-2 text-right">{price?.rsi?.toFixed(1) || '-'}</td>
                                    <td className="py-3 px-2 text-center"><span className={`grade-badge grade-${(price?.grade || 'D').toLowerCase()}`}>{price?.grade || 'D'}</span></td>
                                    <td className="py-3 px-2 text-center"><button onClick={(e) => { e.stopPropagation(); removeTicker(ticker); }} className="button button-danger" style={{ padding: '4px 8px', fontSize: '12px' }}>×</button></td>
                                </tr>
                            );
                        })}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

// Backtest Tab
function BacktestTab() {
    const [ticker, setTicker] = useState('');
    const [strategy, setStrategy] = useState('sma_crossover');
    const [months, setMonths] = useState('6');
    const [maxTickers, setMaxTickers] = useState('50');
    const [minPrice, setMinPrice] = useState('');
    const [minVolume, setMinVolume] = useState('');
    const [isRunning, setIsRunning] = useState(false);
    const [results, setResults] = useState(null);
    const [trades, setTrades] = useState([]);
    const [error, setError] = useState(null);
    const [strategyOptions, setStrategyOptions] = useState([]);
    const [progress, setProgress] = useState({ pct: 0, percent: 0, status: 'idle', message: '' });

    // Load available strategies from server
    useEffect(() => {
        const fetchStrategies = async () => {
            try {
                const resp = await fetch(`${API}/api/backtest-strategies`);
                if (resp.ok) {
                    const data = await resp.json();
                    setStrategyOptions(data.strategies || []);
                }
            } catch (e) {
                // Fallback if endpoint not available
                setStrategyOptions([
                    { id: 'sma_crossover', name: 'SMA Crossover (20/50)', category: 'Indikator', direction: 'long' },
                    { id: 'ema_crossover', name: 'EMA Crossover (9/21)', category: 'Indikator', direction: 'long' },
                    { id: 'rsi_mean_reversion', name: 'RSI Mean Reversion', category: 'Indikator', direction: 'long' },
                ]);
            }
        };
        fetchStrategies();
    }, []);

    const selectedStrategy = strategyOptions.find(s => s.id === strategy) || {};
    const requiresTicker = selectedStrategy.requires_ticker !== false;
    const isUniverseBacktest = !requiresTicker;
    const formatBtPrice = (value) => {
        const n = Number(value);
        if (!Number.isFinite(n) || n <= 0) return '-';
        if (n >= 100) return `$${n.toFixed(2)}`;
        if (n >= 1) return `$${n.toFixed(3)}`;
        if (n >= 0.01) return `$${n.toFixed(5)}`;
        return `$${n.toFixed(8)}`;
    };
    const formatBtPct = (value) => {
        const n = Number(value || 0);
        return `${n >= 0 ? '+' : ''}${n.toFixed(2)}%`;
    };
    const numberOr = (value, fallback) => {
        const n = Number(value);
        return Number.isFinite(n) ? n : fallback;
    };

    const runBacktest = async () => {
        if (requiresTicker && !ticker.trim()) {
            if (window.addToast) window.addToast('Bitte Ticker eingeben', 'error');
            return;
        }

        setIsRunning(true);
        setError(null);
        setResults(null);
        setTrades([]);
        const jobId = `bt_${Date.now()}_${Math.random().toString(36).slice(2, 9)}`;
        setProgress({ pct: 0.01, percent: 1, status: 'running', message: 'Backtest gestartet...' });
        let progressTimer = null;
        const pollProgress = async () => {
            try {
                const progressResp = await fetch(`${API}/api/backtest-progress?job_id=${encodeURIComponent(jobId)}`);
                if (progressResp.ok) {
                    const progressData = await progressResp.json();
                    setProgress(progressData);
                }
            } catch (e) {
                // Progress polling is best effort; the main backtest request still decides success/failure.
            }
        };
        progressTimer = setInterval(pollProgress, 800);
        pollProgress();
        try {
            const response = await fetch(`${API}/api/run-backtest`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    ticker: requiresTicker ? ticker.toUpperCase() : 'UNIVERSE',
                    strategy,
                    months: numberOr(months, 6),
                    max_tickers: numberOr(maxTickers || selectedStrategy.default_max_tickers, 50),
                    min_price: numberOr(minPrice || selectedStrategy.default_min_price, 0),
                    min_volume: numberOr(minVolume || selectedStrategy.default_min_volume, 0),
                    job_id: jobId
                })
            });

            if (response.ok) {
                const data = await response.json();
                if (data.error) {
                    setError(data.error);
                    setResults(null);
                    setTrades([]);
                    if (window.addToast) window.addToast(data.error, 'error');
                } else if (data.total_trades === 0) {
                    setError(null);
                    setResults(data);
                    setTrades([]);
                    if (window.addToast) window.addToast('Keine Trades gefunden', 'info');
                } else {
                    setResults(data);
                    setTrades(data.trades || []);
                    if (window.addToast) window.addToast(`Backtest: ${data.total_trades} Trades gefunden`, 'success');
                }
            } else {
                const errData = await response.json().catch(() => ({}));
                setError(errData.detail || 'Backtest fehlgeschlagen');
                if (window.addToast) window.addToast('Backtest fehlgeschlagen', 'error');
            }
        } catch (err) {
            setError('Netzwerkfehler');
            if (window.addToast) window.addToast('Fehler beim Backtest', 'error');
        } finally {
            if (progressTimer) clearInterval(progressTimer);
            await pollProgress();
            setIsRunning(false);
        }
    };

    const visibleTrades = trades.slice(0, 30);
    const hiddenTradeCount = Math.max(0, trades.length - visibleTrades.length);
    const verdict = results?.verdict || null;
    const outOfSample = results?.out_of_sample || null;
    const verdictThemes = {
        approved: { border: '#10b981', bg: '#ecfdf5', text: '#065f46' },
        selective: { border: '#3b82f6', bg: '#eff6ff', text: '#1e40af' },
        sample_small: { border: '#f59e0b', bg: '#fffbeb', text: '#92400e' },
        weak: { border: '#f59e0b', bg: '#fffbeb', text: '#92400e' },
        validation_open: { border: '#f59e0b', bg: '#fffbeb', text: '#92400e' },
        validation_failed: { border: '#ef4444', bg: '#fef2f2', text: '#991b1b' },
        blocked: { border: '#ef4444', bg: '#fef2f2', text: '#991b1b' },
        no_trades: { border: '#94a3b8', bg: '#f8fafc', text: '#475569' },
    };
    const verdictTheme = verdictThemes[verdict?.status] || verdictThemes.no_trades;

    return (
        <div className="space-y-6">
            <div className="card border border-gray-200 p-6 rounded-lg">
                <div className="flex flex-wrap items-start justify-between gap-3 mb-5">
                    <div>
                        <h2 className="text-xl font-bold">Backtest Center</h2>
                        <p className="text-sm text-gray-500 mt-1">Strategien erst freigeben, wenn Profit Factor, Drawdown und Avg R passen.</p>
                    </div>
                    {selectedStrategy.name && (
                        <span className="signal-badge signal-neutral">
                            {selectedStrategy.category || 'Strategie'} - {selectedStrategy.direction === 'short' ? 'SHORT' : 'LONG'}
                        </span>
                    )}
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-12 gap-4 mb-4">
                    <div className="xl:col-span-2">
                        <label className="block text-sm font-semibold mb-2">{requiresTicker ? 'Ticker' : 'Universe'}</label>
                        <input
                            type="text"
                            value={ticker}
                            onChange={(e) => setTicker(e.target.value.toUpperCase())}
                            onKeyDown={(e) => e.key === 'Enter' && runBacktest()}
                            placeholder={requiresTicker ? 'z.B. AAPL' : 'Scanner-Universum'}
                            disabled={!requiresTicker}
                        />
                    </div>
                    <div className="xl:col-span-4">
                        <label className="block text-sm font-semibold mb-2">Strategie</label>
                        <select value={strategy} onChange={(e) => {
                            const next = strategyOptions.find(s => s.id === e.target.value) || {};
                            setStrategy(e.target.value);
                            if (next.default_max_tickers) setMaxTickers(String(next.default_max_tickers));
                            if (next.default_min_price) setMinPrice(String(next.default_min_price));
                            if (next.default_min_volume) setMinVolume(String(next.default_min_volume));
                        }}>
                            {(() => {
                                const categories = {};
                                strategyOptions.forEach(s => {
                                    const cat = s.category || 'Sonstige';
                                    if (!categories[cat]) categories[cat] = [];
                                    categories[cat].push(s);
                                });
                                return Object.entries(categories).map(([cat, strats]) => (
                                    <optgroup key={cat} label={cat}>
                                        {strats.map(s => (
                                            <option key={s.id} value={s.id}>{s.name} {s.direction === 'short' ? '(Short)' : ''}</option>
                                        ))}
                                    </optgroup>
                                ));
                            })()}
                        </select>
                    </div>
                    <div className="xl:col-span-2">
                        <label className="block text-sm font-semibold mb-2">Zeitraum</label>
                        <select value={months} onChange={(e) => setMonths(e.target.value)}>
                            <option value="3">3 Monate</option>
                            <option value="6">6 Monate</option>
                            <option value="12">12 Monate</option>
                            <option value="24">24 Monate</option>
                        </select>
                    </div>
                    <div className="xl:col-span-2">
                        <label className="block text-sm font-semibold mb-2">Max Ticker</label>
                        <input
                            type="number"
                            value={maxTickers}
                            onChange={(e) => setMaxTickers(e.target.value)}
                            min="5"
                            max="500"
                            disabled={!isUniverseBacktest}
                        />
                    </div>
                    <div className="xl:col-span-2 flex items-end">
                        <button onClick={runBacktest} disabled={isRunning} className="button w-full">
                            {isRunning ? 'Laeuft...' : 'Backtest starten'}
                        </button>
                    </div>
                </div>
                {isUniverseBacktest && (
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-3">
                        <div>
                            <label className="block text-xs font-semibold mb-1 text-gray-500">Min Preis optional</label>
                            <input type="number" value={minPrice} onChange={(e) => setMinPrice(e.target.value)} placeholder={selectedStrategy.default_min_price || 'auto'} />
                        </div>
                        <div>
                            <label className="block text-xs font-semibold mb-1 text-gray-500">Min Volumen optional</label>
                            <input type="number" value={minVolume} onChange={(e) => setMinVolume(e.target.value)} placeholder={selectedStrategy.default_min_volume || 'auto'} />
                        </div>
                        <div className="text-xs text-gray-500 flex items-end">
                            {selectedStrategy.note || 'Scanner-Backtest nutzt ein ganzes Universum statt nur einen Ticker.'}
                        </div>
                    </div>
                )}

            {error && (

            {results && !error && (
                <>

                                <div>
                                    <div className="text-xs font-bold uppercase tracking-wide opacity-80">Backtest Freigabe</div>

                    )}

                    {outOfSample && (

                                <span className={`px-2 py-1 rounded text-xs font-bold ${outOfSample.status === 'pass' ? 'bg-green-50 text-green-700' : outOfSample.status === 'fail' ? 'bg-red-50 text-red-700' : 'bg-yellow-50 text-yellow-700'}`}>
                                    {outOfSample.status === 'pass' ? 'BESTAETIGT' : outOfSample.status === 'fail' ? 'NICHT BESTAETIGT' : 'NOCH ZU KLEIN'}

                                <div className="mt-2 text-xs text-gray-500">
                                    {outOfSample.total_trades ?? 0} Trades vorhanden; mindestens {outOfSample.minimum_total_trades ?? 30} und ausreichend getrennte Handelstage erforderlich.

                    )}

                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                        <div className="metric-card green">

                        </div>
                        <div className="metric-card blue">
                            <div className="text-xs font-semibold text-gray-500">Gewinnquote</div>
                            <div className="text-2xl font-bold mt-1">{results.win_rate?.toFixed(1)}%</div>
                        </div>
                        <div className="metric-card orange">
                            <div className="text-xs font-semibold text-gray-500">Ø PnL pro Trade</div>
                            <div className={`text-2xl font-bold mt-1 ${(results.avg_pnl ?? 0) >= 0 ? 'color-positive' : 'color-negative'}`}>
                                {(results.avg_pnl ?? 0) >= 0 ? '+' : ''}{(results.avg_pnl ?? 0).toFixed(2)}%
                            </div>
                        </div>
                        <div className="metric-card purple">
                            <div className="text-xs font-semibold text-gray-500">Max Drawdown</div>
                            <div className="text-2xl font-bold mt-1 color-negative">-{(results.max_drawdown ?? 0).toFixed(2)}%</div>
                        </div>
                        <div className="metric-card" style={{ borderColor: (results.total_return ?? 0) >= 0 ? '#10b981' : '#ef4444' }}>
                            <div className="text-xs font-semibold text-gray-500">{results.backtest_type ? 'Equity*' : 'Gesamtrendite'}</div>
                            <div className={`text-2xl font-bold mt-1 ${(results.total_return ?? 0) >= 0 ? 'color-positive' : 'color-negative'}`}>
                                {(results.total_return ?? 0) >= 0 ? '+' : ''}{(results.total_return ?? 0).toFixed(2)}%
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="card border border-gray-200 p-3 rounded-lg text-center">
                            <div className="text-xs text-gray-500">Bester Trade</div>
                            <div className="text-lg font-bold color-positive mt-1">+{(results.best_trade ?? 0).toFixed(2)}%</div>
                        </div>
                        <div className="card border border-gray-200 p-3 rounded-lg text-center">
                            <div className="text-xs text-gray-500">Schlechtester Trade</div>
                            <div className="text-lg font-bold color-negative mt-1">{(results.worst_trade ?? 0).toFixed(2)}%</div>
                        </div>
                        <div className="card border border-gray-200 p-3 rounded-lg text-center">
                            <div className="text-xs text-gray-500">Ø Gewinn</div>
                            <div className="text-lg font-bold color-positive mt-1">+{(results.avg_win ?? 0).toFixed(2)}%</div>
                        </div>
                        <div className="card border border-gray-200 p-3 rounded-lg text-center">
                            <div className="text-xs text-gray-500">Ø Verlust</div>
                            <div className="text-lg font-bold color-negative mt-1">{(results.avg_loss ?? 0).toFixed(2)}%</div>
                        </div>
                    </div>

                    {(results.total_signals !== undefined || results.n_tickers || results.note) && (
                        <div className="card border border-blue-100 bg-blue-50 p-4 rounded-lg text-sm text-blue-900">
                            <div className="grid grid-cols-2 md:grid-cols-6 gap-3">
                                <div><span className="font-semibold">Signale:</span> {results.total_signals ?? results.total_trades}</div>
                                <div><span className="font-semibold">No Fill:</span> {results.no_fill ?? 0}</div>
                                <div><span className="font-semibold">Ticker:</span> {results.n_tickers ?? '-'}</div>
                                <div><span className="font-semibold">Sum PnL:</span> {formatBtPct(results.sum_pnl ?? results.total_return ?? 0)}</div>
                                <div><span className="font-semibold">Profit Factor:</span> {results.profit_factor_display || ((results.profit_factor ?? 0).toFixed ? (results.profit_factor ?? 0).toFixed(2) : results.profit_factor)}</div>
                                <div><span className="font-semibold">Avg R:</span> {(results.avg_r ?? 0).toFixed ? (results.avg_r ?? 0).toFixed(2) : results.avg_r}</div>
                            </div>
                            {results.note && <div className="mt-2 text-xs text-blue-700">{results.note}</div>}
                            {results.methodology && <div className="mt-1 text-xs text-blue-700">{results.methodology}</div>}
                        </div>
                    )}

                    {results.stats_by_grade && Object.keys(results.stats_by_grade).length > 0 && (
                        <div className="card border border-gray-200 p-4 rounded-lg overflow-x-auto">
                            <h3 className="font-semibold mb-3">Qualitaet nach Grade</h3>
                            <table className="w-full text-sm">
                                <thead className="border-b border-gray-200">
                                    <tr>
                                        <th className="text-left py-2 px-2">Grade</th>
                                        <th className="text-right py-2 px-2">Trades</th>
                                        <th className="text-right py-2 px-2">Win%</th>
                                        <th className="text-right py-2 px-2">Avg PnL</th>
                                        <th className="text-right py-2 px-2">Avg R</th>
                                        <th className="text-right py-2 px-2">PF</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {Object.entries(results.stats_by_grade).map(([grade, stat]) => (
                                        <tr key={grade} className="table-row border-b border-gray-200">
                                            <td className="py-2 px-2 font-semibold">{grade}</td>
                                            <td className="py-2 px-2 text-right">{stat.total ?? 0}</td>
                                            <td className="py-2 px-2 text-right">{(stat.win_rate ?? 0).toFixed(1)}%</td>
                                            <td className={`py-2 px-2 text-right ${(stat.avg_pnl ?? 0) >= 0 ? 'color-positive' : 'color-negative'}`}>{formatBtPct(stat.avg_pnl ?? 0)}</td>
                                            <td className="py-2 px-2 text-right">{(stat.avg_r ?? 0).toFixed(2)}</td>
                                            <td className="py-2 px-2 text-right">{stat.profit_factor_display || ((stat.profit_factor ?? 0).toFixed ? (stat.profit_factor ?? 0).toFixed(2) : stat.profit_factor)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {trades.length > 0 && (
                        <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                            <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
                                <h3 className="font-semibold">Trade Historie ({trades.length} Trades)</h3>
                                {hiddenTradeCount > 0 && <span className="text-xs text-gray-500">Zeigt erste 30 chronologische Trades - {hiddenTradeCount} ausgeblendet</span>}
                            </div>
                            <table className="w-full text-sm">
                                <thead className="border-b border-gray-200">
                                    <tr>
                                        <th className="text-left py-2 px-2">#</th>
                                        <th className="text-left py-2 px-2">Ticker</th>
                                        <th className="text-left py-2 px-2">Entry</th>
                                        <th className="text-right py-2 px-2">Entry Preis</th>
                                        <th className="text-left py-2 px-2">Exit</th>
                                        <th className="text-right py-2 px-2">Exit Preis</th>
                                        <th className="text-right py-2 px-2">PnL%</th>
                                        <th className="text-right py-2 px-2">R</th>
                                        <th className="text-center py-2 px-2">Grade</th>
                                        <th className="text-center py-2 px-2">Outcome</th>
                                        <th className="text-center py-2 px-2">Typ</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {visibleTrades.map((trade, idx) => (
                                        <tr key={idx} className="table-row border-b border-gray-200">
                                            <td className="py-3 px-2 text-gray-400">{idx + 1}</td>
                                            <td className="py-3 px-2 font-semibold">{trade.ticker || '-'}</td>
                                            <td className="py-3 px-2">{trade.entry_date}</td>
                                            <td className="py-3 px-2 text-right">{formatBtPrice(trade.entry_price)}</td>
                                            <td className="py-3 px-2">{trade.exit_date}</td>
                                            <td className="py-3 px-2 text-right">{formatBtPrice(trade.exit_price)}</td>
                                            <td className={`py-3 px-2 text-right font-semibold ${(trade.pnl_pct ?? 0) >= 0 ? 'color-positive' : 'color-negative'}`}>{formatBtPct(trade.pnl_pct ?? 0)}</td>
                                            <td className="py-3 px-2 text-right">{(trade.r_multiple ?? 0).toFixed ? (trade.r_multiple ?? 0).toFixed(2) : trade.r_multiple}</td>
                                            <td className="py-3 px-2 text-center text-xs">{trade.grade || '-'}</td>
                                            <td className="py-3 px-2 text-center text-xs">{trade.outcome || '-'}</td>
                                            <td className="py-3 px-2 text-center text-xs">{trade.type || 'LONG'}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </>
            )}
        </div>
    );
}

        'Gap Momentum Long': 'Fokussiert auf starke Gap-Ups nach News, Earnings oder anderen Katalysatoren. Das Setup ist nur dann interessant, wenn der Gap nicht sofort abverkauft wird, sondern der Preis über dem Open stabil bleibt.',

        'Trend Reversal': 'Sucht kontrollierte Bodenbildung nach einem mehrtägigen Abverkauf. Interessant ist nicht jeder grüne Tag, sondern nur Reversals mit Struktur, Volumen und klarer Veränderung im Verhalten.',

        'Wyckoff Distribution': 'Das Gegenstück zur Akkumulation: Schwäche baut sich schleichend in einer Range auf, bevor der sichtbare Breakdown startet. Gut geeignet, um trügerisch stabile Charts früh skeptisch zu bewerten.',

        'Volume Surge': 'Erkennt Aktien, bei denen plötzlich viel mehr gehandelt wird als üblich UND sich der Preis gleichzeitig bewegt. Wenn beides zusammenkommt, steckt oft echtes Interesse dahinter — nicht nur zufälliges Rauschen. Besonders nützlich um früh in einen Move einzusteigen.',
        'Bull Flag': 'Klassisches Fortsetzungs-Pattern: Eine Aktie hatte einen starken Anstieg (die "Fahnenstange") und pausiert jetzt in einer engen Range. Dieses Verschnaufen bei sinkendem Volumen deutet darauf hin, dass der Trend weitergehen könnte. Der Scanner analysiert mehrere Wochen Kurshistorie um echte Flaggen zu finden.',
        'Bear Flag': 'Das Gegenstück zur Bull Flag — nach einem starken Abverkauf konsolidiert die Aktie in einer engen Range. Oft ein Zeichen, dass der Abwärtstrend weitergehen wird. Nützlich für Short-Setups.',
        'Breakout Long': 'Findet Aktien, die gerade nach oben ausbrechen und ihren Tagesgewinn halten. Der Kurs schließt nahe dem Tageshoch — ein Zeichen, dass die Käufer die Kontrolle haben. Kann auch Multi-Day-Runner erkennen, die über mehrere Tage steigen.',
        'Turtle Breakout': 'Die legendäre Turtle Trading Strategie von Richard Dennis (1983). Ein reines Trend-Following System: Wenn der Kurs das 20-Tage-Hoch durchbricht, wird Long eingegangen. Der Stop-Loss liegt 2× ATR (Average True Range) unter dem Einstieg und wird als Trailing-Stop nachgezogen. Exit wenn der Kurs unter das 10-Tage-Tief fällt. Einfach, mechanisch und profitabel in Trendmärkten. Dennis bewies damit, dass Trading erlernbar ist — seine "Turtles" (Anfänger) verdienten über $100M.',
        'Penny Rockets': 'Sucht günstige Aktien im Low-Price-Bereich, die plötzlich explodieren. Nur liquide Aktien werden angezeigt (Mindest-Handelsvolumen), um illiquide Fallen zu vermeiden. Hochriskant, aber potentiell sehr profitabel.',
        'Dip Buy': 'Findet qualitativ hochwertige Aktien im Rücksetzer, die NICHT in Panik verkauft werden. Wenn eine gute Aktie moderat fällt, aber das Handelsvolumen normal bleibt, ist das oft eine Kaufgelegenheit — kein Crash.',
        'Reversal Hunter': 'Sucht nach Wendepunkten: Aktien, die gestern stark gefallen sind und heute wieder Käufer anziehen. Der Scanner unterscheidet zwischen echten Reversals (im Abwärtstrend) und normalen Pullback-Bounces (im Aufwärtstrend).',
        'Early Momentum': 'Erkennt Aktien mit einem starken Tagesstart, die ihre Gewinne halten. Wenn der Kurs am Tageshoch oder nahe dran schließt, deutet das auf anhaltendes Momentum hin. Ideal für Intraday-Trader.',
        'Whale Watch': 'Extrem hohes Handelsvolumen kombiniert mit klarer Kursrichtung nach oben. Wenn das Volumen weit über dem Durchschnitt liegt und der Preis steigt, sind wahrscheinlich große institutionelle Käufer ("Whales") aktiv.',
        'Whale Watch Short ': 'Das Short-Gegenstück: Extremes Volumen mit klarem Abverkauf. Große Spieler verkaufen in Menge — der Kurs schließt nahe dem Tagestief. Ein starkes Signal für weitere Schwäche.',
        'Earnings Mover Long': 'Aktien, die nach Quartalszahlen oder News stark nach oben gappen und den Gap halten. Funktioniert im Pre-Market, After-Hours und regulärer Session. Der Gap muss mit hohem Volumen bestätigt sein.',
        'Earnings Mover Short': 'Aktien, die nach schlechten Quartalszahlen oder News stark fallen und sich nicht erholen. Wenn der Kurs nahe dem Tagestief bleibt, deutet das auf weitere Schwäche hin — ein Short-Setup.',
        'Gap Up': 'Einfacher Gap-Scanner: Aktien, die mit einer Lücke nach oben eröffnen. Gaps entstehen durch News, Earnings oder Overnight-Aktivität und bieten oft Trading-Chancen in der ersten Stunde.',
        'Gap Down': 'Erkennt Aktien, die mit einer Lücke nach unten eröffnen. Nützlich für Gap-Fill-Trades (Preis kehrt zum Schlusskurs zurück) oder Continuation-Shorts.',

        'Long Wick Down': 'Das Gegenteil: Eine lange untere Wick zeigt, dass der Preis stark fiel, aber von Käufern aufgefangen wurde. Bekannt als "Hammer" in der Candlestick-Analyse — ein bullisches Umkehrsignal.',
        'Insider Buying': 'Zeigt Aktien, bei denen Unternehmensinsider (CEOs, CFOs, Direktoren) eigene Aktien kaufen. Wenn diejenigen kaufen, die das Unternehmen am besten kennen, ist das ein starkes bullisches Signal.',
        'Insider Selling': 'Große Insider-Verkäufe können ein Warnsignal sein. Allerdings verkaufen Insider aus vielen Gründen (Steuern, Diversifikation) — es muss nicht immer negativ sein. Trotzdem ein wichtiger Datenpunkt.',
        'Consolidation ': 'Findet Aktien in einer mehrtägigen Seitwärtsphase mit sinkendem Volumen. Diese "Ruhe vor dem Sturm" geht oft einem großen Ausbruch voraus — die Richtung ist allerdings noch unklar. Basiert auf Wyckoff-Prinzipien.',
        'Consolidation Breakout ': 'Der nächste Schritt nach der Konsolidierung: Erkennt Aktien, die gerade aus einer engen mehrtägigen Range ausbrechen. Der Ausbruch wird durch erhöhtes Volumen bestätigt — ein starkes Einstiegssignal.',
        'Reversal Setup ': 'Sucht mehrtägige Abverkäufe, bei denen sich heute eine bullische Umkehr andeutet. Wenn nach mehreren roten Tagen plötzlich Käufer mit erhöhtem Volumen einsteigen, bildet sich möglicherweise ein Boden.',
        'Tight Range ': 'Extrem enge Tagesrange bei niedrigem Volumen — die Aktie bewegt sich kaum noch. Dieses extreme Gleichgewicht löst sich fast immer in einem großen Move auf. Die Richtung ist allerdings noch unklar.',
        'High Volume Churn ': 'Hohes Volumen OHNE Preisfortschritt. Das klingt langweilig, ist aber eines der wichtigsten Signale: Wenn viel gehandelt wird aber der Preis sich nicht bewegt, wechseln Aktien von schwachen zu starken Händen (Akkumulation) oder umgekehrt (Distribution).',
        'Volume Void Long ⬆': 'Identifiziert Preiszonen über dem aktuellen Kurs, in denen historisch sehr wenig gehandelt wurde. In diesen "Volumen-Löchern" gibt es kaum Widerstand — der Preis kann schnell durchrutschen. Ein Volume-Profile-basiertes Setup.',
        'Volume Void Short ⬇': 'Das Short-Gegenstück: Preiszonen unter dem aktuellen Kurs mit wenig historischem Volumen. Wenn der Preis dort hinein fällt, gibt es wenig Support und er kann schnell weiter fallen.',

        'Harmonic Bearish ⬇': 'Bärische Harmonic Patterns für Short-Setups. Gleiche Methodik wie die bullische Variante, nur in die andere Richtung.',

        'Wyckoff Accumulation ⬆': 'Basiert auf der Wyckoff-Methode: Erkennt Phasen, in denen Smart Money leise in einer Trading Range kauft. Klassische Zeichen sind sinkendes Volumen in der Range und versteckte Stärke. Einer der professionellsten und zuverlässigsten Ansätze der technischen Analyse — entwickelt von Richard Wyckoff in den 1930ern.',
        'Wyckoff Distribution ⬇': 'Das Gegenteil der Akkumulation: Smart Money verkauft leise in einer Trading Range, während der Markt noch stabil aussieht. Erkennt versteckte Schwäche bevor der Abverkauf beginnt. Basiert auf der gleichen Wyckoff-Methodik.',
        'SMA 50 Bounce Long ': 'Der 50-Tage-Durchschnitt (SMA 50) ist eine der wichtigsten Support-Zonen. Wenn der Preis von oben an den SMA 50 herankommt und der MA nach oben zeigt, bietet das oft eine Kaufgelegenheit. Swing-Trader nutzen dieses Setup regelmäßig.',

        'EMA 21 Bounce (Swing) ': 'Der EMA 21 ist der klassische Swing-Trading Moving Average, bekannt durch Linda Raschke\'s "Holy Grail" Setup. Ein Pullback zur EMA 21 im Aufwärtstrend bietet eine der zuverlässigsten Einstiegsmöglichkeiten für Swing-Trades.',

        'Accumulation ': 'Erkennt Coins, die seitwärts handeln aber leicht erhöhtes Volumen zeigen. Das deutet darauf hin, dass jemand still und leise Positionen aufbaut. Oft ein Vorbote eines größeren Moves.',

        'London Session 🇬🇧': 'Die London-Session (08:00-17:00 UTC) hat die höchste Liquidität weltweit. EUR und GBP-Paare sind besonders aktiv. Die besten Breakout-Setups entstehen in der ersten Stunde.',

        'Exotic Movers ': 'Große Bewegungen in Emerging-Market-Währungen. Exotische Paare haben höhere Spreads aber auch größere Schwankungen. Für erfahrene Forex-Trader.',

        ' Gewinner': 'Zeigt alle Aktien der Börse, die heute im Plus sind. Einfacher Überblick über die stärksten Werte des Tages.',

        ' Breakout': 'Starker Ausbruch nach oben — der Kurs schließt nahe dem Tageshoch. Zeigt klare bullische Stärke.',
        ' Breakdown': 'Starker Abverkauf — der Kurs schließt nahe dem Tagestief. Zeigt Verkaufsdruck und mögliche Short-Setups.',
        ' Dip Buy': 'Moderate Schwäche bei soliden Aktien. Ein Rücksetzer bei niedrigem Panik-Level kann eine Kaufgelegenheit sein.',
        ' Volume Spike': 'Deutlich überdurchschnittliches Volumen (zeitnormalisiert). Wenn eine normalerweise ruhige europäische Aktie plötzlich viel gehandelt wird, passiert etwas Wichtiges.',
        ' Reversal': 'Trendumkehr: Gestern stark gefallen, heute Bounce. Zeigt, dass Käufer einsteigen und der Abverkauf möglicherweise vorbei ist.',
