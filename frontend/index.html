<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const API = window.location.protocol + '//' + window.location.hostname + ':8000';

// Toast Component
function ToastContainer() {
    const [toasts, setToasts] = useState([]);
    useEffect(() => {
        window.addToast = (msg, type) => {
            const id = Math.random();
            setToasts(prev => [...prev, { id, message: msg, type }]);
            setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
        };
    }, []);

    return (
        <div>
            {toasts.map(t => (
                <div key={t.id} className={`toast ${t.type}`}>
                    {t.message}
                </div>
            ))}
        </div>
    );
}

// Custom Hooks
function useAutoRefresh(url, interval = 30000, dependency = []) {
    const [data, setData] = useState(null);
    const [loading, setLoading] = useState(true);
    const [error, setError] = useState(null);

    useEffect(() => {
        const fetchData = async () => {
            try {
                setLoading(true);
                const response = await fetch(API + url);
                if (!response.ok) throw new Error('API Error');
                const result = await response.json();
                setData(result);
                setError(null);
            } catch (err) {
                setError(err.message);
                if (window.addToast) window.addToast('Fehler beim Abrufen der Daten', 'error');
            } finally {
                setLoading(false);
            }
        };

        fetchData();
        const timer = setInterval(fetchData, interval);
        return () => clearInterval(timer);
    }, dependency);

    return { data, loading, error };
}

function useSortable(data, defaultKey = null) {
    const [sortKey, setSortKey] = useState(defaultKey);
    const [sortDesc, setSortDesc] = useState(false);

    const sorted = useMemo(() => {
        if (!data || !sortKey) return data;
        return [...data].sort((a, b) => {
            const aVal = a[sortKey];
            const bVal = b[sortKey];
            if (typeof aVal === 'number' && typeof bVal === 'number') {
                return sortDesc ? bVal - aVal : aVal - bVal;
            }
            return sortDesc ? String(bVal).localeCompare(String(aVal)) : String(aVal).localeCompare(String(bVal));
        });
    }, [data, sortKey, sortDesc]);

    const toggleSort = (key) => {
        if (sortKey === key) {
            setSortDesc(!sortDesc);
        } else {
            setSortKey(key);
            setSortDesc(false);
        }
    };

    return { sorted, toggleSort, sortKey, sortDesc };
}

// Global helper: relative time display (German)
function getRelativeTime(timestamp, isFuture = false) {
        if (!timestamp) return 'nie';
        // Server sends UTC timestamps without 'Z' suffix — force UTC interpretation
        const raw = String(timestamp);
        const date = new Date(raw.endsWith('Z') ? raw : raw + 'Z');
        const now = new Date();
        const diffMs = isFuture ? (date - now) : (now - date);
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);

        if (isFuture) {
            if (diffMs < 0) return 'überfällig';
            if (diffMins < 1) return 'gleich';
            if (diffMins < 60) return `in ${diffMins} min`;
            if (diffHours < 24) return `in ${diffHours}h`;
            return date.toLocaleDateString('de-DE');
        }
        if (diffMins < 1) return 'gerade eben';
        if (diffMins < 60) return `vor ${diffMins} min`;
        if (diffHours < 24) return `vor ${diffHours}h`;
        return date.toLocaleDateString('de-DE');
}

// Helper: extract scan timing info for ScanControl from schedulerStatus
function getScanTiming(schedulerStatus, scanKey) {
    if (!schedulerStatus?.scans?.[scanKey]) return { lastScan: null, nextScan: null };
    const scan = schedulerStatus.scans[scanKey];
    return {
        lastScan: scan.last_run ? getRelativeTime(scan.last_run) : null,
        nextScan: scan.next_run ? getRelativeTime(scan.next_run, true) : null,
    };
}

// SchedulerStatus Component
function SchedulerStatus({ status }) {
    const [showDetails, setShowDetails] = useState(false);

    if (!status) return null;

    // API returns scans as object {bi_long: {running, last_run, next_run, interval_min}, ...}
    const scanEntries = status.scans ? Object.entries(status.scans) : [];
    const activeCount = scanEntries.length;
    const runningCount = scanEntries.filter(([_, s]) => s.running).length;
    const scanNames = { bi_long: 'BI Long', bi_short: 'BI Short', bear: 'Bear', biotech: 'Biotech', early_movers: 'Early Movers', crash_monitor: 'Crash Monitor', btc_divergenz: 'BTC Divergenz', money_flow: 'Money Flow', new_listing: 'New Listing', volume_spikes: 'Volume Spikes' };

    return (
        <div className="flex items-center gap-2">
            <div className="relative">
                <button
                    onClick={() => setShowDetails(!showDetails)}
                    className="flex items-center gap-2 text-sm px-3 py-1 rounded bg-blue-100 text-blue-700 hover:bg-blue-200"
                >
                    <span>{runningCount > 0 ? '⏳' : '🔄'}</span>
                    <span>Auto-Scans: {activeCount}{runningCount > 0 ? ` (${runningCount} aktiv)` : ''}</span>
                </button>

                {showDetails && (
                    <div className="absolute top-full right-0 mt-2 bg-white border border-gray-200 rounded shadow-lg z-50 p-4" style={{minWidth: '320px'}}>
                        <div className="text-sm font-semibold mb-3">
                            Scan-Scheduler {status.scheduler_running ? '(läuft)' : '(gestoppt)'}
                        </div>
                        {scanEntries.map(([key, scan]) => (
                            <div key={key} className="text-xs border-b border-gray-100 pb-2 mb-2 last:border-0 last:mb-0">
                                <div className="flex justify-between">
                                    <span className="font-medium">{scanNames[key] || key}</span>
                                    <span className={scan.running ? 'text-orange-500 font-semibold' : 'text-green-600'}>
                                        {scan.running ? '⏳ läuft' : `alle ${scan.interval_min} min`}
                                    </span>
                                </div>
                                <div className="text-gray-500 mt-1">Letzter: {getRelativeTime(scan.last_run)} | Nächster: {getRelativeTime(scan.next_run, true)}</div>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        </div>
    );
}

// ScanControl Component
function ScanControl({ onScan, isScanning = false, lastScan = null, nextScan = null, schedulerStatus = null, scanKey = null }) {
    // Auto-derive lastScan/nextScan from schedulerStatus if scanKey provided
    const timing = scanKey ? getScanTiming(schedulerStatus, scanKey) : { lastScan, nextScan };
    const displayLast = timing.lastScan || lastScan;
    const displayNext = timing.nextScan || nextScan;

    // Check if scheduler is currently running this scan in the background
    const schedulerRunning = scanKey && schedulerStatus?.scans?.[scanKey]?.running;
    const runningSinceSec = schedulerRunning ? (schedulerStatus.scans[scanKey].running_since_sec || 0) : 0;
    const anyScanning = isScanning || schedulerRunning;

    return (
        <div className="card border border-gray-200 p-4 rounded-lg">
            <div className="flex items-center justify-between">
                <div className="flex items-center gap-4">
                    <button onClick={onScan} disabled={anyScanning} className="button" style={{ display: 'inline-flex', alignItems: 'center', gap: '8px' }}>
                        {anyScanning ? (
                            <>
                                <span className="loading-spinner"></span>
                                {schedulerRunning && !isScanning ? 'Auto-Scan läuft...' : 'Scannt...'}
                            </>
                        ) : (
                            'Scan starten'
                        )}
                    </button>
                    {displayLast && <div className="text-sm text-gray-500">Letzter: {displayLast}</div>}
                    {displayNext && <div className="text-sm text-gray-500">Nächster: {displayNext}</div>}
                </div>
            </div>
            {anyScanning && (() => {
                const prog = scanKey && schedulerStatus?.scans?.[scanKey]?.progress;
                const hasProgress = prog && prog.total > 0;
                const pct = hasProgress ? Math.round((prog.checked / prog.total) * 100) : 0;
                return (
                <div className="mt-3">
                    <div style={{ width: '100%', height: hasProgress ? '6px' : '4px', backgroundColor: '#e5e7eb', borderRadius: '3px', overflow: 'hidden' }}>
                        {hasProgress ? (
                            <div style={{ width: `${pct}%`, height: '100%', backgroundColor: '#3b82f6', borderRadius: '3px', transition: 'width 0.5s ease' }}></div>
                        ) : (
                            <div style={{ width: '100%', height: '100%', background: 'linear-gradient(90deg, #3b82f6, #60a5fa, #3b82f6)', backgroundSize: '200% 100%', animation: 'shimmer 1.5s infinite', borderRadius: '2px' }}></div>
                        )}
                    </div>
                    <div className="text-xs text-blue-600 mt-1 font-semibold">
                        {hasProgress
                            ? `${prog.checked} / ${prog.total} analysiert — ${prog.hits} Treffer (${pct}%)`
                            : schedulerRunning && !isScanning
                                ? `Auto-Scan läuft seit ${runningSinceSec > 60 ? Math.floor(runningSinceSec / 60) + ' min' : runningSinceSec + 's'}...`
                                : 'Scanner läuft — Bitte warten...'}
                    </div>
                    {hasProgress && prog.detail && (
                        <div className="text-xs text-gray-400 mt-0.5">{prog.detail}</div>
                    )}
                </div>
                );
            })()}
        </div>
    );
}

// DetailSidebar Component
function DetailSidebar({ ticker, onClose, scannerData }) {
    const [tickerData, setTickerData] = useState(null);
    const [chartData, setChartData] = useState(null);
    const [aiData, setAiData] = useState(null);
    const [aiLoading, setAiLoading] = useState(false);
    const [loading, setLoading] = useState(true);
    const [sidebarMode, setSidebarMode] = useState('normal');
    const [customWidth, setCustomWidth] = useState(null);
    const [customHeight, setCustomHeight] = useState(null);
    const [timeframe, setTimeframe] = useState('1D');
    const [overlays, setOverlays] = useState({ ema: true, vwap: false, sr: false, fib: false, patterns: false, bb: false, vrvp: true, vol: false });
    const chartContainer = useRef(null);
    const chart = useRef(null);
    const candleSeries = useRef(null);
    const overlaySeriesRef = useRef([]);
    const savedVisibleRange = useRef(null);
    const prevOverlaysRef = useRef(null);
    const sidebarRef = useRef(null);
    const isDragging = useRef(false);

    const TIMEFRAMES = ['5m', '15m', '1H', '4H', '1D', '1W'];
    const EMA_COLORS = { ema9: '#f59e0b', ema20: '#3b82f6', ema50: '#ef4444', ema100: '#8b5cf6', ema200: '#14b8a6' };

    // Drag-Resize Handler
    const startResize = (e) => {
        e.preventDefault();
        isDragging.current = true;
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        const handleMouseMove = (e) => {
            if (!isDragging.current) return;
            const newWidth = window.innerWidth - e.clientX;
            const clamped = Math.max(380, Math.min(newWidth, window.innerWidth - 40));
            setCustomWidth(clamped);
            setSidebarMode('custom');
        };
        const handleMouseUp = () => {
            isDragging.current = false;
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            document.removeEventListener('mousemove', handleMouseMove);
            document.removeEventListener('mouseup', handleMouseUp);
        };
        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
    };

    // V2.4: Vertikaler Drag-Resize für Chart-Höhe
    const startHeightResize = (e) => {
        e.preventDefault();
        e.stopPropagation();
        const startY = e.clientY;
        const startHeight = getChartHeight();
        document.body.style.cursor = 'row-resize';
        document.body.style.userSelect = 'none';
        const handleMouseMove = (e) => {
            const delta = e.clientY - startY;
            const newHeight = Math.max(180, Math.min(startHeight + delta, window.innerHeight - 100));
            setCustomHeight(newHeight);
        };
        const handleMouseUp = () => {
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            document.removeEventListener('mousemove', handleMouseMove);
            document.removeEventListener('mouseup', handleMouseUp);
        };
        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
    };

    const cycleMode = () => {
        setCustomWidth(null);
        setSidebarMode(prev => prev === 'normal' ? 'wide' : prev === 'wide' ? 'full' : 'normal');
    };

    const isCrypto = scannerData?.isCrypto || false;

    // Fetch ticker detail data (metrics) — skip for crypto
    useEffect(() => {
        if (isCrypto) { setLoading(false); return; }
        const fetchData = async () => {
            try {
                setLoading(true);
                setAiData(null);
                const res = await fetch(`${API}/api/ticker-detail?ticker=${ticker}`);
                if (res.ok) setTickerData(await res.json());
            } catch (err) {
                console.error('Error fetching detail:', err);
            } finally {
                setLoading(false);
            }
        };
        fetchData();
    }, [ticker, isCrypto]);

    // Fetch chart data — crypto uses CoinGecko, stocks use Polygon
    useEffect(() => {
        const fetchChart = async () => {
            try {
                if (isCrypto) {
                    // Crypto: use CoinGecko chart via coin ID
                    const coinId = scannerData?.ID || scannerData?.id || ticker.toLowerCase();
                    const res = await fetch(`${API}/api/crypto-chart?coin_id=${coinId}&days=30`);
                    if (res.ok) {
                        setChartData(await res.json());
                    } else {
                        setChartData({ ticker, timeframe: '1D', candles: [], error: 'Crypto-Chart nicht verfügbar' });
                    }
                } else {
                    const allOverlays = 'ema,vwap,sr,fib,patterns,vrvp';
                    const res = await fetch(`${API}/api/chart-data?ticker=${ticker}&timeframe=${timeframe}&overlays=${allOverlays}`);
                    if (res.ok) {
                        setChartData(await res.json());
                    } else {
                        setChartData({ ticker, timeframe, candles: [], error: 'Keine Chart-Daten verfügbar' });
                    }
                }
            } catch (err) {
                console.error('Chart data error:', err);
                setChartData({ ticker, timeframe, candles: [], error: 'Chart-Daten konnten nicht geladen werden' });
            }
        };
        fetchChart();
    }, [ticker, timeframe, isCrypto]);

    const loadAiAnalysis = async () => {
        setAiLoading(true);
        try {
            const res = await fetch(`${API}/api/ai-analysis?ticker=${ticker}`);
            if (res.ok) {
                setAiData(await res.json());
            } else {
                setAiData({ analysis: 'API Fehler: ' + res.status });
            }
        } catch (err) {
            setAiData({ analysis: 'Verbindungsfehler' });
        } finally {
            setAiLoading(false);
        }
    };

    const getChartWidth = () => {
        if (customWidth) return customWidth - 60;
        if (sidebarMode === 'full') return window.innerWidth - 60;
        if (sidebarMode === 'wide') return 720 - 60;
        return 480 - 60;
    };

    const getChartHeight = () => {
        if (customHeight) return customHeight;
        return sidebarMode === 'full' ? Math.max(500, window.innerHeight * 0.55) : sidebarMode === 'wide' ? 380 : 250;
    };

    // Render chart with all overlays
    useEffect(() => {
        if (!chartData || !chartContainer.current) return;
        if (!chartData.candles || chartData.candles.length === 0) return; // No data to render
        try {
            // V2.4: Zoom+Scroll exakt speichern vor Rebuild
            // Erkennung: ist es nur ein Overlay/Resize-Wechsel (gleiche Daten)?
            const isOverlayChange = prevOverlaysRef.current && chartData === prevOverlaysRef.current._chartData;
            if (chart.current) {
                try {
                    savedVisibleRange.current = {
                        logical: chart.current.timeScale().getVisibleLogicalRange(),
                        scrollPos: chart.current.timeScale().scrollPosition(),
                    };
                } catch(e) {}
                chart.current.remove();
            }
            prevOverlaysRef.current = { ...overlays, _chartData: chartData };
            overlaySeriesRef.current = [];

            const { createChart, LineStyle, CrosshairMode } = window.LightweightCharts;
            const chartWidth = getChartWidth();
            const chartHeight = getChartHeight();

            chart.current = createChart(chartContainer.current, {
                layout: { textColor: '#999', background: { color: '#1a1a2e' }, fontSize: 11 },
                grid: { vertLines: { color: 'rgba(255,255,255,0.04)' }, horzLines: { color: 'rgba(255,255,255,0.04)' } },
                width: chartWidth, height: chartHeight,
                crosshair: { mode: CrosshairMode.Normal },
                rightPriceScale: { borderColor: 'rgba(255,255,255,0.1)' },
                timeScale: { timeVisible: timeframe.includes('m') || timeframe.includes('H'), secondsVisible: false, borderColor: 'rgba(255,255,255,0.1)' },
            });

            // Candlestick series
            candleSeries.current = chart.current.addCandlestickSeries({
                upColor: '#10b981', downColor: '#ef4444',
                borderUpColor: '#10b981', borderDownColor: '#ef4444',
                wickUpColor: '#10b981', wickDownColor: '#ef4444',
            });
            const candles = (chartData.candles || []).map(c => ({
                time: c.time, open: c.open, high: c.high, low: c.low, close: c.close
            }));
            if (candles.length > 0) candleSeries.current.setData(candles);

            // Volume overlay
            if (overlays.vol && chartData.volume) {
                const volSeries = chart.current.addHistogramSeries({
                    priceFormat: { type: 'volume' },
                    priceScaleId: 'vol',
                });
                chart.current.priceScale('vol').applyOptions({ scaleMargins: { top: 0.85, bottom: 0 } });
                volSeries.setData(chartData.volume);
                overlaySeriesRef.current.push(volSeries);
            }

            // EMA lines
            if (overlays.ema && chartData.ema) {
                Object.entries(chartData.ema).forEach(([key, data]) => {
                    if (data && data.length > 0) {
                        const line = chart.current.addLineSeries({
                            color: EMA_COLORS[key] || '#888',
                            lineWidth: key === 'ema200' ? 2 : 1,
                            priceLineVisible: false,
                            lastValueVisible: false,
                            title: key.toUpperCase(),
                        });
                        line.setData(data);
                        overlaySeriesRef.current.push(line);
                    }
                });
            }

            // VWAP line
            if (overlays.vwap && chartData.vwap && chartData.vwap.length > 0) {
                const vwapLine = chart.current.addLineSeries({
                    color: '#f97316', lineWidth: 2,
                    lineStyle: LineStyle.Dotted,
                    priceLineVisible: false, lastValueVisible: false,
                    title: 'VWAP',
                });
                vwapLine.setData(chartData.vwap);
                overlaySeriesRef.current.push(vwapLine);
            }

            // Bollinger Bands
            if (overlays.bb && chartData.bollinger && chartData.bollinger.length > 0) {
                const bbUpper = chart.current.addLineSeries({
                    color: 'rgba(147,51,234,0.5)', lineWidth: 1,
                    priceLineVisible: false, lastValueVisible: false, title: 'BB+',
                });
                const bbLower = chart.current.addLineSeries({
                    color: 'rgba(147,51,234,0.5)', lineWidth: 1,
                    priceLineVisible: false, lastValueVisible: false, title: 'BB-',
                });
                bbUpper.setData(chartData.bollinger.map(b => ({ time: b.time, value: b.upper })));
                bbLower.setData(chartData.bollinger.map(b => ({ time: b.time, value: b.lower })));
                overlaySeriesRef.current.push(bbUpper, bbLower);
            }

            // Support/Resistance — REAL swing-based levels from backend
            if (overlays.sr && chartData.sr) {
                const sr = chartData.sr;
                const addPriceLine = (price, title, color, style, width) => {
                    if (price && price > 0) {
                        candleSeries.current.createPriceLine({
                            price, color, lineWidth: width || 1,
                            lineStyle: style || LineStyle.Dashed,
                            axisLabelVisible: true, title,
                        });
                    }
                };
                // Real support levels (from swing analysis)
                if (sr.support_levels) {
                    sr.support_levels.slice(0, 4).forEach((lvl, i) => {
                        const strength = lvl.strength || 1;
                        const lw = Math.min(3, Math.max(1, Math.ceil(strength / 2)));
                        addPriceLine(lvl.price, `S${i+1} ${lvl.type || ''}`, '#10b981', strength >= 4 ? LineStyle.Solid : LineStyle.Dashed, lw);
                    });
                }
                // Real resistance levels
                if (sr.resistance_levels) {
                    sr.resistance_levels.slice(0, 4).forEach((lvl, i) => {
                        const strength = lvl.strength || 1;
                        const lw = Math.min(3, Math.max(1, Math.ceil(strength / 2)));
                        addPriceLine(lvl.price, `R${i+1} ${lvl.type || ''}`, '#ef4444', strength >= 4 ? LineStyle.Solid : LineStyle.Dashed, lw);
                    });
                }
                // Pivot if available
                if (sr.pivot) addPriceLine(sr.pivot, 'Pivot', '#fbbf24', LineStyle.Solid, 1);
                // PDH/PDL (Previous Day High/Low)
                if (sr.pdh) addPriceLine(sr.pdh, 'PDH', '#94a3b8', LineStyle.Dotted, 1);
                if (sr.pdl) addPriceLine(sr.pdl, 'PDL', '#94a3b8', LineStyle.Dotted, 1);
                // Period High/Low
                if (sr.period_high) addPriceLine(sr.period_high, 'Period High', '#64748b', LineStyle.Dotted, 1);
                if (sr.period_low) addPriceLine(sr.period_low, 'Period Low', '#64748b', LineStyle.Dotted, 1);
            }

            // VRVP — V2.3: Volume Profile als Balken (horizontales Histogramm)
            if (overlays.vrvp && chartData.vrvp) {
                const vp = chartData.vrvp;
                // POC, VAH, VAL als Preis-Linien beibehalten
                const addVPLine = (price, title, color, style, width) => {
                    if (price && price > 0) {
                        candleSeries.current.createPriceLine({
                            price, color, lineWidth: width || 1,
                            lineStyle: style || LineStyle.Dashed,
                            axisLabelVisible: true, title,
                        });
                    }
                };
                addVPLine(vp.poc, 'POC', '#06b6d4', LineStyle.Solid, 2);
                addVPLine(vp.vah, 'VAH', '#0891b2', LineStyle.Dashed, 1);
                addVPLine(vp.val, 'VAL', '#0891b2', LineStyle.Dashed, 1);

                // Balken als Canvas-Overlay zeichnen
                if (vp.bins && vp.bins.length > 0 && chart.current) {
                    const maxVol = Math.max(...vp.bins.map(b => b.volume));
                    const maxBarWidth = chartContainer.current ? chartContainer.current.clientWidth * 0.15 : 80;
                    const priceScale = chart.current.priceScale('right');

                    // Canvas-Overlay erstellen
                    const existingCanvas = chartContainer.current.querySelector('.vrvp-canvas');
                    if (existingCanvas) existingCanvas.remove();
                    const canvas = document.createElement('canvas');
                    canvas.className = 'vrvp-canvas';
                    canvas.style.position = 'absolute';
                    canvas.style.top = '0';
                    canvas.style.right = '48px';
                    canvas.style.pointerEvents = 'none';
                    canvas.style.zIndex = '5';
                    canvas.width = Math.ceil(maxBarWidth + 10);
                    canvas.height = chartContainer.current.clientHeight;
                    chartContainer.current.style.position = 'relative';
                    chartContainer.current.appendChild(canvas);

                    const drawVRVP = () => {
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        const series = candleSeries.current;
                        if (!series) return;

                        vp.bins.forEach(bin => {
                            const yMid = series.priceToCoordinate(bin.mid);
                            const yHigh = series.priceToCoordinate(bin.high);
                            const yLow = series.priceToCoordinate(bin.low);
                            if (yMid === null || yHigh === null || yLow === null) return;

                            const barH = Math.max(2, Math.abs(yLow - yHigh));
                            const barW = Math.max(2, (bin.volume / maxVol) * maxBarWidth);
                            const y = Math.min(yHigh, yLow);
                            const isPOC = Math.abs(bin.mid - vp.poc) < (bin.high - bin.low);
                            const isVA = bin.mid >= vp.val && bin.mid <= vp.vah;

                            ctx.fillStyle = isPOC ? 'rgba(6, 182, 212, 0.45)' : isVA ? 'rgba(34, 211, 238, 0.25)' : 'rgba(100, 116, 139, 0.18)';
                            ctx.fillRect(canvas.width - barW, y, barW, barH);
                            // Rand
                            ctx.strokeStyle = isPOC ? 'rgba(6, 182, 212, 0.7)' : isVA ? 'rgba(34, 211, 238, 0.4)' : 'rgba(100, 116, 139, 0.3)';
                            ctx.lineWidth = 0.5;
                            ctx.strokeRect(canvas.width - barW, y, barW, barH);
                        });
                    };

                    drawVRVP();
                    // Redraw on scroll/zoom
                    chart.current.timeScale().subscribeVisibleTimeRangeChange(drawVRVP);
                    chart.current.subscribeCrosshairMove(drawVRVP);
                }
            }

            // Fibonacci levels — V2.3: Extended Levels mit eigenen Farben
            if (overlays.fib && chartData.fib) {
                const fibColors = {
                    '0%': '#ef4444', '23%': '#f97316', '38%': '#eab308', '50%': '#22c55e',
                    '61%': '#3b82f6', '78%': '#8b5cf6', '100%': '#a855f7',
                    // Extended Long (nach oben)
                    '127%': '#06b6d4', '161%': '#14b8a6', '200%': '#10b981', '261%': '#059669',
                    // Extended Short (nach unten)
                    '-27%': '#f43f5e', '-61%': '#e11d48', '-100%': '#be123c', '-161%': '#9f1239',
                };
                const extendedKeys = ['127%', '161%', '200%', '261%', '-27%', '-61%', '-100%', '-161%'];
                Object.entries(chartData.fib).forEach(([level, price]) => {
                    const isExtended = extendedKeys.includes(level);
                    candleSeries.current.createPriceLine({
                        price, color: fibColors[level] || '#6b7280',
                        lineWidth: isExtended ? 1 : 1,
                        lineStyle: isExtended ? LineStyle.Dashed : LineStyle.Dotted,
                        axisLabelVisible: true, title: `Fib ${level}`,
                    });
                });
            }

            // Pattern markers
            if (overlays.patterns && chartData.patterns) {
                const markers = [];

                // Pivot markers (swing highs/lows)
                if (chartData.patterns.pivots) {
                    chartData.patterns.pivots.forEach(p => {
                        if (p.time) {
                            markers.push({
                                time: p.time,
                                position: p.type === 'high' ? 'aboveBar' : 'belowBar',
                                color: p.type === 'high' ? '#ef4444' : '#10b981',
                                shape: p.type === 'high' ? 'arrowDown' : 'arrowUp',
                                text: p.type === 'high' ? 'H' : 'L',
                            });
                        }
                    });
                }

                // V2.6b: Richtung bestimmen — nur passende Patterns anzeigen
                const _viewDir = (d.confluence?.direction || '').toUpperCase();

                // Chart pattern markers (gefiltert nach Richtung)
                if (chartData.patterns.chart_patterns) {
                    chartData.patterns.chart_patterns
                        .filter(p => !_viewDir || _viewDir === 'NEUTRAL' || (_viewDir === 'SHORT' ? p.type !== 'bullish' : p.type !== 'bearish'))
                        .forEach(p => {
                        const lastCandle = candles[candles.length - 1];
                        if (lastCandle) {
                            markers.push({
                                time: lastCandle.time,
                                position: p.type === 'bullish' ? 'belowBar' : 'aboveBar',
                                color: p.type === 'bullish' ? '#10b981' : '#ef4444',
                                shape: 'circle',
                                text: (p.pattern || '').substring(0, 12),
                            });
                        }
                    });
                }

                // Harmonic pattern lines (gefiltert nach Richtung)
                if (chartData.patterns.harmonic) {
                    chartData.patterns.harmonic
                        .filter(h => !_viewDir || _viewDir === 'NEUTRAL' || h.direction === _viewDir)
                        .forEach(h => {
                        if (h.points && h.points.length >= 5) {
                            const hLine = chart.current.addLineSeries({
                                color: h.direction === 'LONG' ? '#10b981' : '#ef4444',
                                lineWidth: 2, lastValueVisible: false, priceLineVisible: false,
                                title: h.pattern || 'Harmonic',
                            });
                            const points = h.points.map(pt => ({ time: pt.time || pt.t, value: pt.price || pt.p })).filter(pt => pt.time && pt.value);
                            if (points.length > 0) hLine.setData(points);
                            overlaySeriesRef.current.push(hLine);
                        }
                    });
                }

                // Order block levels
                if (chartData.patterns.order_blocks) {
                    const obs = chartData.patterns.order_blocks;
                    if (obs.nearest_bull_ob) {
                        candleSeries.current.createPriceLine({
                            price: obs.nearest_bull_ob.ob_high || obs.nearest_bull_ob.level,
                            color: '#10b981', lineWidth: 2, lineStyle: LineStyle.Solid,
                            axisLabelVisible: true, title: 'Bull OB',
                        });
                    }
                    if (obs.nearest_bear_ob) {
                        candleSeries.current.createPriceLine({
                            price: obs.nearest_bear_ob.ob_low || obs.nearest_bear_ob.level,
                            color: '#ef4444', lineWidth: 2, lineStyle: LineStyle.Solid,
                            axisLabelVisible: true, title: 'Bear OB',
                        });
                    }
                }

                // Liquidity levels
                if (chartData.patterns.liquidity) {
                    const liq = chartData.patterns.liquidity;
                    if (liq.nearest_buyside) {
                        candleSeries.current.createPriceLine({
                            price: liq.nearest_buyside.level,
                            color: '#3b82f6', lineWidth: 1, lineStyle: LineStyle.Dashed,
                            axisLabelVisible: true, title: 'Buy Liq',
                        });
                    }
                    if (liq.nearest_sellside) {
                        candleSeries.current.createPriceLine({
                            price: liq.nearest_sellside.level,
                            color: '#f59e0b', lineWidth: 1, lineStyle: LineStyle.Dashed,
                            axisLabelVisible: true, title: 'Sell Liq',
                        });
                    }
                }

                // Sort markers by time and set them
                if (markers.length > 0) {
                    markers.sort((a, b) => a.time - b.time);
                    candleSeries.current.setMarkers(markers);
                }
            }

            // V2.4: Zoom+Scroll exakt wiederherstellen bei Overlay-Toggle
            if (isOverlayChange && savedVisibleRange.current) {
                try {
                    if (savedVisibleRange.current.logical) {
                        chart.current.timeScale().setVisibleLogicalRange(savedVisibleRange.current.logical);
                    }
                } catch(e) {
                    chart.current.timeScale().fitContent();
                }
            } else {
                chart.current.timeScale().fitContent();
                savedVisibleRange.current = null;
            }
        } catch (err) { console.error('Chart error:', err); }
        return () => {
            if (chart.current) {
                try {
                    savedVisibleRange.current = {
                        logical: chart.current.timeScale().getVisibleLogicalRange(),
                        scrollPos: chart.current.timeScale().scrollPosition(),
                    };
                } catch(e) {}
                chart.current.remove();
                chart.current = null;
            }
        };
    }, [chartData, sidebarMode, customWidth, customHeight, overlays, tickerData]);

    if (loading && !tickerData) {
        return (
            <div className={`detail-sidebar sidebar-${sidebarMode}`} style={customWidth ? {width: customWidth + 'px'} : {}}>
                <div className="detail-sidebar-content" style={{ padding: '24px' }}>
                    <div className="flex items-center justify-between mb-4">
                        <h2 className="text-xl font-bold">{ticker}</h2>
                        <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
                    </div>
                    <div style={{ width: '100%', height: '4px', backgroundColor: '#e5e7eb', borderRadius: '2px', overflow: 'hidden', marginBottom: '12px' }}>
                        <div style={{ width: '100%', height: '100%', background: 'linear-gradient(90deg, #3b82f6, #60a5fa, #3b82f6)', backgroundSize: '200% 100%', animation: 'shimmer 1.5s infinite', borderRadius: '2px' }}></div>
                    </div>
                    <div className="text-sm text-gray-500">Daten werden geladen...</div>
                </div>
            </div>
        );
    }

    const d = tickerData || {};
    const cd = scannerData || {};  // crypto data from Early Movers
    const price = isCrypto ? (cd.Price || 0) : (d.price || 0);
    const change = isCrypto ? (cd.Change24h || 0) : (d.change_1d || 0);
    const changeClass = change >= 0 ? 'color-positive' : 'color-negative';
    const signalColor = s => s === 'bullish' ? '#059669' : s === 'bearish' ? '#dc2626' : '#6b7280';
    const modeIcon = sidebarMode === 'normal' ? '⬜' : sidebarMode === 'wide' ? '◻️' : '⬛';
    const modeLabel = sidebarMode === 'normal' ? 'Normal' : sidebarMode === 'wide' ? 'Breit' : 'Vollbild';

    // Simple markdown-to-HTML: bold, headers, line breaks
    const renderMarkdown = (text) => {
        if (!text) return '';
        // Escape HTML first to prevent XSS
        let safe = text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        // Then apply markdown formatting
        return safe
            .replace(/\*\*(\d+)\.\s*(.*?)\*\*/g, '<br/><strong>$1. $2</strong>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\n/g, '<br/>');
    };

    // Use grid layout in wide/full mode
    const isWide = sidebarMode === 'wide' || sidebarMode === 'full' || (customWidth && customWidth > 600);

    return (
        <div ref={sidebarRef} className={`detail-sidebar sidebar-${sidebarMode}`} style={customWidth ? {width: customWidth + 'px', transition: 'none'} : {}}>
            {/* Drag Handle */}
            <div className="sidebar-resize-handle" onMouseDown={startResize}></div>

            <div className="detail-sidebar-content" style={{ overflowY: 'auto', maxHeight: '100vh', paddingBottom: '40px' }}>
                {/* Header */}
                <div className="flex justify-between items-start mb-4">
                    <div>
                        <h2 className="text-2xl font-bold">{ticker}</h2>
                        <p className="text-2xl font-bold mt-1">
                            ${price < 0.01 ? price.toPrecision(4) : price.toFixed(2)} <span className={`text-lg font-semibold ${changeClass}`}>({change.toFixed(2)}%)</span>
                        </p>
                    </div>
                    <div className="flex gap-2 items-center">
                        <button onClick={cycleMode} className="sidebar-mode-btn" title={`Modus: ${modeLabel}`}>
                            {sidebarMode === 'normal' ? '↔' : sidebarMode === 'wide' ? '⛶' : '▪'}
                        </button>
                        <button onClick={onClose} className="text-2xl font-bold hover:text-red-500">×</button>
                    </div>
                </div>

                {/* Grade + Confluence — BI Scanner Grade hat Vorrang (kommt direkt vom Backend) */}
                <div className="mb-4">
                    <div className="flex gap-2 items-center">
                        {d.signal_grade && (
                            <span className={`grade-badge grade-${d.signal_grade.toLowerCase()}`}>
                                Grade {d.signal_grade} ({d.signal_score != null ? Math.round(d.signal_score) : 0}P)
                            </span>
                        )}
                        {d.confluence && (
                            <span className={`signal-badge signal-${d.confluence.direction === 'LONG' ? 'bullish' : d.confluence.direction === 'SHORT' ? 'bearish' : 'neutral'}`}>
                                {d.confluence.direction}
                            </span>
                        )}
                        {d.bi_scanner && (
                            <span className="text-xs text-blue-500 font-medium ml-1">via BI Scanner</span>
                        )}
                    </div>
                    {d.bi_scanner && d.bi_scanner.grade_label && (
                        <div className="text-xs text-gray-500 mt-1">{d.bi_scanner.grade_label}</div>
                    )}
                </div>

                {/* Timeframe Selector */}
                <div className="flex gap-1 mb-2 flex-wrap">
                    {TIMEFRAMES.map(tf => (
                        <button key={tf} onClick={() => setTimeframe(tf)}
                            className={`px-2 py-1 text-xs rounded ${timeframe === tf ? 'bg-blue-600 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`}>
                            {tf}
                        </button>
                    ))}
                </div>

                {/* Overlay Toggles */}
                <div className="flex gap-1 mb-3 flex-wrap">
                    {[
                        { key: 'ema', label: 'EMA', color: '#3b82f6' },
                        { key: 'vwap', label: 'VWAP', color: '#f97316' },
                        { key: 'sr', label: 'S/R', color: '#fbbf24' },
                        { key: 'fib', label: 'Fib', color: '#8b5cf6' },
                        { key: 'bb', label: 'BB', color: '#9333ea' },
                        { key: 'vrvp', label: 'VRVP', color: '#06b6d4' },
                        { key: 'patterns', label: 'Patterns', color: '#10b981' },
                        { key: 'vol', label: 'Vol', color: '#6b7280' },
                    ].map(({ key, label, color }) => (
                        <button key={key}
                            onClick={() => setOverlays(prev => ({...prev, [key]: !prev[key]}))}
                            className="px-2 py-1 text-xs rounded font-semibold"
                            style={{
                                background: overlays[key] ? color : `${color}22`,
                                color: overlays[key] ? '#fff' : color,
                                border: `1.5px solid ${overlays[key] ? color : `${color}55`}`,
                                opacity: overlays[key] ? 1 : 0.6,
                            }}>
                            {label}
                        </button>
                    ))}
                </div>

                {/* Chart */}
                {chartData && chartData.candles && chartData.candles.length === 0 ? (
                    <div className="text-center py-8 text-gray-500 text-sm bg-gray-800 rounded-lg mb-4">
                        {chartData.error || 'Keine Chart-Daten verfügbar'}
                    </div>
                ) : !chartData ? (
                    <div className="flex justify-center py-8 mb-4"><div className="loading-spinner"></div></div>
                ) : null}
                <div style={{ position: 'relative' }}>
                    {/* V2.5: Expand-Button oben links im Chart */}
                    {chartData && chartData.candles && chartData.candles.length > 0 && (
                        <button onClick={() => {
                            const halfScreen = Math.round(window.innerWidth * 0.5);
                            if (customWidth && customWidth >= halfScreen - 50) {
                                setCustomWidth(null); setSidebarMode('normal');
                            } else {
                                setCustomWidth(halfScreen); setSidebarMode('custom');
                            }
                        }}

// Main App
function App() {
    const [activeTab, setActiveTab] = useState('scanner');
    const [darkMode, setDarkMode] = useState(false);
    const [selectedTicker, setSelectedTicker] = useState(null);
    const [scannerItemData, setScannerItemData] = useState(null);
    const [serverStatus, setServerStatus] = useState(true);
    const [activeScans, setActiveScans] = useState(0);
    const [scanCache, setScanCache] = useState({});

    // Wrapper: akzeptiert String (ticker) oder Objekt {ticker, grade, score, direction, ...}
    const handleSelectTicker = useCallback((tickerOrObj) => {
        if (!tickerOrObj) {
            setSelectedTicker(null);
            setScannerItemData(null);
        } else if (typeof tickerOrObj === 'string') {
            setSelectedTicker(tickerOrObj);
            setScannerItemData(null);
        } else if (tickerOrObj.ticker) {
            setSelectedTicker(tickerOrObj.ticker);
            setScannerItemData(tickerOrObj);
        }
    }, []);
    const [schedulerStatus, setSchedulerStatus] = useState(null);

    // Check server status
    useEffect(() => {
        const checkServer = async () => {
            try {
                const response = await fetch(`${API}/api/health`);
                setServerStatus(response.ok);
            } catch {
                setServerStatus(false);
            }
        };
        checkServer();
        const interval = setInterval(checkServer, 30000);
        return () => clearInterval(interval);
    }, []);

    // Fetch scheduler status
    useEffect(() => {
        const fetchSchedulerStatus = async () => {
            try {
                const response = await fetch(`${API}/api/scan-status`);
                if (response.ok) {
                    setSchedulerStatus(await response.json());
                }
            } catch (err) {
                console.error('Error fetching scheduler status:', err);
            }
        };
        fetchSchedulerStatus();
        // Schnelleres Polling (5s) wenn Scans laufen, sonst 30s
        const interval = setInterval(fetchSchedulerStatus, 5000);
        return () => clearInterval(interval);
    }, []);

    const updateScanCache = (key, data) => {
        setScanCache(prev => ({...prev, [key]: data}));
    };

    // Apply dark mode
    useEffect(() => {
        if (darkMode) {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.removeAttribute('data-theme');
        }
    }, [darkMode]);

    const tabs = [
        { id: 'scanner', label: 'Scanner' },
        { id: 'bi-scanner', label: 'BI Scanner' },
        { id: 'biotech', label: 'Biotech' },
        { id: 'btc-divergenz', label: 'BTC-Divergenz' },
        { id: 'early-movers', label: 'Early Movers' },
        { id: 'short-scanner', label: 'Short Scanner' },
        { id: 'money-flow', label: 'Money Flow' },
        { id: 'kalender', label: 'Kalender' },
        { id: 'crash-monitor', label: 'Crash Monitor' },
        { id: 'watchlist', label: 'Watchlist' },
        { id: 'backtest', label: 'Backtest' },
        { id: 'strategie-guide', label: 'Strategie Guide' },
        { id: 'new-listing', label: 'New Listing' },
        { id: 'volume-spikes', label: 'Volume Spikes' },
        { id: 'orb', label: 'ORB Scanner' },
        { id: 'suche', label: 'Suche' }
    ];

    return (
        <div className={darkMode ? 'dark' : ''}>
            {/* Header */}
            <div className="card border-b border-gray-200 sticky top-0 z-100">
                <div className="max-w-full px-6 py-4">
                    <div className="flex justify-between items-center mb-4">
                        <h1 className="text-2xl font-bold">Alpha Station</h1>
                        <div className="flex items-center gap-4">
                            <SchedulerStatus status={schedulerStatus} />
                            <div className="flex items-center gap-2">
                                <span className={`status-dot ${serverStatus ? 'status-online' : 'status-offline'}`}></span>
                                <span className="text-sm">{serverStatus ? 'Server Online' : 'Server Offline'}</span>
                            </div>
                            <button
                                onClick={() => setDarkMode(!darkMode)}
                                className="icon-button text-xl"
                            >
                                {darkMode ? '☀️' : '🌙'}
                            </button>
                        </div>
                    </div>

                    {/* Tab Navigation */}
                    <div className="flex gap-6 overflow-x-auto pb-2">
                        {tabs.map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`whitespace-nowrap pb-2 border-b-2 transition-all ${
                                    activeTab === tab.id
                                        ? 'tab-active font-semibold'
                                        : 'tab-inactive'
                                }`}
                            >
                                {tab.label}
                            </button>
                        ))}
                    </div>
                </div>
            </div>

            {/* Main Content */}
            <div className="max-w-full px-6 py-6">
                {activeTab === 'scanner' && <ScannerTab onSelectTicker={handleSelectTicker} scanCache={scanCache} updateScanCache={updateScanCache} schedulerStatus={schedulerStatus} />}
                {activeTab === 'bi-scanner' && <BIScannerTab onSelectTicker={handleSelectTicker} scanCache={scanCache} updateScanCache={updateScanCache} schedulerStatus={schedulerStatus} />}
                {activeTab === 'biotech' && <BiotechTab onSelectTicker={handleSelectTicker} scanCache={scanCache} updateScanCache={updateScanCache} schedulerStatus={schedulerStatus} />}
                {activeTab === 'btc-divergenz' && <BTCDivergenzTab onSelectTicker={handleSelectTicker} scanCache={scanCache} updateScanCache={updateScanCache} schedulerStatus={schedulerStatus} />}
                {activeTab === 'early-movers' && <EarlyMoversTab onSelectTicker={handleSelectTicker} scanCache={scanCache} updateScanCache={updateScanCache} schedulerStatus={schedulerStatus} />}
                {activeTab === 'short-scanner' && <ShortScannerTab onSelectTicker={handleSelectTicker} scanCache={scanCache} updateScanCache={updateScanCache} schedulerStatus={schedulerStatus} />}
                {activeTab === 'money-flow' && <MoneyFlowTab onSelectTicker={handleSelectTicker} scanCache={scanCache} updateScanCache={updateScanCache} schedulerStatus={schedulerStatus} />}
                {activeTab === 'kalender' && <KalenderTab />}
                {activeTab === 'crash-monitor' && <CrashMonitorTab onSelectTicker={handleSelectTicker} scanCache={scanCache} updateScanCache={updateScanCache} schedulerStatus={schedulerStatus} />}
                {activeTab === 'watchlist' && <WatchlistTab onSelectTicker={handleSelectTicker} scanCache={scanCache} updateScanCache={updateScanCache} />}
                {activeTab === 'backtest' && <BacktestTab />}
                {activeTab === 'strategie-guide' && <StrategieGuideTab />}
                {activeTab === 'new-listing' && <NewListingTab onSelectTicker={handleSelectTicker} scanCache={scanCache} updateScanCache={updateScanCache} schedulerStatus={schedulerStatus} />}
                {activeTab === 'volume-spikes' && <VolumeSpikesTab onSelectTicker={handleSelectTicker} scanCache={scanCache} updateScanCache={updateScanCache} schedulerStatus={schedulerStatus} />}
                {activeTab === 'orb' && <ORBScannerTab onSelectTicker={handleSelectTicker} scanCache={scanCache} updateScanCache={updateScanCache} schedulerStatus={schedulerStatus} />}
                {activeTab === 'suche' && <SucheTab onSelectTicker={handleSelectTicker} scanCache={scanCache} updateScanCache={updateScanCache} />}
            </div>

            {/* Detail Sidebar */}
            {selectedTicker && (
                <DetailSidebar ticker={selectedTicker} onClose={() => { setSelectedTicker(null); setScannerItemData(null); }} scannerData={scannerItemData} />
            )}

            {/* Toast Container */}
            <ToastContainer />
        </div>
    );
}

                            const items = data.data || [];

            }

// BI Scanner Tab
function BIScannerTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [direction, setDirection] = useState('long');
    const [isScanning, setIsScanning] = useState(scanCache.bi_scanning || false);
    const [results, setResults] = useState(scanCache.bi_results || []);
    const { sorted, toggleSort, sortKey } = useSortable(results, 'score');
    const pollRef = useRef(null);

    // Cleanup polling on unmount
    useEffect(() => {
        return () => { if (pollRef.current) clearInterval(pollRef.current); };
    }, []);

    // V2.2: Live-Polling — lädt Zwischenergebnisse während Scan läuft
    const startLivePolling = () => {
        if (pollRef.current) clearInterval(pollRef.current);
        pollRef.current = setInterval(async () => {
            try {
                // Prüfe ob Scan noch läuft
                const scanKey = direction === 'long' ? 'bi_long' : 'bi_short';
                const statusRes = await fetch(`${API}/api/scan-status`);
                let scanRunning = true;
                if (statusRes.ok) {
                    const status = await statusRes.json();
                    const s = status.scans?.[scanKey];
                    scanRunning = s?.running || false;
                }
                // Lade aktuelle Ergebnisse (inkl. Zwischenergebnisse)
                const res = await fetch(`${API}/api/bi-results?direction=${direction}`);
                if (res.ok) {
                    const data = await res.json();
                    const items = data.data || [];
                    if (items.length > 0) {
                        setResults(items);
                        updateScanCache('bi_results', items);
                    }
                }
                // Scan fertig → Polling stoppen
                if (!scanRunning) {
                    clearInterval(pollRef.current);
                    pollRef.current = null;
                    setIsScanning(false);
                    updateScanCache('bi_scanning', false);
                    if (window.addToast) window.addToast('Scan fertig', 'success');
                }
            } catch (e) { console.error(e); }
        }, 8000); // Alle 8 Sekunden
    };

    const handleScan = async () => {
        setIsScanning(true);
        updateScanCache('bi_scanning', true);
        try {
            const response = await fetch(`${API}/api/bi-scan`, { method: 'POST', body: JSON.stringify({ direction }), headers: { 'Content-Type': 'application/json' } });
            if (response.ok) {
                if (window.addToast) window.addToast('Scan gestartet — Ergebnisse erscheinen live...', 'info');
                startLivePolling();
            } else {
                setIsScanning(false);
                updateScanCache('bi_scanning', false);
            }
        } catch (err) {
            console.error('Error:', err);
            setIsScanning(false);
            updateScanCache('bi_scanning', false);
        }
    };

    // Load results on mount / direction change + auto-detect running scan
    useEffect(() => {
        const fetchResults = async () => {
            try {
                const response = await fetch(`${API}/api/bi-results?direction=${direction}`);
                if (response.ok) {
                    const data = await response.json();
                    const items = data.data || [];
                    if (items.length > 0) {
                        setResults(items);
                        updateScanCache('bi_results', items);
                    }
                }
                // Auto-detect: Läuft gerade ein Scan? Dann Live-Polling starten
                const scanKey = direction === 'long' ? 'bi_long' : 'bi_short';
                const statusRes = await fetch(`${API}/api/scan-status`);
                if (statusRes.ok) {
                    const status = await statusRes.json();
                    if (status.scans?.[scanKey]?.running) {
                        setIsScanning(true);
                        startLivePolling();
                    }
                }
            } catch (err) { console.error('Error:', err); }
        };
        fetchResults();
        return () => { if (pollRef.current) clearInterval(pollRef.current); };
    }, [direction]);

    return (
        <div className="space-y-6">
            <div className="card border border-gray-200 p-6 rounded-lg">
                <label className="block text-sm font-semibold mb-3">Richtung</label>
                <div className="flex gap-4">
                    <button onClick={() => setDirection('long')} className={`button ${direction === 'long' ? '' : 'button-secondary'}`}>Long</button>
                    <button onClick={() => setDirection('short')} className={`button ${direction === 'short' ? '' : 'button-secondary'}`}>Short</button>
                </div>
            </div>

            <ScanControl onScan={handleScan} isScanning={isScanning} schedulerStatus={schedulerStatus} scanKey={direction === 'long' ? 'bi_long' : 'bi_short'} />

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-center py-2 px-2 sortable-header" onClick={() => toggleSort('grade')}>Grade {sortKey === 'grade' && '↓'}</th>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('ticker')}>Ticker {sortKey === 'ticker' && '↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('price')}>Preis {sortKey === 'price' && '↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('change_pct')}>Chg% {sortKey === 'change_pct' && '↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('rvol')}>RVOL {sortKey === 'rvol' && '↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('volume')}>Volumen {sortKey === 'volume' && '↓'}</th>
                            <th className="text-right py-2 px-2 sortable-header" onClick={() => toggleSort('score')}>Score {sortKey === 'score' && '↓'}</th>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('grade_label')}>Signal {sortKey === 'grade_label' && '↓'}</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.map((item, idx) => (
                            <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker(item.ticker)}>
                                <td className="py-3 px-2 text-center"><span className={`grade-badge grade-${(item.grade || 'c').toLowerCase()}`}>{item.grade}</span></td>
                                <td className="py-3 px-2 font-semibold">{item.ticker}</td>
                                <td className="py-3 px-2 text-right">${item.price?.toFixed(2)}</td>
                                <td className="py-3 px-2 text-right" style={{color: (item.change_pct || 0) >= 0 ? '#10b981' : '#ef4444'}}>{(item.change_pct || 0) >= 0 ? '+' : ''}{(item.change_pct || 0).toFixed(2)}%</td>
                                <td className="py-3 px-2 text-right" style={{color: (item.rvol || 0) >= 2 ? '#f59e0b' : '#9ca3af'}}>{(item.rvol || 0).toFixed(1)}x</td>
                                <td className="py-3 px-2 text-right">{item.volume ? (item.volume >= 1000000 ? (item.volume / 1000000).toFixed(1) + 'M' : (item.volume / 1000).toFixed(0) + 'K') : '–'}</td>
                                <td className="py-3 px-2 text-right font-semibold">{item.score?.toFixed(0)}</td>
                                <td className="py-3 px-2"><span className={`signal-badge signal-${direction === 'long' ? 'bullish' : 'bearish'}`}>{item.grade_label || direction.toUpperCase()}</span></td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

            updateScanCache('btc_divergenz_scanning', false);
        }
    };

    useEffect(() => {
        if (scanCache.btc_divergenz_results && scanCache.btc_divergenz_results.length > 0) {
            // fallback from cache
            setResults(scanCache.btc_divergenz_results);
        }
        const fetchResults = async () => {
            try {
                const response = await fetch(`${API}/api/btc-divergenz-results`);
                if (response.ok) {
                    const data = await response.json();
                    const items = data.data || [];
                    if (items.length > 0) {
                        setResults(items);
                        updateScanCache('btc_divergenz_results', items);
                    }
                }
            } catch (err) { console.error('Error:', err); }
        };
        fetchResults();
    }, []);

    const getSignalClass = (signal) => {
        if (signal.includes('KAUFEN')) return 'signal-kaufen';
        if (signal.includes('MEIDEN')) return 'signal-meiden';
        if (signal.includes('ABWARTEN')) return 'signal-abwarten';
        if (signal.includes('BEOBACHTEN')) return 'signal-beobachten';
        if (signal.includes('BTC')) return 'signal-btc';
        return 'signal-neutral';

    return (

// Early Movers Tab
function EarlyMoversTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [subTab, setSubTab] = useState('volume-spikes');
    const [volumeSpikes, setVolumeSpikes] = useState([]);
    const [microCaps, setMicroCaps] = useState([]);
    const [whaleAcc, setWhaleAcc] = useState([]);
    const [recentlyListed, setRecentlyListed] = useState([]);
    const [narratives, setNarratives] = useState({});
    const [stats, setStats] = useState({});
    const [isScanning, setIsScanning] = useState(false);
    const pollTimeoutRef = useRef(null);

    const { sorted: sortedSpikes, toggleSort: toggleSpikeSort } = useSortable(volumeSpikes, 'EarlyScore');
    const { sorted: sortedMicro, toggleSort: toggleMicroSort } = useSortable(microCaps, 'DegenScore');
    const { sorted: sortedWhale, toggleSort: toggleWhaleSort } = useSortable(whaleAcc, 'WhaleScore');
    const { sorted: sortedRecent, toggleSort: toggleRecentSort } = useSortable(recentlyListed, 'NewScore');

    // Utility functions for formatting
    const formatPrice = (price) => {
        if (price === null || price === undefined) return '–';
        return price >= 1 ? `$${price.toFixed(2)}` : `$${price.toFixed(4)}`;
    };

    const formatMCap = (mcap) => {
        if (mcap === null || mcap === undefined) return '–';
        if (mcap >= 1000000000) return `$${(mcap / 1000000000).toFixed(1)}B`;
        if (mcap >= 1000000) return `$${(mcap / 1000000).toFixed(1)}M`;
        return `$${mcap.toFixed(0)}`;
    };

    const getScoreClass = (score) => {
        if (!score) return '';
        if (score >= 70) return 'bg-green-600 text-white';
        if (score >= 40) return 'bg-yellow-600 text-white';
        return 'bg-red-600 text-white';
    };

    const getPercentClass = (value) => {
        if (!value) return '';
        return value >= 0 ? 'color-positive' : 'color-negative';
    };

    // Cleanup polling on unmount
    useEffect(() => {
        return () => { if (pollTimeoutRef.current) clearTimeout(pollTimeoutRef.current); };
    }, []);

    // Load latest data on mount
    useEffect(() => {
        const fetchResults = async () => {
            try {
                const response = await fetch(`${API}/api/early-movers-results`);
                if (response.ok) {
                    const data = await response.json();
                    const em = (data.data && data.data[0]) || {};
                    setVolumeSpikes(em.volume_spikes || []);
                    setMicroCaps(em.micro_caps || []);
                    setWhaleAcc(em.whale_acc || []);
                    setRecentlyListed(em.recently_listed || []);
                    setNarratives(em.narratives || {});
                    setStats(em.stats || {});
                }
            } catch (err) { console.error('Error fetching early movers:', err); }
        };
        fetchResults();
    }, []);

    const handleScan = async () => {
        setIsScanning(true);
        let prevCachedAt = null;
        try {
            const preCheck = await fetch(`${API}/api/early-movers-results`);
            if (preCheck.ok) {
                const preData = await preCheck.json();
                prevCachedAt = preData.cached_at || null;
            }
        } catch(e) {}
        try {
            const response = await fetch(`${API}/api/early-movers-scan`, { method: 'POST' });
            if (response.ok) {
                if (window.addToast) window.addToast('Scan gestartet...', 'info');
                const pollResults = async (attempts = 0) => {
                    if (attempts > 12) {
                        setIsScanning(false);
                        if (window.addToast) window.addToast('Scan dauert länger...', 'info');
                        return;
                    }
                    try {
                        const res = await fetch(`${API}/api/early-movers-results`);
                        if (res.ok) {
                            const data = await res.json();
                            const em = (data.data && data.data[0]) || {};
                            const isNewData = data.cached_at && data.cached_at !== prevCachedAt;
                            if (isNewData) {
                                setVolumeSpikes(em.volume_spikes || []);
                                setMicroCaps(em.micro_caps || []);
                                setWhaleAcc(em.whale_acc || []);
                                setRecentlyListed(em.recently_listed || []);
                                setNarratives(em.narratives || {});
                                setStats(em.stats || {});
                                setIsScanning(false);
                                if (window.addToast) window.addToast('Scan fertig!', 'success');
                                return;
                            }
                        }
                    } catch (e) { console.error(e); }
                    pollTimeoutRef.current = setTimeout(() => pollResults(attempts + 1), 10000);
                };
                pollTimeoutRef.current = setTimeout(() => pollResults(0), 5000);
            } else {
                setIsScanning(false);
            }
        } catch (err) {
            if (window.addToast) window.addToast('Scan-Fehler', 'error');
            setIsScanning(false);
        }
    };

function ShortScannerTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {}, schedulerStatus = null }) {
    const [subTab, setSubTab] = useState('breakdown');
    const [inverseETFs, setInverseETFs] = useState(scanCache.short_inverse || []);
    const [breakdownStocks, setBreakdownStocks] = useState(scanCache.short_breakdown || []);
    const [isScanning, setIsScanning] = useState(scanCache.short_scanning || false);
    const { sorted: sortedInverse, toggleSort: toggleInverseSort } = useSortable(inverseETFs, 'ticker');
    const { sorted: sortedBreakdown, toggleSort: toggleBreakdownSort } = useSortable(breakdownStocks, 'ticker');
    const pollTimeoutRef = useRef(null);

    // Cleanup polling on unmount
    useEffect(() => {
        return () => { if (pollTimeoutRef.current) clearTimeout(pollTimeoutRef.current); };
    }, []);

    // Always load latest from server on mount
    useEffect(() => {
        const fetchResults = async () => {
            try {
                const response = await fetch(`${API}/api/bear-results`);
                if (response.ok) {
                    const data = await response.json();
                    const bear = (data.data && data.data[0]) || {};
                    setInverseETFs(bear.inverse_etfs || []);
                    setBreakdownStocks(bear.breakdown_stocks || []);
                    updateScanCache('short_inverse', bear.inverse_etfs || []);
                    updateScanCache('short_breakdown', bear.breakdown_stocks || []);
                }
            } catch (err) { console.error('Error:', err); }
        };
        fetchResults();
    }, []);

    const handleScan = async () => {
        setIsScanning(true);
        updateScanCache('short_scanning', true);
        // Save current cached_at BEFORE scan starts
        let prevCachedAt = null;
        try {
            const preCheck = await fetch(`${API}/api/bear-results`);
            if (preCheck.ok) {
                const preData = await preCheck.json();
                prevCachedAt = preData.cached_at || null;
            }
        } catch(e) {}
        try {

// Watchlist Tab
function WatchlistTab({ onSelectTicker, scanCache = {}, updateScanCache = () => {} }) {
    const [watchlist, setWatchlist] = useState([]);
    const [newTicker, setNewTicker] = useState('');
    const [tickerPrices, setTickerPrices] = useState({});
    const { sorted, toggleSort, sortKey } = useSortable(watchlist, 'ticker');

    useEffect(() => {
        const saved = localStorage.getItem('watchlist');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                setWatchlist(parsed);
            } catch (e) {
                setWatchlist([]);
            }
        }
    }, []);

    useEffect(() => {
        watchlist.forEach(ticker => {
            fetch(`${API}/api/ticker-detail?ticker=${ticker}`)
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (data) {
                        setTickerPrices(prev => ({
                            ...prev,
                            [ticker]: data
                        }));
                    }
                })
                .catch(err => console.error('Error:', err));
        });
    }, [watchlist]);

    const addTicker = () => {
        if (newTicker.trim() && !watchlist.includes(newTicker.toUpperCase())) {
            const updated = [...watchlist, newTicker.toUpperCase()];
            setWatchlist(updated);
            localStorage.setItem('watchlist', JSON.stringify(updated));
            setNewTicker('');
            if (window.addToast) window.addToast(`${newTicker.toUpperCase()} zur Watchlist hinzugefügt`, 'success');
        }
    };

    const removeTicker = (ticker) => {
        const updated = watchlist.filter(t => t !== ticker);
        setWatchlist(updated);
        localStorage.setItem('watchlist', JSON.stringify(updated));
        if (window.addToast) window.addToast(`${ticker} aus Watchlist entfernt`, 'success');
    };

    const exportCSV = () => {
        let csv = 'Ticker,Preis,1D%,5D%,RSI,Grade\n';
        sorted.forEach(ticker => {
            const price = tickerPrices[ticker];
            if (price) {
                csv += `${ticker},${price.price},${price.change_pct},${price.change_5d || 0},${price.rsi || 0},${price.grade || 'N/A'}\n`;
            }
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'watchlist.csv';
        a.click();
    };

    return (
        <div className="space-y-6">
            <div className="card border border-gray-200 p-6 rounded-lg">
                <label className="block text-sm font-semibold mb-3">Ticker hinzufügen</label>
                <div className="flex gap-2">
                    <input
                        type="text"
                        value={newTicker}
                        onChange={(e) => setNewTicker(e.target.value)}
                        onKeyPress={(e) => e.key === 'Enter' && addTicker()}
                        placeholder="z.B. AAPL"
                        className="flex-1"
                    />
                    <button onClick={addTicker} className="button">Hinzufügen</button>
                    <button onClick={exportCSV} className="button button-secondary">CSV</button>
                </div>
            </div>

            <div className="card border border-gray-200 p-6 rounded-lg overflow-x-auto">
                <table className="w-full text-sm">
                    <thead className="border-b border-gray-200">
                        <tr>
                            <th className="text-left py-2 px-2 sortable-header" onClick={() => toggleSort('ticker')}>Ticker</th>
                            <th className="text-right py-2 px-2">Preis</th>
                            <th className="text-right py-2 px-2">1D%</th>
                            <th className="text-right py-2 px-2">5D%</th>
                            <th className="text-right py-2 px-2">RSI</th>
                            <th className="text-center py-2 px-2">Grade</th>
                            <th className="text-center py-2 px-2">Aktion</th>
                        </tr>
                    </thead>
                    <tbody>
                        {sorted.map((ticker, idx) => {
                            const price = tickerPrices[ticker];
                            return (
                                <tr key={idx} className="table-row border-b border-gray-200" onClick={() => onSelectTicker(ticker)}>
                                    <td className="py-3 px-2 font-semibold">{ticker}</td>
                                    <td className="py-3 px-2 text-right">${price?.price?.toFixed(2) || '-'}</td>
                                    <td className={`py-3 px-2 text-right ${(price?.change_pct || 0) >= 0 ? 'color-positive' : 'color-negative'}`}>{price?.change_pct?.toFixed(2) || '-'}%</td>
                                    <td className={`py-3 px-2 text-right ${(price?.change_5d || 0) >= 0 ? 'color-positive' : 'color-negative'}`}>{price?.change_5d?.toFixed(2) || '-'}%</td>
                                    <td className="py-3 px-2 text-right">{price?.rsi?.toFixed(1) || '-'}</td>
                                    <td className="py-3 px-2 text-center"><span className={`grade-badge grade-${(price?.grade || 'D').toLowerCase()}`}>{price?.grade || 'D'}</span></td>
                                    <td className="py-3 px-2 text-center"><button onClick={(e) => { e.stopPropagation(); removeTicker(ticker); }} className="button button-danger" style={{ padding: '4px 8px', fontSize: '12px' }}>×</button></td>
                                </tr>
                            );
                        })}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

// Backtest Tab
function BacktestTab() {
    const [ticker, setTicker] = useState('');

    const [months, setMonths] = useState('6');
    const [isRunning, setIsRunning] = useState(false);
    const [results, setResults] = useState(null);
    const [trades, setTrades] = useState([]);
    const [strategies] = useState(['SMA Crossover', 'RSI Mean Reversion']);

    const runBacktest = async () => {
        if (!ticker.trim()) {
            if (window.addToast) window.addToast('Bitte Ticker eingeben', 'error');
            return;
        }

        setIsRunning(true);
        try {
            const response = await fetch(`${API}/api/backtest`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticker: ticker.toUpperCase(), strategy, months: parseInt(months) })
            });

            if (response.ok) {
                const data = await response.json();
                setResults(data.data || {});
                setTrades(data.trades || []);
                if (window.addToast) window.addToast('Backtest abgeschlossen', 'success');
            } else {

            if (window.addToast) window.addToast('Fehler beim Backtest', 'error');
