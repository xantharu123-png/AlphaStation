# ============================================================
# Alpha Station / TradingBot — nginx vHost (Produktion)
#
# Architektur:
#   - Statisches Frontend (frontend/index.html + vendor/) direkt via nginx
#     => KEIN eigener "tradingbot-frontend"-Service noetig.
#   - /api/  -> proxy auf FastAPI/uvicorn (tradingbot-api.service, 127.0.0.1:8000)
#   - TLS-Terminierung hier; uvicorn lauscht nur auf localhost.
#
# PLATZHALTER: ${DOMAIN} ist KEINE nginx-Variable, sondern ein Text-Platzhalter.
# Vor dem Aktivieren ersetzen (install.sh macht das automatisch), manuell:
#   sudo sed -i 's/${DOMAIN}/app.deine-domain.de/g' /etc/nginx/sites-available/tradingbot
#
# Zertifikat VOR dem Aktivieren dieses vHosts holen (sonst schlaegt `nginx -t`
# wegen fehlender Cert-Dateien fehl):
#   sudo certbot certonly --nginx -d app.deine-domain.de
# ============================================================

# Rate-Limit-Zone gegen Login-Bruteforce/Credential-Stuffing.
# (Diese Datei wird ueber sites-enabled in den http-Block inkludiert,
# limit_req_zone ist hier also im korrekten http-Kontext.)
limit_req_zone $binary_remote_addr zone=tb_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=tb_register:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=tb_password_reset:10m rate=5r/m;

# ── HTTP :80 — nur ACME-Challenge, sonst Redirect auf HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    # Let's-Encrypt-Renewals via webroot (Verzeichnis legt install.sh an).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 — statisches Frontend + API-Proxy ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN};

    # Certbot-Standardpfade (entstehen durch `certbot certonly --nginx -d ${DOMAIN}`).
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:TB_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security-Header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://checkout.stripe.com; upgrade-insecure-requests" always;

    # API nimmt nur kleine JSON-Bodies an (Login, Settings, Stripe-Webhook).
    client_max_body_size 1m;

    # gzip fuer statische Assets (index.html ist ~670 KB, vendor-JS aehnlich).
    # text/html komprimiert nginx bei "gzip on" immer automatisch mit.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ── Statisches Frontend ──
    # /vendor/* (React, Tailwind, lightweight-charts) liegt unter
    # frontend/vendor/ und wird hier ebenfalls statisch ausgeliefert.
    root  /home/tradingbot/app/frontend;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /app.bundle.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /boot.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ^~ /vendor/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # Quellcode-, Backup- und Datenbankartefakte duerfen niemals durch den
    # statischen Webroot oder den SPA-Fallback erreichbar sein.
    location ~* \.(?:bak|backup|old|orig|patch|diff|zip|tar|tgz|sql|sqlite|sqlite3|db)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Versteckte Dateien (.env, .git, ...) niemals ausliefern.
    location ~ /\. {
        deny all;
    }

    # ── Login: hartes Rate-Limit (5 Versuche/Minute, Burst 5) ──
    location = /api/auth/login {
        limit_req zone=tb_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Registrierung ist absichtlich oeffentlich, darf aber weder die Account-
    # Datenbank noch Mail-/Stripe-Folgeschritte unbegrenzt fluten.
    location = /api/auth/register {
        limit_req zone=tb_register burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reset-Anfragen antworten absichtlich immer generisch. Das zusaetzliche
    # IP-Limit verhindert trotzdem Mail-Flooding ueber viele Zieladressen.
    location = /api/auth/password-reset/request {
        limit_req zone=tb_password_reset burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API-Proxy (FastAPI/uvicorn, nur auf localhost gebunden) ──
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ad-hoc-Scans/Backtests brauchen Zeit — 120s ist bewusst grosszuegig,
        # aber begrenzt. Echte Langlaeufer gehoeren in tradingbot-bg, die API
        # liest deren Ergebnisse nur aus den /tmp-Caches.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Health-Endpoint fuer externe Uptime-Checks (ohne Access-Log-Rauschen).
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}

