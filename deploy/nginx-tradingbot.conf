# Nginx Reverse Proxy für Streamlit
# Streamlit braucht WebSocket-Support für Live-Updates

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;  # Später durch deine Domain ersetzen

    # Streamlit App
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # WebSocket Support (wichtig für Streamlit!)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts für lange Scans
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health Check
    location /healthz {
        proxy_pass http://127.0.0.1:8501/_stcore/health;
        proxy_http_version 1.1;
    }
}
